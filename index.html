process — threads in one process share the heap (Lesson 0.2), which is what makes them fast to
communicate and dangerous to get wrong.

**Concurrency vs. parallelism, precisely**: concurrency is about *structure* — multiple tasks making
progress over the same time window, possibly by interleaving on a single core (this entire lesson is
about concurrency). Parallelism is about *execution* — tasks literally running at the same instant on
different cores. You can have concurrency without parallelism (many threads on one core, time-sliced) and
parallelism without meaningfully complex concurrency (a `for` loop split across cores with no shared
state). Everything in this lesson — races, locks, deadlock — is a concurrency concern; it applies whether
or not the threads involved ever run in true parallel.

Three ways to run something on another thread:
```java
// 1. Implement Runnable (preferred over extending Thread — you keep your inheritance slot)
Runnable task = () -> System.out.println("running on " + Thread.currentThread().getName());
Thread t = new Thread(task);
t.start();          // start() spawns a new thread; calling run() directly would just run it HERE
t.join();           // wait for t to finish

// 2. ExecutorService (what you'd actually use — Phase 3 covers this properly)
ExecutorService pool = Executors.newFixedThreadPool(4);
pool.submit(task);
pool.shutdown();

// 3. Callable + Future, when the task returns a value
Future<Integer> future = pool.submit(() -> 2 + 2);
int result = future.get();   // blocks until done
```

**`start()` vs `run()`** is a classic interview question: `start()` creates a new thread and invokes
`run()` on it; calling `run()` yourself is an ordinary method call on the current thread, with no
concurrency at all.

### Going Further

- **Threads are expensive** — roughly 1MB of stack each, plus OS scheduling overhead. That's why you use
  a pool rather than `new Thread()` per task. Modern Java (21+) adds **virtual threads**
  (`Executors.newVirtualThreadPerTaskExecutor()`), which are cheap, JVM-scheduled, and designed for
  blocking-I/O-heavy workloads — millions of them are viable. Platform threads remain the right model for
  CPU-bound work. Mentioning virtual threads when discussing "how would this scale to many concurrent
  requests" is a strong, current signal.
- **Thread states**: NEW → RUNNABLE → (BLOCKED / WAITING / TIMED_WAITING) → TERMINATED. Knowing that
  BLOCKED means "waiting on a monitor lock" while WAITING means "waiting on another thread's signal"
  (`wait()`, `join()`) helps a lot when reading thread dumps.
- **`Thread.sleep()` does not release locks**; `Object.wait()` does. Confusing the two is how deadlocks
  get written.

---

## 2. Why concurrent code breaks: race conditions

### Beginner

```java
class Counter {
    private int count = 0;
    public void increment() { count++; }     // looks atomic. is not.
    public int get() { return count; }
}
```
Run `increment()` 10,000 times each from two threads and you will *not* reliably get 20,000.

**Why**: `count++` is three separate operations:
1. **read** `count` from memory
2. **add** 1 to the value in a register
3. **write** the result back

Two threads running this "simultaneously" doesn't mean literally the same instant — it means the CPU can
interleave their individual steps in any order. Here's one interleaving that loses an update, with
`count` starting at 5:
```
Thread A                        Thread B                        count in memory
--------                        --------                        ----------------
read count (gets 5)                                              5
                                 read count (gets 5)              5      <- B reads BEFORE A writes back
add 1  (A's local copy = 6)                                       5
                                 add 1 (B's local copy = 6)        5
write 6                                                            6
                                 write 6                            6     <- B overwrites with the SAME 6
```
Both threads ran `increment()` once each — two increments happened — but `count` only went from 5 to 6,
a net change of *one*. Thread B's `read` happened before Thread A's `write`, so B never saw A's update
and both threads computed the exact same "next value" independently. This is a **lost update**: the
program is correct in isolation and wrong only because of *timing you don't control* — which is the
definition of a race condition. Run it a thousand times and you'll get a different lost-update count
each time, because the exact interleaving depends on OS scheduling, which varies run to run — exactly
what the demo shows.

**The fix** — make the read-modify-write indivisible:
```java
public synchronized void increment() { count++; }
```

### Going Further

#### Atomicity vs visibility — two different bugs, traced separately

It's tempting to think "the fix for concurrency bugs is to make operations atomic." That's only half of
it — there's a second, entirely separate problem, and `volatile` only fixes one of the two:

1. **Atomicity** — the read-modify-write above must not be interleaved. That's the lost-update trace you
   just walked through.
2. **Visibility** — even a *single* write by one thread might never become visible to another thread at
   all, with no interleaving involved. Each CPU core can keep its own cached copy of a variable for
   speed; without an explicit synchronization point, there's no guarantee thread B's cached copy ever
   gets refreshed from thread A's write:
   ```
   Thread A's core:  writes stopFlag = true   -->  cached locally, may not reach main memory yet
   Thread B's core:  while (!stopFlag) {}     -->  keeps reading its OWN stale cached copy, forever
   ```
   A loop like `while (!stopFlag) {}` over a plain (non-`volatile`) field can legally spin forever, even
   long after another thread has set `stopFlag = true` — not because of a race in the interleaving sense,
   but because B may simply never *see* A's write. (In practice this is made worse by the JIT compiler,
   which is allowed to notice "this loop never modifies `stopFlag` from B's point of view" and hoist the
   read out of the loop entirely, turning it into `if (!stopFlag) { while(true){} }`.)

`volatile` fixes exactly the visibility problem: it forces every write to go straight to main memory and
every read to come straight from it, and it prevents the compiler from reordering around it. What it
does **not** do is make multi-step operations atomic — `volatile int count; count++` is *still* the
same three-step read-modify-write race from before, just with the visibility half of the problem solved
and the atomicity half untouched. `synchronized` (and the atomic classes below) give you both guarantees
at once. Being able to state this distinction — and that they're separate problems requiring separate
guarantees — is one of the highest-signal concurrency answers at SDE2 level.
- **The happens-before relationship** is the formal rule the Java Memory Model gives you: if action A
  *happens-before* B, then A's effects are visible to B. The edges worth memorizing: unlocking a monitor
  happens-before any subsequent lock of it; a write to a `volatile` happens-before any subsequent read of
  it; `Thread.start()` happens-before everything in that thread; everything in a thread happens-before
  another thread's successful `join()` on it.
- **Atomic classes** use CAS (compare-and-swap), a hardware instruction, instead of locking:
  ```java
  private final AtomicInteger count = new AtomicInteger();
  count.incrementAndGet();      // atomic, lock-free
  ```
  Under low-to-moderate contention this beats `synchronized` (no context switches); under very high
  contention the retry loop can spin, which is why `LongAdder` exists (it shards the counter across
  cells and sums on read — strictly better for hot write-mostly counters like metrics).
- **Immutability sidesteps all of this.** An object whose fields are all `final` and set in the
  constructor is *safely published* and thread-safe with zero synchronization — the JMM guarantees other
  threads see fully-initialized `final` fields. This is the real reason `Circle`'s `radius` is `final`
  in Lesson 1, and the reason records fit concurrent designs so well. "Make it immutable" is usually a
  better answer than "add a lock."

---

## 3. `synchronized` — what it actually does

### Beginner

Every Java object has an invisible **monitor** (a lock). `synchronized` acquires it on entry and releases
it on exit — including when an exception is thrown.

```java
class BankAccount {
    private double balance;

    public synchronized void deposit(double amt) {     // locks on "this"
        balance += amt;
    }

    public void withdraw(double amt) {
        synchronized (this) {                          // same thing, explicit block form
            balance -= amt;
        }
    }

    private static final Object LOCK = new Object();
    public void other() {
        synchronized (LOCK) { ... }                    // lock on a dedicated private object
    }
}
```
- A `synchronized` **instance** method locks on `this`.
- A `synchronized` **static** method locks on the `Class` object — a *different* lock.
- Only one thread can hold a given monitor at a time; others **block** until it's released.

### Going Further

- **Prefer a private final lock object over `synchronized(this)`.** Locking on `this` means any external
  code holding a reference to your object can also lock on it and interfere (or deadlock you). A private
  lock keeps the locking policy an implementation detail you control.
- **Monitors are reentrant**: a thread already holding a lock can re-acquire it (so a synchronized method
  calling another synchronized method on the same object doesn't self-deadlock).
- **Lock granularity is the design decision.** Synchronizing an entire method is easy and safe but
  serializes everything; locking narrowly (or per-bucket/per-row, as `ConcurrentHashMap` does) preserves
  concurrency. This tradeoff is *exactly* the interesting part of Parking Lot / BookMyShow designs — lock
  the individual spot/seat, not the whole lot/theatre.
#### Deadlock, traced as a timeline

```java
// Thread 1 (transfer A -> B): synchronized(A) { synchronized(B) { ... } }
// Thread 2 (transfer B -> A): synchronized(B) { synchronized(A) { ... } }
```
Walk through the exact interleaving that hangs both threads forever:
```
time -->

Thread 1:  lock(A)  ........................  waiting for B ........................
Thread 2:  ........  lock(B)  ..............  ......................  waiting for A ..
```
1. Thread 1 acquires lock `A` (it's transferring *from* account A).
2. Before Thread 1 gets to lock `B`, Thread 2 runs and acquires lock `B` (it's transferring *from*
   account B, the opposite direction).
3. Thread 1 now tries to acquire `B` — but Thread 2 is holding it. Thread 1 **blocks**, waiting.
4. Thread 2 now tries to acquire `A` — but Thread 1 is holding it. Thread 2 **blocks**, waiting.
5. Thread 1 is waiting on Thread 2; Thread 2 is waiting on Thread 1. Neither can ever proceed, because
   proceeding is exactly what would let the other one proceed. This is deadlock — a cycle of "waiting
   for something the other holds," and it's permanent; nothing external breaks it.

This is exactly the transfer scenario in `BankTransfer.transferUnsafe` in `solutions/`, and exactly what
the demo's timeout catches — the two threads are still alive 1.5 seconds later because they're stuck in
this exact cycle, not because anything is slow.

**The fix — consistent lock ordering**: instead of "lock the *from* account first," always lock
whichever account has the **lower id** first, regardless of transfer direction:
```
Thread 1 (A->B): locks min(A,B) first, then max(A,B)
Thread 2 (B->A): locks min(A,B) first, then max(A,B)   <- SAME order as Thread 1, always
```
Now both threads are always racing to acquire the *same first lock* — one of them simply wins and
proceeds to completion, then releases both locks, and the other proceeds normally after. There's no
longer any way for each thread to be holding what the other wants, because there's no longer a
disagreement about *which* lock to grab first. This is exactly `BankTransfer.transferSafe` in
`solutions/`. Alternatives to ordering: `ReentrantLock.tryLock(timeout)` — grab what you can, and if you
can't get the second lock in time, release everything you're holding and retry from scratch (no
ordering needed, but you must handle the retry/backoff yourself); or restructure so nested locks are
never needed at all.
- **Livelock and starvation** round out the failure modes: livelock is threads politely retrying forever
  without progress; starvation is a thread never getting the lock under an unfair scheduler
  (`ReentrantLock(true)` offers fairness, at a throughput cost).
- **`synchronized` is cheaper than it used to be** — the JVM applies biased/thin locking, and modern
  escape analysis can eliminate uncontended locks entirely. "Locks are slow, use atomics" is outdated as
  a blanket claim; measure.

---

## Your practice task

The demo covers counters and lock-ordering deadlock. These tasks apply the same ideas to the shapes
they'll actually take in your LLD problems. In `practice/`, package `com.lld.javabasics.concurrency`:

1. **`ThreadSafeInventory`** — a stock registry: `reserve(String sku, int qty)` returns `false` rather
   than letting stock go negative. First write it *unsafely* and prove with concurrent threads that you
   can oversell (e.g. stock of 100, 200 threads each reserving 1, and more than 100 succeed — or the
   count goes negative). Then fix it two ways: with `synchronized`, and with
   `ConcurrentHashMap.compute(...)` doing the check-and-decrement atomically. Compare the lock
   granularity of each. **This is the Parking Lot "last spot" and BookMyShow "same seat" problem in
   miniature** — expect to reuse this reasoning directly in Phases 4-6.
2. **`BoundedBuffer`** — the classic producer-consumer: a fixed-capacity queue where `put` blocks when
   full and `take` blocks when empty, implemented with `wait()`/`notifyAll()`. Two rules to get right:
   always wait in a `while` loop (never `if` — spurious wakeups are real), and prefer `notifyAll` over
   `notify` unless you can prove all waiters are interchangeable. Then rewrite it in three lines with
   `ArrayBlockingQueue` and note what the JDK gave you for free.
3. **`TryLockTransfer`** — an *alternative* deadlock fix to the demo's lock ordering: use
   `ReentrantLock.tryLock(timeout)` on both accounts, and on failure release everything and retry. Write
   a comment comparing the two approaches — ordering is deterministic and cheaper but needs a global
   order to exist; `tryLock` needs no ordering but can livelock and needs a backoff.
4. **`immutability/`** — take the `Money` class you wrote in Lesson 0.2 and argue in a comment why it
   needs *no* synchronization at all when shared across threads. Then show a mutable equivalent breaking
   under concurrent access. "Make it immutable" is usually a better answer than "add a lock," and this
   makes that concrete.
5. Tests: `ThreadSafeInventory` (spawn N threads via an `ExecutorService`, `awaitTermination`, assert
   stock never goes negative and successful reservations never exceed initial stock) and `BoundedBuffer`
   (one producer, one consumer, every produced item consumed exactly once).

   Note: don't try to write a test asserting the *unsafe* version fails — a race is non-deterministic and
   such a test is flaky by construction. Keep that as a demo runner. Knowing why it can't be tested
   deterministically is itself the lesson, and it's a good interview answer to "how would you test this?"

That completes **Phase 0**. Next up is Phase 1 (Foundations), where the OOP pillars build directly on the
object model from Lesson 0.2 and the immutability/thread-safety connection from this one.
</script>
<script type="text/markdown" id="md-01-oop-pillars">
# Lesson 1 — The Four Pillars of OOP (in Java)

Every LLD interview, no matter the company, is really testing whether you reach for the right OOP tool
automatically. Interviewers rarely ask "what is encapsulation" — they watch whether your `ParkingLot`
class has public mutable fields, or whether your `Payment` hierarchy uses an interface where it should.
This lesson makes the four pillars concrete enough that using them correctly becomes reflexive.

Reference implementation (read only *after* you've attempted the practice task): `solutions/src/main/java/com/lld/foundations/oop/`.

---

## 1. Encapsulation

**Plain definition**: bundling data together with the code that operates on it, and controlling access
to that data so it can never end up in an invalid state.

**Analogy**: a pill capsule. The medicine (state) is inside; you don't get to touch the medicine
directly — you interact with the capsule (the public methods), which controls how and when the medicine
is released.

**The mechanics in Java**:
- Four access levels, narrowest to widest: `private` → *(no modifier, "package-private")* → `protected` → `public`.
- Default posture for fields: **private**. You almost never want a public field.
- Expose behavior, not raw data. Don't reflexively write a getter *and* setter for every field — ask
  "does the outside world need to read this? need to change it? or should changing it only happen
  through a specific action (like `withdraw(amount)`, not `setBalance(x)`)?"
- Validate at the boundary — the constructor and any mutating method are where you enforce invariants
  (rules that must always hold true for the object).

**Why it matters**: without encapsulation, any code anywhere in the system can push an object into an
impossible state (negative balance, negative radius) and now a bug could be *anywhere*. With it, the
class itself is the only place that can violate its own rules — so that's the only place you have to
look, and the only place you have to test.

**In the reference code** — `Circle.java`:
```java
private final double radius;   // private: nobody outside can reach in and mutate it directly

public Circle(double radius) {
    if (radius <= 0) {
        throw new IllegalArgumentException("radius must be positive");
    }
    this.radius = radius;      // validated once, at construction, then never touched again
}
```
There's no `setRadius()`. The field is also `final` — once built, a `Circle`'s radius can never change.
That's a deliberate design choice (immutability), not an oversight — immutable objects are trivially
thread-safe and easier to reason about, which will matter a lot once we hit the concurrency phase.

**Common beginner mistake**: writing a public getter *and* public setter for every private field out of
habit. That's not encapsulation — it's a public field with extra steps. Real encapsulation means the
setter (if it exists at all) enforces a rule the caller can't bypass.

---

## 2. Abstraction

**Plain definition**: exposing *what* an object can do, while hiding *how* it does it.

**Analogy**: a car's accelerator pedal. You know "press harder → go faster." You don't need to know
whether it's a combustion engine or an electric motor to drive it. The pedal is the abstraction; the
engine is the hidden implementation.

**The mechanics in Java** — two tools, and knowing which to reach for is a genuinely important interview
skill:

| | Abstract class | Interface |
|---|---|---|
| Use when | Subclasses share *both* a type identity and some common implementation | Unrelated classes share a *capability*, no shared code needed |
| Can have fields/state | Yes | No (only constants) |
| Can have constructors | Yes | No |
| Multiple inheritance | A class extends **one** abstract class | A class can implement **many** interfaces |
| "is-a" vs "can-do" | "is-a" (a `Circle` *is a* `Shape`) | "can-do" (a `Circle` *can move*) |

Rule of thumb: start with an interface (it's the more flexible, less committal choice). Reach for an
abstract class only when you have real shared code/state to put in it, not just shared method
signatures.

**In the reference code**:
- `Shape.java` is an **abstract class**: every shape genuinely *is a* shape, and they share real
  implementation — `describe()` is written once in `Shape` and every subclass gets it for free.
  `area()`/`perimeter()` are declared but not implemented — that's the "hide how" part; `Circle` and
  `Rectangle` each supply their own how.
- `Movable.java` is an **interface**: moving is a capability, not a kind of shape. `Circle` implements
  it; `Rectangle` doesn't. If `Movable` were forced to be part of the `Shape` hierarchy instead, every
  shape would be forced to support movement whether it made sense or not — that's a design smell called
  "interface pollution," and we'll formalize why it's bad when we cover the Interface Segregation
  Principle (SOLID, Lesson 2).

**Common beginner mistake**: thinking "abstraction = abstract class." Abstraction is the *concept*
(hide how, expose what) — both abstract classes and interfaces are ways to achieve it.

---

## 3. Inheritance

**Plain definition**: a new class (subclass/child) reuses and extends the state and behavior of an
existing class (superclass/parent). Modeled as "is-a": a `Square` *is a* `Rectangle`.

**The mechanics in Java**:
- `class Square extends Rectangle` — `Square` gets every non-private member of `Rectangle` for free.
- `super(...)` calls the parent constructor — you cannot skip initializing the parent's state.
- **Overriding** (`@Override`) — a subclass provides its own version of a method the parent declared.
  This is a *runtime* decision (see Polymorphism below).
- Do not confuse overriding with **overloading** — same method name, *different parameter list*, in the
  same class. Overloading is resolved at *compile time* based on the declared argument types. These are
  frequently mixed up in interviews; keep them straight:
  - Overloading: `area(int r)` and `area(double r)` in the same class — compiler picks based on the
    argument type you pass, before the program even runs.
  - Overriding: `Circle.area()` replacing `Shape.area()` — the JVM picks based on the *actual* object
    type, at runtime.

**In the reference code** — `Rectangle.java`:
```java
class Square extends Rectangle {
    public Square(double side) {
        super(side, side);   // a Square IS a Rectangle whose width always equals its height
    }
}
```
`Square` writes zero lines of `area()`/`perimeter()` logic — it inherits it completely.

**The catch, and why inheritance is the most dangerous pillar**: inheritance creates *tight coupling*.
A change to the parent can silently break every child. The canonical example, sitting right in this
file: imagine `Rectangle` later grows `setWidth(double w)` and `setHeight(double h)` (reasonable — a
resizable rectangle). Now every `Rectangle` is expected to support "resize width independently of
height." But a `Square` *cannot* honor that without breaking its own invariant (width must always equal
height). Any code that does:
```java
void resize(Rectangle r) {
    r.setWidth(10);
    r.setHeight(20);
    assert r.area() == 200;   // holds for any real Rectangle...
}
```
...silently breaks if you pass it a `Square` (area would be 400, or the Square would need to secretly
override `setWidth` to also change height, which breaks the caller's expectation that width and height
are independent). This is the **Liskov Substitution Principle** violation — a subtype must be usable
anywhere its supertype is expected, without surprises. We'll dig into this formally, with the fix
(favoring composition, or not modeling Square as a Rectangle at all), in Lesson 2 (SOLID).

**Interview framing**: senior candidates are expected to *default to composition* ("has-a": a `Car`
*has an* `Engine`) and only reach for inheritance when the "is-a" relationship is genuinely stable and
you need to override behavior polymorphically. We'll cover this explicitly as its own topic
(Foundations #4).

---

## 4. Polymorphism

**Plain definition**: "many forms" — the same method call produces different behavior depending on the
actual object it's called on.

**Two kinds** (interviewers expect you to name both):

1. **Compile-time / static polymorphism** — method **overloading**. Resolved by the compiler based on
   argument types, before the program runs.
2. **Runtime / dynamic polymorphism** — method **overriding**. Resolved by the JVM based on the actual
   object's type, while the program is running. This is the one that matters for LLD — it's *the*
   mechanism that lets you write code against an abstraction (`Shape`, `PaymentMethod`, `Strategy`) and
   have it correctly handle every current *and future* concrete type without an `if/else` chain.

**Why it's the payoff pillar**: encapsulation protects state, abstraction defines a contract, inheritance
shares implementation — but polymorphism is what lets you write `for (Shape s : shapes) s.describe()`
once and have it stay correct forever, even after someone adds a `Triangle` six months from now. This is
the mechanical basis of the **Open/Closed Principle** (open for extension, closed for modification) —
the single most-tested SOLID principle in LLD interviews, coming in Lesson 2.

**In the reference code** — `OopDemoRunner.java`:
```java
List<Shape> shapes = List.of(new Circle(3), new Rectangle(4, 5), new Square(2));
for (Shape shape : shapes) {
    System.out.println(shape.describe());   // runs Circle's area(), Rectangle's area(), etc.
}
```
The loop's code never mentions `Circle`, `Rectangle`, or `Square` by name. The JVM picks the right
`area()` at runtime via a mechanism called *dynamic dispatch* (each object carries a pointer to its
class's method table).

The second form, capability-checking with pattern matching:
```java
if (shape instanceof Movable movable) {
    movable.moveTo(10, 20);
}
```
This is polymorphism over a *capability* (interface) rather than a *type hierarchy* (class) — same
principle, applied to "can this thing move," not "what kind of shape is this."

**Common beginner mistake**: writing `if (shape instanceof Circle) { ... } else if (shape instanceof
Rectangle) { ... }` — this defeats the entire purpose. If you catch yourself branching on concrete type,
that's a signal you're missing a method that belongs on the abstraction (`Shape`) instead.

---

## How the four pillars fit together

- **Encapsulation** protects an object's internal state.
- **Abstraction** defines the contract other code depends on (interface/abstract class).
- **Inheritance** is one mechanism (not the only one — composition is the other) for sharing/extending
  implementation across related types.
- **Polymorphism** is what makes the abstraction actually *pay off* — code written against the contract
  keeps working as new implementations are added.

---

## Going Further — senior-level depth on each pillar

Everything above is the working mental model. This section is the layer an interviewer reaches for when
your first answer is correct and they want to see how deep it goes.

### Encapsulation, advanced

#### The getter leak, traced step by step

```java
class Team {
    private final List<String> members = new ArrayList<>();
    public List<String> getMembers() { return members; }   // looks like a harmless getter
}
```
```java
Team team = new Team();
team.getMembers().add("Asha");    // ...wait, there's no addMember() method. How did this work?

List<String> stolen = team.getMembers();
stolen.clear();                   // team's members are now ALSO empty — from outside, with no method call on Team at all
```
Walk through why: `getMembers()` returns `this.members` — not a copy, the *actual reference* to `Team`'s
internal list. The caller now holds a second variable (`stolen`) pointing at the *same* list object
(exactly the aliasing from Lesson 0.1's `y[0] = 99` example). Calling `.clear()` on `stolen` doesn't go
through any method on `Team` — it reaches directly into `Team`'s internal state via the address it was
handed. Every invariant `Team` thought it was protecting by making `members` `private` is now
enforceable by absolutely nobody, because a live handle to the internals leaked out through the getter.

**The fix — a defensive copy on the way out**:
```java
public List<String> getMembers() { return List.copyOf(members); }
```
Now the caller gets a brand-new, immutable list with the *same contents* but a *different address* —
mutating it does nothing to `Team`'s real list. The same leak exists symmetrically on the way **in**: a
constructor that stores `this.members = incoming;` directly is just as exposed — whoever handed you
`incoming` still holds a reference to it and can mutate your "private" state whenever they want. Store
`List.copyOf(incoming)` instead. (`NotificationService` in `solutions/` does exactly this with
`List.copyOf` on its constructor parameter.)
- **The recipe for a genuinely immutable class**: make the class `final` (or all constructors private),
  make every field `private final`, set everything in the constructor, provide no mutators, and
  defensively copy any mutable field on the way in *and* out. The payoff is that immutable objects are
  automatically thread-safe and safe to share/cache freely (see Lesson 0.5).
- **Constructors with many parameters are an encapsulation smell, not just an ergonomics one** — a
  6-parameter constructor of the same type invites silently swapped arguments. That's the real
  motivation for the **Builder** pattern (Phase 2), not just "readability."

### Abstraction, advanced

- **Default methods (Java 8+) blurred the interface/abstract-class line.** Interfaces can now carry
  implementation, which is why "interfaces can't have code" is outdated. What abstract classes still have
  exclusively: *instance state* (fields) and constructors. Default methods exist primarily for
  **interface evolution** — adding a method to a published interface without breaking every implementor
  (that's how `Collection.stream()` was added).
- **The diamond problem is resolved explicitly**: if two interfaces provide the same default method, the
  implementing class must override it and can disambiguate with `InterfaceName.super.method()`. Java
  permits multiple inheritance of *behavior* (defaults) and *type*, but never of *state* — which is the
  precise reason the classic C++ diamond problem can't occur.
- **`sealed` interfaces (Lesson 0.4) give you a third option** between "open abstraction" and "abstract
  class": a closed set of permitted implementations, enabling exhaustive pattern matching. Choose based
  on whether you expect new *implementations* (keep it open — OCP) or new *operations* (seal it).

### Inheritance, advanced

#### Dynamic dispatch, traced through the actual mechanism

```java
Shape shape = new Circle(3);
shape.area();
```
It's easy to leave this as "the JVM figures out the right method at runtime" without ever seeing *how*.
Here's the mechanism, one step at a time:
1. Every class has a **method table** (vtable) — a fixed-layout array of pointers to its methods,
   built once when the class is loaded. `Shape`'s vtable has a slot for `area()`; `Circle`'s vtable
   *overrides* that same slot to point at `Circle.area()` instead of any default.
2. Every object, at the moment it's created with `new`, gets a hidden pointer to its *actual class's*
   vtable — not the declared type of whatever variable will hold it. A `Circle` object always carries a
   pointer to `Circle`'s vtable, whether you assign it to a `Circle` variable or a `Shape` variable.
3. When you call `shape.area()`, the compiled bytecode instruction is `invokevirtual` — it does **not**
   encode "call `Circle.area()`." It encodes "look at whatever object `shape` currently points to, follow
   *that object's* vtable pointer, and jump to whatever is sitting in the `area()` slot."
4. At runtime: `shape` points to a `Circle` object → follow its vtable pointer → find `Circle`'s
   overridden `area()` in that slot → jump there. If `shape` had pointed at a `Rectangle` instead, the
   exact same bytecode instruction would land on `Rectangle.area()` — nothing about the call site itself
   changes, only which object is behind the reference at that moment.

Interface calls (`invokeinterface`) do a slightly more expensive version of the same lookup, since an
interface has no single fixed vtable slot layout the way a class hierarchy does. The JIT then optimizes
this aggressively once it's watched a call site run enough times: if a given `shape.area()` call site has
only ever seen `Circle` objects (*monomorphic*), the JIT inlines `Circle.area()` directly, skipping the
vtable lookup entirely; two observed types (*bimorphic*) gets a cheap two-way inline cache; many types
(*megamorphic*) falls back to the real vtable lookup every time. Practical takeaway: in ordinary code,
polymorphism is effectively free — "avoid virtual calls for performance" is premature optimization in
almost every LLD context.
- **Covariant return types** are legal: an override may return a *subtype* of what the parent declared
  (`Object clone()` → `Circle clone()`). Combined with generics erasure, this is why the compiler
  sometimes generates **bridge methods** — synthetic methods that preserve the erased signature. You'll
  see them in stack traces and reflection output.
- **`final` is a design tool, not decoration.** A `final` class can't be extended; a `final` method can't
  be overridden. Bloch's rule is "design for inheritance or prohibit it" — if you don't document exactly
  which methods are safe to override and how they're called internally (self-use), you should be making
  the class `final`. Most classes should be.
- **Fields are hidden, not overridden.** Declaring a field with the same name in a subclass *shadows*
  the parent's; which one you get depends on the static type of the reference. Never do this.

### Polymorphism, advanced

#### Single dispatch's limitation, and the double-dispatch workaround, traced

Java dispatches dynamically on exactly one thing: the runtime type of the object you call the method
*on* (the receiver). Every argument is resolved by its *static* (compile-time declared) type — that's
Lesson 0.1's overload-resolution trap. This becomes a real limitation when you need behavior that depends
on **two** runtime types at once — collision handling is the canonical example:
```java
abstract class GameObject { abstract void collideWith(GameObject other); }
class Asteroid extends GameObject { void collideWith(GameObject other) { /* ??? */ } }
class Ship extends GameObject { void collideWith(GameObject other) { /* ??? */ } }
```
Inside `Asteroid.collideWith(GameObject other)`, you're single-dispatched on `this` being an `Asteroid` —
but `other`'s *declared* type here is `GameObject`, so you're back to `instanceof` checks to find out
what it really is. Single dispatch alone can't get you "the right behavior for *this specific pair* of
types" in one polymorphic call.

**Double dispatch fakes a second dispatch by making the call twice, through two single-dispatch hops**:
```java
class Asteroid extends GameObject {
    void collideWith(GameObject other) { other.collideWithAsteroid(this); }  // hop 1: dispatches on `other`'s real type
    void collideWithAsteroid(Asteroid a) { /* asteroid-asteroid logic */ }
    void collideWithShip(Ship s)         { /* asteroid-ship logic */ }
}
class Ship extends GameObject {
    void collideWith(GameObject other) { other.collideWithShip(this); }      // hop 1: dispatches on `other`'s real type
    void collideWithAsteroid(Asteroid a) { /* ship-asteroid logic */ }
    void collideWithShip(Ship s)         { /* ship-ship logic */ }
}
```
Trace `asteroid.collideWith(ship)`:
1. **First dispatch**: `collideWith` is called on `asteroid` — the JVM picks `Asteroid.collideWith`
   because `asteroid`'s runtime type is `Asteroid`. Inside it, `other.collideWithAsteroid(this)` is
   called — note `this` here has the compile-time type `Asteroid`, known precisely, because we're
   writing this code *inside* the `Asteroid` class.
2. **Second dispatch**: `collideWithAsteroid` is called on `other` — the JVM picks whichever class
   `other` actually is at runtime. Since `other` is a `Ship`, it resolves to `Ship.collideWithAsteroid`.
3. End result: `Ship.collideWithAsteroid(Asteroid a)` runs — the exact ship-vs-asteroid logic, reached
   with zero `instanceof` checks anywhere, purely through two chained single dispatches.

This exact double-dispatch trick — an object accepting a "visitor" and calling back a
type-specific method on it — is precisely the mechanism the **Visitor** pattern formalizes (Phase 2).
- **Overriding cannot weaken access** (`protected` → `private` is illegal) and cannot add new checked
  exceptions — both are compiler-enforced corners of LSP (Lesson 2).
- **`instanceof` chains vs polymorphism is a judgment call, not an absolute.** Branching on type is a
  smell when the behavior belongs on the type. But when you're handling a *closed* set (a sealed
  hierarchy) or adding an operation you can't put on classes you don't own, exhaustive pattern matching
  is the cleaner answer. Know both, and say which axis you expect to change.

> **Further resources**: [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design)
> (free, 22k★) covers these same pillars with worked Java examples, one level past this lesson; HelloInterview's
> free "LLD in a Hurry" guide is a good second pass. Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task (write this in `practice/`, not here)

Different domain from the `Shape` example on purpose — this should be *your* code, not a copy.

Build a tiny **bank account hierarchy** (this will directly set up the ATM problem in Phase 4):

1. `Account` — abstract class. Holds `accountNumber` (String) and `balance` (double), both **private**.
   Constructor validates `accountNumber` is non-blank and starting `balance >= 0`.
   - `deposit(double amount)` — concrete method (same for every account type): validates `amount > 0`,
     increases balance.
   - `withdraw(double amount)` — **abstract**. Each account type has different withdrawal rules (see
     below), so there's no shared implementation to put here.
   - `getBalance()` — concrete getter.
2. `SavingsAccount extends Account` — enforces a minimum balance (e.g., 500): `withdraw` must throw if
   the balance would drop below the minimum.
3. `CurrentAccount extends Account` — allows going negative up to an overdraft limit (e.g., -1000):
   `withdraw` must throw only if it would exceed the overdraft limit.
4. `InterestBearing` — an **interface** with one method, `double calculateInterest()`. Only
   `SavingsAccount` implements it (current accounts don't earn interest) — this is your `Movable`-style
   capability check.
5. A small runner (like `OopDemoRunner`) that builds a `List<Account>` of both types, calls `deposit`/
   `withdraw` polymorphically, and separately checks `instanceof InterestBearing` to apply interest only
   where it applies.
6. At least 4-5 JUnit tests: valid deposit/withdraw, withdrawal blocked by minimum balance, withdrawal
   allowed within overdraft, interest only computed for savings accounts.

Package it as `com.lld.foundations.oop.bank` under `practice/src/main/java/...` (and the matching test
path). When you're done, share it and we'll review — checking correctness, encapsulation discipline
(are your fields actually private? did you validate in the right place?), and whether you reached for
inheritance vs. interface correctly, before it gets finalized into `solutions/`.
</script>
<script type="text/markdown" id="md-02-solid-principles">
# Lesson 2 — SOLID Principles

SOLID isn't a separate topic from OOP — it's the set of rules that keep encapsulation, abstraction,
inheritance, and polymorphism from being misused. In an LLD interview, SOLID is the *unstated rubric*:
interviewers rarely say "did you apply SRP," but a class doing five unrelated things, or an
`if/else` chain on type, is exactly what costs points. Being able to name *which* principle a smell
violates — and fix it — is what separates SDE2-level design from junior-level design.

One running domain for all five: a **notification system** (email/SMS/push) — deliberately chosen
because it's also a real upcoming problem (Phase 6, Salesforce-style plugin architecture). Getting SOLID
right here means less rework later.

---

## S — Single Responsibility Principle

**Definition**: a class should have only one reason to change.

Not "a class should do one thing" (too vague to apply) — the sharper version is: list the *actors* or
*reasons* that could force this class to change. If there's more than one, split it.

**Violation**:
```java
class NotificationService {
    void notifyUser(User user, String eventType) {
        String message = buildMessageFor(eventType);      // reason to change #1: message wording/templates
        String formatted = "[" + LocalDateTime.now() + "] " + message; // reason #2: formatting/logging conventions
        sendViaSmtp(user.getEmail(), formatted);            // reason #3: how email is actually sent (SMTP details)
        writeToAuditLog(user, message);                     // reason #4: audit/logging requirements
    }
}
```
Four unrelated reasons to touch this one class: marketing changes the message copy, ops changes the log
format, infra swaps SMTP providers, compliance changes audit requirements. Each is a different
stakeholder — and in `NotificationService`, they're all editing the same file.

**Fix**: split by responsibility — `NotificationMessageBuilder` (content), `EmailSender` (delivery
mechanics), `NotificationAuditLogger` (audit trail), and `NotificationService` becomes a thin
orchestrator that calls the other three.

**Smell to watch for**: class names like `...Manager`, `...Processor`, `...Handler` that keep growing
new unrelated methods. Not automatically wrong, but worth asking "how many reasons does this have to
change?"

---

## O — Open/Closed Principle

**Definition**: classes should be open for extension, closed for modification. You should be able to add
new behavior without editing and re-testing existing, working code.

**Violation**:
```java
void send(Notification n, String channel) {
    if (channel.equals("EMAIL")) {
        sendEmail(n);
    } else if (channel.equals("SMS")) {
        sendSms(n);
    }
    // adding Push means editing this method — and re-testing EMAIL and SMS paths for no reason
}
```
This is the exact same shape as the beginner mistake from Lesson 1 (`instanceof Circle ... else if
instanceof Rectangle`) — branching on type/category instead of using polymorphism.

**Fix**: an abstraction, exactly like `Shape`:
```java
interface NotificationChannel {
    void send(Notification n);
}
class EmailChannel implements NotificationChannel { ... }
class SmsChannel implements NotificationChannel { ... }
// later: class PushChannel implements NotificationChannel { ... } — zero changes to existing code
```
`NotificationService` takes a `List<NotificationChannel>` and calls `send()` on each — adding `Push`
means writing one new class, not touching anything that already works and is already tested.

This is mechanically the **Strategy pattern**, which we'll formalize in the Behavioral Patterns lesson —
OCP is the *principle*, Strategy is the *pattern* that implements it. Most "design pattern" interview
questions are really OCP questions in disguise.

---

## L — Liskov Substitution Principle

**Definition**: if `B` is a subtype of `A`, you should be able to use a `B` anywhere an `A` is expected,
without the caller needing to know or care. Subtyping is a promise, not just code reuse.

You already met this in Lesson 1: `Square extends Rectangle` breaks if `Rectangle` ever grows
independent `setWidth`/`setHeight`, because a `Square` can't honor "change width without changing
height." Same failure shape here:

**Violation**:
```java
class ScheduledEmailChannel extends EmailChannel {
    @Override
    void send(Notification n) {
        throw new UnsupportedOperationException("this channel only supports scheduled sending");
    }
    void scheduleSend(Notification n, Instant when) { ... }
}
```
Any code holding a `NotificationChannel`/`EmailChannel` reference and calling `send()` — which is the
entire contract the type promises — now blows up for this one subtype. The caller would need to know
"is this specifically a `ScheduledEmailChannel`? then don't call `send()`" — which defeats the entire
point of the abstraction.

**Detection heuristic**: a subclass override that throws, silently no-ops, or weakens what the base class
promised is an LSP violation. Look for it *especially* right after you've written an inheritance
relationship — ask "can every caller of the parent type treat this subtype identically?"

**Fix**: don't force "can only send later" into the same hierarchy as "can send now." This is solved by
the *next* principle.

---

## I — Interface Segregation Principle

**Definition**: no class should be forced to implement methods it doesn't need. Prefer several small,
focused interfaces over one large one.

**Violation** — a single fat interface trying to cover every channel's full capability:
```java
interface NotificationChannel {
    void send(Notification n);
    void scheduleSend(Notification n, Instant when);
    void cancelScheduled(String notificationId);
    DeliveryReceipt trackDelivery(String notificationId);
}
```
`SmsChannel` doesn't support scheduling. `PushChannel` doesn't support delivery tracking. Every class is
now forced to implement (or stub-throw) methods that don't apply to it — which is exactly how you get
the LSP violation above.

**Fix**: segregate by capability, same spirit as `Movable` in Lesson 1:
```java
interface NotificationChannel { void send(Notification n); }
interface Schedulable { void scheduleSend(Notification n, Instant when); void cancelScheduled(String id); }
interface DeliveryTrackable { DeliveryReceipt trackDelivery(String notificationId); }

class EmailChannel implements NotificationChannel, DeliveryTrackable { ... }
class SmsChannel implements NotificationChannel { ... }
class ScheduledPushChannel implements NotificationChannel, Schedulable { ... }
```
Now every class implements exactly what it can honestly support — no throwing, no stubs, and the LSP
problem from the previous section disappears because "schedulable" is no longer smuggled into the base
`send()` contract.

---

## D — Dependency Inversion Principle

**Definition**: high-level modules (business logic) shouldn't depend on low-level modules (implementation
details) — both should depend on abstractions. In practice: depend on interfaces, and receive your
dependencies (constructor injection) rather than constructing them yourself with `new` inside business
logic.

**Violation**:
```java
class NotificationService {
    private final EmailChannel emailChannel = new EmailChannel();   // hard-wired to one concrete class

    void notify(Notification n) {
        emailChannel.send(n);
    }
}
```
`NotificationService` (high-level: "notify a user") is directly coupled to `EmailChannel` (low-level:
"how SMTP works"). You can't test `NotificationService` without a real/fake SMTP setup, and you can't add
SMS without editing this class (this is also an OCP violation — the principles overlap in practice).

**Fix**:
```java
class NotificationService {
    private final List<NotificationChannel> channels;

    NotificationService(List<NotificationChannel> channels) {   // depends on the abstraction, injected
        this.channels = channels;
    }

    void notify(Notification n) {
        channels.forEach(c -> c.send(n));
    }
}
```
`NotificationService` now depends only on the `NotificationChannel` interface. The concrete wiring
(`new EmailChannel()`, `new SmsChannel()`) happens once, at the "composition root" (e.g., `main`, or a
test's setup) — not scattered through business logic. This is also *why* dependency-injection frameworks
(Spring, Guice) exist: they automate exactly this wiring. You don't need a framework to apply DIP — the
pattern above is DIP with zero framework.

---

## How they reinforce each other

- OCP is achieved *through* polymorphism, which only stays correct if LSP holds (substitutability).
- ISP is often the fix for an LSP violation (split the fat interface so no one is forced into a broken
  promise).
- DIP is what makes OCP's "add a new class, touch nothing else" actually true end-to-end — if high-level
  code still does `new ConcreteThing()` somewhere, adding a new implementation still requires an edit.
- SRP is somewhat orthogonal but underlies all of them: small, focused classes are what make the other
  four tractable to reason about.

---

## Going Further — senior-level depth

### SRP, advanced

- **The sharpest formulation is about *actors*, not "things"**: a module should have one reason to
  change *because it answers to one stakeholder*. The classic illustration is a `Employee` class with
  `calculatePay()` (finance), `reportHours()` (operations), and `save()` (DBA) — three actors, so a
  change requested by finance can break operations' report. Framing SRP by stakeholder is much more
  actionable in an interview than "does one thing."
- **SRP taken too far produces anemic designs** — a swarm of single-method classes with all the logic in
  orchestrators, which is just procedural code with extra files. Cohesion is the counterweight: things
  that change together should live together. When asked to split a class, be ready to say where you'd
  *stop*.
- **The practical test**: describe the class in one sentence. If you need "and" to do it, you've probably
  found the seam.

### OCP, advanced

- **You cannot be open to everything; you choose an axis.** A `NotificationChannel` interface is open to
  new *channels* but closed to new *operations* — adding `trackDelivery()` to the base interface would
  force every implementor to change. That's the **expression problem** (see Lesson 0.4), and naming it
  explicitly is a strong signal. The real skill is predicting which axis will actually vary in your
  domain and putting the flexibility there, rather than trying to be infinitely extensible everywhere
  (which is how over-engineering happens).
- **OCP has two classic mechanisms**: composition-based (Strategy — inject a different implementation)
  and inheritance-based (Template Method — override a hook). Strategy is usually preferable for the
  reasons in Lesson 4, but Template Method is the right call when the *skeleton* must be fixed and only
  named steps vary.
- **Plugin architectures are OCP at the system level** — Java's `ServiceLoader` (SPI) lets you add an
  implementation by dropping a jar on the classpath, with zero source changes. That's the answer to
  "how would you make this extensible by other teams?" in a Salesforce-flavored interview.

### LSP, advanced

#### The formal contract rules, traced through concrete pre/postconditions

"Pre/postconditions" sounds abstract until you name what they actually are for a specific method. Take
`Account.withdraw(amount)`:
- **Precondition** — what the *caller* must guarantee is true before calling it. Here: "amount is
  positive." That's the caller's responsibility to uphold.
- **Postcondition** — what the *method* guarantees is true after it returns. Here: "balance has
  decreased by amount" (or it threw, refusing the operation).

The rule is: **a subtype may weaken a precondition (accept more than the parent required) but never
strengthen one (accept less)**, and **may strengthen a postcondition (guarantee more) but never weaken
one (guarantee less)**. Trace why each direction is safe or unsafe using code any caller of `Account`
might write:
```java
void processWithdrawal(Account acct, double amount) {
    acct.withdraw(amount);   // written against Account's contract only
}
```
- `SavingsAccount` adding a minimum-balance check is **not** a violation: `Account.withdraw` never
  promised "any positive amount will succeed" — it only promised "a positive amount is required, and if
  it succeeds, balance decreases by that much." `SavingsAccount` still honors exactly that — it just
  *also* refuses in a case the parent's contract never covered either way. The precondition
  ("amount > 0") wasn't strengthened; nothing new was demanded of the caller *before* calling.
- Now imagine a hypothetical `WeekdayOnlyAccount` whose `withdraw` throws on weekends unless the caller
  first calls `checkIsWeekday()`. **That** would be a real precondition-strengthening violation —
  `processWithdrawal` above, written only against `Account`'s contract, has no way to know it needs to
  call `checkIsWeekday()` first, and will break in production every Saturday with no warning from the
  type system.
- A subtype **weakening a postcondition** would be, e.g., a `LenientAccount.withdraw` that silently caps
  the withdrawal at whatever's available instead of decreasing balance by the *full* requested amount (or
  throwing). Code written against `Account`'s promise — "balance decreases by exactly `amount`, or an
  exception is thrown, nothing in between" — would now silently receive less money moved than it asked
  for, with no error, and no way to know without special-casing this one subtype.

- **preserve all invariants** of the supertype (a rule the subtype's own state must always satisfy — e.g.
  "balance never negative" for `SavingsAccount`);
- respect the **history constraint** — a subtype must not allow state changes the supertype's contract
  permitted but the subtype's own nature forbids (this is precisely what an immutable `Square` extending
  a mutable `Rectangle` violates: `Rectangle`'s contract permits independently changing width and height
  over the object's lifetime; `Square` cannot honor that history without breaking its own "always a
  square" invariant).
- **Java enforces a slice of this at compile time**: overrides can't narrow access, can't add checked
  exceptions, and return types must be covariant while parameter types are invariant. The rest —
  behavioral contracts — the compiler cannot check, which is why LSP is a *design* discipline.
- **The pragmatic detection heuristic** remains: if a caller of the supertype would be surprised, or if
  you find yourself writing `if (x instanceof SpecificSubtype)` at a call site to avoid a broken method,
  the hierarchy is wrong.

### ISP, advanced

- **Role interfaces vs header interfaces**: a "header" interface mirrors an entire class's API
  (`UserServiceInterface` with 30 methods — usually a mistake); a "role" interface captures one
  capability from the *client's* perspective (`Schedulable`). ISP is really the instruction to define
  interfaces from the consumer side, not the implementor side.
- **Interfaces belong to their clients.** In a layered design, the interface a high-level module needs
  should be declared *with* that module, not with the implementation package — which is what makes DIP
  more than just "use interfaces" (see below).
- **Too many tiny interfaces has a cost too**: type sprawl, and implementors juggling many `implements`
  clauses. The stopping condition is "no client is forced to depend on a method it doesn't call" — not
  "one method per interface."

### DIP, advanced

- **DIP is not "use interfaces everywhere."** It's specifically about *which module owns the abstraction*:
  the high-level policy defines the interface, and the low-level detail implements it — inverting the
  usual compile-time dependency direction. This is the core idea behind **hexagonal / ports-and-adapters
  architecture**: the domain declares a `PaymentGateway` port; the Stripe adapter depends on the domain,
  never the reverse.
- **Injection style tradeoffs**: constructor injection (preferred — dependencies are explicit, the object
  is never in a half-built state, fields can be `final` and thus thread-safe); setter injection (needed
  for genuinely optional or reconfigurable dependencies, at the cost of mutability); field injection via
  reflection (convenient in frameworks, but hides dependencies and makes the class hard to construct in
  a plain unit test — generally discouraged).
- **The composition root** is the single place where concrete wiring happens (`main`, a Spring
  `@Configuration`, or a factory). Everything else stays dependency-agnostic. If you can't point at your
  composition root, `new` is probably scattered through your business logic.
- **Testability is the practical proof**: if you can substitute a fake implementation in a unit test
  without a mocking framework or a live dependency, your DIP is real. If a test needs a database or an
  SMTP server to run, it isn't.

### How the five interact, at design-review level

The failure modes cluster: a **fat interface** (ISP) forces implementors into **broken promises** (LSP);
a class with **too many responsibilities** (SRP) is impossible to extend without modification (OCP); and
**hard-wired construction** (DIP) makes OCP's "add a class, change nothing" a lie. In review, if you find
one, look for the other four — they usually travel together.

> **Further resources**: the same [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design)
> repo has a dedicated SOLID section with more worked examples; *Clean Code* (Robert Martin) is the classic
> book-length treatment if you want more than this lesson covers. Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

Build the notification system in `practice/`, package `com.lld.foundations.solid.notification`, applying
all five principles from scratch (don't just copy the fixed snippets above — write your own):

1. `NotificationChannel` interface — `send(Notification n)`.
2. `Schedulable` interface — `scheduleSend(Notification n, Instant when)`, `cancelScheduled(String id)`.
3. `DeliveryTrackable` interface — `trackDelivery(String notificationId)` returning some `DeliveryReceipt`
   (can be a simple record/class with a status enum).
4. `EmailChannel implements NotificationChannel, DeliveryTrackable`.
5. `SmsChannel implements NotificationChannel` (no scheduling, no tracking).
6. `PushChannel implements NotificationChannel, Schedulable`.
7. A separate `NotificationMessageBuilder` class (SRP: keeps message construction out of the service).
8. `NotificationService` — constructor-injected `List<NotificationChannel>` (DIP), no `new` of any
   concrete channel inside it, delegates message building to `NotificationMessageBuilder`.
9. Tests proving:
   - OCP: adding a new channel (write a `WebhookChannel` in the test) requires zero changes to
     `NotificationService`.
   - ISP: `SmsChannel` does *not* implement `Schedulable` — should fail to compile if you try to call
     `scheduleSend` on it through a plain `NotificationChannel` reference (this is the point — the type
     system enforces it).
   - `NotificationService` works correctly with a mix of channels, calling only `send()`.

Share it when ready for review before it moves to `solutions/`.
</script>
<script type="text/markdown" id="md-03-uml-class-diagrams">
# Lesson 3 — UML Class Diagrams

Several SDE2 LLD rounds (Amazon and Microsoft especially) explicitly ask you to sketch a class diagram —
on a whiteboard, Excalidraw, or just described verbally. Even when they don't ask for one directly, the
*vocabulary* (association vs. aggregation vs. composition, multiplicity) is how you communicate design
decisions precisely instead of vaguely saying "these are related somehow." This lesson is short — it's a
notation lesson, not a new concept — but the notation is worth being fluent in.

## Anatomy of a class box

```
┌─────────────────────────┐
│      SavingsAccount      │   ← class name
├─────────────────────────┤
│ - balance: double        │   ← attributes: visibility, name, type
│ - minimumBalance: double │
├─────────────────────────┤
│ + deposit(amount): void  │   ← methods: visibility, name(params), return type
│ + withdraw(amount): void │
└─────────────────────────┘
```
Visibility prefixes map directly to Java access modifiers: `+` public, `-` private, `#` protected, `~`
package-private. This is the same encapsulation decision from Lesson 1, just written in diagram notation.

## Relationships — the part people mix up

| Relationship | Arrow | Meaning | Example |
|---|---|---|---|
| **Association** | plain line `───` | "uses/knows about", general, often temporary | `Driver` drives a `Car` |
| **Aggregation** | line + hollow diamond `───◇` at owner | "has-a", **weak** ownership — the part can outlive the whole | `Department o── Professor` (professor still exists if the department is dissolved) |
| **Composition** | line + filled diamond `───◆` at owner | "has-a", **strong** ownership — the part's lifecycle is bound to the whole | `Car ◆── Engine` (destroy the car, the engine object goes with it — it's not shared or reused elsewhere) |
| **Generalization (Inheritance)** | line + hollow triangle `──▷` pointing at parent | "is-a" | `Circle ──▷ Shape` |
| **Realization (Implementation)** | dashed line + hollow triangle `┄┄▷` | "implements the contract of" | `Circle ┄┄▷ Movable` |
| **Dependency** | dashed arrow `┄┄>` | "uses temporarily" (e.g., a method parameter or local variable type), no stored reference | `NotificationService` depends on `Notification` if it only ever receives one as a method argument and doesn't hold onto it |

**The aggregation-vs-composition test that actually works**: ask "if I delete the container object right
now, does the contained object's reason to exist disappear with it?" If the part is meaningless/orphaned
without the whole and nothing else references it — composition. If the part has independent existence or
identity — aggregation. This is genuinely judgment-based (not a hard rule), and interviewers care more
that you can *justify* your choice than that you pick the "textbook-correct" one.

## Multiplicity

Written at each end of a relationship line, meaning "how many of this end per one of the other end":

| Notation | Meaning |
|---|---|
| `1` | exactly one |
| `0..1` | zero or one (optional) |
| `*` or `0..*` | zero or more |
| `1..*` | one or more |
| `m..n` | a specific range |

Example: `ParkingLot "1" ── "1..*" ParkingSpot` reads as "one parking lot has one or more parking spots";
`ParkingSpot "1" ── "0..1" Vehicle` reads as "one spot holds at most one vehicle at a time, and it's
optional (could be empty)."

## Worked examples from what you've already built

**Lesson 1's Account hierarchy** (write this as Mermaid — GitHub renders Mermaid `classDiagram` blocks
directly in `.md` files, so this is also how you'll document real solutions later):

```mermaid
classDiagram
    class Account {
        <<abstract>>
        -accountNumber: String
        -balance: double
        +deposit(amount: double) void
        +withdraw(amount: double) void*
        +getBalance() double
    }
    class SavingsAccount {
        -minimumBalance: double
        +withdraw(amount: double) void
        +calculateInterest() double
    }
    class CurrentAccount {
        -overdraftLimit: double
        +withdraw(amount: double) void
    }
    class InterestBearing {
        <<interface>>
        +calculateInterest() double
    }
    Account <|-- SavingsAccount
    Account <|-- CurrentAccount
    InterestBearing <|.. SavingsAccount
```

**Lesson 2's notification system**:
```mermaid
classDiagram
    class NotificationChannel {
        <<interface>>
        +send(n: Notification) void
    }
    class Schedulable {
        <<interface>>
        +scheduleSend(n: Notification, when: Instant) void
    }
    class DeliveryTrackable {
        <<interface>>
        +trackDelivery(id: String) DeliveryReceipt
    }
    class NotificationService {
        -channels: List~NotificationChannel~
        -messageBuilder: NotificationMessageBuilder
        +notify(n: Notification) void
    }
    NotificationChannel <|.. EmailChannel
    DeliveryTrackable <|.. EmailChannel
    NotificationChannel <|.. SmsChannel
    NotificationChannel <|.. PushChannel
    Schedulable <|.. PushChannel
    NotificationService "1" o-- "1..*" NotificationChannel
    NotificationService "1" *-- "1" NotificationMessageBuilder
```
Note the composition choice for `NotificationMessageBuilder` (created and owned solely by the service, no
independent lifecycle) versus aggregation for `NotificationChannel` (channels could plausibly be
shared/reused across multiple services, and are constructed independently and injected).

## Going Further — senior-level depth

### Other diagram types worth knowing

Class diagrams show *structure*. Two others earn their keep in LLD interviews:

- **Sequence diagrams** show a *flow* over time — which object calls what, in what order. These are
  often more persuasive than a class diagram when explaining a use case ("walk me through booking a
  seat"), because they make the collaboration and the ordering explicit. Mermaid supports them:
  ```mermaid
  sequenceDiagram
      participant U as User
      participant S as NotificationService
      participant C as EmailChannel
      U->>S: notify(recipient, eventType)
      S->>S: messageBuilder.build(...)
      S->>C: send(notification)
      C-->>S: ack
  ```
  The `->>` is a call, `-->>` a return. Self-calls (`S->>S`) show internal delegation.
- **State diagrams** are the right tool the moment a problem has a lifecycle — order status, elevator
  direction, vending machine, booking. If you're designing something with a `State` pattern, sketching
  the state machine first *is* the design work:
  ```mermaid
  stateDiagram-v2
      [*] --> Idle
      Idle --> Moving: request received
      Moving --> DoorsOpen: floor reached
      DoorsOpen --> Idle: doors closed
  ```
- **Use case diagrams** and **activity diagrams** round out the UML set but earn their keep less often in
  an LLD *coding* interview: a use case diagram (actors + the actions they can perform) is a
  requirements-gathering tool, most useful in the "R" step of RCFD when a problem's actors aren't
  obvious yet; an activity diagram is essentially a flowchart (decisions, parallel forks, loops) and is
  most useful for a genuinely branchy business process (a loan-approval workflow, a multi-step
  checkout) rather than for describing a class's structure. Know they exist and what they're for; reach
  for class, sequence, or state diagrams first in a live interview — they map directly to code.

### Notation nuance

- **Dependency vs association in practice**: if the relationship is stored as a field, it's an
  association (draw a solid line). If it only appears as a method parameter, local variable, or return
  type, it's a dependency (dashed arrow). This is the distinction most people get wrong, and it maps
  exactly to "is there a field for it?"
- **Directionality**: an association with an arrowhead means the relationship is *navigable* one way only
  (`Ticket → ParkingSpot` but the spot doesn't know its tickets). Bidirectional associations are drawn
  without arrowheads — and are worth questioning in design review, since they create a cycle that has to
  be kept consistent on both sides.
- **Reflexive associations** (a class related to itself) are normal and worth drawing — `Employee`
  manages `Employee`, `Category` contains `Category`. They're the signature of the **Composite** pattern.
- **Abstract classes** are shown in *italics* or with `<<abstract>>`; interfaces with `<<interface>>` or
  the "lollipop" notation (a small circle on a stick) when you want to de-emphasize them.
- **Aggregation is the most-argued-about notation in UML**, and honestly the least load-bearing. Some
  teams skip the hollow diamond entirely and use a plain association. In an interview, the *justification*
  ("the spot can't exist without the lot, so I'd treat it as composition") is what's being assessed — not
  diamond fill.

### Using diagrams well in an interview

- **Time-box it.** A whiteboard class diagram should take 3-5 minutes: boxes with class names, the key
  fields/methods only, and relationship lines. Do not draw every getter. Interviewers are watching for
  whether you identified the right entities and relationships, not for UML compliance.
- **Draw the class diagram after "C — Core Entities" in the RCFD flow**, then evolve it as you go. Saying
  "let me sketch the entities and how they relate before I write methods" is a strong structural signal.
- **Keep it in the repo, too**: Mermaid in a `.md` file renders natively on GitHub, so a design diagram
  next to the code is genuinely useful documentation (and looks good in a portfolio repo, which is where
  `solutions/` is headed).
- **Scale awareness**: UML class diagrams describe one service's internals. For system-level pictures
  (services, datastores, boundaries), the **C4 model** (Context → Container → Component → Code) is the
  common vocabulary — worth mentioning if an LLD interview drifts upward into architecture.

> **Further resources**: HelloInterview's worked problems consistently sketch a class diagram before
> writing code — watching a few is the fastest way to see this habit in practice, not just in theory.
> Full curated list: [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

No Java this time — pure notation practice, since that's the point of this lesson:

1. In `practice/notes-uml.md` (a plain markdown file, not source code), write your **own** Mermaid
   `classDiagram` for the notification system you build in Lesson 2's practice task — don't copy the one
   above, draw it from *your* actual class/interface names and fields once you've written the code.
2. Add a `ParkingLot` sketch from scratch (you haven't built this yet — that's fine, this is a design
   exercise, not implementation): `ParkingLot`, `ParkingSpot`, `Vehicle`, `Ticket`. Decide and justify:
   is `ParkingLot`-to-`ParkingSpot` aggregation or composition? Is `Vehicle`-to-`ParkingSpot` an
   association or something else? Get the multiplicities right (a lot has many spots; a spot holds at
   most one vehicle at a time).

Share both diagrams when ready — this is a quick review, mostly checking the aggregation/composition
calls and multiplicities.
</script>
<script type="text/markdown" id="md-04-composition-over-inheritance">
# Lesson 4 — Composition over Inheritance

You've now seen the same failure twice — `Square extends Rectangle` (Lesson 1) and
`ScheduledEmailChannel extends EmailChannel` (Lesson 2, LSP) — both broke because inheritance was used to
model something that wasn't a stable "is-a" relationship. This lesson makes the fix a reflex: **default
to composition ("has-a", one object holds a reference to another and delegates to it); reach for
inheritance only when "is-a" is genuinely stable and you need runtime polymorphism over it.**

## Why inheritance is the riskier default

1. **It breaks encapsulation across the hierarchy.** A subclass's correctness can depend on the parent's
   *internal* implementation, not just its public contract — change how the parent's method works
   internally (even without changing its signature) and a subclass can silently break. This is called
   the **fragile base class problem**.
2. **Java allows only single inheritance of implementation.** If a class needs two independent
   behaviors, inheritance forces you into one line of descent, and you end up either duplicating code or
   building an awkward hierarchy to route around the limitation.
3. **It commits at compile time.** Once `Square extends Rectangle`, that relationship is fixed for the
   object's entire life. Composition lets you swap the held object at runtime.
4. **Combinatorial explosion when there are two or more independent variations.** This is the clearest
   way to feel the problem — see below.

## The combinatorial explosion example

Say you're building a report exporter: reports can be exported as **PDF or Excel**, and independently,
the output can be **compressed or not**. Modeling both axes with inheritance:

```
ReportExporter
├── PdfExporter
├── ExcelExporter
├── CompressedPdfExporter extends PdfExporter
└── CompressedExcelExporter extends ExcelExporter
```
Two formats × two compression states = 4 classes already. Add a third format (CSV) or a third
compression scheme (encrypted) and it multiplies again — 2 independent axes modeled as one hierarchy
always explodes like this. Worse, `CompressedPdfExporter` and `CompressedExcelExporter` likely duplicate
the actual compression logic, because inheritance gave you no way to share *that* piece without also
inheriting format-specific stuff.

**Composition fixes it by separating the axes into two objects instead of one hierarchy**:
```java
interface FormatWriter { byte[] write(Report r); }
class PdfWriter implements FormatWriter { ... }
class ExcelWriter implements FormatWriter { ... }

interface Compressor { byte[] compress(byte[] data); }
class ZipCompressor implements Compressor { ... }
class NoopCompressor implements Compressor { ... }   // "no compression" is just another strategy

class ReportExporter {
    private final FormatWriter formatWriter;   // has-a, not is-a
    private final Compressor compressor;

    ReportExporter(FormatWriter formatWriter, Compressor compressor) {
        this.formatWriter = formatWriter;
        this.compressor = compressor;
    }

    byte[] export(Report r) {
        return compressor.compress(formatWriter.write(r));
    }
}
```
2 formats + 2 compression states = **4 small classes total** (not 4 combinations), and every new format
or compression scheme is exactly one new class, touching nothing else — this is DIP and OCP from Lesson 2,
achieved *through* composition. This is also, mechanically, the **Strategy pattern** (each held object is
an interchangeable "strategy") and the **Decorator pattern** (compressor wraps the writer's output) —
you're already doing both, we'll just name them formally in the Patterns phase.

## Revisiting Square/Rectangle with composition

The LSP violation from Lesson 1 doesn't need `Square` to extend `Rectangle` at all. Two honest fixes:

- **Sibling types under a shared interface** (no shared implementation forced): `Quadrilateral`
  interface with `area()`/`perimeter()`; `Rectangle` and `Square` each implement it independently. No
  inheritance relationship between them at all — they're just two unrelated shapes that happen to both
  satisfy the same contract. This is usually the right call when the "shared code" you'd get from
  inheritance is trivial (a one-line formula) and not worth the coupling.
- **Composition, if you genuinely want to reuse Rectangle's logic**: `Square` *has a* `Rectangle`
  internally (`private final Rectangle bounds`) and delegates `area()`/`perimeter()` to it, without
  exposing `setWidth`/`setHeight` on itself. `Square` is no longer substitutable *for* a `Rectangle`
  (it isn't one), so the LSP trap is structurally impossible — there's no shared base type to violate.

## When inheritance is still the right call

Not "never inherit" — inheritance is correct when:
- The "is-a" relationship is genuinely stable and unlikely to need to change at runtime (a `Circle` will
  never need to stop being a `Shape`).
- You need runtime polymorphism over a *family* of types through one abstraction (which is the entire
  point of `Shape`/`NotificationChannel` in earlier lessons — that part was correct).
- There's real, non-trivial shared implementation worth inheriting (like `Shape.describe()` in Lesson 1),
  not just a shared method signature (which an interface alone would cover).

The heuristic in one line: **inherit for "is always substitutable as a"; compose for "is built out of" or
"can optionally do."**

## Going Further — senior-level depth

### Interface inheritance vs implementation inheritance

The maxim is usually stated as "favor composition over inheritance," but the precise version is more
useful: **inheriting a *type* is cheap and safe; inheriting an *implementation* is what creates
coupling.** `implements NotificationChannel` is inheritance of type — it costs you nothing and is exactly
how OCP works. `extends EmailChannel` is inheritance of implementation — that's where the fragile base
class problem lives. When someone says "inheritance is bad," this is the distinction they're missing.

### The cost composition actually has

Composition isn't free, and pretending otherwise is a weak answer:

- **Delegation boilerplate.** If `Square` composes a `Rectangle` and must expose ten methods, you write
  ten forwarding methods by hand. Some languages solve this at the language level (Kotlin's
  `class Square(private val r: Rectangle) : Quadrilateral by r`); Java has no delegation keyword, so the
  boilerplate is real. In practice you mitigate it by keeping composed interfaces narrow (ISP again).
- **Indirection.** One more object hop per call. Almost always irrelevant — the JIT inlines monomorphic
  delegation — but worth knowing the mechanism rather than hand-waving.
- **More objects to wire.** Composition pushes construction complexity to the composition root, which is
  precisely why DI frameworks exist.

### Mixins and default methods

Java's approximation of a mixin is an **interface with default methods** — behavior shared across
unrelated types without a common superclass, and without the single-inheritance constraint:
```java
interface Auditable {
    String id();
    default String auditLabel() { return getClass().getSimpleName() + ":" + id(); }
}
```
Any class can opt in to many of these. The hard limit: interfaces hold **no state**, so a mixin that
needs fields still has to fall back to composition. Java deliberately permits multiple inheritance of
behavior and type but never of state — which is what keeps the C++ diamond problem out of the language.

### Template Method — legitimate implementation inheritance

Not every use of inheritance is a mistake. **Template Method** fixes an algorithm's skeleton in a base
class and lets subclasses override named hook steps:
```java
abstract class DataImporter {
    public final void run() {     // final: the skeleton is not up for negotiation
        var raw = fetch();
        var parsed = parse(raw);
        save(parsed);
    }
    protected abstract String fetch();
    protected abstract List<Record> parse(String raw);
    protected void save(List<Record> records) { /* sensible default */ }
}
```
This is appropriate when the *sequence* must be invariant and only steps vary. The Strategy alternative
(inject a `Fetcher`, a `Parser`) is more flexible and testable, and swappable at runtime; Template
Method is tighter and simpler when you genuinely control the whole hierarchy. Being able to compare the
two directly — and note that Strategy is composition, Template Method is inheritance — is a strong
Phase 2 answer.

### When you don't get a choice

Frameworks frequently *require* implementation inheritance (extending a base `Activity`, `HttpServlet`,
or a test base class). "Favor composition" is a default, not a law — the senior move is to keep the
framework-mandated subclass thin and delegate immediately to composed objects you own and can test
directly. That way the inheritance is a boundary adapter, not where your logic lives.

### The deeper principle

Both this lesson and Lesson 2's LSP section are really about the same thing: **inheritance is a promise
