# Lesson 0.1 — Java Basics: Types, Control Flow, Arrays

Every lesson after this one assumes you can read Java without stopping to decode syntax. This one exists
to make that true. Read the **Beginner** parts to build the mental model; read the **Going Further** parts
to have an answer when an interviewer probes one level deeper than the obvious.

> **Run the demo first.** Every surprise in this lesson is printed, with explanations, by a runnable program:
> ```
> mvn -q -pl solutions compile exec:java -Dexec.mainClass="com.lld.javabasics.basics.JavaBasicsDemo"
> ```
> Source: `solutions/src/main/java/com/lld/javabasics/basics/JavaBasicsDemo.java`. Reading about
> `0.1 + 0.2 != 0.3` is forgettable; watching it print `0.30000000000000004` is not.

---

## 1. Primitive types vs reference types

### Beginner

Java has exactly two categories of values, and every bug about "why did my change not stick" traces back
to this distinction.

**Primitives** hold the actual value:
```java
int count = 5;        // the variable "count" literally contains 5
double price = 19.99;
boolean active = true;
char grade = 'A';
```
The eight primitives: `byte`, `short`, `int`, `long`, `float`, `double`, `char`, `boolean`.

**Reference types** hold a *reference* (an address) pointing at an object stored elsewhere:
```java
String name = "Ojashvi";       // "name" holds a pointer to a String object
int[] scores = new int[3];     // "scores" holds a pointer to an array object
List<String> items = new ArrayList<>();
```

**The analogy**: a primitive is a value written directly on a sticky note. A reference is a sticky note
with a *house address* on it — the note isn't the house, and two notes can carry the same address.

**The consequence** — this is the single most common beginner confusion:
```java
int a = 5;
int b = a;      // copies the VALUE
b = 10;         // a is still 5 — they were independent copies

int[] x = {1, 2, 3};
int[] y = x;    // copies the ADDRESS — both now point at the same array
y[0] = 99;      // x[0] is now ALSO 99 — one array, two references to it
```

### Going Further

#### Pass-by-value, traced step by step

The core rule: **when you call a method, Java copies whatever is in the variable's box and hands the
copy to the method.** For an array/object variable, what's *in the box* is not the object — it's an
**address** (a reference) pointing to where the object lives.

Start here:
```java
int[] arr = {1, 2, 3};
```
```
arr  -->  [box holding address 0x100]
0x100 in memory:  [1, 2, 3]
```

Call `mutate(arr)`:
```java
void mutate(int[] a) { a[0] = 99; }
```
Calling this **copies the address** out of `arr`'s box into a brand-new box called `a`:
```
arr  -->  0x100   (unchanged)
a    -->  0x100   (a COPY of the same address — points at the SAME array)
```
`a[0] = 99` reaches into address `0x100` and changes what's there. Since `arr` also points at `0x100`,
the caller sees the change too — not because Java passed the array "by reference," but because both
variables independently point at the same physical array.

Now call `reassign(arr)` instead:
```java
void reassign(int[] a) { a = new int[]{7}; }
```
```
arr  -->  0x100                (still, untouched)
a    -->  0x100  ...then...
a    -->  0x200   <- new int[]{7} creates a NEW array here, and `a` is repointed to it
```
`a = new int[]{7}` only ever changes what the **local box `a`** points at. `arr` back in the caller
never had its box touched at all — it still points at `0x100`. The method changed its own copy of the
address, not the caller's variable.

**The analogy, one more time**: `arr` is a sticky note with a house address written on it. Calling
`mutate` hands the method a *photocopy* of that sticky note — same address, so the method can walk to
the real house and repaint a room (`arr[0] = 99`) and you'll see the new paint too. But if the method
instead scribbles a *different* address onto its photocopy (`a = new int[]{7}`), that doesn't erase or
change what's written on your original sticky note. You still have the address to the old house.

This is why the precise answer is *"pass-by-value, where the value happens to be a reference"* — never
"pass-by-reference." If an interviewer asks "is Java pass-by-reference?", saying yes is a common and
noticeable error.

#### The `Integer` cache: `==` vs `.equals()`, traced step by step

`Integer a = 127` doesn't just store the number — Java "boxes" it into an `Integer` *object*. Java
pre-creates and keeps a small pool of `Integer` objects for the common range **-128 to 127** (like a
vending machine that keeps a few cans of the popular flavors already made, instead of manufacturing a
fresh one every time someone asks).

```java
Integer a = 127, b = 127;
```
Both `127`s are in the cached range, so Java hands `a` and `b` **the exact same pre-made object**.
`a == b` asks "are these two boxes literally the same object?" → yes → `true`.

```java
Integer c = 128, d = 128;
```
`128` is outside the cache, so Java creates **two separate new objects**, one for `c` and one for `d`.
They both hold the value 128 inside them, but they're two different objects at two different addresses.
`c == d` → `false`.

This *only* happens with wrapper objects (`Integer`, `Long`, ...) — for plain primitives
(`int a = 127, b = 127`), `a == b` is always `true` regardless of the number, because primitives store
the value directly, no boxing, no addresses involved.

The rule this teaches: `==` on objects compares "same object in memory," never "same value." Use
`.equals()` when you want to compare values:
```java
System.out.println(c == d);        // false — different objects
System.out.println(c.equals(d));   // true  — same value, which is what you actually wanted
```

#### Why autoboxing costs performance

"Boxing" = wrapping a primitive into its object form (`int` → `Integer`). Wrapper objects are
**immutable**, so every arithmetic operation on one has to unbox it, do the math, and box a *brand-new*
object for the result:
```java
Long sum = 0L;
for (int i = 0; i < 1_000_000; i++) {
    sum += i;   // secretly: unbox sum, add i, box a NEW Long, reassign sum
}
```
That loop silently allocates ~1,000,000 throwaway `Long` objects for the garbage collector to clean up.
Write `long sum = 0L;` (lowercase, primitive) instead — no boxing at all, just fast arithmetic on the raw
number. Rule of thumb: primitives in hot loops, wrapper types only where the API forces you to (generics
like `List<Integer>` can't hold primitives, so that cost is unavoidable there).<span class="doubt" tabindex="0" data-q="If autoboxing is costly, why use Integer / wrapper objects at all?" data-preview="In generics, null-ability, and Object-typed APIs, int literally isn&#8217;t a legal option &mdash; Integer isn&#8217;t slower there, it&#8217;s the only choice." data-target="doubt-why-integer-at-all">?</span>

<div class="sidenote" id="doubt-why-integer-at-all">
<div class="sidenote-label">&#128172; Doubt</div>
<div class="sidenote-q">If autoboxing is bad, why do we use Integer / wrapper objects at all instead of int directly? What's the actual use case of Integer?</div>
<div class="sidenote-a">
<p>The caution only applies when you have a <strong>real choice</strong> between <code>int</code> and <code>Integer</code> for the same job — a loop counter, a running sum, ordinary arithmetic. In those cases, always prefer the primitive.</p>
<p>But there are entire categories of Java where a primitive <strong>cannot be used at all</strong> — it's not that <code>Integer</code> is "sometimes slower," it's that <code>int</code> isn't a legal answer:</p>
<p><strong>1. Generics require a reference type.</strong> <code>List&lt;int&gt;</code> does not compile. Generics erase to <code>Object</code> internally (Lesson 0.3), and <code>int</code> has no relationship to <code>Object</code> — it can't be stored in a slot typed as <code>Object</code>. The moment you want a <code>List</code>, <code>Map</code>, or <code>Optional</code> of numbers, you need <code>Integer</code>. There's no int-only alternative, so boxing there isn't a mistake — it's the price of admission for using a generic container.</p>
<p><strong>2. Primitives can't represent "no value."</strong> An <code>int</code> always holds some number, even by default (<code>0</code>) — never nothing. <code>Map&lt;String, Integer&gt;.get(key)</code> can return <code>null</code> to mean "this key was never inserted," distinct from "this key maps to 0." A nullable database column, a JSON field that might be absent, an <code>Optional&lt;Integer&gt;</code> — all of these need a value that can genuinely be absent, and only a reference type can be <code>null</code>.</p>
<p><strong>3. Wrapper classes carry behavior a primitive can't have.</strong> A bare <code>int</code> has zero methods. <code>Integer.parseInt("42")</code>, <code>Integer.MAX_VALUE</code>, <code>Integer.compare(a, b)</code> all live on the wrapper precisely because <code>int</code> can't host static methods or constants.</p>
<p><strong>4. APIs typed as <code>Object</code> need a reference to pass around.</strong> Reflection, <code>Object...</code> varargs, JDBC's <code>setObject(...)</code>, JSON/serialization libraries — anything built to accept "some value, type unknown ahead of time" is typed as <code>Object</code>, and only a boxed value fits there.</p>
<p>So the precise rule isn't "Integer is bad." It's: don't box a value that only ever lives as a local variable doing arithmetic, when a primitive would do the identical job for free. The moment you're in a generic collection, need null-ability, or crossing an <code>Object</code>-typed boundary, <code>Integer</code> isn't the slower option — it's the <em>only</em> option, so the performance caution doesn't even apply; you're not choosing between <code>int</code> and <code>Integer</code> there.</p>
</div>
</div>

#### Floating point, traced step by step

Computers store numbers in binary. Just like `1/3` can't be written exactly in decimal (`0.333...`
forever), the decimal number `0.1` can't be written exactly in binary — it becomes a repeating binary
fraction that gets cut off to fit in a `double`'s fixed number of bits. So the `double` storing `0.1` is
a *very close approximation*, not the exact value.

When you add two approximations, the tiny errors don't perfectly cancel:
```java
System.out.println(0.1 + 0.2);            // 0.30000000000000004
System.out.println(0.1 + 0.2 == 0.3);     // false
```

Why this actually matters: track money as `double` and these tiny errors accumulate across many
transactions — a stored balance can genuinely drift off by cents over time. That's a real bug, not a
theoretical one. Fix: store money as integer cents (`150` meaning $1.50 — integer math is always exact)
or use `BigDecimal`, which represents decimal digits directly instead of binary fractions. Interviewers
notice when a payment/banking design uses `double` for currency — treat it as a correctness flag, not a
style nit.

#### Integer overflow, traced step by step

An `int` is exactly 32 bits, so it can only represent numbers from about **-2.1 billion to +2.1
billion**. There's no bit left over to go higher — like a car odometer with a fixed number of digits:
when it hits its max, it doesn't error, it just **wraps around** back to the smallest value.
```java
Integer.MAX_VALUE + 1   // == Integer.MIN_VALUE, silently, no exception
```

Why `(low + high) / 2` is dangerous: if `low` and `high` are both large ints, adding them *before*
dividing can overflow past `MAX_VALUE`, wrapping into a huge negative number — and dividing a negative
number by 2 gives a nonsense negative array index. That's the classic binary-search bug. The fix,
`low + (high - low) / 2`, never adds two large numbers together: `high - low` is always small (just the
size of the range), so it can't overflow, and adding that small safe number to `low` stays in range.

---

## 2. Variables, operators, and scope

### Beginner

```java
int x = 10;
x += 5;            // 15  — shorthand for x = x + 5
x++;               // 16  — post-increment
boolean ok = x > 10 && x < 100;   // && = logical AND, || = OR, ! = NOT
String s = "a" + "b";              // + concatenates Strings
```

**Scope** = where a variable is visible. A variable declared inside `{ }` dies at the closing brace:
```java
if (true) {
    int inner = 5;
}
// System.out.println(inner);  // compile error — "inner" doesn't exist out here
```

`final` means "this variable can never be reassigned after it's set":
```java
final int LIMIT = 100;
// LIMIT = 200;   // compile error
```

### Going Further

- **`final` on a reference freezes the reference, not the object.** `final List<String> list` means you
  can't point `list` at a *different* list, but `list.add("x")` still works fine. True immutability
  requires the object itself to be immutable (see Lesson 0.2 and the `Circle` example in Lesson 1).
- **Short-circuit evaluation**: `&&` and `||` stop evaluating as soon as the answer is determined. This
  is load-bearing, not just an optimization — `if (obj != null && obj.getName().isEmpty())` is safe
  precisely because `&&` won't evaluate the right side when the left is false. `&` and `|` (single) do
  *not* short-circuit and will happily NPE.
- **`i++` is not atomic.** It compiles to read → modify → write (three bytecode operations). This is why
  two threads incrementing a shared counter lose updates — covered properly in Lesson 0.5.
- **Integer division truncates**: `5 / 2 == 2`, not `2.5`. And `-5 / 2 == -2` (truncates toward zero),
  while `Math.floorDiv(-5, 2) == -3`. The `%` operator can return a negative result for negative
  operands (`-5 % 3 == -2`), which breaks naive hash-bucket index calculations — a real bug source.

---

## 3. Control flow

### Beginner

```java
// if / else
if (score >= 90)      grade = "A";
else if (score >= 80) grade = "B";
else                  grade = "C";

// classic switch
switch (day) {
    case "SAT":
    case "SUN":
        System.out.println("Weekend");
        break;          // without break, execution "falls through" to the next case
    default:
        System.out.println("Weekday");
}

// loops
for (int i = 0; i < 5; i++)        { ... }   // when you need the index
for (String item : items)          { ... }   // enhanced for — when you just need each element
while (condition)                  { ... }   // zero or more iterations
do { ... } while (condition);                // at least one iteration
```

### Going Further

- **Modern switch expressions (Java 14+)** remove the fall-through footgun entirely and can *return* a
  value:
  ```java
  String type = switch (day) {
      case "SAT", "SUN" -> "Weekend";
      default           -> "Weekday";
  };
  ```
  The `->` form doesn't fall through, and when switching over an enum or sealed type the compiler
  enforces **exhaustiveness** — add a new enum constant and any non-exhaustive switch fails to compile.
  That compile-time guarantee is a genuine design tool; we use it in Lesson 0.4 with sealed types.
- **Labeled breaks** exist for escaping nested loops (`outer: for(...) { for(...) { break outer; } }`).
  Legal, occasionally the cleanest option, but usually a sign the loop body should be a method with an
  early `return`.
- **Prefer the enhanced for-loop** unless you need the index or need to mutate the list while iterating.
  Mutating a collection during an enhanced for-loop throws `ConcurrentModificationException` — use
  `Iterator.remove()` or `Collection.removeIf()` instead (covered in Lesson 0.3).

---

## 4. Arrays

### Beginner

An array is a **fixed-size**, indexed block of same-typed values. Size is set at creation and can never
change.
```java
int[] scores = new int[3];          // [0, 0, 0] — primitives default to 0
scores[0] = 95;
String[] names = {"Asha", "Ben"};   // literal initialization
System.out.println(names.length);   // 2 — note: a field, not a method (unlike String.length())
int[][] grid = new int[3][4];       // 2D: 3 rows, 4 columns
```
Indexes start at **0**, so the last valid index is `length - 1`. Going outside throws
`ArrayIndexOutOfBoundsException`.

**Default values**: numeric primitives → `0`, `boolean` → `false`, `char` → `'\u0000'`, reference types
→ `null`.

### Going Further

- **Arrays are covariant, and that's a hole in the type system.** `Object[] objs = new String[2];`
  compiles — then `objs[0] = 42;` throws `ArrayStoreException` at *runtime*. Generics (Lesson 0.3) are
  invariant precisely to catch this class of error at compile time instead.
- **`arr.length` vs `str.length()` vs `list.size()`** — three different spellings for the same idea, a
  genuine historical wart worth memorizing.
- **Use `Arrays.equals()`/`Arrays.deepEquals()`, not `==`**, to compare contents — `==` compares
  references. Likewise `Arrays.toString()` for printing, since an array's default `toString()` prints
  something like `[I@1b6d3586`.
- **When to use an array at all**: in real code, prefer `List`. Reach for arrays for primitives in
  performance-critical paths (no boxing overhead), for fixed-size grids (game boards — you'll use this
  in Tic Tac Toe and Chess), or when an API requires one.

---

## 5. Methods

### Beginner

```java
public static int add(int a, int b) {   // returns an int
    return a + b;
}

public static void greet(String name) { // "void" = returns nothing
    System.out.println("Hi " + name);
}
```
- **Parameters** are the variables in the declaration; **arguments** are the actual values passed.
- **Overloading**: same name, different parameter list — the compiler picks based on argument types.
  (Distinct from *overriding*, which is a runtime subclass concept — see Lesson 1.)

### Going Further

- **Varargs** (`int... nums`) are compiled into an array parameter, so `sum(1,2,3)` allocates an `int[]`
  on every call — worth knowing in hot paths. Also, a varargs method and an array-parameter method with
  the same name can't coexist (same erased signature).
- **Overload resolution is done at compile time using the *declared* type**, which produces surprises:
  ```java
  Object o = "hello";
  print(o);   // calls print(Object), NOT print(String) — the declared type is what counts
  ```
  This is the sharpest practical difference between overloading (static, compile-time) and overriding
  (dynamic, runtime).
- **Avoid overloading on ambiguous types** (e.g., `remove(int)` vs `remove(Object)` on `List` — a
  genuine JDK design wart that surprises people constantly: `list.remove(1)` removes the element at
  *index* 1, while `list.remove(Integer.valueOf(1))` removes the *value* 1).

---

# Lesson 0.2 — Classes, Objects & the Memory Model

Lesson 0.1 ended on "a reference points at an object stored elsewhere." This lesson is about *where*
that elsewhere is, what an object actually is, and the three `Object` methods that every collection in
Java silently depends on.

> **Run the demo first.**
> ```
> mvn -q -pl solutions compile exec:java -Dexec.mainClass="com.lld.javabasics.objects.ObjectModelDemo"
> ```
> It shows a `HashSet` holding "duplicate" objects, a `HashMap` losing an entry after a key mutates, and
> a constructor reading a `null` field it "already initialized." Source files sit alongside it in
> `solutions/src/main/java/com/lld/javabasics/objects/`, with tests in the matching test package.

---

## 1. Classes and objects

### Beginner

A **class** is a blueprint. An **object** (or *instance*) is a thing built from that blueprint.

```java
public class Book {
    private String title;      // field (instance variable) — each Book has its own
    private int pages;

    public Book(String title, int pages) {   // constructor — runs when you say "new Book(...)"
        this.title = title;                  // "this" = the object being constructed
        this.pages = pages;
    }

    public String getTitle() { return title; }
}

Book b = new Book("Dune", 412);   // "new" creates the object; b holds a reference to it
```

**What `this` means**: inside an instance method or constructor, `this` refers to the specific object
the method was called on. It's needed when a parameter name shadows a field name (`this.title = title`).

**Constructors**:
- If you write no constructor at all, Java gives you a free no-argument one.
- The moment you write *any* constructor, that free one disappears.
- Constructors can call each other with `this(...)` (constructor chaining) — useful for defaults.

### Going Further

#### Initialization order, traced step by step

This is a real interview question, and the only way to really own it is to walk through what
`new Child()` does, in order, rather than memorize the list. Take:
```java
class Parent {
    Parent() { init(); }
    void init() {}
}
class Child extends Parent {
    private String name = "set";
    @Override void init() { System.out.println(name); }
}
```
Call `new Child()`. Here is *exactly* what happens, in order:
```
1. Static fields/blocks of Parent run   (once ever, first time either class is touched)
2. Static fields/blocks of Child run    (once ever)
3. Parent's instance fields are set to their initializers
4. Parent's constructor body runs           <-- calls init()
5.    init() is a Child method (overridden) — dynamic dispatch picks Child.init()
6.    Child.init() reads `name` ... but step 7 hasn't happened yet!
7. Child's instance fields are set to their initializers   ("set" is assigned HERE, not before)
8. Child's constructor body runs (empty, in this example)
```
Step 5 is the trap: even though we're still inside `Parent`'s constructor, the JVM dispatches `init()`
to `Child`'s override (that's ordinary polymorphism — the *object* is already a `Child`, even mid-
construction). But step 7 — where `name` actually gets the value `"set"` — hasn't run yet. So
`Child.init()` reads `name` while it's still at its default value, `null`. The output is `null`, not
`"set"`, even though a `String name = "set"` field initializer is sitting right there.

**The rule this produces**: never call an overridable (non-private, non-final, non-static) method from a
constructor. If you must run setup logic during construction, either make that method `private`/`final`
(so no subclass can be mid-construction when it runs), or do the setup in a separate factory method
called *after* the object is fully built.

- **`this(...)` vs `super(...)`**: both must be the first statement in a constructor, so you can use
  only one. If you write neither, the compiler silently inserts `super()` — which is why a parent with
  only a non-default constructor forces every child to call `super(...)` explicitly.

---

## 2. Static vs instance members

### Beginner

- **Instance** members belong to each object. Two `Book` objects have two separate `title` fields.
- **Static** members belong to the *class itself*. There's exactly one, shared by everyone.

```java
public class Book {
    private static int totalBooks = 0;     // ONE counter shared across all Books
    private final String title;            // each Book has its own title

    public Book(String title) {
        this.title = title;
        totalBooks++;                      // every construction bumps the shared counter
    }

    public static int getTotalBooks() { return totalBooks; }  // called as Book.getTotalBooks()
}
```

Rule of thumb: a static method can't touch instance fields (there's no specific object to read them
from), but an instance method can freely read static ones.

### Going Further

- **Static state is shared mutable state** — in a multithreaded program, `totalBooks++` above is a race
  condition (Lesson 0.5). Use `AtomicInteger` or synchronize. This is also exactly why the Singleton
  pattern (Phase 2) needs careful thread-safety treatment.
- **Static methods can't be overridden, only *hidden*.** If a parent and child both declare
  `static void f()`, which one runs is decided by the *declared* type at compile time — no dynamic
  dispatch. Calling a static method through an instance reference (`obj.staticMethod()`) is legal but
  misleading; call it on the class.

#### The holder idiom, traced step by step — why it's thread-safe with zero locks

```java
class Config {
    private Config() {}
    private static class Holder { static final Config INSTANCE = new Config(); }
    static Config getInstance() { return Holder.INSTANCE; }
}
```
This looks like it does nothing special — no `synchronized`, no lock, no double-checked anything — and
yet it's the standard answer to "give me a lazy, thread-safe Singleton." Walk through *why*:

1. Loading the `Config` class does **not** load the nested `Holder` class. Nested classes are only
   loaded the first time they're actually referenced.
2. `Holder` is referenced for the first time inside `getInstance()`, at `Holder.INSTANCE`. So `Holder`
   — and therefore `new Config()` — only runs the *first time someone calls `getInstance()`*. That's
   the "lazy" part: no `Config` is built until it's actually needed.
3. Here's the part that replaces the lock: the **JVM specification itself guarantees** that class
   initialization is atomic and happens *at most once*, even if multiple threads try to trigger it
   simultaneously. If Thread A and Thread B both call `getInstance()` at the exact same moment and
   `Holder` isn't loaded yet, the JVM makes one of them do the actual initialization while the other
   *blocks and waits* for it to finish — automatically, as part of how class loading works, not because
   you wrote any locking code.
4. So both threads end up with the exact same `Holder.INSTANCE` — no race, no double-construction — and
   you paid for none of it with a `synchronized` keyword or an explicit lock. You got the safety by
   piggybacking on a guarantee the JVM already has to provide for correctness reasons (two threads
   loading the same class and getting different static state would break the language).

That's the whole trick: lazy initialization (nested class isn't touched until needed) plus a
JVM-level guarantee (class init is a mutual-exclusion point) gives you a correct Singleton for free.
We'll return to this directly in the Singleton lesson (Phase 2), compared against the alternatives
(eager initialization, double-checked locking, `enum`).

- **Static fields and memory leaks**: a static collection that only ever grows is a classic leak, since
  its contents are reachable for the life of the classloader and can never be garbage collected.

---

## 3. Stack vs heap — where things actually live

### Beginner

The JVM keeps your program's memory in two main places:

| | **Stack** | **Heap** |
|---|---|---|
| Holds | local variables, method call frames, references | the actual objects (everything made with `new`) |
| Lifetime | popped automatically when the method returns | lives until nothing references it, then GC reclaims it |
| Per | one stack per **thread** (so locals are thread-private) | one heap shared by **all threads** |

```java
void example() {
    int count = 5;                  // "count" (and its value 5) → stack
    Book b = new Book("Dune", 412); // "b" (a reference) → stack; the Book object → heap
}                                   // both stack slots vanish here; the Book is now unreachable → GC eligible
```

**Analogy**: the stack is your desk — you clear it when you finish a task. The heap is the warehouse —
things stay there until someone confirms nobody needs them.

**Garbage collection**: Java frees memory for you. An object becomes *eligible* for GC when no live
reference points to it. You don't control *when* the GC actually runs (`System.gc()` is only a
suggestion, and calling it is almost always wrong).

### Going Further

#### The call stack, traced through nested calls

"One stack per thread" is easiest to see by watching frames pile up and unwind:
```java
void a() { int x = 1; b(); }
void b() { int y = 2; c(); }
void c() { int z = 3; }
```
Call `a()`. The stack grows a frame per call, and each frame holds only *that method's* locals:
```
call a() ─┐
          │  [ a: x=1 ]
call b() ─┤
          │  [ a: x=1 ][ b: y=2 ]
call c() ─┤
          │  [ a: x=1 ][ b: y=2 ][ c: z=3 ]
c() returns ─┤
          │  [ a: x=1 ][ b: y=2 ]           <- c's frame is popped, z is just GONE
b() returns ─┤
          │  [ a: x=1 ]
a() returns ─┤
          │  (empty)
```
`c()` can't see `a`'s or `b`'s locals, and once a frame is popped its locals don't linger anywhere —
there's no cleanup step needed, no GC involved, the memory is just reused for the next call. This is
also *why* `StackOverflowError` happens: unbounded recursion keeps pushing frames with nothing ever
popping, until the fixed-size stack runs out of room.

#### Garbage collection eligibility, traced step by step

```java
Book a = new Book("Dune", 412);   // step 1
Book b = a;                       // step 2
a = null;                         // step 3
```
```
step 1:  a --> [Book@0x100]                         (1 reference: a)
step 2:  a --> [Book@0x100] <-- b                    (2 references: a, b)
step 3:  a = null            b --> [Book@0x100]      (1 reference: b — still reachable, NOT eligible)
```
The `Book` only becomes GC-eligible once the *last* reference to it disappears — here, only after `b`
also goes out of scope or is reassigned. "I set `a = null`" does not, by itself, free anything if
something else still points at the same object. This is the whole mental model for garbage collection:
an object dies when it becomes **unreachable** from any live reference, not on any particular line of
code you wrote — which is also why you don't control *when* it actually happens.

- **The shared heap is exactly why concurrency is hard.** Two threads have separate stacks (no conflict
  on locals) but share every object on the heap — so unsynchronized shared object state is the entire
  source of race conditions (Lesson 0.5). It also means *local variables are automatically thread-safe*,
  which is a genuinely useful design lever: prefer locals and immutable objects over shared mutable
  fields.
- **Generational GC**: the heap is split into young (eden + survivor spaces) and old generations, on the
  "most objects die young" hypothesis. Short-lived allocations are cheap; objects that survive enough
  collections get promoted to the old generation, where collection is costlier. Practical takeaway: lots
  of small short-lived objects is far less harmful than people assume, while a long-lived cache that
  keeps churning is what causes real GC pressure.
- **Escape analysis**: the JIT can prove an object never escapes a method and allocate it on the stack
  instead (scalar replacement), eliminating the allocation entirely. So "every object is on the heap" is
  true of the language model but not always of the optimized machine code.
- **`StackOverflowError` vs `OutOfMemoryError`**: the first is an unbounded/deep recursion blowing the
  per-thread stack; the second is the heap being exhausted (or a leak). Knowing which one a symptom maps
  to is a routine debugging question.
- **Memory leaks exist in Java**, GC notwithstanding — they're *unintentional retention*: static
  collections that only grow, unremoved listeners/observers, `ThreadLocal`s never cleared in a pooled
  thread, or keys that mutate after insertion into a `HashMap`. GC only collects the *unreachable*; it
  can't know you forgot to unregister something.

---

## 4. Access control and packages

### Beginner

A **package** is a namespace/folder for related classes (`com.lld.foundations.oop`). Four access levels,
narrowest to widest:

| Modifier | Visible to |
|---|---|
| `private` | only inside the same class |
| *(none)* — "package-private" | any class in the same package |
| `protected` | same package **and** subclasses anywhere |
| `public` | everyone |

Default to `private` for fields and widen only when you have a reason — this is the mechanical side of
encapsulation (Lesson 1).

### Going Further

- **`protected` is wider than most people think** — it grants access to the whole package *plus* any
  subclass in any package, which means a `protected` field is effectively part of your public API for
  anyone who can extend your class. Prefer `protected` *methods* over `protected` *fields* (see
  `Account.debit()` in `solutions/` — a protected method that still enforces the invariant, instead of
  exposing the balance field directly).
- **Public API is a promise you can't take back** in a library. This is why `final` classes and private
  constructors are legitimate design tools rather than paranoia.
- **Package-private is underused** and is the natural default for classes that are implementation
  details of a package — it lets you refactor freely without breaking external callers, and it's how
  you'd structure a plugin-ish design where only the interface and factory are `public`.

---

## 5. The `Object` contract: `equals`, `hashCode`, `toString`

### Beginner

Every class in Java implicitly extends `Object`, which gives you these three methods — and the default
implementations are usually wrong for your domain.

- `equals(Object o)` — default is *reference* equality (`this == o`), i.e. "is it literally the same
  object." Usually you want *value* equality ("same account number" / "same coordinates").
- `hashCode()` — an `int` summary used by `HashMap`/`HashSet` to pick a bucket.
- `toString()` — the default prints `ClassName@1b6d3586`, which is useless in logs.

**The contract you must not break**: *if two objects are `equals`, they must have the same `hashCode`.*

```java
public final class Point {
    private final int x, y;

    public Point(int x, int y) { this.x = x; this.y = y; }

    @Override
    public boolean equals(Object o) {
        if (this == o) return true;
        if (!(o instanceof Point p)) return false;
        return x == p.x && y == p.y;
    }

    @Override
    public int hashCode() { return Objects.hash(x, y); }   // consistent with equals — same fields

    @Override
    public String toString() { return "Point(" + x + ", " + y + ")"; }
}
```

**What breaks if you ignore this**: override `equals` but not `hashCode`, and two "equal" points land in
different `HashMap` buckets — so `map.get(new Point(1,1))` returns `null` even though you just put an
equal key in. `HashSet` will happily hold duplicates. This is one of the most common real Java bugs and
a very common interview question.

### Going Further

#### Breaking symmetry across a hierarchy, traced step by step

The full `equals` contract has five rules: reflexive (`x.equals(x)`), symmetric (`x.equals(y) ==
y.equals(x)`), transitive, consistent, and `x.equals(null)` is always `false`. Symmetry is the one that
breaks in an interesting way, and it's worth watching it break:
```java
class Point {
    int x, y;
    @Override public boolean equals(Object o) {
        if (!(o instanceof Point p)) return false;    // accepts ANY Point, including subclasses
        return x == p.x && y == p.y;
    }
}
class ColorPoint extends Point {
    String color;
    @Override public boolean equals(Object o) {
        if (!(o instanceof ColorPoint cp)) return false;
        return super.equals(cp) && color.equals(cp.color);   // ALSO requires matching color
    }
}
```
```java
Point p = new Point(1, 1);
ColorPoint cp = new ColorPoint(1, 1, "red");

p.equals(cp)    // true  — Point.equals only checks x,y, and cp IS a Point with matching x,y
cp.equals(p)    // false — ColorPoint.equals requires a ColorPoint, and p isn't one
```
Same two objects, opposite answer depending on which side you call `.equals()` on — that's a broken
symmetry contract, and it silently corrupts any `HashSet`/`HashMap` that ends up comparing them in the
"wrong" direction (their internal comparisons don't consistently pick a side).

**Two honest fixes, different tradeoffs**:
- Use `getClass() != o.getClass()` instead of `instanceof` in both classes — now a `Point` only ever
  equals another exact `Point`, never a `ColorPoint`, so the contract can't break. Cost: this itself is
  arguably an LSP violation (a `ColorPoint` isn't fully substitutable where equality matters).
- Don't inherit `Point` at all — give `ColorPoint` its own unrelated type, or have it *compose* a
  `Point` internally instead of extending it. No shared `equals` implementation to conflict — the same
  composition-over-inheritance fix from Lesson 4, showing up again here.

Neither is "more correct" — know the tradeoff and be able to state it.

- **Mutable keys are a trap**: mutate a field that participates in `hashCode` *after* inserting the
  object into a `HashMap`, and the entry becomes unreachable — it's sitting in the bucket for its old
  hash. Prefer immutable keys. (This is a strong practical argument for `final` fields — you already saw
  this fail live in the `ObjectModelDemo` output above.)

#### Why `hashCode` quality matters, traced through a `HashMap` lookup

A `HashMap` is (conceptually) an array of buckets. Inserting a key does roughly:
```
bucket index = spread(key.hashCode()) % array.length
```
and walks to that bucket to insert/find the entry. If every key you insert returns the *same*
`hashCode()` (technically legal — the contract only says equal objects need equal hash codes, not that
unequal objects need different ones), every key lands in the *same* bucket:
```
bucket[7]: [key1] -> [key2] -> [key3] -> [key4] -> ...   (all in one chain)
```
Now `get()` has to walk that entire chain checking `.equals()` one by one — you've silently degraded an
O(1) map into an O(n) linked list. A good `hashCode()` spreads keys evenly across buckets so each one
holds close to zero or one entry. (Since Java 8, a bucket that still grows past 8 entries converts to a
red-black tree, capping the damage at O(log n) instead of O(n) — worth knowing when asked "what happens
on hash collisions in `HashMap`?", but it's a safety net, not a reason to write a lazy `hashCode`.)

- **`record` does all of this for you** (Java 16+) — it auto-generates `equals`, `hashCode`, and
  `toString` from the components. That's why `Notification` and `DeliveryReceipt` in `solutions/` are
  records. Use records for immutable data carriers; write the methods by hand only when you need
  non-standard semantics.
- **`Objects.hash(...)` allocates** a varargs array on every call. Irrelevant in ordinary code; in a hot
  path, hand-roll the standard `31 * result + field` form instead.

---

## Your practice task

The demo already shows the broken-`hashCode` and mutable-key failures — these tasks go past them. In
`practice/`, package `com.lld.javabasics.objects`:

1. **`Money`** — an immutable class with `amount` (use `long` cents or `BigDecimal`, *not* `double` —
   justify your choice in a comment) and a `currency` String. Validate in the constructor. Give it a
   correct `equals`/`hashCode`/`toString`, and an `add(Money other)` that returns a **new** `Money` and
   rejects mismatched currencies.
2. **`Money` as a record** — write the same type a second time as a `record` and compare. Which methods
   did you no longer have to write? What did you *lose* (hint: can you still validate? can you still
   control `toString`?). Write your conclusion as a short comment — "when would I hand-write this class
   instead of using a record?" is a real design question.
3. **`EqualsSymmetry`** — the advanced trap: write `Point` and `ColorPoint extends Point`, implement
   `equals` naively on both, then demonstrate in a runner that `point.equals(colorPoint)` is `true` while
   `colorPoint.equals(point)` is `false` — a broken symmetry contract. Then fix it *twice*: once with
   `getClass()` comparison, once by dropping the inheritance in favour of composition. Note the tradeoff
   each fix makes (this is the same is-a-vs-has-a tension formalized in Lesson 4).
4. **`InventoryItem`** — a class with a mutable `quantity` used as a `HashMap` *value* (not a key), plus a
   `static` counter of how many items exist. Mark in a comment exactly which line is unsafe under
   concurrency and why — you'll fix this class in Lesson 0.5.
5. Tests for `Money`: equality, hash consistency (`equal objects → equal hashCodes`), immutability (`add`
   doesn't mutate either operand), and currency-mismatch rejection.

Next: **Lesson 0.3 — Collections & Generics**, which depends directly on the `equals`/`hashCode`
contract you just learned.
</script>
<script type="text/markdown" id="md-00-3-java-collections-and-generics">
# Lesson 0.3 — Collections & Generics

Picking the right collection is one of the most visible signals of Java fluency in an interview — an
`ArrayList` where a `HashMap` belongs turns an O(1) lookup into an O(n) scan, and interviewers notice
immediately. Generics are what make those collections type-safe, and their sharp edges (erasure,
wildcards) are standard SDE2 follow-up territory.

> **Run the demo first.**
> ```
> mvn -q -pl solutions compile exec:java -Dexec.mainClass="com.lld.javabasics.collections.CollectionsDemo"
> ```
> It contrasts `HashSet`/`LinkedHashSet`/`TreeSet` iteration order, `HashMap` vs `TreeMap` null handling,
> a live `ConcurrentModificationException` and its `removeIf` fix, three comparator orderings over the
> same list, the `List.of` vs `unmodifiableList` distinction, and type erasure proving
> `List<String>.getClass() == List<Integer>.getClass()`.

---

## 1. The collection hierarchy

### Beginner

Four interfaces cover almost everything:

| Interface | Meaning | Duplicates? | Ordered? |
|---|---|---|---|
| `List` | an ordered sequence, indexed | yes | yes (insertion order) |
| `Set` | a bag of unique things | no | depends on impl |
| `Queue`/`Deque` | things waiting in line | yes | yes (FIFO/LIFO) |
| `Map` | key → value lookup table | unique keys | depends on impl |

(`Map` is technically not a `Collection`, but it's used alongside them constantly.)

```java
List<String> names = new ArrayList<>();
names.add("Asha");  names.add("Ben");  names.add("Asha");   // duplicates fine
System.out.println(names.get(0));                            // "Asha" — index access

Set<String> unique = new HashSet<>(names);                   // {"Asha", "Ben"} — dupes collapsed

Map<String, Integer> ages = new HashMap<>();
ages.put("Asha", 30);
System.out.println(ages.get("Asha"));                        // 30
System.out.println(ages.getOrDefault("Zed", -1));            // -1, no NPE

Deque<Integer> stack = new ArrayDeque<>();
stack.push(1); stack.push(2);
System.out.println(stack.pop());                             // 2 — LIFO
```

### Which implementation to pick

| Need | Use | Why |
|---|---|---|
| general-purpose list | `ArrayList` | O(1) index access, cache-friendly |
| lots of add/remove at the ends, queue-ish | `ArrayDeque` | beats `LinkedList` in practice, always |
| general-purpose set | `HashSet` | O(1) add/contains |
| set kept in sorted order | `TreeSet` | O(log n), sorted iteration |
| set in insertion order | `LinkedHashSet` | O(1) plus predictable iteration |
| general-purpose map | `HashMap` | O(1) get/put |
| map in key-sorted order | `TreeMap` | O(log n), plus range queries (`headMap`, `floorKey`) |
| map in insertion/access order | `LinkedHashMap` | LRU caches are built on its access-order mode |
| thread-safe map | `ConcurrentHashMap` | Lesson 0.5 / Phase 3 |

**Complexity cheat sheet** (average case):

| Operation | `ArrayList` | `LinkedList` | `HashMap`/`HashSet` | `TreeMap`/`TreeSet` |
|---|---|---|---|---|
| get by index | O(1) | O(n) | — | — |
| get by key | — | — | O(1) | O(log n) |
| add at end | O(1) amortized | O(1) | O(1) | O(log n) |
| add/remove at front | O(n) | O(1) | — | — |
| contains | O(n) | O(n) | O(1) | O(log n) |

### Going Further

- **`ArrayList` growth is amortized O(1)**: when it fills up it allocates a new array at 1.5× capacity
  and copies. If you know the size up front, `new ArrayList<>(expectedSize)` avoids repeated copying —
  a free win in hot paths.
- **`LinkedList` is almost always the wrong answer.** Its O(1) insert requires you to *already be at* the
  node (via an iterator); `add(i, x)` still walks there in O(n). It has terrible cache locality and 40+
  bytes of overhead per element. If you want a queue/stack, use `ArrayDeque`. Saying "LinkedList for
  frequent inserts" without the iterator caveat is a subtly wrong answer interviewers do catch.
#### How `HashMap` actually works, traced through a `put` and a `get`

This is a top-5 Java interview question, and it's much easier to hold onto as a trace than as a
paragraph. Picture the map as an array of "buckets" (say, 16 slots to start):
```
buckets: [0] [1] [2] [3] ... [15]
```
**`map.put("Asha", 30)`**:
1. Compute `"Asha".hashCode()` — some `int`.
2. Run it through an internal *spread* step (mixes the high and low bits together) — this defends
   against hash functions that only vary in their high bits, which would otherwise collide constantly.
3. `bucket index = spread(hash) % buckets.length` — say that lands on bucket `7`.
4. Walk bucket `7`: if it's empty, place `("Asha", 30)` there. If it already has entries, compare
   `"Asha".equals(...)` against each key in the chain — if none match, append a new entry.

```
buckets: [0] [1] ... [7: ("Asha",30)] ... [15]
```

**`map.get("Asha")`**: recompute the *same* bucket index (`7`), walk that bucket's chain, and return the
value the first time `.equals()` matches. This is why `get` is O(1) *on average* — you skip straight to
one bucket instead of scanning everything — and why a correct `hashCode()`/`equals()` pair (Lesson 0.2)
is what makes that skip land you in the right place at all.

**What happens under heavy collisions**: if many keys hash to the same bucket (a bad `hashCode`, or an
attacker deliberately choosing colliding keys), that bucket's chain grows long and `get` degrades toward
O(n) — you're back to scanning a list. Since Java 8, once a *single* bucket's chain reaches 8 entries
(and the table itself has at least 64 buckets), that one bucket converts from a linked list into a small
**red-black tree**, capping worst-case lookup at O(log n) for that bucket instead of O(n). This is a
safety net against pathological hashing, not a reason to skip writing a good `hashCode()`.

**Resizing**: once the map is 75% full (the *load factor*, 0.75 by default), it allocates a new array at
double the size and re-buckets every existing entry (since the bucket formula depends on
`buckets.length`, every entry's index can change). That's an O(n) pause, amortized over many inserts —
which is exactly why `new HashMap<>(expectedSize)` up front avoids repeated resizing in a hot path, the
same idea as `ArrayList`'s pre-sizing above.
- **`LinkedHashMap` with access-order = true, plus an overridden `removeEldestEntry`, is a complete LRU
  cache in ~5 lines.** You'll implement LRU from scratch in Phase 5, but knowing the JDK already has this
  is a good "and in production I'd just use..." answer.
- **`null` handling varies**: `HashMap` allows one `null` key and `null` values; `TreeMap` rejects `null`
  keys (it must compare them); `ConcurrentHashMap` rejects both. Since Java 9, `List.of()`/`Map.of()`
  reject `null` entirely and return **immutable** collections — note that `List.of()` is genuinely
  immutable, while `Collections.unmodifiableList(x)` is only an unmodifiable *view* (mutate the backing
  list and the view changes).
- **Fail-fast iteration**: mutating a collection while iterating it throws
  `ConcurrentModificationException` (it's a best-effort bug detector, not a thread-safety guarantee).
  Use `iterator.remove()`, `removeIf(...)`, or iterate a copy. `CopyOnWriteArrayList` is the
  concurrent-friendly alternative when reads vastly outnumber writes.

---

## 2. Ordering: `Comparable` vs `Comparator`

### Beginner

- **`Comparable`** — "this class has one natural order," implemented *by* the class itself.
- **`Comparator`** — "here's an ordering I'm supplying from outside," so you can have many.

```java
class Employee implements Comparable<Employee> {
    String name; int salary;

    @Override
    public int compareTo(Employee other) {          // natural order: by name
        return this.name.compareTo(other.name);
    }
}

Collections.sort(employees);                                    // uses compareTo
employees.sort(Comparator.comparingInt(e -> e.salary));         // a different order, supplied externally
employees.sort(Comparator.comparingInt((Employee e) -> e.salary).reversed()
                         .thenComparing(e -> e.name));          // chained: salary desc, then name
```
The contract: return negative if `this` comes first, zero if equivalent, positive if `other` comes first.

### Going Further

- **Keep `compareTo` consistent with `equals`** (i.e., `a.compareTo(b) == 0` iff `a.equals(b)`). When
  they disagree, sorted collections misbehave in confusing ways: a `TreeSet` treats "compares equal" as
  duplicate and silently drops the second element, even though `equals` says they differ.
  `BigDecimal` is the famous JDK example — `new BigDecimal("1.0").equals(new BigDecimal("1.00"))` is
  false, but `compareTo` says 0, so a `HashSet` and a `TreeSet` of the same `BigDecimal`s disagree on
  size.
- **Never implement `compareTo` as `a - b`** for ints — it overflows for large/negative values and
  silently inverts the ordering. Use `Integer.compare(a, b)`.
- **A non-transitive comparator throws** `IllegalArgumentException: Comparison method violates its
  general contract!` from `Arrays.sort` (TimSort detects it). Usually caused by hand-rolled comparison
  logic with inconsistent tie-breaking.

---

## 3. Generics

### Beginner

Generics let a class or method work over *any* type while staying type-safe. Before them, collections
held `Object` and you cast everything by hand (and found out at runtime when you got it wrong).

```java
List<String> names = new ArrayList<>();
names.add("Asha");
String s = names.get(0);        // no cast needed — compiler knows it's a String
// names.add(42);               // compile error — caught before you ever run it
```

Writing your own:
```java
public class Box<T> {                    // T is a type parameter — a placeholder
    private final T item;
    public Box(T item) { this.item = item; }
    public T get() { return item; }
}

Box<String> b = new Box<>("hi");
```

**Bounded types** constrain what `T` can be:
```java
public static <T extends Comparable<T>> T max(List<T> list) {   // T must be comparable
    T best = list.get(0);
    for (T item : list) if (item.compareTo(best) > 0) best = item;
    return best;
}
```

### Going Further

#### Type erasure, traced through what the compiler actually generates

Generics are a *compile-time* feature only. Here's what you write, and what the compiler turns it into
before it ever becomes bytecode:
```java
// what you write:
List<String> names = new ArrayList<>();
names.add("Asha");
String first = names.get(0);

// roughly what the compiler generates (erasure + inserted casts):
List names = new ArrayList();          // <String> is GONE — erased to the raw type
names.add("Asha");
String first = (String) names.get(0);  // the compiler inserts this cast FOR you, silently
```
The type argument `<String>` never exists at runtime — it's purely a compile-time promise the compiler
checks once, then throws away, inserting the cast so the erased code still behaves correctly. This one
fact explains a whole list of things that otherwise look like arbitrary rules:
- `new T[]` and `new T()` are illegal — there's no `T` left at runtime to construct from.
- You can't overload `process(List<String>)` and `process(List<Integer>)` in the same class — after
  erasure they're both just `process(List)`, an identical signature — the compiler rejects it as a
  duplicate method.
- `list instanceof List<String>` is illegal (there's no `<String>` left to check against at runtime);
  only `instanceof List<?>` compiles.
- `strings.getClass() == integers.getClass()` is `true` — exactly what the demo printed. Same erased
  class, `ArrayList`, for both.

Erasure exists for *migration compatibility*: when generics were added to Java 5, all the pre-generics
code already compiled and running in the world had to keep working unchanged against the new generic
collections. Erasing to the pre-generics raw types was how that was achieved. (Contrast with C#, which
reifies generics — keeps the type info at runtime — at the cost of that backward compatibility.)

#### Wildcards and PECS, traced through what the compiler allows and rejects

First, *why* wildcards need to exist at all: generics are **invariant** in Java — `List<String>` is
**not** a `List<Object>`, even though every `String` is an `Object`. If it were allowed:
```java
List<String> strings = new ArrayList<>();
List<Object> objects = strings;        // if this compiled...
objects.add(42);                       // ...this would silently corrupt a List<String> with an Integer
```
That's exactly the hole arrays have (`Object[] objs = new String[2]; objs[0] = 42;` compiles and blows up
at runtime — Lesson 0.1). Generics refuse to compile the dangerous line at all, which is *safer* but
means you sometimes need a different tool to write flexible APIs: wildcards.

```java
void copyAll(List<? extends Number> source, List<? super Integer> target) { ... }
```
Read as "**P**roducer `extends`, **C**onsumer `super`" — think about which side of the assignment the
list sits on:

- **`? extends Number`** (a *producer* — you only ever read from it): the compiler knows *some* subtype
  of `Number` is in there, but not which one, so:
  ```java
  Number n = source.get(0);     // fine — whatever's in there, it's at least a Number
  source.add(5);                // COMPILE ERROR — could be a List<Integer>, a List<Double>...
                                 //   the compiler can't prove a 5 is safe to insert into either
  ```
- **`? super Integer`** (a *consumer* — you only ever write to it): the compiler knows the list holds
  `Integer` or some *supertype* of it, so:
  ```java
  target.add(5);                 // fine — an Integer is always safe to add here
  Number n = target.get(0);      // COMPILE ERROR — could be a List<Object>; all you're
                                  //   guaranteed is Object, not Number
  ```
Try to violate either rule and the compiler rejects it before the program ever runs — that's the entire
point: wildcards let you write a *more flexible* method signature (accept any subtype/supertype) while
the compiler still statically proves you can't corrupt the caller's list.
- **Practical API rule**: use wildcards on method *parameters* to make your API flexible for callers;
  don't use them as return types (it pushes the awkwardness onto everyone calling you).
- **Heap pollution and `@SafeVarargs`**: a generic varargs parameter (`List<String>... lists`) creates an
  array of a generic type, which erasure can't fully guarantee — hence the unchecked warning, and
  `@SafeVarargs` to assert you're not storing anything unsafe into it.

---

## Your practice task

In `practice/`, package `com.lld.javabasics.collections`:

1. **`GenericStack<T>`** — implement a stack backed by an `ArrayDeque<T>` (not `LinkedList`) with `push`,
   `pop`, `peek`, `isEmpty`, `size`. Throw a meaningful exception on `pop`/`peek` when empty. Write a
   comment explaining why `ArrayDeque` over `LinkedList` or `Stack` (note: the legacy `java.util.Stack`
   extends `Vector` and is synchronized-and-slow — knowing *why* it's discouraged is the point).
2. **`Pair<A, B>`** — a generic immutable pair with correct `equals`/`hashCode`/`toString` (reuse what you
   learned in Lesson 0.2). Then write a static factory `of(A a, B b)` so callers get type inference.
3. **`LeaderBoard`** — keep the top N scores using a `TreeSet` with a custom comparator. The hard part is
   deliberate: a `TreeSet` treats "compares equal" as duplicate, so two players with the *same score*
   will silently collapse into one unless your comparator has a tie-breaker. Hit that bug, then fix it —
   it's the `compareTo`-vs-`equals` consistency issue from the Going Further section, made concrete.
4. **`WordFrequency`** — count word occurrences in a sentence using `merge(word, 1, Integer::sum)`, then
   again with `computeIfAbsent`. Then return the top 3 words by count, ties broken alphabetically. These
   `Map` APIs are idiomatic modern Java and replace the `if (map.containsKey(k))` dance most people write.
5. **`PecsDemo`** — a `copyAll(List<? extends Number> src, List<? super Integer> dst)` method, plus
   commented-out lines showing exactly which operations the compiler rejects on each side and why.
6. Tests for `GenericStack` (LIFO order, empty-stack behavior, size tracking), `Pair` (equality and hash
   consistency), and `LeaderBoard` (equal scores must both be retained).

Next: **Lesson 0.4 — Exceptions & Modern Java**.
</script>
<script type="text/markdown" id="md-00-4-java-exceptions-and-modern-java">
# Lesson 0.4 — Exceptions & Modern Java

Two halves. First, exceptions — the part of Java where most "works on the happy path" code falls apart,
and where interviewers probe your judgment (not your syntax). Second, the modern language features
(lambdas, streams, records, sealed types) that show up in every current codebase and that make several
classic design patterns nearly disappear.

> **Run the demo first.**
> ```
> mvn -q -pl solutions compile exec:java -Dexec.mainClass="com.lld.javabasics.modern.ModernJavaDemo"
> ```
> It shows try-with-resources closing before the catch block runs, a *suppressed* close-time exception
> sitting alongside the primary one, cause chaining, stream aggregation with `groupingBy`, a stream
> rejecting reuse, and a sealed hierarchy handled by an exhaustive `switch` with no `default`. The sealed
> `Shape` + `ShapeAreas` pair lives in the same package if you want to try adding a fourth type and
> watching the build break.

---

## 1. Exceptions

### Beginner

An exception is Java's way of saying "I can't continue normally." You either handle it or let it
propagate up to your caller.

```java
try {
    int result = 10 / divisor;
} catch (ArithmeticException e) {
    System.out.println("Can't divide by zero: " + e.getMessage());
} finally {
    // always runs — success, exception, even an early return
}
```

**The hierarchy**:
```
Throwable
├── Error                    ← JVM-level, don't catch (OutOfMemoryError, StackOverflowError)
└── Exception
    ├── RuntimeException     ← UNCHECKED: compiler doesn't force you to handle
    │   ├── NullPointerException, IllegalArgumentException,
    │   └── IllegalStateException, IndexOutOfBoundsException...
    └── everything else      ← CHECKED: compiler forces catch-or-declare
        └── IOException, SQLException...
```

- **Checked** — the compiler makes you either `catch` it or declare `throws` on your method. Meant for
  recoverable, expected-in-normal-operation conditions (a file might not exist).
- **Unchecked** (`RuntimeException` and subclasses) — no compiler obligation. Meant for programming
  errors (a null you should have checked, an argument that violates the method's contract).

**Custom exceptions**:
```java
public class InsufficientFundsException extends RuntimeException {
    public InsufficientFundsException(String message) { super(message); }
}
```

**try-with-resources** closes anything implementing `AutoCloseable`, in reverse order, even on exception:
```java
try (BufferedReader reader = new BufferedReader(new FileReader("data.txt"))) {
    return reader.readLine();
}   // reader.close() happens automatically — no finally block needed
```

### Going Further

- **Checked vs unchecked is a design decision, and it's a real interview question.** The practical
  modern consensus (and what most frameworks do): prefer **unchecked** for most application code.
  Checked exceptions don't compose with lambdas/streams, they leak implementation details up the call
  stack, and in practice they get swallowed by empty catch blocks. Use checked only when the caller can
  realistically *do something specific* to recover. Be able to argue both sides — Bloch argues for checked
  when recovery is plausible; Spring/Hibernate wrap everything into unchecked deliberately.
#### How `finally` silently swallows exceptions, traced step by step

```java
String risky() {
    try {
        throw new RuntimeException("the real problem");
    } finally {
        return "fine?";     // <-- do not do this
    }
}
```
Walk through what actually happens when you call `risky()`:
1. The `try` block throws `RuntimeException("the real problem")`.
2. Before that exception can propagate to the caller, the JVM must run `finally` first (that's the
   guarantee — `finally` always runs).
3. `finally` executes `return "fine?"` — a `return` **completes the method right there**.
4. Because the method just completed *normally* (via that `return`), the exception from step 1 is
   **discarded**. It never reaches the caller. `risky()` returns `"fine?"` as if nothing happened.

The same thing happens with a `throw` inside `finally` — it replaces whatever was propagating, silently.
This is why the rule is absolute: never `return` or `throw` from a `finally` block. Try-with-resources
avoids this failure mode by design — instead of discarding, it *suppresses*: if the resource's `close()`
also throws while an exception is already propagating from the body, both are kept, with the original as
primary and the close-time one attached via `getSuppressed()` (you saw this live in the demo's second
section). Hand-written `finally` blocks don't get this for free — you'd have to write the suppression
logic yourself, which is exactly why try-with-resources exists.

#### Close order with multiple resources, traced step by step

```java
try (var a = new NoisyResource("A", false);
     var b = new NoisyResource("B", false)) {
    // use a and b
}
```
Resources close in **reverse** declaration order — think of it like a stack: the last one opened is the
first one that might depend on something the others set up, so it's closed first.
```
open A
open B
... body runs ...
close B      <- opened last, closed first
close A      <- opened first, closed last
```
This matters the moment one resource depends on another (e.g., a buffered wrapper around a raw stream) —
reverse order guarantees the wrapper is closed before the thing it wraps.
- **Don't catch what you can't handle**, and never `catch (Exception e) {}` empty — the two habits that
  make production incidents unexplainable. If you must catch broadly (a thread's top-level loop, a
  request handler), *log with the stack trace* and continue deliberately.
- **Exception chaining preserves cause**: `throw new ServiceException("saving order failed", e)` keeps
  the original stack trace. Losing the cause is the most common debugging-hostile mistake.
- **Exceptions are expensive** — mainly because filling in the stack trace walks the stack. Never use
  them for ordinary control flow (e.g., "end of loop"). In extreme hot paths you'll occasionally see
  pre-allocated stackless exceptions (overriding `fillInStackTrace`), which is a legitimate but rare
  optimization worth recognizing.
- **Validate at boundaries, fail fast**: `IllegalArgumentException` for bad inputs,
  `IllegalStateException` for an operation invalid in the object's current state. That's exactly the
  split used in `solutions/`'s `Account` (`IllegalArgumentException` for a negative amount,
  `IllegalStateException` for a withdrawal the balance can't support) — that distinction is a small
  but real signal of care in an interview.

---

## 2. Lambdas and functional interfaces

### Beginner

A **functional interface** is any interface with exactly one abstract method. A **lambda** is a compact
way to write an instance of one.

```java
// The old way
Runnable r = new Runnable() {
    @Override public void run() { System.out.println("hi"); }
};

// The lambda way — identical meaning
Runnable r = () -> System.out.println("hi");
```

The built-in ones you'll use constantly (`java.util.function`):

| Interface | Shape | Typical use |
|---|---|---|
| `Supplier<T>` | `() -> T` | lazily produce a value |
| `Consumer<T>` | `T -> void` | do something with a value |
| `Function<T,R>` | `T -> R` | transform |
| `Predicate<T>` | `T -> boolean` | test/filter |
| `BiFunction<T,U,R>` | `(T,U) -> R` | two-arg transform |

**Method references** are shorthand when the lambda just calls an existing method:
```java
names.forEach(System.out::println);          // instead of  x -> System.out.println(x)
names.stream().map(String::toUpperCase);     // instead of  s -> s.toUpperCase()
list.sort(Comparator.comparing(Employee::getName));
```

### Going Further

#### `this` in a lambda vs an anonymous class, traced step by step

This looks like a style difference and is actually a behavioral one:
```java
class Reporter {
    String name = "Reporter";

    Runnable asAnonymous() {
        return new Runnable() {
            String name = "Anonymous";
            @Override public void run() { System.out.println(this.name); }
        };
    }

    Runnable asLambda() {
        return () -> System.out.println(this.name);
    }
}
```
```java
new Reporter().asAnonymous().run();   // prints "Anonymous"
new Reporter().asLambda().run();      // prints "Reporter"
```
In the anonymous class, `this` refers to the anonymous class instance itself — it's a genuinely new
object with its own identity, so `this.name` finds *its own* `name` field. A lambda has no such
identity: `this` inside a lambda body is resolved exactly as if the lambda's code were still sitting
directly inside `asLambda()` — so `this` refers to the enclosing `Reporter` instance, not to "the
lambda." This also explains why lambdas compile completely differently under the hood: an anonymous
class generates its own `.class` file and allocates a new object per instantiation; a lambda compiles to
an `invokedynamic` call site, with the body as a plain private method — and a *non-capturing* lambda
(one that references nothing from its enclosing scope) can be created once and reused for every call,
since there's no per-instance state to allocate at all.
- **Effectively final capture**: a lambda can only capture local variables that are never reassigned.
  This exists because locals live on the stack (Lesson 0.2) and the lambda may outlive the frame, so the
  value is *copied*. Instance fields have no such restriction (they're on the heap) — which is also how
  people accidentally capture mutable shared state in concurrent code.
- **Lambdas and checked exceptions don't mix.** `Function.apply` doesn't declare `throws`, so any checked
  exception inside a lambda must be caught and wrapped — this friction is one of the strongest practical
  arguments for preferring unchecked exceptions in new code.
- **Functional interfaces make Strategy nearly free.** A `Strategy` pattern whose interface has one
  method can often just *be* a `Function`/`Predicate` supplied as a lambda — no class needed. We'll call
  this out explicitly in the Strategy lesson; knowing when the lightweight version suffices (and when you
  still want a named class for clarity/testability) is an SDE2-level judgment call.

---

## 3. Streams

### Beginner

A stream is a pipeline for processing a collection declaratively — *what* you want, not *how* to loop.

```java
// Imperative
List<String> result = new ArrayList<>();
for (Employee e : employees) {
    if (e.getSalary() > 50000) result.add(e.getName().toUpperCase());
}

// Stream equivalent
List<String> result = employees.stream()
        .filter(e -> e.getSalary() > 50000)     // intermediate — lazy
        .map(e -> e.getName().toUpperCase())    // intermediate — lazy
        .toList();                              // terminal — triggers execution
```

**Intermediate** operations (`filter`, `map`, `sorted`, `distinct`, `limit`) are lazy and return a
stream. **Terminal** operations (`collect`, `toList`, `forEach`, `reduce`, `count`, `anyMatch`) actually
run the pipeline. Nothing happens until a terminal operation is called.

Useful collectors:
```java
Map<String, List<Employee>> byDept =
        employees.stream().collect(Collectors.groupingBy(Employee::getDept));

double avg = employees.stream().mapToInt(Employee::getSalary).average().orElse(0);

String joined = names.stream().collect(Collectors.joining(", "));
```

### Going Further

- **Streams are single-use.** Consuming one twice throws `IllegalStateException`. They're pipelines, not
  collections.

#### Laziness and fusion, traced element by element

The easy mental model — "`filter` runs over the whole list, *then* `map` runs over the result, *then*
`findFirst` picks one" — is actually wrong, and it's worth seeing why. Add logging to watch the real
order:
```java
List.of(1, 2, 3, 4, 5).stream()
    .filter(n -> { System.out.println("filter " + n); return n % 2 == 0; })
    .map(n -> { System.out.println("map " + n); return n * 10; })
    .findFirst();
```
If it ran "one stage at a time over the whole list," you'd expect all five `filter` lines, then all the
`map` lines. What actually prints:
```
filter 1
filter 2
map 2
```
...and it **stops there** — `3`, `4`, `5` are never even touched. Here's what's really happening: nothing
runs until the terminal operation (`findFirst`) is called, and once it is, each *element* is pulled
through the **entire pipeline** one at a time, not each *stage* over the entire collection:
```
pull element 1 --> filter(1)=false --> discard, pull next
pull element 2 --> filter(2)=true  --> map(2)=20 --> findFirst is satisfied, STOP
                                                       (3, 4, 5 never enter the pipeline at all)
```
This fused, element-at-a-time, short-circuiting execution is why a stream with `findFirst()` or
`anyMatch()` over a huge collection can beat an equivalent imperative loop that (naively) computes an
intermediate list first — the stream never does the wasted work in the first place.
- **Don't mutate shared state from a lambda** (`forEach(x -> list.add(x))`). It's a correctness bug in
  parallel streams and a code smell in sequential ones — use `collect` instead, which is designed for it.
- **`parallelStream()` is rarely the win people expect.** It uses the shared common ForkJoinPool, so one
  slow parallel stream can starve unrelated tasks; it only pays off for large datasets with CPU-bound,
  independent, non-blocking work over a splittable source (`ArrayList` splits well, `LinkedList` doesn't).
  Never use it for blocking I/O. "I'd measure first" is the correct interview answer.
- **Streams are not always faster than loops.** For small collections or hot inner loops, the plain
  `for` loop usually wins (no pipeline setup, no boxing). Use `IntStream`/`mapToInt` to avoid boxing
  when working with primitives.
- **`Optional` is a return type, not a field type.** Use it to express "this method may find nothing";
  don't use it for fields or parameters. Prefer `orElseGet`/`orElseThrow`/`map` over `isPresent() + get()`,
  which is just a null check with more ceremony.

---

## 4. Records, sealed types, and pattern matching

### Beginner

**Records** (Java 16+) are immutable data carriers — the compiler writes the constructor, accessors,
`equals`, `hashCode`, and `toString`:
```java
public record Point(int x, int y) { }

Point p = new Point(3, 4);
p.x();                    // accessor (note: x(), not getX())
p.equals(new Point(3, 4)); // true — value equality, generated for you
```
With validation via a **compact constructor**:
```java
public record Notification(String recipient, String eventType, String content) {
    public Notification {                                     // no parameter list, no assignments
        if (recipient == null || recipient.isBlank())
            throw new IllegalArgumentException("recipient must not be blank");
    }
}
```
(That's exactly the `Notification` record in `solutions/`.)

**Sealed types** (Java 17+) restrict who may implement/extend:
```java
public sealed interface Shape permits Circle, Square { }
public record Circle(double radius) implements Shape { }
public record Square(double side)   implements Shape { }
```

**Pattern matching** then becomes exhaustive and cast-free:
```java
double area = switch (shape) {
    case Circle c -> Math.PI * c.radius() * c.radius();
    case Square s -> s.side() * s.side();
};   // no default needed — the compiler KNOWS these are the only two
```

### Going Further

- **Sealed + exhaustive switch is a compile-time safety net**: add a `Triangle` to the `permits` clause
  and *every* switch over `Shape` that doesn't handle it fails to compile. That's strictly stronger than
  the runtime `UnsupportedOperationException` you'd get from a missing case.
- **This directly competes with the Visitor pattern.** Visitor exists mainly to add operations over a
  fixed type hierarchy without modifying the classes; sealed interfaces + pattern matching achieve the
  same exhaustiveness with far less ceremony. Knowing *when each is appropriate* is exactly the kind of
  tradeoff discussion that lands well at SDE2 level — we'll revisit it in the Visitor lesson.
#### The expression-problem tradeoff, traced through both directions

Take the `Shape` example and ask two different questions about extending it later.

**"Add a new type"** (say, `Triangle`) — compare the two designs:
```java
// OPEN interface (like NotificationChannel):
interface Shape { double area(); }
class Triangle implements Shape { public double area() { ... } }   // done. Nothing else touched.

// SEALED interface (like this lesson's Shape):
sealed interface Shape permits Circle, Square { ... }
// adding Triangle means editing the permits clause AND every exhaustive switch over Shape
// — the compiler FORCES you to touch every place that cared, on purpose
```
Open wins here: one new class, zero edits elsewhere. That's OCP.

**"Add a new operation"** (say, `perimeter()`) — now compare the same two designs:
```java
// OPEN interface: perimeter() must be added to the interface itself...
interface Shape { double area(); double perimeter(); }
// ...which means EVERY existing implementing class must now implement perimeter() too —
// Circle, Square, and anything else anyone else wrote against this interface, invasively.

// SEALED interface: just write a new function with a switch — no existing class touched:
double perimeter(Shape s) {
    return switch (s) {
        case Circle c -> 2 * Math.PI * c.radius();
        case Square sq -> 4 * sq.side();
    };   // exhaustive, compiler-checked, and Circle/Square themselves are untouched
}
```
Sealed wins here: one new function, zero edits to existing classes.

Neither design is "better" in the abstract — each makes one direction of extension free and the other
direction costly. The actual skill is predicting, for your specific problem, which axis (types or
operations) is more likely to grow, and picking accordingly: `NotificationChannel` was designed open
because "new channel" is the expected growth (Phase 6); a fixed algebra like the `Expression` type in
your practice task is designed sealed because "new operation" (evaluate, print, simplify, ...) is the
expected growth and the set of node types is fixed by definition.
- **Records are shallowly immutable**: `record Team(String name, List<Player> players)` still lets a
  caller mutate the list. For true immutability, defensively copy in the compact constructor
  (`players = List.copyOf(players)`).
- **Records can't extend classes** (they implicitly extend `Record`) but can implement interfaces — which
  is why they compose naturally with sealed interfaces rather than class hierarchies.
- **`var` (Java 10+)** is local type inference, *not* dynamic typing — the type is fixed at compile time.
  Use it when the right-hand side already states the type (`var list = new ArrayList<String>()`); avoid
  it when it hides useful information (`var x = getThing()`).

---

## Your practice task

In `practice/`, package `com.lld.javabasics.modern`:

1. **`SafeDivider`** — a class demonstrating exception design: a method that throws
   `IllegalArgumentException` for a zero divisor, plus a custom unchecked
   `CalculationException` wrapping a lower-level failure *with its cause preserved*. Write a comment
   arguing why you chose unchecked over checked here.
2. **`RetryExecutor`** — a method `<T> T runWithRetries(Supplier<T> action, int attempts)` that retries on
   failure and, if every attempt fails, throws one exception carrying *all* the earlier failures via
   `addSuppressed(...)`. This combines functional interfaces with the suppressed-exception mechanism the
   demo showed, in a genuinely useful utility (retry logic reappears in the Phase 6 notification system).
3. **`StreamRefactor`** — take an imperative nested-loop aggregation (e.g., group employees by department
   and compute each department's average salary) and write both versions side by side: the `for`-loop
   version and the `Collectors.groupingBy(..., Collectors.averagingInt(...))` version. Assert in a test
   that they produce identical results.
4. **`Expression`** — a `sealed interface Expression permits Num, Add, Mul` with record implementations,
   and a *recursive* `evaluate(Expression e)` using an exhaustive switch. Then extend it with **record
   patterns** (`case Add(Expression l, Expression r) -> ...`) to destructure in the case label itself.
   Evaluating `Add(Num(2), Mul(Num(3), Num(4)))` should give 14. This is the sealed-types idea one level
   past the demo, and it's the exact structure an interpreter/rule-engine question uses.
5. Tests: `RetryExecutor` (succeeds on a later attempt; final failure carries all suppressed causes),
   `StreamRefactor` (both implementations agree), `Expression` (nested evaluation is correct).

This completes Phase 0's language work except concurrency. Next: **Lesson 0.5 — Concurrency Basics**.

# Lesson 0.5 — Concurrency Basics (Language Mechanics)

This lesson covers *how concurrency works in Java* — what a thread is, why unsynchronized code breaks,
and what `synchronized` actually does. Phase 3 ("Concurrency for LLD") is the applied follow-up: locks,
concurrent collections, thread pools, and designing thread-safe systems. Do this one first; every claim
in Phase 3 rests on the memory model explained here.

Concurrency shows up in LLD interviews more than people expect — Parking Lot ("two cars request the last
spot simultaneously"), BookMyShow ("two users select the same seat"), Rate Limiter ("counter under
concurrent requests"). Being able to say precisely *where* the race is and *what* you'd lock is a
differentiator at SDE2 level.

> **Run the demo first — this is the one lesson where reading is genuinely not enough.**
> ```
> mvn -q -pl solutions compile exec:java -Dexec.mainClass="com.lld.javabasics.concurrency.ConcurrencyDemo"
> ```
> It runs an unsynchronized counter three times (you'll get a *different wrong answer* each run — and
> occasionally a correct one, which is itself the lesson), then the same workload with `synchronized`,
> `AtomicInteger`, and `ReentrantLock` all landing exactly on target. Then it demonstrates a real
> deadlock between two opposing bank transfers, and the lock-ordering fix that makes it impossible.
> Every section is bounded by timeouts and daemon threads, so the program always terminates.
>
> Run it several times. The variation between runs is the entire point — concurrency bugs don't
> reproduce on demand, which is why you design them out rather than test them out.

---

## 1. Processes, threads, and how to start one

### Beginner

A **process** is a running program with its own memory. A **thread** is a unit of execution *inside* a
