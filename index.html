<script type="text/markdown" id="md-11-2-movie-ticket-booking">
# Movie Ticket Booking (BookMyShow)
*Amazon, Microsoft — concurrency-heavy; this is the seat-locking problem.*

**Time-box**: ~3h.

## Requirements
- Theaters have screens; a screen hosts shows (a specific movie at a specific date/time); a screen has
  seats, each with a type (regular/premium) and price.
- A user selects seats for a show and books them. Selecting seats should place a temporary **hold** while
  payment is "processed" (simulate); if payment doesn't complete within a timeout, the hold releases the
  seats automatically.
- Two users must never both successfully book the same seat for the same show.
- A booking can be cancelled, freeing its seats.
- **Out of scope**: real payment gateway integration, seat-recommendation algorithms.

## Where to start
The single most important modeling decision in this problem, and a very common mistake: **seat
availability is a property of a (seat, show) pair, not of the physical seat alone.** The same physical
seat is available again for the 9pm show even while it's held for the 6pm show — if you model
availability directly on `Seat`, you'll incorrectly block a seat across unrelated showtimes. Once that's
modeled correctly, the concurrency shape is identical to **Lesson 8's `ConcurrentParkingLot`** and
Phase 3's "claim atomically, per-resource" principle — apply that exact reasoning here, per seat-per-show,
not with a lock spanning the whole show or theater. The hold-then-expire mechanic is a State machine
(available → held → booked, with held reverting to available on timeout).

## Common pitfalls
Modeling seat status on the physical seat instead of per (seat, show); locking the whole show/screen
instead of individual seats (the exact over-broad-locking mistake named for Parking Lot, reappearing
here); forgetting to implement the hold-timeout release at all, leaving seats permanently stuck as "held"
if payment never completes.

## Your task
In `practice/`, package `com.lld.problems.moviebooking`. Model seat state per (seat, show). Tests: two
concurrent threads racing to book the same seat for the same show — exactly one succeeds; a held seat
that isn't confirmed within the timeout becomes available again; the same physical seat is independently
bookable for two different shows at the same time; cancelling a confirmed booking frees the seat.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/moviebooking/`.*

**Clarifying questions**: Confirm the (seat, show) modeling decision out loud before writing anything —
"the same physical seat needs independent availability per showtime, so I'll key state by the pair, not
the seat alone." How long is the hold window? Does confirming require payment success as a separate step,
or is "confirm" itself the terminal action for this exercise?

**Build order**:
1. `ShowSeat` first — deliberately the very first class, before `Seat` even has more than an id and type,
   because the (seat, show) keying decision is the entire problem, and getting it wrong here means
   redoing everything downstream. Give it the exact same atomic-claim shape as `Locker` from Phase 4
   (`AtomicReference` + `compareAndSet`) — recognizing "this is the third time I've built this exact
   shape" (Parking Lot, Amazon Locker, now this) is worth saying out loud.
2. `HoldStatus` and `SeatHold` together — `SeatHold` is `LockerAssignment` with a different name and one
   more transition (`CONFIRMED`), so build it by adapting that class rather than starting from a blank
   page: `HELD → CONFIRMED` (payment succeeded) or `HELD → EXPIRED` (timeout) or
   `HELD`/`CONFIRMED → CANCELLED`.
3. `BookingService` last, and the one design choice worth narrating: it keeps its own list of active
   holds (`activeHolds`), separate from the per-seat claim in `ShowSeat`. Say why — a `ShowSeat` only
   knows about *its own* current hold, with no way to be swept for expiry from the outside; the service
   needs its own index of everything currently held so a periodic sweep (`expireStaleHolds`) has
   something to iterate without walking every seat in the theater.
4. The (seat, show) key itself (`showId + "#" + seatId"`) is a small detail worth a sentence: a composite
   key is simpler here than a nested `Map<String, Map<String, ShowSeat>>`, and there's no real downside
   for this access pattern — don't over-engineer the key structure when a string concatenation does the
   job correctly.

**Extensions**:
- *"What triggers the expiry sweep — who calls `expireStaleHolds`?"* — name the real answer: a scheduled
  background task (`ScheduledExecutorService`, Lesson 8) running every few seconds, or a lazy check
  performed the next time anyone tries to hold that specific seat — trade-off being background-thread
  overhead vs. slightly stale availability data between sweeps.
- *"Support group bookings (multiple seats in one transaction)?"* — hold *all* requested seats
  atomically or none at all; if any single `tryHold` in the batch fails, release whichever ones already
  succeeded before returning failure — a mini two-phase-commit, worth naming as exactly that.
- *"Dynamic pricing (surge for popular shows)?"* — a `PricingStrategy` (Lesson 5) on `Show`, independent
  of the seat-holding mechanics entirely — the two concerns don't need to know about each other.

## Solution Code

*Full source lives in `solutions/.../problems/moviebooking/` — shown below in build order, one file at a time.*

**`HoldStatus.java`**

```java
package com.lld.problems.moviebooking;

public enum HoldStatus { HELD, CONFIRMED, EXPIRED, CANCELLED }
```

**`Seat.java`**

```java

public record Seat(String id, String seatType) {
}
```

**`Show.java`**

package com.lld.problems.moviebooking;

import java.time.Instant;

public record Show(String id, String movieTitle, Instant startTime) {
}
```

**`ShowSeat.java`**

```java
package com.lld.problems.moviebooking;

import java.util.concurrent.atomic.AtomicReference;

/**
 * Seat state is per (show, seat) pair, not on the physical Seat itself --
 * the same physical seat is independently bookable for a different show at
 * a different time. Atomic claim, same shape as ParkingSpot/Locker.
 */
public class ShowSeat {

    private final String showId;
    private final Seat seat;
    private final AtomicReference<SeatHold> currentHold = new AtomicReference<>();

    public ShowSeat(String showId, Seat seat) {
        this.showId = showId;
        this.seat = seat;
    }

    public String getShowId() {
        return showId;
    }

    public Seat getSeat() {
        return seat;
    }

    public boolean isAvailable() {
        return currentHold.get() == null;
    }

    boolean tryHold(SeatHold hold) {
        return currentHold.compareAndSet(null, hold);
    }

    void release() {
        currentHold.set(null);
    }
}
```

**`SeatHold.java`**

```java
package com.lld.problems.moviebooking;

import java.time.Duration;
import java.time.Instant;
import java.util.UUID;

/** Its own small State machine (HELD -> CONFIRMED / EXPIRED / CANCELLED), layered on the seat's own claim. */
public class SeatHold {

    private final String id;
    private final ShowSeat showSeat;
    private final Instant heldAt;
    private final Duration holdWindow;
    private HoldStatus status = HoldStatus.HELD;

    SeatHold(ShowSeat showSeat, Instant heldAt, Duration holdWindow) {
        this.id = UUID.randomUUID().toString();
        this.showSeat = showSeat;
        this.heldAt = heldAt;
        this.holdWindow = holdWindow;
    }

    public String getId() {
        return id;
    }

    public ShowSeat getShowSeat() {
        return showSeat;
    }

    public synchronized HoldStatus getStatus() {
        return status;
    }

    synchronized boolean confirm(Instant now) {
        if (status != HoldStatus.HELD) {
            return false;
        }
        if (isExpired(now)) {
            status = HoldStatus.EXPIRED;
            showSeat.release();
            return false;
        }
        status = HoldStatus.CONFIRMED;
        return true;
    }

    synchronized boolean cancel() {
        if (status != HoldStatus.CONFIRMED && status != HoldStatus.HELD) {
            return false;
        }
        status = HoldStatus.CANCELLED;
        showSeat.release();
        return true;
    }

    synchronized boolean checkExpiry(Instant now) {
        if (status == HoldStatus.HELD && isExpired(now)) {
            status = HoldStatus.EXPIRED;
            showSeat.release();
            return true;
        }
        return false;
    }

    private boolean isExpired(Instant now) {
        return now.isAfter(heldAt.plus(holdWindow));
    }
}
```

**`BookingService.java`**

```java
package com.lld.problems.moviebooking;

import java.time.Duration;
import java.time.Instant;
import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.ConcurrentLinkedQueue;

public class BookingService {

    private final Duration holdWindow;
    private final Map<String, ShowSeat> showSeats = new ConcurrentHashMap<>(); // key: showId + "#" + seatId
    private final ConcurrentLinkedQueue<SeatHold> activeHolds = new ConcurrentLinkedQueue<>();

    public BookingService(Duration holdWindow) {
        this.holdWindow = holdWindow;
    }

    public Optional<SeatHold> holdSeat(Show show, Seat seat, Instant now) {
        ShowSeat showSeat = showSeats.computeIfAbsent(key(show.id(), seat.id()), k -> new ShowSeat(show.id(), seat));
        SeatHold hold = new SeatHold(showSeat, now, holdWindow);
        if (!showSeat.tryHold(hold)) {
            return Optional.empty();
        }
        activeHolds.add(hold);
        return Optional.of(hold);
    }

    public boolean confirmBooking(SeatHold hold, Instant now) {
        return hold.confirm(now);
    }

    public boolean cancelBooking(SeatHold hold) {
        return hold.cancel();
    }

    /** Sweeps every tracked hold for ones past their pickup window and not yet confirmed. */
    public List<SeatHold> expireStaleHolds(Instant now) {
        return activeHolds.stream().filter(hold -> hold.checkExpiry(now)).toList();
    }

    public boolean isAvailable(Show show, Seat seat) {
        ShowSeat showSeat = showSeats.get(key(show.id(), seat.id()));
        return showSeat == null || showSeat.isAvailable();
    }

    private String key(String showId, String seatId) {
        return showId + "#" + seatId;
    }
}
```

<script type="text/markdown" id="md-11-3-hotel-car-rental">
# Hotel / Car Rental Management
*Amazon, Walmart-adjacent.*

**Time-box**: ~3h.

## Requirements
- An inventory of rentable units (hotel rooms or cars), each with a category (room type / car class) and
  attributes.
- Search availability for a date range and category.
- Book a unit for a date range — must not double-book **overlapping** date ranges for the same unit
  (partial overlaps count, not just exact-duplicate ranges).
- Pricing varies by category, season, and duration.
- Cancel a booking.
- **Out of scope**: cross-location search aggregation, real payment processing, loyalty programs.

## Where to start
The core algorithm here is **interval overlap**: does `[start1, end1)` intersect `[start2, end2)`? Get
the inclusive/exclusive boundary convention right and consistent (a checkout date is typically the same
day a new guest can check in — decide whether your ranges are inclusive or exclusive on each end, and
apply that rule everywhere). Pricing-by-category/season is a Strategy. The concurrency angle: two users
requesting overlapping ranges on the *same* unit at the same moment is the same "check-then-act on shared
state" race from Section 1 of Phase 3 — treat a booking attempt as an atomic claim, not a
check-then-insert.

## Common pitfalls
An off-by-one on inclusive/exclusive date boundaries (extremely easy to get subtly wrong and have it only
show up on edge-case date ranges); checking availability and then separately inserting the booking as two
non-atomic steps, allowing two concurrent bookers to both pass the availability check for the same
overlapping range before either commits.

## Your task
In `practice/`, package `com.lld.problems.rental`. Implement correct interval-overlap checking and at
least one pricing strategy. Tests: a range fully inside an existing booking is rejected; a range that
merely *touches* an existing booking's boundary behaves per your documented inclusive/exclusive rule; a
non-overlapping range on the same unit succeeds; a concurrent test with two threads racing to book
overlapping ranges on the same unit — exactly one succeeds.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/rental/`.*

**Clarifying questions**: Half-open or closed intervals — does a checkout on day 5 conflict with a
checkin on day 5? (Pick half-open `[start, end)` and say why: it matches how hotels actually operate —
the room is cleaned and re-let the same day the previous guest leaves — and it's the more common
convention in real booking systems.) Should search return available units, or just check one specific
unit's availability? Is thread safety in scope from the start, or a follow-up?

**Build order**:
1. `DateRange` — and specifically its `overlaps()` method — is the entire problem, so build and test it
   *completely in isolation*, with no `RentalUnit` or `RentalService` yet: half a dozen hand-picked pairs
   of ranges (fully inside, touching at a boundary, fully outside, identical) each with a known expected
   answer. Getting this one method's boundary condition (`start.isBefore(other.end) &&
   other.start.isBefore(end)`, strict `<` on both sides, not `<=`) right is worth more than everything
   else in this problem combined — an off-by-one here silently corrupts every booking decision downstream.
2. `RentalUnit`, `Booking` — plain data, introduced only once `DateRange` is solid.
3. `PricingStrategy` interface + one implementation, deliberately built and tested independently of
   booking/availability logic — pricing and availability are genuinely unrelated concerns that happen to
   share a `RentalUnit`, and interviewers notice when a candidate tangles them into one method.
4. `RentalService.book()` last, and — same as ATM, same as Movie Ticket Booking — the availability check
   and the commit must happen inside **one** `synchronized` block, not as two separate calls. State this
   explicitly as "the same check-then-act shape from Lesson 8, applied to date ranges instead of a
   count or a seat" — by Phase 6 you should be able to name this pattern on sight rather than reasoning
   through it fresh each time.

**Extensions**:
- *"Reduce lock contention — do all units really need to share one lock?"* — no: `synchronized` on the
  whole `RentalService` serializes bookings for *every* unit against each other, even unrelated ones.
  The fix is a lock per unit (a `Map<String, Object>` of per-unit lock objects, or `synchronized` on the
  unit's own booked-ranges list) — narrate this as the Lesson 8 "narrowest fix" principle, applied here.
- *"Support partial-week discounted rates or seasonal pricing?"* — a new `PricingStrategy`
  implementation that looks at the date range's month/day-of-week; the booking/availability code is
  completely untouched, which is the entire point of having pricing be a Strategy.
- *"What if a unit needs to be taken offline for maintenance for a date range?"* — model it as a
  synthetic "booking" that blocks availability the same way a real one does — reusing the exact same
  `DateRange`/overlap machinery instead of inventing a parallel maintenance-tracking system.

## Solution Code

*Full source lives in `solutions/.../problems/rental/` — shown below in build order, one file at a time.*

**`DateRange.java`**

```java
package com.lld.problems.rental;

import java.time.LocalDate;

/**
 * Half-open interval [start, end): a checkout date equal to another
 * booking's checkin date does NOT count as an overlap -- the same
 * convention real hotel booking uses. Documented explicitly, since this is
 * the one detail this exact problem is designed to get subtly wrong.
 */
public record DateRange(LocalDate start, LocalDate end) {
    public DateRange {
        if (!start.isBefore(end)) {
            throw new IllegalArgumentException("start must be before end");
        }
    }

    public boolean overlaps(DateRange other) {
        return start.isBefore(other.end) && other.start.isBefore(end);
    }
}
```

**`RentalUnit.java`**

```

    static Booking create(String unitId, DateRange range) {

package com.lld.problems.rental;

/** Strategy (Lesson 5): pricing by category/season/duration, independent of availability logic entirely. */
public interface PricingStrategy {
    long totalPriceCents(RentalUnit unit, DateRange range);
}

**`PerNightPricingStrategy.java`**

```java
package com.lld.problems.rental;

import java.time.temporal.ChronoUnit;
import java.util.Map;

public class PerNightPricingStrategy implements PricingStrategy {

    private final Map<String, Long> nightlyRateCentsByCategory;

    public PerNightPricingStrategy(Map<String, Long> nightlyRateCentsByCategory) {
        this.nightlyRateCentsByCategory = Map.copyOf(nightlyRateCentsByCategory);
    }

    @Override
    public long totalPriceCents(RentalUnit unit, DateRange range) {
        long nights = ChronoUnit.DAYS.between(range.start(), range.end());
        Long rate = nightlyRateCentsByCategory.get(unit.category());
        if (rate == null) {
            throw new IllegalArgumentException("no rate configured for category: " + unit.category());
        }
        return nights * rate;
    }
}
```

**`RentalService.java`**

```java
package com.lld.problems.rental;

import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.CopyOnWriteArrayList;

public class RentalService {

    private final List<RentalUnit> units;
    private final PricingStrategy pricingStrategy;
    private final Map<String, List<DateRange>> bookedRangesByUnit = new ConcurrentHashMap<>();

    public RentalService(List<RentalUnit> units, PricingStrategy pricingStrategy) {
        this.units = List.copyOf(units);
        this.pricingStrategy = pricingStrategy;
    }

    public List<RentalUnit> search(String category, DateRange range) {
        return units.stream()
                .filter(u -> u.category().equals(category))
                .filter(u -> isAvailable(u.id(), range))
                .toList();
    }

    /**
     * synchronized: checking availability and committing the booking must be
     * atomic, otherwise two concurrent bookers can both pass the
     * availability check for overlapping ranges before either commits --
     * exactly the check-then-act race from Lesson 8.
     */
    public synchronized Optional<Booking> book(String unitId, DateRange range) {
        if (!isAvailable(unitId, range)) {
            return Optional.empty();
        }
        bookedRangesByUnit.computeIfAbsent(unitId, k -> new CopyOnWriteArrayList<>()).add(range);
        return Optional.of(Booking.create(unitId, range));
    }

    public synchronized void cancel(Booking booking) {
        bookedRangesByUnit.getOrDefault(booking.unitId(), List.of()).remove(booking.range());
    }

    public long priceFor(String unitId, DateRange range) {
        RentalUnit unit = units.stream().filter(u -> u.id().equals(unitId)).findFirst()
                .orElseThrow(() -> new IllegalArgumentException("no such unit: " + unitId));
        return pricingStrategy.totalPriceCents(unit, range);
    }

    private boolean isAvailable(String unitId, DateRange range) {
        return bookedRangesByUnit.getOrDefault(unitId, List.of()).stream().noneMatch(r -> r.overlaps(range));
    }
}
```

<script type="text/markdown" id="md-11-4-notification-system">
# Notification System (extended)
*Salesforce-style plugin architecture — this one explicitly builds on what you already have, not a fresh start.*

**Time-box**: ~2.5h (less than the others — you're extending, not starting from zero).

## Requirements
Go back to **Lesson 2's `NotificationChannel`/`NotificationService`** (in `solutions/`) and extend it
with:
- **Retry with backoff** on a transient delivery failure, without ever double-delivering a notification
  that actually succeeded (idempotency matters here).
- **Delivery-event observers** — something can subscribe to "this notification was delivered" /
  "this notification permanently failed," independent of the channels themselves (a dashboard, an audit
  log, a metrics counter — none of which should need to know anything about *how* delivery happens).
- **Channel fallback**: if the preferred channel is unavailable or fails, fall through to the next
  configured channel (push → SMS → email, or whatever order is configured) — and that fallback order must
  be configurable per notification type, not hardcoded once globally.
- **Out of scope**: a full templating/localization engine (a basic hook is fine to sketch, not required).

## Where to start
This is deliberately the pattern-combination showcase of the whole curriculum: **Strategy** (already
there, from `NotificationChannel`), **Observer** (new — delivery events), **Chain of Responsibility**
(new — the fallback sequence, same shape as Lesson 7's `SupportTicketChain` practice task). Retrying is
worth framing as re-executing a **Command** (Lesson 7) — a retryable unit of work is exactly what Command
represents. Reuse your actual Lesson 2 code rather than rebuilding `NotificationChannel` from scratch;
the point of this problem is everything you'd add *around* it.

## Common pitfalls
A retry that re-sends a notification which actually succeeded but whose success response was lost/slow
(track delivery status explicitly, don't just retry blindly on any exception); a fallback chain
hardcoded once for every notification type instead of configurable per type; rebuilding
`NotificationChannel` instead of reusing Lesson 2's version.

## Your task
In `practice/`, package `com.lld.problems.notification` (or extend your Lesson 2 practice code directly).
Add retry-with-backoff, at least one delivery-event observer, and a configurable fallback chain. Tests: a
transient failure followed by a successful retry results in exactly one delivered notification, not two;
a permanently-failing channel correctly falls through to the next one in its configured chain; a
delivery-event observer receives exactly one event per notification's final outcome.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/notification/`, importing Lesson 2's `NotificationChannel`/
`Notification` directly rather than redefining them.*

**Clarifying questions**: Confirm you're extending, not rebuilding, before writing a line of code — "I
built a `NotificationChannel` interface and a few implementations in an earlier design; I'll import those
directly and add the new pieces around them." Does retry apply per-channel, or to the whole fallback
chain as a unit? (Per-channel is the more realistic choice — a channel that's down shouldn't eat the
retry budget meant for a different, healthy channel — and worth stating as a deliberate choice.) What
exactly counts as "delivered" for idempotency purposes, given the channel interface is synchronous and
exception-based?

**Build order**:
1. Answer the idempotency question *before* writing `RetryingChannel`, because it determines the whole
   design: since `send()` either returns normally or throws — no separate ambiguous "response" to lose —
   the moment a call returns without throwing, retrying is unnecessary and must stop *immediately*. Say
   this reasoning out loud; it's the actual answer to "how do you avoid duplicate delivery," not a
   separate mechanism bolted on afterward.
2. `RetryingChannel` as a **Decorator** (Lesson 6) around a plain `NotificationChannel` — same shape as
   `ZipCompressor` wrapping a `FormatWriter` back in Lesson 4, just retrying instead of compressing. Build
   and test it completely alone, with a hand-written fake channel that fails N times then succeeds,
   before anything else in this problem exists.
3. `ChannelFallbackChain` next, **also** implementing `NotificationChannel` — the same interface it's
   built out of, which is what lets you nest it (a chain of retrying channels *is itself* a channel,
   so it can be wrapped by anything else that also expects one). Test it with two fake channels
   independently of any retry logic first, then combine.
4. **The event-publishing placement is the one decision worth narrating carefully**: it would be tempting
   to publish a delivery event inside `RetryingChannel` itself, but that produces one FAILED event per
   *channel* that exhausts its retries inside a multi-channel fallback chain — wrong, since the
   requirement is exactly one event per *notification's overall outcome*. The fix is a separate
   `ObservableNotificationChannel` that wraps the *outermost* channel (the whole chain), and publishes
   based on whether the entire pipeline succeeded or exhausted every option. Getting this placement
   right — one layer further out than where you'd first reach for it — is exactly the kind of subtlety an
   interviewer is testing for when they ask "exactly once" in a requirement.
5. `NotificationRouter` last, as pure configuration: a map from event type to a fully-composed channel
   (chain-of-retrying-channels-wrapped-in-observable). Nothing in the router itself knows about retries,
   fallback, or events — it only knows "look up the right channel, call it."

**Extensions**:
- *"What if retries should be delayed and run in the background instead of blocking the caller?"* — the
  producer-consumer shape from Lesson 8: enqueue the notification onto a `BlockingQueue`, a worker pool
  consumes it and applies the same retry/fallback logic, decoupling "notify was called" from "notify
  finished" — a real change to the design, worth naming as such rather than hand-waved as "just make it
  async."
- *"Track delivery latency per channel, not just success/failure?"* — extend `DeliveryEvent` with a
  duration field, computed in `ObservableNotificationChannel` around the `delegate.send()` call —
  contained entirely to that one class.
- *"What if the SAME channel type needs different retry policies for different event types?"* — this is
  already free: `RetryPolicy` is a plain value passed into the `RetryingChannel` constructor, so
  different `NotificationRouter` entries can wrap the same underlying channel class with different
  policies without any new abstraction.

## Solution Code

*Full source lives in `solutions/.../problems/notification/` — shown below in build order, one file at a time.*

**`DeliveryOutcome.java`**

```java

public enum DeliveryOutcome { DELIVERED, FAILED }
```

**`DeliveryEvent.java`**

import com.lld.foundations.solid.notification.Notification;

import java.time.Instant;

public record DeliveryEvent(Notification notification, DeliveryOutcome outcome, Instant timestamp) {
}
```

**`DeliveryEventObserver.java`**

/** Observer (Lesson 7): independent of the channels themselves -- a dashboard, audit log, or metrics counter. */

    void onDeliveryEvent(DeliveryEvent event);
}
```

**`RetryPolicy.java`**

package com.lld.problems.notification;

import java.time.Duration;

public record RetryPolicy(int maxAttempts, Duration initialBackoff) {
    public RetryPolicy {
        if (maxAttempts < 1) {
            throw new IllegalArgumentException("maxAttempts must be at least 1");
        }
    }
}
```

**`NotificationDeliveryException.java`**

public class NotificationDeliveryException extends RuntimeException {
    public NotificationDeliveryException(String message, Throwable cause) {
        super(message, cause);

}
```

**`RetryingChannel.java`**

```java
package com.lld.problems.notification;

import com.lld.foundations.solid.notification.Notification;
import com.lld.foundations.solid.notification.NotificationChannel;

import java.time.Duration;

/**
 * Decorator (Lesson 6) around a NotificationChannel. Idempotency note: this
 * channel's send() is synchronous and exception-based, so "success" is
 * unambiguous -- the moment delegate.send() returns without throwing, this
 * method returns immediately and never calls it again for that notification.
 * There is no window where a "lost success response" could cause a
 * duplicate send, because there is no separate response to lose.
 */
public class RetryingChannel implements NotificationChannel {

    private final NotificationChannel delegate;
    private final RetryPolicy policy;

    public RetryingChannel(NotificationChannel delegate, RetryPolicy policy) {
        this.delegate = delegate;
        this.policy = policy;
    }

    @Override
    public void send(Notification notification) {
        RuntimeException lastFailure = null;
        Duration backoff = policy.initialBackoff();

        for (int attempt = 1; attempt <= policy.maxAttempts(); attempt++) {
            try {
                delegate.send(notification);
                return; // delivered -- stop immediately, no further attempts
            } catch (RuntimeException e) {
                lastFailure = e;
                if (attempt < policy.maxAttempts()) {
                    sleep(backoff);
                    backoff = backoff.multipliedBy(2); // exponential backoff
                }
            }
        }
        throw new NotificationDeliveryException(
                "delivery failed after " + policy.maxAttempts() + " attempts", lastFailure);
    }

    private void sleep(Duration duration) {
        try {
            Thread.sleep(duration.toMillis());
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt();
        }
    }
}
```

**`ChannelFallbackChain.java`**

```java
package com.lld.problems.notification;

import com.lld.foundations.solid.notification.Notification;
import com.lld.foundations.solid.notification.NotificationChannel;

import java.util.List;

/** Chain of Responsibility (Lesson 7): try each channel in order; the first one that doesn't throw wins. */
public class ChannelFallbackChain implements NotificationChannel {

    private final List<NotificationChannel> orderedChannels;

    public ChannelFallbackChain(List<NotificationChannel> orderedChannels) {
        if (orderedChannels.isEmpty()) {
            throw new IllegalArgumentException("fallback chain must have at least one channel");
        }
        this.orderedChannels = List.copyOf(orderedChannels);
    }

    @Override
    public void send(Notification notification) {
        RuntimeException lastFailure = null;
        for (NotificationChannel channel : orderedChannels) {
            try {
                channel.send(notification);
                return; // delivered -- stop, don't try the remaining channels
            } catch (RuntimeException e) {
                lastFailure = e; // fall through to the next channel in the chain
            }
        }
        throw new NotificationDeliveryException("every channel in the fallback chain failed", lastFailure);
    }
}
```

**`ObservableNotificationChannel.java`**

```java
package com.lld.problems.notification;

import com.lld.foundations.solid.notification.Notification;
import com.lld.foundations.solid.notification.NotificationChannel;

import java.time.Instant;
import java.util.List;

/**
 * Wraps the OUTERMOST channel (typically a ChannelFallbackChain of several
 * RetryingChannels) so it publishes exactly ONE event per notification's
 * final outcome -- not one per underlying channel's retry exhaustion.
 * Publishing lives here specifically because this is the single place that
 * knows the whole pipeline is actually done, one way or the other.
 */
public class ObservableNotificationChannel implements NotificationChannel {

    private final NotificationChannel delegate;
    private final List<DeliveryEventObserver> observers;

    public ObservableNotificationChannel(NotificationChannel delegate, List<DeliveryEventObserver> observers) {
        this.delegate = delegate;
        this.observers = List.copyOf(observers);
    }

    @Override
    public void send(Notification notification) {
        try {
            delegate.send(notification);
            publish(notification, DeliveryOutcome.DELIVERED);
        } catch (RuntimeException e) {
            publish(notification, DeliveryOutcome.FAILED);
            throw e;
        }
    }

    private void publish(Notification notification, DeliveryOutcome outcome) {
        DeliveryEvent event = new DeliveryEvent(notification, outcome, Instant.now());
        observers.forEach(o -> o.onDeliveryEvent(event));
    }
}
```

**`NotificationRouter.java`**

```java
package com.lld.problems.notification;

import com.lld.foundations.solid.notification.Notification;
import com.lld.foundations.solid.notification.NotificationChannel;

import java.util.Map;

/** Fallback order/retry policy is configured per event type, not once globally. */
public class NotificationRouter {

    private final Map<String, NotificationChannel> channelByEventType;
    private final NotificationChannel defaultChannel;

    public NotificationRouter(Map<String, NotificationChannel> channelByEventType, NotificationChannel defaultChannel) {
        this.channelByEventType = Map.copyOf(channelByEventType);
        this.defaultChannel = defaultChannel;
    }

    public void send(Notification notification) {
        NotificationChannel channel = channelByEventType.getOrDefault(notification.eventType(), defaultChannel);
        channel.send(notification);
    }
}
```

# Inventory / Order Management
*Walmart-specific.*

**Time-box**: ~3h.

## Requirements
- A product catalog with stock counts tracked **per location/warehouse** (not just one global count).
- A cart: add/remove items; checkout creates an `Order`.
- An order has a lifecycle: `PLACED → CONFIRMED (stock reserved) → SHIPPED → DELIVERED`, with
  `CANCELLED` possible from some (not all) of those states — decide and document exactly which
  transitions are legal.
- Stock reservation at checkout must not oversell an item under concurrent checkouts for the same
  low-stock item.
- Low-stock alerts: something should be notified when a product's stock falls below a configured
  threshold.
- **Out of scope**: multi-warehouse fulfillment/routing optimization, a full returns/refunds workflow.

## Where to start
The order lifecycle is a State machine — sketch the legal transitions as a diagram first, same as
Vending Machine and Elevator, and decide deliberately which states allow cancellation (can a `SHIPPED`
order still be cancelled? that's a real business decision, not just an implementation detail). Low-stock
alerting is Observer. The stock-reservation requirement is, once again, the check-then-act race from
Phase 3 Section 1 and **Lesson 8's `ThreadSafeInventory` practice task** — by this point in the
curriculum, recognizing this shape on sight (rather than re-deriving the fix from scratch) is exactly
what's being tested.

## Common pitfalls
Order lifecycle as a bare enum with transition logic scattered across methods instead of real State
classes; stock reservation implemented as a separate check-then-decrement (the exact race from Phase 3's
opening example) instead of one atomic operation; not defining which cancellations are actually legal and
allowing an already-shipped order to be silently cancelled.

## Your task
In `practice/`, package `com.lld.problems.inventory`. Implement the order state machine and atomic stock
reservation. Tests: legal transitions succeed, illegal ones are rejected (e.g., cancelling a delivered
order, if that's outside your documented legal set); a concurrent test with many simultaneous checkouts
against low stock never oversells; a low-stock alert fires exactly once when a threshold is crossed, not
repeatedly on every subsequent sale below it.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/inventory/`.*

**Clarifying questions**: Which order transitions can be cancelled — up to which state? (Say the decision
out loud and defend it: "no cancellation once shipped, since a return is a genuinely different process" is
a reasonable line to draw, and stating *why* matters more than which exact line you pick.) Should a
low-stock alert re-fire if stock is restocked and then crosses the threshold again, or only ever once for
the product's lifetime? Multi-location from the start, or single-location with location as a natural later
extension?

**Build order**:
1. `Inventory.tryReserve` first, and specifically as a CAS *loop*, not a `synchronized` block — worth
   naming the choice: a `while (true) { read, check, compareAndSet-or-retry }` loop is lock-free and
   scales better under contention than a monitor lock for a single-field update like this, whereas the
   earlier problems that used `synchronized` (Order's own transitions, Movie Ticket Booking's `SeatHold`)
   were protecting *multi-step* sequences a single CAS can't express. Recognizing *which* concurrency
   primitive fits which shape — not defaulting to `synchronized` everywhere — is exactly the kind of
   judgment Lesson 8 asks for.
2. The low-stock alert logic goes inside that same CAS loop's success branch, not as a separate step
   after — say why: computing "did this reservation cross the threshold" outside the atomic operation
   reopens a race where two concurrent reservations could both observe "just crossed" and both fire an
   alert. The `Set.add(key)` returning `true` only the first time is what turns "fire once" from a
   race-prone check into an atomic guarantee — a nice small reuse of `ConcurrentHashMap.newKeySet()`'s own
   atomicity rather than building a separate lock for it.
3. `OrderStatus` as an enum with a `Map<OrderStatus, Set<OrderStatus>>` legal-transitions table, and
   *this* is a design decision worth narrating explicitly against the earlier State-pattern problems:
   full State classes (Vending Machine, Elevator) earn their cost when each state has genuinely different
   *behavior*; here, every status behaves identically except for which transitions are legal, so a lookup
   table is simpler and equally correct — say "I don't need polymorphic classes here because there's no
   behavior to differentiate, just a legality check" rather than mechanically reapplying the heaviest
   pattern from an earlier problem.
4. `Order` and `OrderService` last, wiring reservation and the transition table together. `cancel()`'s
   order of operations is the one line worth a sentence: transition first (which throws immediately if
   illegal), restock only *after* the transition succeeds — restocking before validating would leave
   inventory incorrectly incremented if the cancellation itself turned out to be illegal.

**Extensions**:
- *"Reserve stock across multiple warehouses for one order (partial fulfillment)?"* — `tryReserve` would
  need to try several locations and either aggregate partial reservations or roll them all back if the
  full quantity can't be met anywhere — a real two-phase-commit-shaped problem, worth naming as more
  involved than the current single-location reservation.
- *"What if `SHIPPED` orders need a `RETURNED` path after all?"* — one new entry in the transitions map
  (`SHIPPED -> RETURNED` or `DELIVERED -> RETURNED`) plus a restock call in that new handler; the
  transition-table design makes this a small, localized change rather than a new class.
- *"Alert on a rate of depletion (selling fast), not just an absolute threshold?"* — a genuinely different
  computation (tracking reservation timestamps, not just current level), worth flagging as a different
  `StockAlertObserver` implementation rather than a variant of the existing threshold check.

## Solution Code

*Full source lives in `solutions/.../problems/inventory/` — shown below in build order, one file at a time.*

**`StockAlertObserver.java`**

```java
package com.lld.problems.inventory;

/** Observer (Lesson 7): subscribed independently of Inventory's own reservation logic. */
public interface StockAlertObserver {
    void onLowStock(String location, String sku, int remainingStock);
}
```

**`OrderStatus.java`**

```java
package com.lld.problems.inventory;

import java.util.Map;
import java.util.Set;

/**
 * A lighter-weight state machine than full State-pattern classes (compare
 * to VendingMachineState/ElevatorState): each status only differs in which
 * transitions are legal, not in meaningfully different BEHAVIOR per state,
 * so a lookup table is a legitimate, simpler alternative here. Documented
 * decision: no cancellation once SHIPPED -- a return/refund flow is a
 * separate, out-of-scope process.
 */
public enum OrderStatus {
    PLACED, CONFIRMED, SHIPPED, DELIVERED, CANCELLED;

    private static final Map<OrderStatus, Set<OrderStatus>> LEGAL_TRANSITIONS = Map.of(
            PLACED, Set.of(CONFIRMED, CANCELLED),
            CONFIRMED, Set.of(SHIPPED, CANCELLED),
            SHIPPED, Set.of(DELIVERED),
            DELIVERED, Set.of(),
            CANCELLED, Set.of()
    );

    public boolean canTransitionTo(OrderStatus next) {
        return LEGAL_TRANSITIONS.getOrDefault(this, Set.of()).contains(next);
    }
}
```

**`Inventory.java`**

```java
package com.lld.problems.inventory;

import java.util.List;
import java.util.Map;
import java.util.Set;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.atomic.AtomicInteger;

/**
 * Per-(location, sku) stock, reserved atomically via a CAS loop -- the same
 * check-then-act race from Lesson 8, fixed the same way: the check
 * ("enough stock?") and the act (decrement) happen as one atomic operation,
 * not two separate steps a concurrent reservation could interleave between.
 */
public class Inventory {

    private final int lowStockThreshold;
    private final List<StockAlertObserver> observers;
    private final Map<String, AtomicInteger> stockByKey = new ConcurrentHashMap<>();
    private final Set<String> alreadyAlerted = ConcurrentHashMap.newKeySet();

    public Inventory(int lowStockThreshold, List<StockAlertObserver> observers) {
        this.lowStockThreshold = lowStockThreshold;
        this.observers = List.copyOf(observers);
    }

    public void addStock(String location, String sku, int quantity) {
        String key = key(location, sku);
        int newLevel = stockByKey.computeIfAbsent(key, k -> new AtomicInteger()).addAndGet(quantity);
        if (newLevel >= lowStockThreshold) {
            alreadyAlerted.remove(key); // restocked above the threshold -- a future crossing can alert again
        }
    }

    public boolean tryReserve(String location, String sku, int quantity) {
        String key = key(location, sku);
        AtomicInteger stock = stockByKey.get(key);
        if (stock == null) {
            return false;
        }
        while (true) {
            int current = stock.get();
            if (current < quantity) {
                return false;
            }
            int next = current - quantity;
            if (stock.compareAndSet(current, next)) {
                if (next < lowStockThreshold && alreadyAlerted.add(key)) {
                    // Set.add() returns true only the FIRST time -- this IS the fire-exactly-once guarantee
                    observers.forEach(o -> o.onLowStock(location, sku, next));
                }
                return true;
            }
            // another thread changed the value between get() and compareAndSet() -- retry with the fresh value
        }
    }

    public int stockOf(String location, String sku) {
        AtomicInteger stock = stockByKey.get(key(location, sku));
        return stock == null ? 0 : stock.get();
    }

    private String key(String location, String sku) {
        return location + ":" + sku;
    }
}
```

**`Order.java`**

```java
package com.lld.problems.inventory;

import java.util.UUID;

public class Order {

    private final String id;
    private final String location;
    private final String sku;
    private final int quantity;
    private OrderStatus status = OrderStatus.PLACED;

    Order(String location, String sku, int quantity) {
        this.id = UUID.randomUUID().toString();
        this.location = location;
        this.sku = sku;
        this.quantity = quantity;
    }

    public String getId() {
        return id;
    }

    public String getLocation() {
        return location;
    }

    public String getSku() {
        return sku;
    }

    public int getQuantity() {
        return quantity;
    }

    public synchronized OrderStatus getStatus() {
        return status;
    }

    synchronized void transitionTo(OrderStatus next) {
        if (!status.canTransitionTo(next)) {
            throw new IllegalStateException("cannot transition from " + status + " to " + next);
        }
        status = next;
    }
}
```

**`OrderService.java`**

```java
package com.lld.problems.inventory;

import java.util.Optional;

public class OrderService {

    private final Inventory inventory;

    public OrderService(Inventory inventory) {
        this.inventory = inventory;
    }

    public Optional<Order> placeOrder(String location, String sku, int quantity) {
        if (!inventory.tryReserve(location, sku, quantity)) {
            return Optional.empty();
        }
        return Optional.of(new Order(location, sku, quantity));
    }

    public void confirm(Order order) {
        order.transitionTo(OrderStatus.CONFIRMED);
    }

    public void ship(Order order) {
        order.transitionTo(OrderStatus.SHIPPED);
    }

    public void deliver(Order order) {
        order.transitionTo(OrderStatus.DELIVERED);
    }

    public void cancel(Order order) {
        order.transitionTo(OrderStatus.CANCELLED); // throws first if illegal -- e.g. already shipped
        inventory.addStock(order.getLocation(), order.getSku(), order.getQuantity()); // restock only after the transition succeeds
    }
}
```

# Meeting Room Scheduler
*Microsoft, Amazon.*

**Time-box**: ~2.5h.

## Requirements
- Multiple rooms, each with a capacity and optional amenities (projector, video conferencing).
- Book a room for a time range given required capacity/amenities — either auto-select an available room
  or let the caller specify one directly.
- No double-booking: two meetings in the same room must not have overlapping time ranges.
- Support recurring meetings (e.g., weekly, for N occurrences).
- Cancel or reschedule a meeting.
- **Out of scope**: a calendar UI, cross-timezone handling (fine to name as a real extension), syncing
  with an external calendar system.

## Where to start
**This is the same core algorithm as Hotel/Car Rental Management** — interval-overlap checking, applied
to rooms instead of rentable units. Recognizing that and reusing the same reasoning (rather than
re-deriving it) is faster and is itself a legitimate thing to say out loud in an interview. The one new
wrinkle: recurring meetings. Think about whether you'd eagerly materialize every occurrence of a
long-running weekly series up front (simple, but doesn't scale to very long or unbounded series) versus
representing the recurrence as a *rule* and checking conflicts against it lazily — worth at least
discussing the tradeoff even if you implement the simpler version.

## Common pitfalls
The same inclusive/exclusive boundary bug as Hotel/Car Rental; materializing an unbounded recurring
series eagerly without considering the scaling cost; a race between two concurrent booking requests for
the same room/time slot.

## Your task
In `practice/`, package `com.lld.problems.meetingscheduler`. Implement conflict-free booking (reuse your
interval-overlap logic from the Hotel/Car Rental problem if you already built it) and at least a basic
recurring-meeting series. Tests: overlapping requests for the same room are rejected, non-overlapping
ones succeed; a recurring series correctly avoids double-booking any of its individual occurrences against
existing single meetings; a concurrent test proves no double-booking under simultaneous requests for the
same room/slot.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/meetingscheduler/`.*

**Clarifying questions**: Should the caller be able to book a specific room directly, or only ever go
through search-then-book? (Answer: support both — direct `book(roomId, ...)` for the case where the
caller already knows which room, and `findAvailableRooms(...)` for discovery; they share the same
availability check underneath, so supporting both costs nothing extra.) Is a recurring series all-or-
nothing, or should it book whatever occurrences are free and report which ones failed? (Answer: all-or-
nothing for this exercise — it's the simpler contract to reason about, and partial-success is worth naming
as a real alternative with its own tradeoffs, namely that the caller now has to handle a mixed result.)
Do we need to support rescheduling, or is cancel-then-rebook sufficient? (Answer: cancel-then-rebook is
fine — a dedicated `reschedule` would just be sugar over the same two calls.)

**Build order**:
1. `TimeRange` first, as a record with the half-open-interval `overlaps` check baked into the compact
   constructor's validation and the record body — exactly the same shape as `rental.DateRange` from
   Hotel/Car Rental Management, just with `Instant` in place of `LocalDate`. Building this first and
   recognizing it as a rename of a solved problem, rather than re-deriving interval overlap from scratch,
   is the fastest path through the "new" parts of this problem.
2. `Room` and `Meeting` as plain records — no behavior, just data, so they cost almost nothing to write
   and unblock everything else.
3. `MeetingScheduler.isAvailable` and `book` next, mirroring `RentalService`'s booking method exactly:
   look up existing ranges for the room, reject if any overlaps, otherwise record the new range. Getting
   the core single-booking path correct and tested *before* touching recurrence keeps the recurrence logic
   from having to be debugged at the same time as the base case.
4. `findAvailableRooms` as a thin filter (capacity, amenities, then availability) over the already-working
   `isAvailable` — a good moment to say out loud that search is just "generate candidates, then reuse the
   booking precondition as a read-only check," not a separate code path that could drift from what `book`
   actually enforces.
5. `RecurringSeries.weeklyOccurrences` and `bookRecurring` last, specifically *after* single booking works,
   because recurrence is a wrapper around it: materialize every occurrence as a `List<TimeRange>`, validate
   that *all* of them are free, and only then commit any of them — the validate-then-commit split is what
   makes it all-or-nothing rather than accidentally leaving a partial series booked if occurrence 3 of 5
   conflicts.
6. `cancel` and thread-safety last: `synchronized` on the mutating methods, same reasoning as Hotel/Car
   Rental — these are check-then-act sequences (verify no overlap, then insert), not single-field updates,
   so a monitor lock is the right tool here rather than a CAS loop (contrast with Inventory's `tryReserve`,
   which *was* a single-field update and got a CAS loop instead — the two problems make a nice paired
   example of picking the primitive that matches the shape of the critical section).

**Extensions**:
- *"What if the recurring series should book whatever it can and report conflicts, instead of all-or-
  nothing?"* — `bookRecurring` would return a result type distinguishing booked occurrences from rejected
  ones (e.g. a small record pairing `List<Meeting>` with `List<TimeRange>` for the conflicts) instead of
  throwing on the first conflict; worth naming that this changes the caller's contract meaningfully, not
  just the return type.
- *"Support time zones, so a 9am recurring meeting stays 9am local time across a DST transition?"* —
  `Instant` alone can't express that; the fix is storing `ZonedDateTime` or a timezone alongside the
  recurrence rule so occurrence generation recomputes wall-clock 9am per timezone rather than adding a
  fixed `Duration` — worth flagging as a real correctness bug (DST) the current implementation doesn't
  handle, not just a nice-to-have.
- *"Suggest alternate rooms/times when the requested slot is unavailable?"* — a genuinely different query:
  scan each candidate room's booked ranges for the nearest free gap of the required length near the
  requested time, rather than a single yes/no availability check — worth naming as a bigger feature than
  a tweak to `isAvailable`.

## Solution Code

*Full source lives in `solutions/.../problems/meetingscheduler/` — shown below in build order, one file at a time.*

**`TimeRange.java`**

```java
package com.lld.problems.meetingscheduler;

import java.time.Instant;

/**
 * The exact same algorithm as rental.DateRange, applied to Instant instead
 * of LocalDate -- meetings need time-of-day precision, hotel bookings only
 * need date precision, so the types differ, but the half-open-interval
 * overlap logic is identical on purpose.
 */
public record TimeRange(Instant start, Instant end) {
    public TimeRange {
        if (!start.isBefore(end)) {
            throw new IllegalArgumentException("start must be before end");
        }
    }

    public boolean overlaps(TimeRange other) {
        return start.isBefore(other.end) && other.start.isBefore(end);
    }
}
```

package com.lld.problems.meetingscheduler;

import java.time.Duration;
import java.time.Instant;
import java.util.ArrayList;
import java.util.List;

/**
 * Eager materialization for this exercise's scope: generates every
 * occurrence up front as a plain list of TimeRanges. Does not scale to a
 * very long or unbounded series -- a rule-based lazy check (is THIS
 * specific date's occurrence free, computed on demand) is the production
 * alternative, discussed but not built here.
 */
final class RecurringSeries {

    private RecurringSeries() {
    }

    static List<TimeRange> weeklyOccurrences(Instant firstStart, Duration meetingDuration, int occurrenceCount) {
        List<TimeRange> ranges = new ArrayList<>();
        for (int i = 0; i < occurrenceCount; i++) {
            Instant start = firstStart.plus(Duration.ofDays(7L * i));
            ranges.add(new TimeRange(start, start.plus(meetingDuration)));
        }
        return ranges;
    }
}

```java
package com.lld.problems.meetingscheduler;

import java.util.ArrayList;
import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.Set;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.CopyOnWriteArrayList;

public class MeetingScheduler {

    private final List<Room> rooms;
    private final Map<String, List<TimeRange>> bookedRangesByRoom = new ConcurrentHashMap<>();

    public MeetingScheduler(List<Room> rooms) {
        this.rooms = List.copyOf(rooms);
    }

    public List<Room> findAvailableRooms(int requiredCapacity, Set<String> requiredAmenities, TimeRange range) {
        return rooms.stream()
                .filter(r -> r.capacity() >= requiredCapacity)
                .filter(r -> r.amenities().containsAll(requiredAmenities))
                .filter(r -> isAvailable(r.id(), range))
                .toList();
    }

    public synchronized Optional<Meeting> book(String roomId, TimeRange range, List<String> attendees) {
        if (!isAvailable(roomId, range)) {
            return Optional.empty();
        }
        bookedRangesByRoom.computeIfAbsent(roomId, k -> new CopyOnWriteArrayList<>()).add(range);
        return Optional.of(Meeting.create(roomId, range, attendees));
    }

    /** All-or-nothing: every occurrence must be free, or none of them get booked. */
    public synchronized List<Meeting> bookRecurring(String roomId, List<TimeRange> occurrences, List<String> attendees) {
        for (TimeRange range : occurrences) {
            if (!isAvailable(roomId, range)) {
                throw new IllegalStateException("recurring series conflicts with an existing meeting at " + range);
            }
        }
        List<Meeting> meetings = new ArrayList<>();
        for (TimeRange range : occurrences) {
            bookedRangesByRoom.computeIfAbsent(roomId, k -> new CopyOnWriteArrayList<>()).add(range);
            meetings.add(Meeting.create(roomId, range, attendees));
        }
        return meetings;
    }

    public synchronized void cancel(Meeting meeting) {
        bookedRangesByRoom.getOrDefault(meeting.roomId(), List.of()).remove(meeting.range());
    }

    private boolean isAvailable(String roomId, TimeRange range) {
        return bookedRangesByRoom.getOrDefault(roomId, List.of()).stream().noneMatch(r -> r.overlaps(range));
    }
}
```

# Ride Sharing (Uber/Lyft)
*General FAANG, good capstone — combines most of Phases 2-3 in one design.*

**Time-box**: ~3h.

## Requirements
- Riders request a ride (pickup + destination); drivers toggle between available/unavailable.
- **Matching**: assign a nearby available driver to a ride request. "Nearby" can be a simple fixed-radius
  or nearest-N search for this exercise — name real geospatial indexing (geohash/quadtree) as the
  production answer without implementing it.
- **Pricing**: a base fare plus a distance/time component, plus a surge multiplier during high demand.
- **Ride lifecycle**: `REQUESTED → DRIVER_ASSIGNED → IN_PROGRESS → COMPLETED`, with `CANCELLED` possible
  from some states.
- Riders and drivers both need to observe ride status changes as they happen.
- **Non-functional, and the crux of the problem**: matching must never assign the same driver to two
  different ride requests concurrently, under real concurrent load.
- **Out of scope**: real geospatial indexing/routing implementation, payment processing, actual GPS
  tracking.

## Where to start
This problem is a deliberate composition of nearly everything in Phases 2-3, and the value of doing it
last is recognizing each piece rather than re-solving it: **State** for the ride lifecycle (same
shape as Elevator/Order); **Strategy**, twice independently, for matching and for pricing (they vary
independently — a design that entangles them is a design that can't evolve either one alone); **Observer**
for status updates to riders/drivers (same shape as the Order/Stock alerting and Library hold
notification); and the **atomic per-resource claim** for driver assignment — a driver is a shared,
contended resource exactly like a parking spot, a seat, or a unit of stock, and needs the identical
"claim it atomically, don't check-then-act" treatment.

## Common pitfalls
Assigning the same driver to two concurrent ride requests (the check-then-act race, one more time —
by now you should reach for the atomic-claim fix immediately, not rediscover the bug first); hardcoding
matching or pricing logic directly instead of behind independently swappable Strategies; conflating "the
driver is available for new requests" with "the driver is assigned but hasn't started the ride yet" as
if they were the same state.

## Your task
In `practice/`, package `com.lld.problems.ridesharing`. Implement the ride lifecycle, at least one
matching strategy and one pricing strategy (each behind its own interface, independently swappable), and
status observers for both rider and driver. Tests: a driver is never assigned to two simultaneous ride
requests under a concurrent stress test; the ride lifecycle only allows legal transitions; swapping the
pricing strategy changes the computed fare without touching matching, and vice versa; observers on both
rider and driver sides receive status-change notifications in the correct order as a ride progresses.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/ridesharing/`.*

**Clarifying questions**: If no driver is available at request time, does the ride fail outright or stay
queued/pending until one frees up? (Answer taken here: it stays `REQUESTED` and the caller can retry —
simpler to reason about than a background queue, and worth naming the queue as the real extension.) Is
"nearest driver" purely distance-based, or does it also need to weigh driver rating/ETA/vehicle type?
(Answer: pure distance for this exercise — say out loud that it's a `Strategy`, so any of those become a
different implementation later without touching the rest of the system.) Does surge pricing apply per
ride at request time or does an in-progress ride get re-priced if surge changes mid-trip? (Answer: locked
in at request time via the multiplier passed into the pricing strategy — re-pricing mid-trip is a fairness
question worth flagging, not solving here.)

**Build order**:
1. `Location` and `Driver` first — the two pieces of shared state everything else reads. `Driver` gets its
   availability behind an `AtomicReference<DriverAvailability>` with a `tryClaim()` CAS from the start,
   *not* added later — this is the one property the whole problem is graded on (the "non-functional, crux
   of the problem" requirement), so it has to be load-bearing in the very first version of the class, the
   same lesson as building `ParkingSpot`'s claim logic before its getters.
2. `RideStatus` as a transition table next, same reasoning as `OrderStatus` in Inventory: every status
   behaves identically except for which transitions are legal, so a `Map<RideStatus, Set<RideStatus>>`
   beats a full State-class hierarchy here — worth saying explicitly why this problem *doesn't* get the
   Elevator/Vending-Machine treatment despite superficially having "a lifecycle."
3. `Ride` as a thin mutable holder whose only real logic is delegating every mutation through
   `transitionTo`, `synchronized` — a check-then-act sequence (validate legality, then mutate), the same
   category of critical section as Hotel/Car Rental's booking, not a single-field CAS candidate.
4. `DriverMatchingStrategy` and `PricingStrategy` as two *separate* interfaces before writing the service
   that uses them — the sequencing itself is the point to narrate: if they're designed after the service
   exists, it's easy to accidentally let one depend on the other's output (e.g. matching considering fare,
   or pricing considering which driver was picked), which is exactly the entanglement the requirements
   explicitly call out as wrong.
5. `RideSharingService.assignDriver` last and most carefully: snapshot available drivers, ask the matching
   strategy for its pick, attempt `tryClaim()`, and on failure *loop and re-snapshot* rather than give up —
   this retry-on-lost-race is what turns "atomic claim" into "atomic claim that still finds you a driver
   even under contention," and is worth narrating as the difference between a claim that's merely
   thread-safe and one that's actually useful under load.
6. Observers wired in last, notifying on every transition (including the initial `REQUESTED`) — both
   rider-side and driver-side observers are just implementations of the same interface, filtering on
   `ride.getRiderId()`/`ride.getDriverId()` themselves rather than the service maintaining two separate
   observer lists, the same "one observer list, filtering is the observer's job" shape as Library's hold
   notifications.

**Extensions**:
- *"What if two riders request a ride at the literal same instant and the same single driver is the
  nearest match for both?"* — this is exactly what the CAS retry loop in step 5 already handles: whichever
  `tryClaim()` wins gets the driver, the loser re-snapshots (now empty) and its ride simply stays
  `REQUESTED` — worth stating that this was tested directly, not just asserted apply.
- *"Add real geospatial search instead of scanning every driver?"* — replace the linear scan inside
  `NearestDriverMatchingStrategy` (or `RideSharingService`'s available-drivers snapshot) with a geohash or
  quadtree lookup that returns only nearby candidates — the `DriverMatchingStrategy` interface doesn't
  change, only its implementation, which is the point of having isolated it as a Strategy.
- *"Support ride-sharing/pooling (multiple riders in one ride)?"* — a materially different model: `Ride`
  would need a list of riders and stops instead of one pickup/destination pair, and matching would need to
  consider route compatibility, not just proximity — worth naming as a different problem shape, not a small
  extension of this one.

---

*Full source lives in `solutions/.../problems/ridesharing/` — shown below in build order, one file at a time.*

**`Location.java`**

```java
package com.lld.problems.ridesharing;

/**
 * Flat-earth approximation (degrees scaled to km) for this exercise's scope.
 * A production system needs haversine distance (accounts for Earth's
 * curvature) plus real geospatial indexing (geohash/quadtree) to avoid
 * scanning every driver -- named here, not implemented.
 */
public record Location(double latitude, double longitude) {

    private static final double KM_PER_DEGREE = 111.0;

    public double distanceKmTo(Location other) {
        double dLat = (latitude - other.latitude) * KM_PER_DEGREE;
        double dLon = (longitude - other.longitude) * KM_PER_DEGREE;
        return Math.sqrt(dLat * dLat + dLon * dLon);
    }
}
```

package com.lld.problems.ridesharing;

import java.util.concurrent.atomic.AtomicReference;

/**
 * Same atomic-claim shape as ParkingSpot / Locker / ShowSeat: a shared,
 * contended resource that must be claimed with a single CAS, never a
 * check-then-act pair of calls.
 */
public class Driver {

    private final String id;
    private final String name;
    private final AtomicReference<Location> location;
    private final AtomicReference<DriverAvailability> availability =
            new AtomicReference<>(DriverAvailability.AVAILABLE);

    public Driver(String id, String name, Location startingLocation) {
        this.id = id;
        this.name = name;
        this.location = new AtomicReference<>(startingLocation);
    }

    public String getId() {
        return id;
    }

    public String getName() {
        return name;
    }

    public Location getLocation() {
        return location.get();
    }

    public void updateLocation(Location newLocation) {
        location.set(newLocation);
    }

    public boolean isAvailable() {
        return availability.get() == DriverAvailability.AVAILABLE;
    }

    public boolean tryClaim() {
        return availability.compareAndSet(DriverAvailability.AVAILABLE, DriverAvailability.ON_TRIP);
    }

    public void release() {
        availability.set(DriverAvailability.AVAILABLE);
    }
}
```

package com.lld.problems.ridesharing;

import java.util.Map;
import java.util.Set;

/**
 * A transition table, not full State classes: every status behaves
 * identically except for which transitions are legal, the same reasoning
 * as OrderStatus in the Inventory problem.
 */
public enum RideStatus {
    REQUESTED,
    DRIVER_ASSIGNED,
    IN_PROGRESS,
    COMPLETED,
    CANCELLED;

    private static final Map<RideStatus, Set<RideStatus>> TRANSITIONS = Map.of(
            REQUESTED, Set.of(DRIVER_ASSIGNED, CANCELLED),
            DRIVER_ASSIGNED, Set.of(IN_PROGRESS, CANCELLED),
            IN_PROGRESS, Set.of(COMPLETED),
            COMPLETED, Set.of(),
            CANCELLED, Set.of()
    );

    public boolean canTransitionTo(RideStatus target) {
        return TRANSITIONS.getOrDefault(this, Set.of()).contains(target);
    }
}
```

package com.lld.problems.ridesharing;

import java.util.UUID;

public class Ride {

    private final String id;
    private final String riderId;
    private final Location pickup;
    private final Location destination;
    private RideStatus status = RideStatus.REQUESTED;
    private String driverId;
    private Long fareCents;

    private Ride(String id, String riderId, Location pickup, Location destination) {
        this.id = id;
        this.riderId = riderId;
        this.pickup = pickup;
        this.destination = destination;
    }

    static Ride create(String riderId, Location pickup, Location destination) {
        return new Ride(UUID.randomUUID().toString(), riderId, pickup, destination);
    }

    public String getId() {
        return id;
    }

    public String getRiderId() {
        return riderId;
    }

    public Location getPickup() {
        return pickup;
    }

    public Location getDestination() {
        return destination;
    }

    public synchronized RideStatus getStatus() {
        return status;
    }

    public synchronized String getDriverId() {
        return driverId;
    }

    public synchronized Long getFareCents() {
        return fareCents;
    }

    synchronized void assignDriver(String driverId) {
        transitionTo(RideStatus.DRIVER_ASSIGNED);
        this.driverId = driverId;
    }

    synchronized void start() {
        transitionTo(RideStatus.IN_PROGRESS);
    }

    synchronized void complete(long fareCents) {
        transitionTo(RideStatus.COMPLETED);
        this.fareCents = fareCents;
    }

    synchronized void cancel() {
        transitionTo(RideStatus.CANCELLED);
    }

    private void transitionTo(RideStatus target) {
        if (!status.canTransitionTo(target)) {
            throw new IllegalStateException("cannot transition ride " + id + " from " + status + " to " + target);
        }
        status = target;
    }
}
```

package com.lld.problems.ridesharing;

import java.util.Comparator;
import java.util.List;
import java.util.Optional;

/**
 * Fixed-radius/nearest-N search stands in for real geospatial indexing
 * (geohash/quadtree) here -- named as the production alternative, not
 * built, since candidates are already a short in-memory list.
 */
public class NearestDriverMatchingStrategy implements DriverMatchingStrategy {

    @Override
    public Optional<Driver> findDriver(Location pickupLocation, List<Driver> candidates) {
        return candidates.stream()
                .min(Comparator.comparingDouble(d -> pickupLocation.distanceKmTo(d.getLocation())));
    }
}

package com.lld.problems.ridesharing;

public class DistanceBasedPricingStrategy implements PricingStrategy {

    private final long baseFareCents;
    private final long perKmCents;

    public DistanceBasedPricingStrategy(long baseFareCents, long perKmCents) {
        this.baseFareCents = baseFareCents;
        this.perKmCents = perKmCents;
    }

    @Override
    public long calculateFareCents(Location pickup, Location destination, double surgeMultiplier) {
        double distanceKm = pickup.distanceKmTo(destination);
        long distanceFareCents = Math.round(distanceKm * perKmCents);
        return Math.round((baseFareCents + distanceFareCents) * surgeMultiplier);
    }
}
```

```java
package com.lld.problems.ridesharing;

import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.CopyOnWriteArrayList;

public class RideSharingService {

    private final Map<String, Driver> drivers = new ConcurrentHashMap<>();
    private final Map<String, Ride> rides = new ConcurrentHashMap<>();
    private final List<RideStatusObserver> observers = new CopyOnWriteArrayList<>();
    private final DriverMatchingStrategy matchingStrategy;
    private final PricingStrategy pricingStrategy;
    private volatile double surgeMultiplier = 1.0;

    public RideSharingService(DriverMatchingStrategy matchingStrategy, PricingStrategy pricingStrategy) {
        this.matchingStrategy = matchingStrategy;
        this.pricingStrategy = pricingStrategy;
    }

    public void addDriver(Driver driver) {
        drivers.put(driver.getId(), driver);
    }

    public void addObserver(RideStatusObserver observer) {
        observers.add(observer);
    }

    public void setSurgeMultiplier(double surgeMultiplier) {
        this.surgeMultiplier = surgeMultiplier;
    }

    public Ride requestRide(String riderId, Location pickup, Location destination) {
        Ride ride = Ride.create(riderId, pickup, destination);
        rides.put(ride.getId(), ride);
        notifyObservers(ride, null);
        assignDriver(ride);
        return ride;
    }

    /**
     * Atomic per-resource claim, the same shape as ParkingSpot / Locker /
     * ShowSeat: a driver is shared and contended, so it must be claimed with
     * a single CAS (Driver.tryClaim), not checked-then-claimed in two steps.
     * If the chosen candidate loses the race, retry against a fresh
     * available-drivers snapshot rather than giving up.
     */
    private void assignDriver(Ride ride) {
        while (true) {
            List<Driver> available = drivers.values().stream().filter(Driver::isAvailable).toList();
            if (available.isEmpty()) {
                return;
            }
            Optional<Driver> chosen = matchingStrategy.findDriver(ride.getPickup(), available);
            if (chosen.isEmpty()) {
                return;
            }
            Driver driver = chosen.get();
            if (driver.tryClaim()) {
                RideStatus previous = ride.getStatus();
                ride.assignDriver(driver.getId());
                notifyObservers(ride, previous);
                return;
            }
            // lost the race for this driver -- loop and re-snapshot available drivers
        }
    }

    public void startRide(String rideId) {
        Ride ride = requireRide(rideId);
        RideStatus previous = ride.getStatus();
        ride.start();
        notifyObservers(ride, previous);
    }

    public void completeRide(String rideId) {
        Ride ride = requireRide(rideId);
        RideStatus previous = ride.getStatus();
        long fareCents = pricingStrategy.calculateFareCents(ride.getPickup(), ride.getDestination(), surgeMultiplier);
        ride.complete(fareCents);
        notifyObservers(ride, previous);
        releaseDriver(ride);
    }

    public void cancelRide(String rideId) {
        Ride ride = requireRide(rideId);
        RideStatus previous = ride.getStatus();
        ride.cancel();
        notifyObservers(ride, previous);
        releaseDriver(ride);
    }

    private void releaseDriver(Ride ride) {
        String driverId = ride.getDriverId();
        if (driverId != null) {
            Driver driver = drivers.get(driverId);
            if (driver != null) {
                driver.release();
            }
        }
    }

    private Ride requireRide(String rideId) {
        Ride ride = rides.get(rideId);
        if (ride == null) {
            throw new IllegalArgumentException("no such ride: " + rideId);
        }
        return ride;
    }

    private void notifyObservers(Ride ride, RideStatus previous) {
        for (RideStatusObserver observer : observers) {
            observer.onStatusChanged(ride, previous);
        }
    }
}
```
