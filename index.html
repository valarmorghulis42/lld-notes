# India Tech Company Tiers & SDE2 Prep Resources (2025-2026)

This is reference material, not a lesson — a deep-research pass (5 parallel researchers + a synthesis
pass, all citing primary sources) on two questions: how does the Indian tech industry actually tier
companies for software engineers right now, and what are the current best resources for landing an SDE2
role at the higher tiers. It exists here because it directly shapes *why* this curriculum prioritizes
what it does — the curriculum's target list (Google, Microsoft, Amazon, Salesforce, Walmart) sits
inside the tiering below, and the resource list at the end is meant to sit alongside this repo's own LLD
track, not replace it.

**Full raw research** (five per-topic note files with inline `Takeaway / Cited Findings / Inferences /
Gaps` sections, if you want to check a claim against its primary source) lives in
`research_notes/Big tech company tiers India SDE2/`. This file is the synthesized, cleaned-up version.

---

## The core finding: "tier" isn't one variable

Four loosely correlated axes drive every ranking in this research, and they frequently disagree:
**brand prestige**, **compensation**, **work-life balance/stability**, and **depth of engineering
ownership** (is the India office doing core product work, or feature/support work for a team elsewhere).
A candidate optimizing for only one — usually prestige — will misjudge companies like Atlassian and
Salesforce, which out-pay several "higher-tier" peers, or top Indian unicorns, which out-pay plenty of
MNCs but carry real stability/WLB tradeoffs. Keep all four axes in view rather than collapsing to a
single ranked list.

## Global MNC India offices

Google is the only company with near-universal Tier 1 consensus across every India-specific source
reviewed — prestige lists, pay/WLB lists, and engineering-work-quality lists all agree
([Blind](https://www.teamblind.com/post/rank-these-companies-according-to-engineering-work-in-india-pbcokpc2)).
Microsoft, Amazon, Meta (specifically Hyderabad), and Uber form a fairly stable cluster just below —
though even here there's friction: Amazon's ranking has been trending down in 2025-2026 discussions
specifically because of its mandatory five-day RTO policy, and some commenters place Microsoft a tier
lower than usual over "poor engineering culture in India"
([Blind](https://www.teamblind.com/post/company-prestige-tier-rankings-the-indian-version-gos4l50m)).

Below that cluster, consensus collapses. **Adobe, Salesforce, and Atlassian are the most contested
placements in the entire dataset** — ranked Tier 1.5-2 on pay-weighted lists, Tier 3 on
engineering-work-quality lists that see their India offices as doing less core/infra work. Netflix,
Apple, and Nvidia show a related split: compensation-focused rankings rate them very highly, but
India-specific commenters dispute whether they have meaningful *product*-engineering presence in India at
all — Apple India was singled out as "mostly IT support roles" rather than core ownership
([Blind](https://www.teamblind.com/post/rank-these-companies-according-to-engineering-work-in-india-pbcokpc2)).
Second-tier MNCs (Cisco, VMware, Intuit, PayPal, ServiceNow, Expedia) showed the *most* volatile
placement of any group — the same company landing anywhere from Tier 2 to Tier 5-6 depending on the
source ([Blind](https://www.teamblind.com/post/What-companies-are-Cisco-tier-Trying-to-escape-Infosys-6AHQQD6s)).

**GCCs (Global Capability Centers) split by maturity, not parent-brand size.** Elite, decade-plus-old
financial GCCs like Goldman Sachs Bangalore genuinely own mission-critical infrastructure and are
described as among "the most sophisticated GCC operations in the country"; newer or execution-focused
GCCs risk a "status trap" — handed a product mandate on paper, never the budget/hiring authority to act
on it, and quietly reverting to execution-center habits under a new name
([Business of GCC](https://www.businessofgcc.com/gcc-data/companies/goldman-sachs-india)).

**2025 stability shocks that fed directly into this tiering**: Microsoft cut ~6,000 roles in May 2025 and
~9,000 more in July 2025 globally; Meta cut ~3,600 roles (~5%) tied to a revamped performance system;
Google India reportedly terminated 400+ employees via email
([Fortune](https://fortune.com/2025/07/16/tech-layoffs-2025-how-microsoft-google-meta-amazon/); [TechCrunch](https://techcrunch.com/2025/12/22/tech-layoffs-2025-list/)).

## Indian product companies & unicorns

No single authoritative tier list exists, but a consistent "top of the Indian pack" recurs across
sources: **Razorpay, PhonePe, CRED, Zerodha, Flipkart, Swiggy, Zomato/Eternal, and Meesho** — generally
placed one tier below the Google/Meta/Microsoft cluster but clearly above IT-services firms
([Underpaid](https://iamunderpaid.com/blog/tier-1-tier-2-tier-3-companies-india)). The honest framing is a
*tradeoff*, not a hierarchy: Indian unicorns are "the sweet spot for high comp + real-scale learning,"
while MNC India offices offer "FAANG-level comp with better work-life balance." A Blind pay/WLB/security
ranking put Google Bangalore, Meta Hyderabad, and Microsoft above a mid-tier of CRED, Razorpay, Swiggy,
and Zomato specifically because of stability, not pay — one Razorpay employee on that same thread pushed
back describing "constant war rooms and firefighting" rather than balanced comp
([Blind](https://www.teamblind.com/post/made-an-india-focused-company-tier-list-pay-wlb-job-security-us0kkcjb)).
**Within-company variance is often as large as between-company variance** — Razorpay sits at 3.2/5 on
Blind with reviews ranging from praise for its engineering practices to "this place has lost all its
former glory and is now a sweat shop."

**2023-2026 has been unusually volatile**, driven by binary regulatory/liquidity shocks rather than
gradual drift:
- **Byju's** — valuation collapsed from a $22B 2022 peak to effectively zero by October 2024, ending in
  insolvency ([US News](https://www.usnews.com/news/technology/articles/2024-07-21/india-ed-tech-firm-byjus-founder-faces-reckoning-as-startup-implodes)).
- **Paytm** — barred by the RBI from payments-bank operations in early 2024; ~4,600 roles cut
  year-over-year ([PeopleMatters](https://www.peoplematters.in/news/strategic-hr/paytm-tightens-belt-with-4600-layoffs-indian-rupee650-crore-cost-cut-42380)).
- **Dream11/Dream Sports** — lost ~95% of revenue overnight when India's 2025 Online Gaming Bill banned
  real-money gaming; 100+ exits
  ([PeopleMatters](https://www.peoplematters.in/news/leadership/dream11-vows-no-layoffs-after-real-money-gaming-ban-wipes-95percent-revenue-43138)).
- **Ola Electric** — stock down ~59% in 2025, 54% attrition, C-suite exodus, a harassment-linked employee
  death that triggered a police complaint against the founder
  ([Inc42](https://inc42.com/features/ola-electric-in-2025-how-a-market-leader-ran-out-of-spark/)).
- **Positive catalysts, for contrast**: Swiggy's November 2024 IPO unlocked ~₹9,000 crore in ESOP value
  (500+ employees became crorepatis); Meesho's December 2025 IPO delivered a 46.4% listing-day pop
  ([India.com](https://www.india.com/business/swiggy-500-employees-become-crorepatis-company-unlocks-rs-90000000000-worth-of-esops-in-ipo-zomatos-ceo-deepinder-goyal-congratulaties-them-7395060/); [TechCrunch](https://techcrunch.com/2025/12/10/meeshos-606m-ipo-pops-as-enthusiasm-for-indias-e-commerce-startups-rises)).

Total Indian startup headcount cuts still exceeded 9,500 across 2025, with a growing share hitting core
engineering teams rather than non-core functions
([Inc42](https://inc42.com/features/indian-startup-layoff-tracker-2025/)).

## Service-based IT: a genuinely separate, and currently widening, lower tier

The WITCH cluster (Wipro, Infosys, TCS, HCLTech, Cognizant) plus Accenture, Capgemini, Tech Mahindra, and
LTIMindtree are viewed as the clear lowest tier for engineers seeking real software-engineering work —
for structural, not individual-skill, reasons: a billable-hours client-dictated-scope business model that
discourages deep ownership, a hard compensation ceiling, and seniority-over-merit promotion
([Susam Pal](https://susam.net/re-infosys-tcs-or-wipro.html)). Entry-level pay typically runs **₹3.5-5
LPA vs. ₹6-12 LPA+** at product companies, with internal raises averaging 8-15%/year vs. the 50-100% jump
a successful switch to a product company typically delivers
([jobsbyculture.com](https://jobsbyculture.com/blog/software-engineer-salary-india-2026)).

**This gap is actively widening in 2025-2026**, not just historically entrenched. TCS's new bench policy
(effective June 2025) caps unassigned time at 35 business days/year and mandates 225 billable days
minimum, with failure risking salary freezes or performance-based exit — a union alleged workers are
being pressured into forced resignation
([Analytics India Magazine](https://analyticsindiamag.com/ai-features/why-tcs-changed-its-bench-policy)).
TCS let go of 23,000+ employees in FY26, its largest single-year cut on record, as all major WITCH firms
shrink bench sizes to defend margins amid a shift from labour-arbitrage toward AI-driven productivity
models. This directly undercuts these firms' traditional "job security" pitch — no updated community
rebuttal accounting for the 2025-2026 layoff wave was found in this research.

**The exit path is viable but requires deliberate counter-programming**: ~6-12 months of pattern-based
DSA prep (not brute-force volume) plus one live, deployed portfolio project — a service-company employer
on a resume is a documented real friction point in initial screening, per a 10-year-experience engineer
who reported that even strong DSA/system-design skills weren't enough to get shortlisted
([Glassdoor Community](https://www.glassdoor.co.in/Community/tech-india/how-to-switch-from-service-based-companies-to-product-based-companies-i-have-10-years-of-work-experience-and-i-have-good-knowledge)).

## Compensation reality check (SDE2/L4-equivalent, levels.fyi, India, Sept 2026 snapshot)

Prestige and pay are only loosely correlated — several companies ranked *below* the top prestige tier
out-pay companies ranked above them:

| Company | Level | Median total comp (₹) |
|---|---|---|
| Atlassian | Senior (P50) | ~1.05 Cr |
| Salesforce | Overall SE | ~73.7 L |
| Google | L4 | ~75.6 L |
| Adobe | Overall SE | ~68.3 L |
| Amazon | SDE II | ~63.1 L |
| Microsoft | SDE II | ~47 L (Senior/63: ~73.4 L) |
| InMobi | SDE II | ~40.6 L |
| Groww | SE II | ~37.1 L |
| Flipkart | SDE2 | ~34.7 L |
| Urban Company | Overall SE | ~33.6 L |
| Myntra | Overall SE | ~32.6 L |
| Razorpay | All levels | ~27.8 L |
| Wipro | Overall SE | ~14.8 L |
| Accenture | Senior SE | ~13.2 L |
| HCLTech | Overall SE | ~10.2 L |
| Infosys | Overall SE | ~8.9 L |
| Cognizant | Overall SE | ~6.7 L–13.8 L (sources conflict) |
| TCS | Entry-level | ~3.9 L |

Source: [levels.fyi India company pages](https://www.levels.fyi/companies/google/salaries/software-engineer/levels/l4/locations/india).
Atlassian and Salesforce both beating Microsoft's SDE2 median is the clearest concrete evidence for the
"prestige ≠ pay" finding above. Among Indian product companies there's a visible split: fintech/adtech
unicorns (InMobi, Groww, Flipkart, Razorpay) cluster ₹28-41L median; profitable bootstrapped SaaS players
like Zoho/Freshworks pay materially less in cash (~₹6-12L even for experienced engineers) despite strong
stability reputations. **Caveat**: India levels.fyi samples are smaller and self-selected (skew toward
engineers benchmarking against product-company offers) — read narrow figures like Zerodha's outlier
~₹94.9L as directional, not precise.

## Resource list

Organized so you can act on it directly. **Bolded** = the one to start with in that category if you only
pick one. Free/paid noted throughout.

### DSA / Coding
- **[NeetCode 150](https://neetcode.io/)** (free) — curated list + video solutions, built by a former
  Google engineer. Best for depth/pattern-learning.
- [Grind 75](https://www.techinterviewhandbook.org/grind75) (free) — auto-schedules by weeks/hours
  available; built by the same author as the Tech Interview Handbook. Best for time-boxed prep.
- Blind 75 (free) — fastest low-effort broad exposure; ~85% overlap with NeetCode 150.
- [Striver's A2Z DSA Sheet](https://takeuforward.org/dsa/strivers-a2z-sheet-learn-dsa-a-to-z) (free,
  India-popular) — 450 items across 19 modules, by a Google SWE. Explicitly preferred by some Indian
  commenters over NeetCode.
- Love Babbar's 450 DSA Sheet (free, India-popular) — comparable structured alternative to Striver's.
- [Aditya Verma's DP playlist](https://www.youtube.com/@AdityaVermaTheProgrammingLord) (free,
  India-popular) — the go-to for dynamic programming specifically.
- AlgoExpert ($199/yr, paid) — small ~200-question bank; reviewers now call it "a stepping stone, not a
  destination" given free alternatives with comparable video quality.
- Not recommended as a primary resource anymore: GeeksforGeeks for DSA content specifically — Google
  deindexed 36,000+ low-value pages in an April 2025 core-update sweep, and organic traffic fell 44% in a
  month. Its interview-*experience* writeups (see Communities below) are still useful.

### System Design / HLD
- **[ByteByteGo](https://bytebytego.com/)** (Alex Xu — book series + platform + newsletter, 1M+ readers;
  free + paid tiers) — the most-cited "gold standard."
- [System Design Primer](https://github.com/donnemartin/system-design-primer) (free, 371k-star GitHub
  repo) — includes Anki decks for spaced repetition.
- [HelloInterview.com](https://www.hellointerview.com/) (free core guides — "System Design in a Hurry" —
  plus $47/mo-$279 lifetime premium) — ranked at/near the top of multiple 2025-2026 review roundups,
  interview-realistic rather than academic.
- Gaurav Sen (YouTube, free, India-linked, ex-Google) — strong for foundational concepts; upload pace has
  slowed since 2023.
- Hussein Nasser (YouTube, free) — deeper backend/networking/database internals.
- [Arpit Bhayani / Asli Engineering](https://arpitbhayani.me/masterclass/) (free YouTube/podcast + paid
  masterclass, India-based — Principal Engineer at Razorpay, ex-Amazon/D.E. Shaw).
- CodeKarle (YouTube, free, India-popular, ex-Facebook) — strong for interview-question walkthroughs.

### LLD / OOD
- **[HelloInterview's "LLD in a Hurry"](https://www.hellointerview.com/)** (free) — interview-realistic
  guide, same platform as the HLD resource above.
- [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design) (free,
  22k+-star GitHub repo, Java) — SOLID, design patterns, UML, concurrency, worked interview problems.
  Directly complementary to this repo's own curriculum.
- "Grokking the Object-Oriented Design Interview" (Educative or DesignGurus.io, paid) — best-known paid
  course brand for LLD specifically.
- Classic books, still relevant: *Head First Design Patterns*, *Design Patterns: Elements of Reusable
  Object-Oriented Software* (GoF), *Effective Java* (Bloch), *Clean Code*.

### Mock Interview Platforms
- **Pramp** (now merged into Exponent/"Aced," free tier + ~$12/mo unlimited) — standard free
  peer-to-peer mock interviews.
- interviewing.io ($179-$339/session, paid) — FAANG-experienced interviewers; community sentiment
  genuinely mixed (some find it decisive, others found sessions harder than the real thing with feedback
  that "wasn't particularly useful").
- DesignGurus.io (paid) — mock interviews bundled with Grokking courses.
- Recommended sequencing: free peer platforms first to build baseline comfort; reserve paid sessions for
  late-stage, high-stakes practice against a specific target company.

### Communities / Forums
- **Blind (teamblind.com)** — unusually India-heavy (reportedly 50%+ Indian posters); functions as a de
  facto comp-research tool via its discussion threads (12.83M monthly visits as of May 2025, more traffic
  than AmbitionBox or Glassdoor India).
- GeeksforGeeks interview-experience articles — actively updated through 2025 with detailed round-by-round
  company writeups, despite the platform's DSA-content reputation decline.
- Roundz and BigOmega (Substacks, India-focused) — curated interview-experience writeups and resource
  roundups.

### India-specific Compensation Research
- **AmbitionBox** (owned by Naukri/InfoEdge) — largest India-native tool; 100,000+ companies, structured
  min/max/typical CTC ranges.
- [levels.fyi India leaderboard](https://www.levels.fyi/leaderboard/Software-Engineer/Entry-Level-Engineer/country/India/)
  — partially offer-letter-verified data; best for level-normalized comparison at MNCs and larger product
  companies (thinner coverage of Indian-origin companies specifically).
- Glassdoor India — best for qualitative culture/negotiation context alongside the above.
- Recommended: cross-reference AmbitionBox (baseline) + levels.fyi (MNC level-normalization) + Glassdoor/
  Blind (qualitative), rather than trusting any single tool.

### Behavioral Prep
- STAR method (Situation, Task, Action, Result) — the universal framework, cited as ~50% of interview
  weight at FAANG-tier companies. Use "STAR-L" (add Learnings) for SDE2-and-above.
- **Amazon-specific**: given Amazon's outsized India hiring footprint, its Leadership-Principles format
  deserves dedicated prep — the official SDE2/L5 loop runs four ~55-minute rounds, roughly half
  technical (coding/HLD/LLD) and half LP-based behavioral, plus an 8-minute LP-tied "Work Style Survey"
  in the OA. Amazon explicitly recommends STAR-formatted answers with quantified metrics
  ([Amazon Jobs, official](https://amazon.jobs/content/en/how-we-hire/sde-ii-interview-prep)).

---

## Bottom line

A "free-first" doctrine has quietly taken over DSA, HLD, and LLD prep alike: the standout resources of
2025-2026 (NeetCode, HelloInterview, System Design Primer, ashishps1's repo, Striver's sheets) are free
and creator-led, with paid products surviving mainly by selling structure and mock-interview access, not
unique content — a real shift from a few years ago. On the company side: don't chase a single "best"
tier list — decide which of the four axes (prestige, pay, stability, engineering depth) matters most for
*your* situation right now, and use the resource list above alongside this repo's own LLD track (the
concrete skill every tier of company in this research actually interviews on).

  // ---------- doubts: inline hover markers + side notes ----------
  var doubtTooltip = null;
  function ensureDoubtTooltip(){
    if (!doubtTooltip){
      doubtTooltip = document.createElement('div');
      doubtTooltip.className = 'doubt-tooltip';
      doubtTooltip.hidden = true;
      document.body.appendChild(doubtTooltip);
    }
    return doubtTooltip;
  }
  function showDoubtTooltip(marker){
    var tip = ensureDoubtTooltip();
    var q = marker.getAttribute('data-q') || '';
    var a = marker.getAttribute('data-preview') || '';
    var hasTarget = !!marker.getAttribute('data-target');
    tip.innerHTML =
      (q ? '<div class="dt-q">' + q + '</div>' : '') +
      (a ? '<div class="dt-a">' + a + '</div>' : '') +
      (hasTarget ? '<div class="dt-hint">Click to jump to the full answer &darr;</div>' : '');
    tip.hidden = false;
    var r = marker.getBoundingClientRect();
    tip.style.top = (r.bottom + 8) + 'px';
    tip.style.left = r.left + 'px';
    requestAnimationFrame(function(){
      var maxLeft = window.innerWidth - tip.offsetWidth - 12;
      if (r.left > maxLeft) tip.style.left = Math.max(12, maxLeft) + 'px';
      var maxTop = window.innerHeight - tip.offsetHeight - 12;
      if (r.bottom + 8 > maxTop) tip.style.top = Math.max(12, r.top - tip.offsetHeight - 8) + 'px';
    });
  }
  function hideDoubtTooltip(){ if (doubtTooltip) doubtTooltip.hidden = true; }

  function wireDoubts(root){
    root.querySelectorAll('.doubt').forEach(function(marker){
      marker.addEventListener('mouseenter', function(){ showDoubtTooltip(marker); });
      marker.addEventListener('mouseleave', hideDoubtTooltip);
      marker.addEventListener('focus', function(){ showDoubtTooltip(marker); });
      marker.addEventListener('blur', hideDoubtTooltip);
      marker.addEventListener('click', function(ev){
        ev.preventDefault();
        hideDoubtTooltip();
        var targetId = marker.getAttribute('data-target');
        if (!targetId) return;
        var target = document.getElementById(targetId);
        if (!target) return;
        target.scrollIntoView({ behavior:'smooth', block:'center' });
        target.classList.remove('sidenote-flash');
        void target.offsetWidth; // restart animation if clicked twice
        target.classList.add('sidenote-flash');
      });
    });
  }

  function currentSlug(){
    var h = location.hash.replace(/^#/, '');
    return h && FLAT.some(function(l){ return l.slug === h; }) ? h : FLAT[0].slug;
  }

  function route(){ renderLesson(currentSlug()); }

  buildSidebar();
  window.addEventListener('hashchange', route);
  if (window.hljs && window.hljs.registerLanguage && window.javaLanguage) {
    // languages/java.min.js self-registers; nothing to do
  }
  route();
})();
</script>
