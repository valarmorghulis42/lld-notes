about substitutability**, and you should only make that promise when you can keep it for every current
and future subclass. Composition makes no such promise, which is exactly why it's the safer default —
you can't violate a contract you never signed.

> **Further resources**: *Design Patterns: Elements of Reusable Object-Oriented Software* (GoF) and
> *Head First Design Patterns* both build their entire case around this exact tradeoff — worth reading
> now that you've derived the reasoning yourself. Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

In `practice/`, package `com.lld.foundations.composition`:

1. Implement the report exporter example above from scratch (`FormatWriter`, `Compressor`,
   `ReportExporter`) with at least: `PdfWriter`, `ExcelWriter`, `ZipCompressor`, `NoopCompressor`.
   Write a test proving you can add a new `Compressor` (e.g., a `Base64Compressor`) without touching
   `ReportExporter`, `FormatWriter`, or any existing writer/compressor class.
2. Refactor Lesson 1's `Square`/`Rectangle` using the **composition** fix described above (`Square` holds
   a `Rectangle` internally rather than extending it). Write a test that would have caught the original
   LSP problem — e.g., assert that `Square` has no way to independently change width vs. height, and that
   a list of mixed shapes still polymorphs correctly through a shared `Quadrilateral`/`Shape`-like
   interface.

This wraps up Phase 1 (Foundations). Once these four lessons are reviewed and finalized into
`solutions/`, we move to Phase 2: Design Patterns — where Strategy, Decorator, and Factory formalize a
lot of what you've already been doing here by hand.
</script>
<script type="text/markdown" id="md-05-creational-patterns">
# Lesson 5 — Creational Patterns

Creational patterns are all about one question: **how does an object get built, without the code that
*uses* the object being coupled to exactly *how* it's constructed?** That coupling is the thing every
pattern in this lesson is trying to break — for testability (swap the real thing for a fake), for
extensibility (add a new variant without touching callers), or because construction itself is
non-trivial (many optional parameters, expensive setup, or a family of related objects that must stay
consistent).

Five patterns: **Singleton**, **Factory Method**, **Abstract Factory**, **Builder**, **Prototype**.

---

## Singleton

**Problem**: ensure a class has exactly one instance for the whole application, with one global access
point to it. Classic candidates: a logger, an app-wide configuration object, a connection pool.

You already built the best version of this in Lesson 0.2 — the **holder idiom** — and saw exactly why
it's thread-safe with zero locking (nested class loading + the JVM's class-init guarantee). This lesson
covers the other variants you'll be expected to know and compare:

```java
// 1. Eager initialization — simplest, thread-safe (final static fields are set during class init,
//    which the JVM already serializes), but the instance is built the moment the class loads,
//    whether or not the app ever actually needs it.
class EagerConfig {
    private static final EagerConfig INSTANCE = new EagerConfig();
    private EagerConfig() {}
    static EagerConfig getInstance() { return INSTANCE; }
}

// 2. Double-checked locking — lazy AND avoids taking a lock on every call, but has a famous trap.
class DclConfig {
    private static volatile DclConfig instance;   // <-- volatile is not optional, see below
    private DclConfig() {}
    static DclConfig getInstance() {
        if (instance == null) {                    // first check, no lock (fast path once built)
            synchronized (DclConfig.class) {
                if (instance == null) {             // second check, now holding the lock
                    instance = new DclConfig();
                }
            }
        }
        return instance;
    }
}

// 3. Enum singleton (Effective Java's recommended default) — the JVM guarantees exactly one
//    instance per enum constant, even under reflection or serialization, for free.
enum EnumConfig {
    INSTANCE;
    void doSomething() { }
}
```

**Why `volatile` is mandatory on double-checked locking, not a nice-to-have**: `new DclConfig()`
is not one atomic step — roughly, the JVM (1) allocates memory, (2) runs the constructor, (3) assigns the
reference to `instance`. Without `volatile`, the compiler/CPU is allowed to *reorder* steps 2 and 3 for
another thread's view (this is exactly the reordering-without-`volatile` problem from Lesson 0.5). A
second thread could see `instance` become non-null *before* the constructor has finished running, read
`instance` as non-null in the first check, skip the lock entirely, and return a half-constructed object.
`volatile` establishes the happens-before edge that forbids this reordering — this is one of the most
cited real-world justifications for `volatile` beyond simple flags.

**Why Enum is the recommended default**: it sidesteps both classic Singleton-breaking attacks for free —
reflection can normally call a private constructor via `Constructor.setAccessible(true)`, but the JVM
explicitly refuses to do this for enum constructors; and Java's default serialization can normally
deserialize a *new* instance from a byte stream, but enum deserialization is special-cased to return the
existing constant instead. Getting both of those protections right by hand (a `readResolve()` method, a
constructor guard) is easy to forget; Enum gives you both automatically.

**The pitfall worth naming out loud**: Singleton is also the most over-used and most-criticized pattern
in this lesson, and a senior interviewer will notice if you reach for it reflexively. A class enforcing
its own single-instance-ness via a static `getInstance()` is **global mutable state accessed by direct
reference** — every caller is now coupled to the *concrete class*, not an abstraction, which is a direct
DIP violation (Lesson 2) and makes the class nearly impossible to substitute with a test double. In most
real codebases, "there's only one of these" is better achieved by constructing *one instance* at the
composition root and injecting it everywhere it's needed (an "effectively singleton" object, managed by
whoever wires the app together) rather than baking single-instantiation into the class itself. Reach for
a true Singleton mainly for things that are genuinely process-global by nature (a logging framework's
static entry point) — not as a default way to avoid passing a dependency around.

---

## Factory Method, Abstract Factory, and "Simple Factory" — the trio people mix up

This is one of the most confused groupings in LLD interviews, partly because the thing most developers
actually write in practice (a static method returning different implementations) *isn't* the GoF
"Factory Method" pattern at all. Knowing the real distinction is worth more than knowing any one of them
individually.

### Simple Factory (not officially a GoF pattern, but what you'll write 90% of the time)

A single static method that switches on some input and returns the right implementation:
```java
class NotificationChannelFactory {
    static NotificationChannel create(String type) {
        return switch (type) {
            case "EMAIL" -> new EmailChannel();
            case "SMS" -> new SmsChannel();
            case "PUSH" -> new PushChannel();
            default -> throw new IllegalArgumentException("unknown channel: " + type);
        };
    }
}
```
This centralizes construction logic in one place (useful!) but notice it's still an `if`/`switch` on
type — adding a new channel means editing this method, which is an OCP violation baked right into your
"factory." It's a genuinely useful, extremely common idiom — just don't call it "Factory Method" in an
interview; that's a different, more specific pattern.

### Factory Method (the real GoF pattern): creation deferred to subclasses via polymorphism

The actual pattern ties object creation to an inheritance hierarchy: an abstract `Creator` declares a
factory method that subclasses override, so *which* product gets built is decided by *which concrete
Creator subclass you're using*, not by a switch statement:
```java
abstract class ReportExporter {                       // the "Creator"
    abstract FormatWriter createWriter();              // the "factory method"

    byte[] export(Report report) {                     // uses the product without knowing its concrete type
        return createWriter().write(report);
    }
}
class PdfReportExporter extends ReportExporter {
    @Override FormatWriter createWriter() { return new PdfWriter(); }
}
class ExcelReportExporter extends ReportExporter {
    @Override FormatWriter createWriter() { return new ExcelWriter(); }
}
```
Adding a new exporter (say, CSV) means writing one new subclass — zero edits to `ReportExporter` or any
existing subclass. That's the real payoff: OCP achieved through polymorphism, the same mechanism from
Lesson 1, just applied specifically to the *act of construction*.

### Abstract Factory: a factory of *families* of related objects

Abstract Factory is one level up again — instead of creating one kind of product, it creates a whole
*family* of related products that must stay consistent with each other. The textbook example is a UI
toolkit that must produce a matching Button *and* Checkbox *and* Scrollbar for a given look-and-feel —
you never want a Windows-style button next to a Mac-style checkbox:
```java
interface UiFactory {
    Button createButton();
    Checkbox createCheckbox();
}
class WindowsUiFactory implements UiFactory {
    public Button createButton() { return new WindowsButton(); }
    public Checkbox createCheckbox() { return new WindowsCheckbox(); }
}
class MacUiFactory implements UiFactory {
    public Button createButton() { return new MacButton(); }
    public Checkbox createCheckbox() { return new MacCheckbox(); }
}
```
Code that receives a `UiFactory` (picked once, e.g. based on the OS) never has to worry about mismatched
styles — every product it creates through that one factory instance belongs to the same family by
construction. **The distinguishing question that separates the three**: "am I creating one product with
type-specific construction logic?" (Factory Method) vs. "am I creating a whole family of products that
must match each other?" (Abstract Factory) vs. "do I just need a single switch statement centralizing a
handful of `new` calls?" (Simple Factory — and that's a perfectly fine answer most of the time).

---

## Builder

**Problem**: an object has many optional fields, and a constructor covering every combination either
needs a huge parameter list (error-prone — easy to swap two `int` arguments silently) or a "telescoping"
pile of overloaded constructors. Lesson 1 already named this: *constructors with many parameters are an
encapsulation smell* — Builder is the direct fix.

```java
public final class HttpRequest {
    private final String url;                 // required
    private final String method;               // required
    private final Map<String, String> headers;  // optional
    private final String body;                  // optional
    private final int timeoutMs;                // optional, has a sensible default

    private HttpRequest(Builder b) {
        this.url = b.url;
        this.method = b.method;
        this.headers = Map.copyOf(b.headers);
        this.body = b.body;
        this.timeoutMs = b.timeoutMs;
    }

    public static Builder builder(String url, String method) { return new Builder(url, method); }

    public static final class Builder {
        private final String url;
        private final String method;
        private final Map<String, String> headers = new HashMap<>();
        private String body;
        private int timeoutMs = 5000;               // default

        private Builder(String url, String method) {
            this.url = Objects.requireNonNull(url);
            this.method = Objects.requireNonNull(method);
        }
        public Builder header(String key, String value) { headers.put(key, value); return this; }
        public Builder body(String body) { this.body = body; return this; }
        public Builder timeoutMs(int ms) { this.timeoutMs = ms; return this; }

        public HttpRequest build() {
            if ("POST".equals(method) && body == null) {
                throw new IllegalStateException("POST requires a body");   // cross-field validation, HERE
            }
            return new HttpRequest(this);
        }
    }
}

HttpRequest req = HttpRequest.builder("https://api.example.com", "POST")
        .header("Content-Type", "application/json")
        .body("{}")
        .timeoutMs(10_000)
        .build();
```

**What this buys you that a constructor can't**: cross-field validation at `build()` time (a rule that
spans *multiple* optional fields — like "POST requires a body" above — has nowhere sensible to live in a
plain constructor), self-documenting call sites (`.timeoutMs(10_000)` vs. a bare `10000` in a giant
argument list), and immutability of the final object even though construction happens gradually.

**The textbook-vs-practice gap, worth naming**: the original GoF Builder pattern includes a separate
`Director` class that encapsulates a specific *build sequence*, so the same builder can produce different
representations under different directors. In real Java code, almost nobody writes a separate `Director`
— the fluent, method-chaining style above (sometimes just called the "fluent builder" idiom) is what you'll
actually see and write. Know the textbook version exists; use the fluent version. And know the
"production" answer: Lombok's `@Builder` annotation generates exactly this boilerplate for you — a
completely reasonable thing to mention when asked "how would you actually build this."

---

## Prototype

**Problem**: create new objects by **copying an existing, already-configured instance** rather than
constructing from scratch — useful when construction is expensive, or when you want a new object that
starts as a variation of some existing "template" without hard-coding a reference to its concrete class.

```java
interface Shape extends Cloneable {
    Shape copy();
}
final class Circle implements Shape {
    private final double radius;
    private final String color;
    Circle(double radius, String color) { this.radius = radius; this.color = color; }
    @Override public Shape copy() { return new Circle(radius, color); }   // hand-written copy, not clone()
}
```

**Why hand-write `copy()` instead of using Java's built-in `Cloneable`/`clone()`**: this is a well-known
wart in the language, and knowing to avoid it is itself a signal. `Cloneable` is a *marker interface* — it
has no methods of its own, and merely flags a class as "OK to clone"; the actual `clone()` method lives on
`Object`, is `protected`, performs a **shallow** field-by-field copy (any mutable field like a `List` ends
up shared between original and copy, not duplicated), and the whole mechanism predates generics and
exceptions being designed well together (`clone()` throws a checked `CloneNotSupportedException` even
though, once you've implemented `Cloneable` correctly, it can never actually be thrown). Effective Java's
guidance — and the practical consensus — is to skip `Cloneable` entirely and provide your own `copy()`
method or a copy constructor, exactly as above, where you control precisely what gets deep-copied.

**Real use case**: a prototype *registry* — pre-build and configure a handful of template objects once
(expensive setup done a single time), then produce new instances by cloning whichever template fits,
instead of re-running expensive setup for every new object. Also shows up in editors/games: "duplicate
this configured game object" is Prototype by definition.

> **Further resources**: [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design)
> and *Head First Design Patterns* both cover all five of these patterns with additional worked examples;
> DesignGurus/Educative's "Grokking Design Patterns" is the paid alternative if you want guided practice.
> Full curated list: [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

In `practice/`, package `com.lld.patterns.creational`. Different domain from every example above.

1. **`IdGeneratorSingleton`** — implement it two ways: the holder idiom (copy the mechanism from Lesson
   0.2's `Config` example, applied to a new domain) and double-checked locking with `volatile`. Write a
   comment explaining, in your own words, exactly what goes wrong if you remove `volatile` from the DCL
   version — don't just cite the rule, trace the reordering.
2. **`VehicleFactory`** — build all three creational-factory flavors over one small domain (a
   `Vehicle` interface with `Car`/`Motorcycle`): a `VehicleFactory.create(String type)` static method
   (Simple Factory); a `VehicleDealership` abstract class with an abstract `orderVehicle()` factory
   method and two subclasses (Factory Method); and a `VehiclePartsFactory` abstract factory producing
   matched `Engine`+`Tire` families for `SedanPartsFactory` vs `SportsPartsFactory` (Abstract Factory).
   Write one sentence per pair explaining which of the three you'd actually reach for and why.
3. **`MeetingInviteBuilder`** — a fluent builder for a `MeetingInvite` (required: title, organizer;
   optional: attendees, location, recurrence rule, reminder minutes) with at least one cross-field
   validation at `build()` time (e.g., a recurring meeting must have an end date).
4. **`DocumentTemplatePrototype`** — a `DocumentTemplate` with a hand-written `copy()` (not
   `Cloneable`) that deep-copies a mutable field (e.g., a `List<String> sections`), plus a test proving
   that mutating the copy's list does **not** affect the original's list.
5. Tests: DCL/holder singleton returns the same instance across many threads (use an `ExecutorService`,
   like Lesson 0.5); each factory variant produces the correct concrete type; the builder rejects the
   invalid cross-field case; the prototype's deep copy is independent of its source.

Next: **Lesson 6 — Structural Patterns**.

<script type="text/markdown" id="md-06-structural-patterns">
# Lesson 6 — Structural Patterns

Structural patterns are about **composing objects and classes into larger structures while keeping them
loosely coupled** — how do you make two incompatible interfaces work together, add behavior to an object
without touching its class, or let a client treat one object and a tree of objects identically? Every
pattern here is composition (Lesson 4) applied to a specific, recurring shape of problem.

Seven patterns: **Adapter**, **Decorator**, **Facade**, **Composite**, **Proxy**, **Bridge**,
**Flyweight**.

---

## Adapter

**Problem**: you have an existing class with an interface that doesn't match what your code expects —
often a third-party library, legacy code, or two subsystems designed independently. You can't (or
shouldn't) modify either side.

```java
// The interface your code expects:
interface PaymentGateway { void charge(long cents, String currency); }

// A third-party SDK you don't control, with an incompatible interface:
class LegacyBillingSdk {
    void submitPayment(double amountInDollars) { /* ... */ }
}

// The adapter: translates calls from what you need to what you have
class LegacyBillingAdapter implements PaymentGateway {
    private final LegacyBillingSdk sdk;
    LegacyBillingAdapter(LegacyBillingSdk sdk) { this.sdk = sdk; }

    @Override
    public void charge(long cents, String currency) {
        if (!"USD".equals(currency)) throw new UnsupportedOperationException("legacy SDK is USD-only");
        sdk.submitPayment(cents / 100.0);   // translates units AND method signature
    }
}
```
Your code depends only on `PaymentGateway` (DIP, Lesson 2) — it never even knows `LegacyBillingSdk`
exists. Swap providers later by writing a new adapter; nothing else changes.

**The interview-relevant nuance**: Adapter's whole purpose is making an *existing, unmodifiable* interface
fit — it doesn't add new behavior, just translates. That's the line that separates it from Decorator
(below), which deliberately *adds* behavior while keeping the interface the same. Confusing these two
is a common interview slip: "does this wrap something to translate its interface, or to add behavior on
top of an already-compatible interface?"

---

## Decorator

**Problem**: add behavior to an individual object, at runtime, without touching its class or affecting
other instances of the same class — and without the combinatorial explosion of subclassing for every
combination of behaviors (this is exactly Lesson 4's report-exporter problem).

You've already built this shape: `ZipCompressor` wrapping a `FormatWriter`'s output is a decorator by
structure. The formal pattern names it explicitly — a decorator implements the *same interface* as the
thing it wraps, and delegates to it, adding behavior before/after:

```java
interface Coffee { double cost(); String description(); }

class Espresso implements Coffee {
    public double cost() { return 2.50; }
    public String description() { return "Espresso"; }
}

abstract class CoffeeDecorator implements Coffee {          // also a Coffee — same interface as what it wraps
    protected final Coffee inner;
    CoffeeDecorator(Coffee inner) { this.inner = inner; }
}
class WithMilk extends CoffeeDecorator {
    WithMilk(Coffee inner) { super(inner); }
    public double cost() { return inner.cost() + 0.50; }
    public String description() { return inner.description() + " + milk"; }
}
class WithCaramel extends CoffeeDecorator {
    WithCaramel(Coffee inner) { super(inner); }
    public double cost() { return inner.cost() + 0.70; }
    public String description() { return inner.description() + " + caramel"; }
}

Coffee order = new WithCaramel(new WithMilk(new Espresso()));
order.cost();          // 2.50 + 0.50 + 0.70 = 3.70
order.description();   // "Espresso + milk + caramel"
```
Each decorator wraps a `Coffee` and *is* a `Coffee` — so decorators stack in any combination, in any
order, all decided at runtime by which constructors you call, with zero new classes needed per
combination. This is the direct alternative to the class-explosion problem from Lesson 4.

**Decorator vs. inheritance, the concrete comparison**: `WithMilk` and `WithCaramel` could instead have
been subclasses (`EspressoWithMilk`, `EspressoWithCaramel`, `EspressoWithMilkAndCaramel`, ...) — and
that's exactly the combinatorial explosion Lesson 4 walked through. Decorator is that lesson's fix,
applied by name.

---

## Facade

**Problem**: a subsystem has many moving parts with a complex combined API (several classes, specific
call ordering, configuration). Most callers don't need that full power — they need one simple
entry point for the common case.

```java
class VideoConverter {                     // the Facade
    private final Decoder decoder = new Decoder();
    private final AudioMixer mixer = new AudioMixer();
    private final BitrateEncoder encoder = new BitrateEncoder();
    private final Muxer muxer = new Muxer();

    File convert(File source, Format targetFormat) {          // one simple method...
        var rawVideo = decoder.decode(source);                // ...hides four coordinated steps,
        var mixedAudio = mixer.extractAndMix(source);          // called in a specific required order,
        var encoded = encoder.encode(rawVideo, targetFormat); // that callers no longer need to know
        return muxer.mux(encoded, mixedAudio, targetFormat);
    }
}
```
Facade doesn't hide the subsystem *forever* — `Decoder`, `AudioMixer`, etc. are usually still public for
callers who genuinely need fine-grained control. It just gives everyone else a simple front door. This is
the pattern behind "add a `NotificationService` that hides SMTP/SMS-gateway details" — you built exactly
this shape in Lesson 2's `NotificationService`, which faces channels the way a Facade faces a subsystem
(though `NotificationService` also does real orchestration work, not just delegation — Facade is at its
purest when it's *mostly* just simplifying access, doing little logic of its own).

---

## Composite

**Problem**: you have a part-whole tree (files and folders, UI components and containers, org-chart
employees and managers) and want callers to treat a single leaf and an entire subtree **identically**,
through one shared interface.

```java
interface FileSystemNode { long sizeInBytes(); }

class File implements FileSystemNode {
    private final long size;
    File(long size) { this.size = size; }
    public long sizeInBytes() { return size; }
}

class Folder implements FileSystemNode {
    private final List<FileSystemNode> children = new ArrayList<>();
    void add(FileSystemNode node) { children.add(node); }
    @Override public long sizeInBytes() {
        return children.stream().mapToLong(FileSystemNode::sizeInBytes).sum();   // recurses transparently
    }
}
```
`sizeInBytes()` on a `Folder` doesn't know or care whether each child is a `File` or another `Folder` full
of more files and folders — the recursion "just works" because every node, leaf or branch, answers to the
same interface. Calling code never special-cases "is this a leaf or a container?" This is also, notably,
one of the cleanest real uses of a **reflexive association** from Lesson 3's UML notation (`Folder`
contains other `FileSystemNode`s, which can themselves be `Folder`s).

---

## Proxy

**Problem**: control access to an object — without the caller knowing they're not talking to the real
thing directly. Same interface as the real object; the proxy sits in front of it.

```java
interface UserRepository { User findById(String id); }

class DatabaseUserRepository implements UserRepository {
    public User findById(String id) { /* real, slow DB query */ return null; }
}

class CachingUserRepositoryProxy implements UserRepository {        // same interface as the real thing
    private final UserRepository real;
    private final Map<String, User> cache = new HashMap<>();
    CachingUserRepositoryProxy(UserRepository real) { this.real = real; }

    @Override
    public User findById(String id) {
        return cache.computeIfAbsent(id, real::findById);           // controls access: cache-then-delegate
    }
}
```
Common Proxy flavors, all the same shape (same interface, controls access, delegates to the real object):
**virtual proxy** (defer expensive construction until first real use — lazy loading), **caching proxy**
(above), **protection proxy** (check permissions before delegating), **remote proxy** (the real object
lives on another machine; the proxy makes the network call look like a local method call — this is
literally how RPC/gRPC-generated client stubs work).

**Proxy vs. Decorator, the sharpest distinction**: both wrap an object behind the same interface and
delegate to it — structurally almost identical. The difference is *intent*: **Decorator adds new
behavior/responsibility** (milk, caramel — the object can genuinely do more now); **Proxy controls
*access* to behavior that's already fully defined by the interface** (caching, lazy-loading, permission
checks — the object doesn't gain new capabilities, access to the existing ones is just being mediated).
Interviewers ask this distinction directly — lead with intent, not structure, since the structure alone
won't tell them apart.

---

## Bridge

**Problem**: you have two things that vary independently, and naively modeling both with inheritance
produces the same combinatorial explosion Lesson 4 already covered (M abstractions × N implementations =
M×N classes). Bridge is the deliberate, named fix: split the **abstraction** (the thing callers use) from
its **implementation** (how it actually works), connected by composition, so either side can vary
independently.

```java
interface Renderer { void renderCircle(double radius); }          // the "implementation" side
class VectorRenderer implements Renderer {
    public void renderCircle(double radius) { /* draw as vector paths */ }
}
class RasterRenderer implements Renderer {
    public void renderCircle(double radius) { /* draw as pixels */ }
}

abstract class Shape {                                             // the "abstraction" side
    protected final Renderer renderer;                              // composed, not inherited
    Shape(Renderer renderer) { this.renderer = renderer; }
    abstract void draw();
}
class Circle extends Shape {
    private final double radius;
    Circle(Renderer renderer, double radius) { super(renderer); this.radius = radius; }
    void draw() { renderer.renderCircle(radius); }
}
```
Add a new shape (`Square`) or a new renderer (`SvgRenderer`) and neither side multiplies against the
other — exactly one new class each. **This is genuinely the same idea as Lesson 4's `ReportExporter`**
(format × compression, composed rather than inherited) — Bridge is that idea's formal name when it's
specifically applied to an abstraction/implementation split. If you can already explain why
`ReportExporter` avoided a class explosion, you already understand Bridge; the pattern name is new
vocabulary for a technique you've already used.

---

## Flyweight

**Problem**: you need *huge numbers* of similar objects (think: every character glyph in a text editor,
every tree in a forest-rendering game), and creating one full object per instance would exhaust memory —
even though most of each object's state is actually identical across instances.

The fix: split each object's state into **intrinsic** (shared, immutable, identical across many
instances — e.g., a character's font/glyph shape) and **extrinsic** (unique per use, supplied by the
caller at the point of use — e.g., that character's x/y position on the page). Only the intrinsic part is
actually stored in a shared, cached object; the extrinsic part is passed in on every call instead of
stored:

```java
final class CharacterGlyph {                              // intrinsic state ONLY — shared, immutable
    private final char symbol;
    private final String fontFamily;
    CharacterGlyph(char symbol, String fontFamily) { this.symbol = symbol; this.fontFamily = fontFamily; }
    void render(int x, int y) { /* draw using symbol/fontFamily, at the given position */ }  // extrinsic state passed in
}

class GlyphFactory {
    private final Map<String, CharacterGlyph> cache = new HashMap<>();
    CharacterGlyph get(char symbol, String font) {
        return cache.computeIfAbsent(symbol + font, k -> new CharacterGlyph(symbol, font));   // reuse, don't recreate
    }
}
```
A million characters on a page share a comparatively tiny number of `CharacterGlyph` objects (one per
distinct symbol+font combination) instead of a million full objects — the *position* of each character
on the page is extrinsic, supplied by the caller at render time, never stored on the shared glyph.
**When it's worth reaching for**: only when you genuinely have large *counts* of similar objects and
profiling shows memory pressure — it trades simplicity for memory savings, so it's a targeted
optimization, not a default design stance. `Integer`'s -128..127 cache (Lesson 0.1) is a real-world
Flyweight already sitting inside the JDK.

> **Further resources**: same as Lesson 5 —
> [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design) and the
> GoF/Head First books cover all seven of these. HelloInterview's worked problems are a good place to see
> Decorator and Proxy actually show up inside a full design, not in isolation. Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

In `practice/`, package `com.lld.patterns.structural`. Different domain from every example above.

1. **`XmlToJsonAdapter`** — adapt a (fake/simplified) legacy `XmlConfigReader` with a method like
   `String readXml(String key)` to a `ConfigSource` interface your code actually wants
   (`Optional<String> get(String key)`), including translating its "missing key" behavior (throws) into
   your interface's `Optional.empty()`.
2. **`PizzaDecorator`** — same shape as the coffee example, different domain (toppings on a pizza) — at
   least 3 stacking decorators, plus a test proving different stacking *orders* still produce correct
   total cost.
3. **`SmartHomeFacade`** — a facade over 3-4 fake subsystems (`Lights`, `Thermostat`, `Locks`,
   `Speakers`) exposing one `leavingHome()` method and one `arrivingHome()` method that each coordinate
   several subsystem calls in the right order.
4. **`OrgChartComposite`** — `Employee` (leaf) and `Manager` (composite, holds direct reports) both
   implementing a shared `OrgUnit` interface with `totalHeadcount()` and `totalSalary()`; build a small
   tree and verify the numbers roll up correctly through multiple levels.
5. **`LazyImageProxy`** — a `Image` interface, a `RealImage` that "loads" (simulate with a
   `Thread.sleep` or a counter) only in its constructor, and a `ProxyImage` that defers creating the
   `RealImage` until `display()` is first called. Test that construction the proxy does *not* trigger the
   expensive load, but the first `display()` call does (and only once).
6. Tests as described inline above, plus: `GlyphFactory`-style cache (your own small Flyweight example)

   one.

# Lesson 7 — Behavioral Patterns

Behavioral patterns are about **how objects communicate and divide responsibility** — which object
decides what happens next, how a request travels between objects, how an algorithm can vary
independently of the object using it. This is the largest pattern category, and the one most directly
tested in LLD interviews, because almost every practice problem in Phases 4-6 leans on at least one of
these.

Ten patterns: **Strategy**, **Observer**, **State**, **Command**, **Chain of Responsibility**,
**Template Method**, **Iterator**, **Mediator**, **Memento**, **Visitor**.

---

## Strategy

**Problem**: you have a family of interchangeable algorithms (or policies, or rules) and want to select
and swap between them at runtime, without an `if/else`/`switch` chain and without the class using the
algorithm knowing anything about the concrete implementations.

You've already built this — twice. `NotificationChannel` in Lesson 2 is a Strategy (interchangeable
delivery mechanisms, injected into `NotificationService`). `FormatWriter`/`Compressor` in Lesson 4 are
also Strategy (interchangeable behaviors, composed into `ReportExporter`). The formal shape:
```java
interface DiscountStrategy { double apply(double price); }

class NoDiscount implements DiscountStrategy { public double apply(double p) { return p; } }
class PercentOff implements DiscountStrategy {
    private final double percent;
    PercentOff(double percent) { this.percent = percent; }
    public double apply(double p) { return p * (1 - percent / 100); }
}

class Cart {
    private final DiscountStrategy discount;               // composed, injected — DIP again
    Cart(DiscountStrategy discount) { this.discount = discount; }
    double total(double subtotal) { return discount.apply(subtotal); }
}
```
**Worth stating explicitly in an interview**: Strategy *is* the mechanical implementation of the
Open/Closed Principle via composition — if you've already been saying "I'd inject an interface here so
new variants don't require editing this class," you've been describing Strategy the whole time, whether
or not you used the pattern's name. Since Java 8, when the interface has exactly one method (as almost
all Strategies do), you can often skip a named class entirely and pass a lambda
(`Function<Double,Double>`) — know when the lightweight version suffices (simple, stateless, no need to
unit-test it in isolation) versus when a named class is still better (the strategy has its own state, or
you want it independently testable/mockable by name).

---

## Observer

**Problem**: when one object's state changes, an open-ended set of other objects need to find out —
without the changing object (the *subject*) knowing who they are or how many there are.

```java
interface OrderObserver { void onStatusChanged(Order order, OrderStatus newStatus); }

class Order {
    private final List<OrderObserver> observers = new ArrayList<>();     // subject holds observers...
    private OrderStatus status = OrderStatus.PLACED;

    void addObserver(OrderObserver o) { observers.add(o); }

    void updateStatus(OrderStatus newStatus) {
        this.status = newStatus;
        observers.forEach(o -> o.onStatusChanged(this, newStatus));      // ...and notifies them, generically
    }
}

class SmsNotifier implements OrderObserver {
    public void onStatusChanged(Order order, OrderStatus newStatus) { /* send SMS */ }
}
class InventoryUpdater implements OrderObserver {
    public void onStatusChanged(Order order, OrderStatus newStatus) { /* adjust stock */ }
}
```
`Order` never mentions `SmsNotifier` or `InventoryUpdater` by name — any number of unrelated concerns can
subscribe independently, and `Order` stays completely ignorant of what they do with the notification.
This is the standard shape behind event-driven design, GUI listeners, and "notify these three unrelated
systems when X happens" requirements (exactly what Phase 6's Movie Ticket Booking and Order Management
problems will ask for).

**Two pitfalls worth knowing**: (1) **memory leaks via forgotten unsubscription** — an observer that's
added but never removed keeps the subject holding a reference to it forever, which is precisely the
"unremoved listener" memory-leak shape named back in Lesson 0.2; always pair `addObserver` with a
`removeObserver` and call it. (2) **notification order and failure isolation** — if one observer's
`onStatusChanged` throws, should the rest still run? A naive `forEach` above will *not* notify the
remaining observers once one throws; production Observer implementations usually catch-and-log per
observer so one broken subscriber can't silently break every other subscriber.

---

## State

**Problem**: an object's behavior must change based on its own internal state, and you want to eliminate
sprawling `if (state == X) ... else if (state == Y) ...` conditionals scattered across every method.

```java
interface VendingMachineState {
    VendingMachineState insertCoin(VendingMachine m);
    VendingMachineState selectItem(VendingMachine m);
}

class IdleState implements VendingMachineState {
    public VendingMachineState insertCoin(VendingMachine m) { return new HasCoinState(); }
    public VendingMachineState selectItem(VendingMachine m) {
        throw new IllegalStateException("insert a coin first");
    }
}
class HasCoinState implements VendingMachineState {
    public VendingMachineState insertCoin(VendingMachine m) {
        throw new IllegalStateException("coin already inserted");
    }
    public VendingMachineState selectItem(VendingMachine m) { m.dispense(); return new IdleState(); }
}

class VendingMachine {
    private VendingMachineState state = new IdleState();
    void insertCoin() { state = state.insertCoin(this); }
    void selectItem() { state = state.selectItem(this); }
    void dispense() { /* ... */ }
}
```
Each state is its own class, knows only its own legal transitions, and *returns* the next state — the
`VendingMachine` itself has zero conditional logic about what's currently allowed. This is exactly the
shape you'd sketch as a Mermaid `stateDiagram-v2` first (Lesson 3) — draw the state machine, then each
node in the diagram becomes one class.

**State vs. Strategy — the classic point of confusion, and the actual distinction**: structurally, these
two patterns are close to identical (an interface, multiple implementations, composed into a context
object) — the difference is entirely about *intent and who changes it*. In Strategy, the *client* picks
which implementation to use, once, from outside, and it doesn't typically change during the object's
life for the same operation (you construct a `Cart` with a specific `DiscountStrategy` and that's the
policy for that cart). In State, the object's *own current state transitions itself*, driven by the
object's internal logic in response to events, without the outside caller choosing or even necessarily
knowing which concrete state is active. If your interview answer is "the object switches implementations
on its own as things happen to it," say State; if it's "the caller decides which algorithm to plug in,"
say Strategy — leading with that framing is more convincing than describing either pattern's UML shape,
since the shapes look the same.

---

## Command

**Problem**: turn a request/action into a standalone object, so it can be queued, logged, undone, or
passed around like any other value — instead of being just a direct method call that happens and is
gone.

```java
interface Command { void execute(); void undo(); }

class AddTextCommand implements Command {
    private final Document doc;
    private final String text;
    AddTextCommand(Document doc, String text) { this.doc = doc; this.text = text; }
    public void execute() { doc.append(text); }
    public void undo() { doc.removeLast(text.length()); }
}

class CommandHistory {
    private final Deque<Command> history = new ArrayDeque<>();
    void run(Command cmd) { cmd.execute(); history.push(cmd); }
    void undoLast() { if (!history.isEmpty()) history.pop().undo(); }
}
```
Because a request is now an *object*, `CommandHistory` can hold a stack of them for undo/redo, a queue of
them for deferred/background execution, or a log of them for replay — none of which is possible with a
bare method call, which vanishes the instant it returns. This is the standard shape behind undo/redo in
editors, job queues, and "replay these operations" audit logs.

---

## Chain of Responsibility

**Problem**: a request may need to be handled by one of several possible handlers, but the sender
shouldn't need to know *which* handler will end up processing it — each handler decides independently
whether to handle the request or pass it along to the next one in line.

```java
abstract class NotificationHandler {
    protected NotificationHandler next;
    NotificationHandler setNext(NotificationHandler next) { this.next = next; return next; }

    void handle(Notification n) {
        if (canHandle(n)) {
            doHandle(n);
        } else if (next != null) {
            next.handle(n);                     // pass along the chain
        } else {
            throw new IllegalStateException("no handler in the chain could process: " + n);
        }
    }
    protected abstract boolean canHandle(Notification n);
    protected abstract void doHandle(Notification n);
}

class PushHandler extends NotificationHandler {
    protected boolean canHandle(Notification n) { return n.userHasApp(); }
    protected void doHandle(Notification n) { /* send push */ }
}
class SmsHandler extends NotificationHandler {
    protected boolean canHandle(Notification n) { return n.hasPhoneNumber(); }
    protected void doHandle(Notification n) { /* send sms */ }
}

// wire the fallback order once:
NotificationHandler chain = new PushHandler();
chain.setNext(new SmsHandler());
```
This is exactly the "channel fallback" behavior flagged as a Phase 6 extension of the Lesson 2
notification system — try push, and only if that's not applicable, fall through to SMS, without the
caller writing that fallback logic itself. It's also precisely how logging frameworks route a message
through handlers by severity level, and how middleware/interceptor chains work in most web frameworks.

**A subtlety worth naming**: nothing *requires* exactly one handler in the chain to fire — some designs
deliberately let multiple handlers in the chain process the same request (e.g., logging *and*
forwarding), while others (like the fallback example above) stop at the first handler that accepts it.
Be explicit about which behavior you intend when you describe the design.

---

## Template Method

Covered in depth already in **Lesson 4's "Going Further"** (the `DataImporter` skeleton example, and the
direct comparison with Strategy: Template Method is *inheritance-based* OCP — the algorithm's sequence is
fixed in a `final` method, and subclasses override individual named steps — while Strategy is
*composition-based* OCP. Worth re-reading that section now that you've seen the other eight patterns
around it; the comparison lands better with Strategy fresh in mind from this lesson too.

---

## Iterator

**Problem**: let a caller walk through a collection's elements one at a time, without exposing how that
collection is actually stored internally (array, linked list, tree, a live database cursor).

```java
interface Playlist extends Iterable<Song> { }

class ArrayPlaylist implements Playlist {
    private final Song[] songs;
    private int count;
    ArrayPlaylist(int capacity) { songs = new Song[capacity]; }
    void add(Song s) { songs[count++] = s; }

    @Override
    public Iterator<Song> iterator() {
        return new Iterator<>() {
            private int index = 0;
            public boolean hasNext() { return index < count; }
            public Song next() { return songs[index++]; }
        };
    }
}

for (Song s : new ArrayPlaylist(10)) { /* ... */ }   // enhanced for-loop is Iterator, used implicitly
```
You've been using this pattern every time you wrote `for (X x : collection)` since Lesson 0.1 — the
enhanced for-loop is entirely built on `Iterable`/`Iterator`. Worth knowing explicitly for LLD interviews
because you'll sometimes need to write a **custom** iterator over a non-collection data structure of your
own (a tree's in-order traversal, a paginated API's "next page" cursor) — same interface, same contract
(`hasNext()`/`next()`), applied to something the JDK doesn't already iterate for you.

---

## Mediator

**Problem**: a set of objects need to communicate with each other, but direct object-to-object references
between all of them create a tangled many-to-many web (N objects, up to N² relationships) that's hard to
reason about or change. Mediator centralizes that communication through one object, so the participants
only ever talk to the mediator, never directly to each other.

```java
interface ChatRoomMediator { void sendMessage(String from, String message); }

class ChatRoom implements ChatRoomMediator {
    private final List<User> users = new ArrayList<>();
    void register(User u) { users.add(u); }
    @Override
    public void sendMessage(String from, String message) {
        for (User u : users) {
            if (!u.name().equals(from)) u.receive(from, message);   // ChatRoom coordinates; users don't know each other
        }
    }
}

class User {
    private final String name;
    private final ChatRoomMediator room;
    User(String name, ChatRoomMediator room) { this.name = name; this.room = room; room.register(...); }
    void send(String message) { room.sendMessage(name, message); }
    void receive(String from, String message) { /* display */ }
}
```
No `User` holds a reference to any other `User` — every interaction routes through `ChatRoom`. Adding a
new user, or changing how messages are routed (broadcast vs. private vs. moderated), touches the
mediator, not every participant.

**Mediator vs. Observer, the distinction**: both centralize communication, but Observer is fundamentally
*one-directional and one-to-many* (a subject broadcasts to subscribers who don't talk back through the
same channel), while Mediator is *many-to-many, bidirectional coordination* — every participant is both a
sender and a receiver through the same central object. A chat room is Mediator; a single object's
"notify everyone when I change" is Observer.

---

## Memento

**Problem**: capture and externalize an object's internal state so it can be restored later — **without
violating encapsulation**, i.e. without exposing that state's representation to whoever is doing the
saving. The standard use case is undo/redo, but it also covers checkpointing and "save game" features.

```java
final class EditorState {                    // the Memento — an opaque, immutable snapshot
    private final String content;
    EditorState(String content) { this.content = content; }
    private String content() { return content; }   // private on purpose — see below
}

class TextDocument {                          // the Originator — the only class that reads inside a snapshot
    private String content = "";
    void type(String text) { content += text; }
    EditorState save() { return new EditorState(content); }
    void restore(EditorState state) { this.content = state.content(); }
}

class EditorHistory {                         // the Caretaker — holds snapshots, never looks inside them
    private final Deque<EditorState> history = new ArrayDeque<>();
    void save(TextDocument doc) { history.push(doc.save()); }
    void undo(TextDocument doc) {
        if (!history.isEmpty()) doc.restore(history.pop());
    }
}
```
The encapsulation point is concrete, not abstract: `EditorHistory` holds a stack of `EditorState` objects
and pushes/pops them, but it never calls anything that reveals what's *inside* one — `content()` doesn't
even need to be visible outside `TextDocument`. If `EditorState` exposed a public getter, any code with a
reference to a snapshot could inspect or leak the document's history; keeping it opaque means the
*only* class that can ever make sense of a snapshot is the one that created it.

**Memento vs. Command, tying back to earlier in this lesson**: the two are usually combined, not
competing. **Command** captures the *action* that changed something — cheap to store, and naturally
supports redo (just re-run it) and audit logging. **Memento** captures the *state* before the change —
more expensive to store, but trivial to restore (no need to compute an action's inverse, which isn't
always possible). A production undo/redo stack often uses Command for redo and Memento for undo,
picking whichever is cheaper for a given operation.

**The cost worth naming**: a naive Memento snapshots the *entire* state on every save, which wastes
memory for a large object with small, frequent changes. Real implementations often store a diff instead
of a full copy — the same space/simplicity tradeoff Flyweight makes (Lesson 6), applied to history
instead of instance sharing.

---

## Visitor

**Problem**: add a new *operation* over a fixed family of types, without modifying any of those types'
classes — the exact opposite emphasis from normal OCP (which optimizes for adding new *types* easily).
You've already met the mechanism this relies on: **double dispatch**, traced in full in Lesson 1's
"Going Further" section (the `Asteroid`/`Ship` collision example). Visitor is that exact technique,
formalized and generalized to a whole family of types with a shared `accept` method:

```java
interface ShapeVisitor<R> {
    R visitCircle(Circle c);
    R visitSquare(Square s);
}
interface Shape { <R> R accept(ShapeVisitor<R> visitor); }

class Circle implements Shape {
    final double radius;
    Circle(double radius) { this.radius = radius; }
    public <R> R accept(ShapeVisitor<R> visitor) { return visitor.visitCircle(this); }   // double dispatch, hop 1
}
class Square implements Shape {
    final double side;
    Square(double side) { this.side = side; }
    public <R> R accept(ShapeVisitor<R> visitor) { return visitor.visitSquare(this); }
}

class AreaVisitor implements ShapeVisitor<Double> {
    public Double visitCircle(Circle c) { return Math.PI * c.radius * c.radius; }        // hop 2, statically typed
    public Double visitSquare(Square s) { return s.side * s.side; }
}
```
Adding a new operation (perimeter, rendering, serialization) means writing one new `ShapeVisitor`
implementation — zero changes to `Circle` or `Square`. This is the exact expression-problem tradeoff
named explicitly in Lesson 0.4: Visitor optimizes for "operations vary, types are fixed," which is the
mirror image of the open-interface style (`NotificationChannel`) used everywhere else in this curriculum.

**Why this pattern has become less common in modern Java, and you should say so**: sealed interfaces plus
exhaustive pattern matching (Lesson 0.4) achieve the same "operations vary, types are fixed, compiler
enforces exhaustiveness" goal with far less ceremony — no visitor interface, no `accept` methods, just a
`switch` over a `sealed` hierarchy that the compiler checks for completeness. Visitor is still essential
to know (you'll find it throughout the JDK — annotation processing, compiler ASTs, older codebases) and
still the right call when the type hierarchy isn't sealed or spans multiple independent modules you don't
control. But if asked "how would you build this today," mentioning the sealed-types alternative — and
correctly identifying *why* it's often preferable now — is a strong, current signal.

> **Further resources**: [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design)
> and the GoF/Head First books, once more, plus: the sealed-types-vs-Visitor tradeoff above is exactly the
> kind of judgment call HelloInterview's problem writeups call out when it actually comes up in a design.
> Full curated list: [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

In `practice/`, package `com.lld.patterns.behavioral`. Different domain from every example above.

1. **`ShippingCostStrategy`** — 3 strategies (flat rate, weight-based, free-over-threshold) injected into
   an `Order` that computes shipping cost — same shape as `DiscountStrategy`, own domain.
2. **`StockTicker` (Observer)** — a `Stock` subject notifying multiple `PriceAlertObserver`s when price
   crosses a threshold each observer registered independently; include a `removeObserver` and a test that
   a removed observer stops receiving updates (proving you avoided the Lesson 0.2 leak shape).
3. **`TrafficLightState`** — Red/Yellow/Green states, each knowing only its own legal `next()`
   transition; a test driving it through a full cycle and asserting the sequence is exactly
   Red→Green→Yellow→Red.
4. **`TextEditorCommand`** — `Insert`/`Delete` commands with `execute()`/`undo()`, plus a history stack
   supporting multiple sequential undos (not just one) — verify the document's content after 3 commands
   and 2 undos matches hand-computed expected state.
5. **`SupportTicketChain`** — a chain of handlers by severity (`L1Handler` → `L2Handler` →
   `L3Handler`), each deciding independently whether it can resolve a ticket or must escalate; a test
   proving a high-severity ticket skips L1/L2 and lands on L3.
6. **`BinaryTreeIterator`** — a custom `Iterator<Integer>` doing in-order traversal of a small binary
   tree you build by hand (not using any JDK tree class) — usable in an enhanced for-loop.
7. **`AuctionMediator`** — bidders that never reference each other directly, coordinated through one
   `AuctionMediator` that broadcasts the current highest bid to all other registered bidders.
8. **`InvoiceLineVisitor`** — a small `sealed interface InvoiceLine permits Product, Discount, TaxLine`
   plus *two* visitors over it (`TotalVisitor`, `PrintVisitor`) proving you can add the second operation
   without touching the first visitor or any of the three line types. Then write a one-paragraph comment
   comparing this to solving the same problem with a `switch` over the sealed type instead (Lesson 0.4) —
   which would you actually choose here, and why.

This completes **Phase 2 — Design Patterns**. Next: **Phase 3 — Concurrency for LLD** (the applied
follow-up to Lesson 0.5's language mechanics — locks, concurrent collections, producer-consumer, thread
pools, used to design whole systems), then the practice problems in Phases 4-6, which will draw on
nearly every pattern from this lesson.

# Lesson 8 — Concurrency for LLD

Lesson 0.5 taught the language mechanics: what a race condition is, what `synchronized` actually does,
why deadlock happens. This lesson is the applied follow-up — taking those mechanics and using them to
answer the question an LLD interviewer actually asks: **"two requests hit this system at the same
instant — what happens, and how did you make sure of it?"**

Every practice problem from Phase 4 onward has a concurrency angle once you look for it: Parking Lot
("two cars grab the last spot"), BookMyShow ("two users select the same seat"), Rate Limiter ("the
counter under concurrent requests"), Splitwise ("two expenses settle the same balance simultaneously").
Being able to name *exactly* what's shared, *exactly* what could interleave, and *exactly* what you'd
lock — narrowly, not the whole system — is one of the clearest SDE2-vs-junior signals in the interview.

---

## 1. Finding the race in a design (not just fixing one you're handed)

### Beginner

The mechanical bug-finding move, every time: **find the shared mutable state, then find every place two
threads could touch it without coordination.**

```java
class ParkingLot {
    private int availableSpots = 100;

    boolean parkVehicle() {
        if (availableSpots > 0) {     // <-- check
            availableSpots--;         // <-- act
            return true;
        }
        return false;
    }
}
```
`availableSpots` is shared mutable state. `parkVehicle()` does a **check-then-act**: read the value,
decide based on it, then mutate it — three separate steps, exactly like `count++` in Lesson 0.5, just
with a branch in the middle. Two threads can both read `availableSpots == 1`, both decide "yes, room,"
both decrement — and now the lot thinks it has -1 spots free, or two vehicles were both told "yes" for
the one remaining space. This is the single most common concurrency bug shape in LLD interview problems:
**check-then-act on shared state**, not just bare increments.

### Going Further

#### The fix, traced at the right granularity

The naive fix — `synchronized` the whole method — works, but locks the *entire lot* for every single
park/leave, even when two cars are heading to two completely unrelated spots on opposite sides of the
building. That's correct but needlessly serializes everything, which is exactly the "lock granularity"
tradeoff named in Lesson 0.5:
```java
class ParkingLot {
    private final AtomicInteger availableSpots = new AtomicInteger(100);

    boolean parkVehicle() {
        return availableSpots.getAndUpdate(n -> n > 0 ? n - 1 : n) > 0;   // atomic check-then-act, one step
    }
}
```
This collapses check-then-act into a single atomic operation (Lesson 0.5's CAS mechanism) — no window
where another thread can interleave between the check and the act at all, and no explicit lock needed
for this specific piece of state.

**The realistic version locks per-resource, not per-count.** A real parking lot doesn't just track a
number — it tracks which *specific* spot each car is in, and "the last spot" is really "the last
available `ParkingSpot` object." The correct granularity is a lock (or an atomic compare-and-set) *on
each individual spot*, not on the whole lot:
```java
class ParkingSpot {
    private final AtomicBoolean occupied = new AtomicBoolean(false);
    boolean tryOccupy() { return occupied.compareAndSet(false, true); }   // atomic per-spot claim
}
class ParkingLot {
    private final List<ParkingSpot> spots;
    Optional<ParkingSpot> park() {
        return spots.stream().filter(ParkingSpot::tryOccupy).findFirst();   // each spot decides for itself
    }
}
```
Two threads racing for *different* spots now proceed fully in parallel — no contention at all, since each
`ParkingSpot`'s `AtomicBoolean` is independent state. Two threads racing for the *same* spot: exactly one
`compareAndSet` succeeds, atomically, and the other simply moves on to try the next spot. This is the
"lock the individual spot/seat, not the whole lot/theatre" principle named in Lesson 0.5, now applied
concretely — and it's exactly the reasoning interviewers want to hear for Parking Lot and BookMyShow.

---

## 2. `java.util.concurrent.locks`, beyond `synchronized`

### Beginner

`ReentrantLock` does what `synchronized` does, explicitly, as an object instead of a keyword:
```java
private final Lock lock = new ReentrantLock();

void criticalSection() {
    lock.lock();
    try {
        // ... protected work ...
    } finally {
        lock.unlock();     // ALWAYS in finally — an exception must not strand the lock held forever
    }
}
```

### Going Further

**What `ReentrantLock` gives you that `synchronized` can't**:
- **`tryLock(timeout)`** — attempt to acquire, give up after a timeout instead of blocking forever. This
  is the alternative deadlock fix named in Lesson 0.5: instead of consistent lock ordering, grab what you
  can, and back off-and-retry if you can't get everything you need in time.
- **Interruptible locking** (`lockInterruptibly()`) — a thread blocked waiting for the lock can be woken
  up and told to abort, instead of being stuck until the lock is free. Matters for cancellable
  operations (a request timeout, a shutdown signal).
- **Fairness** (`new ReentrantLock(true)`) — grants the lock to whichever waiting thread has been queued
  longest, preventing starvation, at a real throughput cost (the JVM's default unfair lock is faster
  precisely because it lets whichever thread happens to be running next just grab the lock).

**`ReadWriteLock` — for state that's read constantly and written rarely**:
```java
private final ReadWriteLock rwLock = new ReentrantReadWriteLock();

String read(String key) {
    rwLock.readLock().lock();
    try { return cache.get(key); } finally { rwLock.readLock().unlock(); }
}
void write(String key, String value) {
    rwLock.writeLock().lock();
    try { cache.put(key, value); } finally { rwLock.writeLock().unlock(); }
}
```
Multiple readers can hold the read lock **simultaneously** (reads don't conflict with each other); a
writer needs the write lock **exclusively** (blocks all readers and other writers). For a cache read far
more often than it's written — exactly the access pattern of a config store, a product catalog, a rate
limiter's rule set — this beats a plain `synchronized`/`ReentrantLock`, which would needlessly serialize
concurrent *reads* against each other even though reads never actually conflict.

#### `Semaphore` — limiting concurrent access to a fixed number of slots

A `ReentrantLock` grants access to exactly one thread at a time. A `Semaphore` generalizes this to N —
useful whenever a resource genuinely has a fixed number of interchangeable slots, not just one:
```java
private final Semaphore pool = new Semaphore(3);   // only 3 concurrent connections allowed

Connection borrow() throws InterruptedException {
    pool.acquire();          // blocks if all 3 permits are already taken
    return createOrReuseConnection();
}
void release(Connection c) {
    closeOrReturnToPool(c);
    pool.release();          // frees a permit for the next waiter
}
```
This is the mechanism behind connection pools, and behind any "only N of these at once" LLD requirement
— a fixed number of parking spots of a given type, a fixed number of concurrent elevator dispatch slots,
a rate limiter's concurrent-request cap. A `Semaphore(1)` behaves like a lock (mutual exclusion), which is
why a plain lock is sometimes described as "a semaphore with one permit" — but reach for a real
`Semaphore` the moment the count is genuinely greater than one.

#### Condition variables — waiting for a specific condition, not just a lock

Lesson 0.5's `BoundedBuffer` practice task used raw `wait()`/`notifyAll()` on an object's own monitor.
`java.util.concurrent.locks.Condition` is the same idea, modernized to pair with `ReentrantLock` instead
of `synchronized`:
```java
private final Lock lock = new ReentrantLock();
private final Condition notEmpty = lock.newCondition();
private final Queue<Task> queue = new ArrayDeque<>();

void put(Task t) {
    lock.lock();
    try {
        queue.add(t);
        notEmpty.signal();              // wake one waiter — equivalent to notify()
    } finally { lock.unlock(); }
}
Task take() throws InterruptedException {
    lock.lock();
    try {
        while (queue.isEmpty()) notEmpty.await();   // ALWAYS a while loop — same spurious-wakeup rule as 0.5
        return queue.poll();
    } finally { lock.unlock(); }
}
```
The advantage over a single object's `wait()`/`notifyAll()`: one `Lock` can own *multiple* `Condition`s,
each representing a different thing threads might be waiting for (`notEmpty`, `notFull`, one per priority
level, ...) — so you wake exactly the threads waiting on the condition that just became true, instead of
waking every waiter and making most of them immediately re-check and go back to sleep.

---

## 3. Concurrent collections, beyond `ConcurrentHashMap`

### Beginner

You met `ConcurrentHashMap` in Lesson 0.3/0.5. Two more come up constantly in LLD designs:

- **`CopyOnWriteArrayList`** — reads never block (they iterate a stable snapshot array); every *write*
  copies the entire underlying array. Correct for read-heavy, write-rare lists — the textbook example is
  Observer's list of subscribers (Lesson 7): registered rarely, iterated on every event.
- **`BlockingQueue`** — a queue where `put()` blocks if full and `take()` blocks if empty, with no manual
  `wait()`/`notify()` needed (you hand-built exactly this behavior in Lesson 0.5's `BoundedBuffer`
  practice task; this is the JDK doing it for you, correctly, in three lines).

### Going Further

**Why `CopyOnWriteArrayList` is wrong for a frequently-mutated list**: every single write is an O(n) full
array copy. Fine for a subscriber list that changes rarely and is read on every event; catastrophic for,
say, a shared task list that's mutated constantly — there, `ConcurrentHashMap`'s keySet or a properly
locked structure is the right call instead. Picking `CopyOnWriteArrayList` correctly is entirely about
the read:write ratio, not a default choice.

**`BlockingQueue` implementations, and when each is the right pick**:
- `ArrayBlockingQueue` — fixed capacity, backed by an array. Use when you want to bound memory and apply
  real backpressure (producers genuinely block/slow down once the queue is full) — the standard choice
  for a bounded work queue in front of a thread pool.
- `LinkedBlockingQueue` — optionally unbounded (or bounded, your choice). Higher throughput under
  contention than `ArrayBlockingQueue` (separate locks for head/tail), but an *unbounded* one can grow
  without limit if producers outpace consumers — a real memory-exhaustion risk if you don't cap it.
- `PriorityBlockingQueue` — unbounded, orders elements by a `Comparator` instead of FIFO. The natural
  choice whenever "process the most urgent thing next" is a requirement (a ride-matching queue prioritized
  by wait time, a task scheduler by priority).

---

## 4. Producer-consumer, the real version

### Beginner

The pattern from Lesson 0.5, now built the way you'd actually build it in a design:
```java
class OrderProcessingPipeline {
    private final BlockingQueue<Order> queue = new ArrayBlockingQueue<>(1000);
    private final ExecutorService workers = Executors.newFixedThreadPool(4);

    void submit(Order order) throws InterruptedException {
        queue.put(order);                      // producer: blocks if the queue is full (backpressure)
    }

    void startWorkers() {
        for (int i = 0; i < 4; i++) {
            workers.submit(() -> {
                while (!Thread.currentThread().isInterrupted()) {
                    try {
                        Order order = queue.take();   // consumer: blocks if the queue is empty
                        process(order);
                    } catch (InterruptedException e) {
                        Thread.currentThread().interrupt();
                        break;
                    }
                }
            });
        }
    }
    private void process(Order order) { /* ... */ }
}
```

### Going Further

**Why this shape recurs across so many LLD problems**: it decouples the *rate* work arrives from the
*rate* it's processed — exactly the requirement behind a notification dispatch system (Phase 6), a ride
request matcher, a ticket-booking queue under a flash-sale spike, or any "requests can burst faster than
we can handle them" scenario. The bounded queue (`ArrayBlockingQueue`, above) is what gives you real
**backpressure** — once it's full, `put()` blocks the producer, which is a deliberate design choice
("slow down the producer") rather than letting an unbounded queue balloon memory until the process falls
over. Naming that tradeoff explicitly — bounded queue + backpressure vs. unbounded queue + risk of memory
exhaustion — is a strong answer to "what happens if producers outpace consumers?"

---

## 5. Thread pools, sized correctly

### Beginner

```java
ExecutorService fixed = Executors.newFixedThreadPool(4);      // N threads, bounded, reused
ExecutorService cached = Executors.newCachedThreadPool();     // grows/shrinks, unbounded — risky under load
ExecutorService scheduled = Executors.newScheduledThreadPool(2);  // for delayed/periodic tasks
```
A thread pool exists to reuse a fixed set of expensive threads (Lesson 0.5: ~1MB stack each) instead of
spawning a new one per task.

### Going Further

**Sizing is not a guess — it follows directly from what the work actually is**:
- **CPU-bound work** (hashing, compression, sorting) — more threads than CPU cores just adds context-
  switching overhead with no benefit. Size roughly to `Runtime.getRuntime().availableProcessors()`.
- **I/O-bound work** (waiting on a database, an HTTP call, a disk read) — the thread spends most of its
  time *blocked*, not computing, so you can run far more threads than cores; a common starting formula is
  `cores * (1 + waitTime/computeTime)`. This is also exactly the situation **virtual threads** (Lesson
  0.5) are designed for — for blocking I/O-bound work specifically, a virtual-thread-per-task executor
  sidesteps the sizing question almost entirely, since virtual threads are cheap enough to create in the
  millions.

**`Executors.newCachedThreadPool()` is a well-known production footgun**: it's *unbounded* — under a
sudden burst of tasks, it will happily spin up thousands of threads, each with real memory/scheduling
cost, until the system falls over. In an interview, prefer explicitly constructing a
`ThreadPoolExecutor` with a bounded pool size *and* a bounded work queue *and* an explicit
**rejection policy** — what happens when both the pool and its queue are full is a design decision you
should be making on purpose (reject and signal "system busy," block the caller, or drop the oldest
queued task), not something you leave to a default.

**Always shut a pool down deliberately**: `shutdown()` (finish queued work, then stop) vs.
`shutdownNow()` (attempt to stop immediately, interrupting running tasks) — an un-shut-down
`ExecutorService` holding non-daemon threads will keep the JVM alive indefinitely, exactly the
"unremoved listener"-shaped leak from Lesson 0.2, just with threads instead of objects.

---

## 6. A concurrency checklist for LLD interviews

When an interviewer says "now make this thread-safe" (they usually will), run this in order:

1. **Name the shared mutable state precisely.** Not "the system" — the specific field(s).
2. **Name the operation that isn't atomic.** Usually a check-then-act (Section 1) or a multi-field update
   that must happen together.
3. **Pick the narrowest fix that's still correct** — an atomic class/CAS for a single field; a lock
   scoped to the individual resource (one spot, one seat, one account) rather than the whole collection;
   `ReadWriteLock` if reads dominate; immutability (Lesson 0.5) if the state doesn't need to change after
   construction at all — that's always worth checking first, since it needs no synchronization whatsoever.
4. **Say what happens under contention**, explicitly: does the loser of a race get `false`/an exception
   (fail fast — usually right for "claim the last seat"), or should it block and wait (right for a queue
   feeding a fixed set of workers)?
5. **Check for deadlock** the moment more than one lock is held at once, and state your ordering
   discipline out loud.

**A complementary framing, useful when you're stuck on step 1**: almost every LLD concurrency problem is
one of three shapes — **Correctness** (multiple threads must not corrupt shared state — the check-then-act
races this lesson opened with), **Coordination** (threads must wait for and signal each other about
specific conditions — the `Condition`/producer-consumer material above), or **Scarcity** (a limited
number of interchangeable resources must be shared safely — `Semaphore`, connection pools, bounded thread
pools). Naming which shape you're facing narrows the fix immediately: Correctness problems want an atomic
op or a narrow lock; Coordination problems want a `Condition`/`BlockingQueue`; Scarcity problems want a
`Semaphore` or a bounded pool. Most real problems are a combination — Movie Ticket Booking is Correctness
(don't double-book a seat) *and* Coordination (a hold expires and must signal release); Rate Limiter is
almost pure Scarcity.

> **Further resources**: this is where LLD and HLD prep overlap — ByteByteGo and HelloInterview's
> system-design guides both cover concurrency/locking at the design level, complementing the JVM-level
> mechanics from Lesson 0.5 and the applied version here. Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

---

## Your practice task

In `practice/`, package `com.lld.concurrency.lld`. Each of these is a miniature of a real Phase 4-6
problem — treat them that way.

1. **`ConcurrentParkingLot`** — a lot of N spots, `park()` claiming the first available spot atomically
   (per-spot `AtomicBoolean` or `compareAndSet`, not a lot-wide lock), `leave(spot)` freeing it. Stress
   test: many threads racing to park when spots are nearly exhausted — assert the number of successful
   parks never exceeds N and no two threads ever hold the same spot.
2. **`SeatBookingCache`** — a `ReadWriteLock`-protected seat map for a showtime: many threads reading
   seat availability, occasional threads booking (writing). Test that concurrent reads don't block each
   other (time them) while a write is correctly exclusive.
3. **`BoundedTaskQueue`** — wrap an `ArrayBlockingQueue` + a fixed `ExecutorService` into a small
   producer-consumer pipeline (like `OrderProcessingPipeline` above, your own domain). Prove backpressure:
   with a slow consumer and a full queue, a producer's `put()` genuinely blocks rather than the queue
   growing unbounded.
4. **`RateLimiterCounter`** — a fixed-window rate limiter (N requests per second) using an atomic counter
   reset on a timer; stress test with concurrent callers and assert the count of *accepted* requests
   within one window never exceeds N even under heavy concurrent load.
5. Tests for all of the above using `ExecutorService` + `awaitTermination`, following the pattern from
   Lesson 0.5 — no test asserting an *unsafe* version fails (still non-deterministic by construction);
   assert only the invariant that must always hold (never oversold, never exceeds N, etc.).

This completes **Phase 3**. Everything from here — Phases 4 through 6 — is applying Phases 0-3 to full
practice problems, following the RCFD framework from the README for each one.

# Phase 4 — Practice Problems: Easy

Everything from here on is different in kind from Lessons 0.1 through 8. Those taught concepts; these are
full practice problems, meant to be worked the way a real interview works: read the prompt, run the RCFD
framework yourself (Requirements → Core Entities → Flows/API → Design Details — see the README), sketch a
class diagram (Lesson 3), pick patterns where they actually earn their keep (Phase 2), and write the code
in `practice/`.

**What these briefs give you, on purpose**: a Requirements section (the way an interviewer would actually
state the problem), and light hints toward entities/patterns so you're not starting from a completely
blank page. **What they deliberately don't give you**: the class diagram, the method signatures, or the
code — figuring those out yourself *is* the exercise now. This is a real shift from Phases 0-2, where
practice tasks spelled out almost every class — that was appropriate for learning a technique for the
first time; it stops being appropriate the moment the goal is practicing the *whole* design process.

Six problems: **Parking Lot**, **Vending Machine**, **ATM**, **Library Management System**, **Tic Tac
Toe**, **Amazon Locker**.

> **Further resources**: HelloInterview's free guides work through several of these exact problems
> end-to-end — good to compare against *after* you've attempted your own design, not before. For live
> practice once you're comfortable: Pramp/Exponent (free peer mocks). Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

Each problem below ends with an **Interview Walkthrough** — how the reference solution in `solutions/`
was actually built, narrated the way it would unfold live: clarifying questions first, then which
interface gets written before which class, in what order, and why, then the follow-up/extension
questions an interviewer typically asks once the base design works. This is spoiler content — it reveals
the design. Attempt the problem yourself first; read the walkthrough to check your reasoning against it
afterward, not as a starting point.
