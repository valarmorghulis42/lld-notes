<script type="text/markdown" id="md-09-1-parking-lot">
# Parking Lot
*Amazon, Microsoft — one of the most common LLD prompts at both.*

**Time-box**: ~2h.

## Requirements
- A lot has multiple levels; each level has parking spots of different types (motorcycle, compact,
  large). Vehicles have types too, and a vehicle can only park in a spot type it's compatible with
  (define this rule explicitly — e.g., a motorcycle can use any spot, a large vehicle needs a large spot).
- Entering the lot issues a ticket recording the assigned spot and entry time.
- Exiting computes a fee from the ticket (duration × a rate that can depend on vehicle/spot type) and
  frees the spot.
- Support querying how many spots of each type are currently available.
- **Non-functional**: the design must stay correct under concurrent entries near capacity (two vehicles
  requesting the last compatible spot at once), and must be easy to extend with a new vehicle type or a
  new pricing scheme without editing unrelated code.
- **Out of scope**: reservations made in advance, multiple payment methods, routing vehicles to a
  specific entrance.

## Where to start
Core entities to identify: think about what a `Level` actually owns versus what the `ParkingLot` owns,
and where the vehicle/spot compatibility rule should live (on the vehicle? the spot? a separate
resolver?) so that adding a new vehicle type later doesn't mean editing existing classes. Pricing that
varies by vehicle type and duration is a strong Strategy candidate (Phase 2, Lesson 5's "Your rule of
thumb" for when the lightweight lambda-based Strategy suffices vs. a named class). For the concurrency
requirement, this is close to identical to **Lesson 8's `ConcurrentParkingLot` practice task** — if you
built that already, the core "claim a spot atomically, per-spot, not lot-wide" reasoning transfers
directly; if you haven't, do that exercise first or alongside this one.

## Common pitfalls
Putting spot-compatibility logic as a chain of `if (vehicle instanceof ...)` inside `ParkingLot` instead
of on the types themselves (an OCP violation the moment a new vehicle type shows up); a single pricing
`if/else` instead of an injected strategy; designing the happy path and only bolting on concurrency as an
afterthought when asked, rather than choosing a spot-claiming mechanism that's correct from the start.

## Your task
In `practice/`, package `com.lld.problems.parkinglot`. Write your RCFD notes first (a short markdown file
alongside your code, or just organize your thinking before coding), then implement it with tests covering:
normal park/leave, a spot-type mismatch being rejected, the lot correctly reporting availability, fee
calculation for at least two different durations/vehicle types, and a concurrent stress test proving no
two vehicles are ever assigned the same spot.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/parkinglot/`.*

**Clarifying questions, before writing anything**: How many levels, and do spot types vary by level or
are they uniform? What vehicle types, and what's the compatibility rule (can a motorcycle use a car
spot)? Does pricing vary by vehicle/spot type and duration, or is it flat? Is single-threaded correctness
enough for a first pass, with concurrency as an explicit follow-up? What should a full lot do — reject
entry, or is that out of scope?

**Build order** (each step only needs what came before it to already compile):
1. `SpotType`, `VehicleType` — the vocabulary. Put the compatibility rule *on* `VehicleType`
   (`fitsIn(SpotType)`) rather than as a switch inside the lot — say out loud that this is the OCP call:
   a new vehicle type is one new enum constant, not an edit to `ParkingLot`.
2. `Vehicle`, `ParkingSpot` — the two things the compatibility rule connects. Write
   `ParkingSpot.isAvailableFor(Vehicle)` here to prove step 1's design actually composes.
3. `Ticket` — a plain record. Write it before `ParkingLot` because `park()`'s return type needs it to
   exist first.
4. `PricingStrategy` as an **interface**, the moment the prompt says pricing varies — not a method on
   `ParkingLot`. This is the sentence to say out loud: "I'll make this a Strategy so a new pricing scheme
   never touches the lot itself."
5. `ParkingLot` last. By now every dependency compiles, so writing it is just wiring: loop spots, ask
   each one, issue a ticket. If this class feels complicated to write, that's a signal a lower layer's
   interface wasn't quite right — go back, don't push complexity forward.
6. **Concurrency is a deliberate final pass, not baked in from line one.** Get single-threaded
   correctness working first. Then explicitly ask "where's the race" (Lesson 8) and swap a plain
   `boolean occupied` for `AtomicReference<Vehicle>` + `compareAndSet`. Doing it in this order mirrors how
   the actual interview conversation goes — correctness, then "now make it thread-safe" as a follow-up,
   not a simultaneous first draft.

**Extensions an interviewer asks next, and the answer**:
- *"Add reserved/VIP spots?"* — new `SpotType` constant + a small reservation check; the lot's loop
  doesn't change.
- *"First-hour-free promo?"* — a new `PricingStrategy` that wraps the base one (Decorator, Lesson 6)
  rather than an `if` inside the existing strategy.
- *"Scale to 10,000 spots across many lots?"* — index spots by type (`Map<SpotType, Queue<ParkingSpot>>`)
  instead of a flat linear scan; flag that this is where LLD starts blurring into HLD.

## Solution Code

*Full source lives in `solutions/.../problems/parkinglot/` — shown below in build order, one file at a time.*

**`SpotType.java`**

```java
package com.lld.problems.parkinglot;

public enum SpotType {
    MOTORCYCLE, COMPACT, LARGE
}
```

**`VehicleType.java`**

```java
package com.lld.problems.parkinglot;

/**
 * Compatibility lives on the vehicle side (Lesson 1: OCP) — a new vehicle type
 * declares what it fits into without ParkingLot needing an if/else chain.
 */
public enum VehicleType {
    MOTORCYCLE {
        @Override
        public boolean fitsIn(SpotType spotType) {
            return true; // a motorcycle can use any spot
        }
    },
    CAR {
        @Override
        public boolean fitsIn(SpotType spotType) {
            return spotType == SpotType.COMPACT || spotType == SpotType.LARGE;
        }
    },
    TRUCK {
        @Override
        public boolean fitsIn(SpotType spotType) {
            return spotType == SpotType.LARGE;
        }
    };

    public abstract boolean fitsIn(SpotType spotType);
}
```

**`Vehicle.java`**

```java
package com.lld.problems.parkinglot;

public record Vehicle(String licensePlate, VehicleType type) {
    public Vehicle {
        if (licensePlate == null || licensePlate.isBlank()) {
            throw new IllegalArgumentException("licensePlate must not be blank");
        }
    }
}
```

**`ParkingSpot.java`**

```java
package com.lld.problems.parkinglot;

import java.util.concurrent.atomic.AtomicReference;

/**
 * Claiming is atomic per-spot (Lesson 8, Section 1) — not a lot-wide lock.
 * Two threads racing for the same spot: exactly one compareAndSet succeeds.
 */
public class ParkingSpot {

    private final String id;
    private final SpotType type;
    private final AtomicReference<Vehicle> occupant = new AtomicReference<>();

    public ParkingSpot(String id, SpotType type) {
        this.id = id;
        this.type = type;
    }

    public String getId() {
        return id;
    }

    public SpotType getType() {
        return type;
    }

    public boolean isFree() {
        return occupant.get() == null;
    }

    public boolean isAvailableFor(Vehicle vehicle) {
        return isFree() && vehicle.type().fitsIn(type);
    }

    boolean tryClaim(Vehicle vehicle) {
        return occupant.compareAndSet(null, vehicle);
    }

    void vacate() {
        occupant.set(null);
    }
}
```

**`Level.java`**

```java
package com.lld.problems.parkinglot;

import java.util.List;

public class Level {

    private final int number;
    private final List<ParkingSpot> spots;

    public Level(int number, List<ParkingSpot> spots) {
        this.number = number;
        this.spots = List.copyOf(spots);
    }

    public int getNumber() {
        return number;
    }

    public List<ParkingSpot> getSpots() {
        return spots;
    }
}
```

package com.lld.problems.parkinglot;

import java.time.Instant;
import java.util.UUID;

public record Ticket(String id, ParkingSpot spot, Vehicle vehicle, Instant entryTime) {

    public static Ticket issue(ParkingSpot spot, Vehicle vehicle, Instant entryTime) {
        return new Ticket(UUID.randomUUID().toString(), spot, vehicle, entryTime);
    }
}
```

**`PricingStrategy.java`**

```java
package com.lld.problems.parkinglot;

import java.time.Duration;
import java.time.Instant;

/** Strategy (Lesson 5): pricing varies by spot/vehicle type and duration, injected. */
public interface PricingStrategy {
    double calculateFee(Ticket ticket, Instant exitTime);

    default Duration duration(Ticket ticket, Instant exitTime) {
        return Duration.between(ticket.entryTime(), exitTime);
    }
}
```

**`HourlyRatePricingStrategy.java`**

```java
package com.lld.problems.parkinglot;

import java.time.Instant;
import java.util.Map;

public class HourlyRatePricingStrategy implements PricingStrategy {

    private static final Map<SpotType, Double> HOURLY_RATE = Map.of(
            SpotType.MOTORCYCLE, 1.0,
            SpotType.COMPACT, 2.0,
            SpotType.LARGE, 3.0
    );

    @Override
    public double calculateFee(Ticket ticket, Instant exitTime) {
        double hours = Math.max(1, Math.ceil(duration(ticket, exitTime).toMinutes() / 60.0));
        return hours * HOURLY_RATE.get(ticket.spot().getType());
    }
}
```

**`ParkingLot.java`**

```java
package com.lld.problems.parkinglot;

import java.time.Instant;
import java.util.List;
import java.util.Map;
import java.util.Optional;
import java.util.concurrent.ConcurrentHashMap;

public class ParkingLot {

    private final List<Level> levels;
    private final PricingStrategy pricingStrategy;
    private final Map<String, Ticket> activeTickets = new ConcurrentHashMap<>();

    public ParkingLot(List<Level> levels, PricingStrategy pricingStrategy) {
        this.levels = List.copyOf(levels);
        this.pricingStrategy = pricingStrategy;
    }

    /** Loops and retries tryClaim on failure — isAvailableFor is just a cheap pre-filter. */
    public Optional<Ticket> park(Vehicle vehicle, Instant entryTime) {
        for (Level level : levels) {
            for (ParkingSpot spot : level.getSpots()) {
                if (spot.isAvailableFor(vehicle) && spot.tryClaim(vehicle)) {
                    Ticket ticket = Ticket.issue(spot, vehicle, entryTime);
                    activeTickets.put(ticket.id(), ticket);
                    return Optional.of(ticket);
                }
            }
        }
        return Optional.empty();
    }

    public double leave(Ticket ticket, Instant exitTime) {
        if (activeTickets.remove(ticket.id()) == null) {
            throw new IllegalStateException("ticket not active: " + ticket.id());
        }
        ticket.spot().vacate();
        return pricingStrategy.calculateFee(ticket, exitTime);
    }

    public long availableSpots(SpotType type) {
        return levels.stream()
                .flatMap(l -> l.getSpots().stream())
                .filter(s -> s.getType() == type)
                .filter(ParkingSpot::isFree)
                .count();
    }
}
```

<script type="text/markdown" id="md-09-2-vending-machine">
# Vending Machine
*Amazon, Microsoft.*

**Time-box**: ~2h.

## Requirements
- The machine stocks multiple products, each with a price and a remaining count.
- A user inserts money (assume discrete coin/note denominations), selects a product, and the machine
  either dispenses the product and returns change, or explains why it can't (insufficient funds, out of
  stock, invalid selection).
- A user can cancel before selecting, getting back everything they inserted.
- An operator can restock a product and adjust prices.
- **Out of scope**: card payments, selecting a quantity greater than one per transaction, demand
  forecasting/auto-reordering.

## Where to start
This problem exists almost entirely to practice one pattern well: the machine's behavior — what's a
legal action right now — genuinely changes based on where it is in its own lifecycle (no money inserted
yet, money inserted, dispensing, out of stock), which is exactly the shape Lesson 7's **State** pattern
was built for. Before writing any code, sketch the state machine as a Mermaid `stateDiagram-v2` (Lesson
3) — what are the legal transitions, and what triggers each one? If you find yourself writing
`if (currentState == IDLE)` checks scattered across multiple methods instead of one class per state, stop
and revisit the pattern.

## Common pitfalls
Modeling state as an enum checked with `if`/`switch` in every method instead of the actual State pattern
(the difference is real, not just stylistic — see Lesson 7's State section); forgetting the cancel/refund
path entirely; conflating "is this selection valid" (product exists, in stock) with "can we dispense
right now" (do we also have enough change to give back) — these are different checks that can fail
independently.

## Your task
In `practice/`, package `com.lld.problems.vendingmachine`. Implement the state machine as actual State
pattern classes, not conditionals. Tests: successful purchase with correct change; insufficient funds
rejected with the right message; out-of-stock rejected even with sufficient funds; cancel mid-transaction
refunds exactly what was inserted; restocking updates availability correctly.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/vendingmachine/`.*

**Clarifying questions**: Are coin/note denominations relevant, or is "insert money" just a total amount?
Can a product be out of stock independently of the machine's own state (yes — this distinction matters,
see below)? Does inserting money after already having a partial balance accumulate, or replace? What
exactly happens on cancel — instant refund, or a separate "collect refund" step?

**Build order**:
1. Sketch the state machine as a diagram *before any code* (Lesson 3): Idle → (insert money) → HasMoney →
   (valid selection) → dispense → back to Idle; HasMoney → (cancel) → Idle. This diagram *is* the
   `VendingMachineState` interface's method list — each arrow becomes a method.
2. `Product`, `Inventory` — the data the state logic will act on, with zero behavior of their own yet.
3. The exception types (`InsufficientFundsException`, `OutOfStockException`) *before* the states that
   throw them — naming the failure modes up front keeps the state classes themselves simple.
4. `VendingMachineState` interface, then `IdleState`. Write only the transitions Idle actually allows;
   everything else throws `IllegalStateException` — this is the point to say "the type of exception itself
   documents which rule was broken."
5. `HasMoneyState` — the one state with real logic. Notice the *order* of checks inside
   `selectProduct`: stock is checked before funds, deliberately, because "out of stock" must reject even
   with enough money — say this out loud, it's exactly the kind of edge case an interviewer plants on
   purpose.
6. `VendingMachine` last — a thin shell holding `state` and delegating every public method to it. If this
   class has any `if` statements in it, a transition rule leaked out of the state classes.

**Extensions**:
- *"Support card payments too?"* — a `PaymentMethod` Strategy that `insertMoney`-equivalent delegates to;
  states don't change.
- *"Multiple machine instances share one restock feed?"* — `Inventory` becomes the shared, thread-safe
  unit (`ConcurrentHashMap`-backed counts); `VendingMachine`/state classes stay single-machine.
- *"What if two people could interact with one machine concurrently?"* — note that this doesn't really
  happen physically (one keypad), so the honest answer is "this design assumes one session at a time by
  construction" rather than adding unnecessary locking.

## Solution Code

*Full source lives in `solutions/.../problems/vendingmachine/` — shown below in build order, one file at a time.*

**`Product.java`**

```java
package com.lld.problems.vendingmachine;

public record Product(String sku, String name, int priceCents) {
    public Product {
        if (sku == null || sku.isBlank()) throw new IllegalArgumentException("sku must not be blank");
        if (priceCents <= 0) throw new IllegalArgumentException("priceCents must be positive");
    }
}
```

**`Inventory.java`**

```java
package com.lld.problems.vendingmachine;

import java.util.HashMap;
import java.util.Map;
import java.util.Optional;

public class Inventory {

    private final Map<String, Product> catalog = new HashMap<>();
    private final Map<String, Integer> stock = new HashMap<>();

    public void addProduct(Product product, int quantity) {
        catalog.put(product.sku(), product);
        stock.merge(product.sku(), quantity, Integer::sum);
    }

    public Optional<Product> findProduct(String sku) {
        return Optional.ofNullable(catalog.get(sku));
    }

    public int stockOf(String sku) {
        return stock.getOrDefault(sku, 0);
    }

    void decrementStock(String sku) {
        stock.computeIfPresent(sku, (k, qty) -> qty - 1);
    }
}
```

**`DispenseResult.java`**

public record DispenseResult(Product product, int changeCents) {
}

}

**`VendingMachineState.java`**

```java
package com.lld.problems.vendingmachine;

/**
 * State (Lesson 7): each state knows only its own legal transitions. The
 * machine has zero conditional logic about what's currently allowed.
 */
interface VendingMachineState {
    void insertMoney(VendingMachine machine, int cents);

    DispenseResult selectProduct(VendingMachine machine, String sku);

    int cancel(VendingMachine machine);
}
```

**`IdleState.java`**

```java
package com.lld.problems.vendingmachine;

final class IdleState implements VendingMachineState {

    static final IdleState INSTANCE = new IdleState();

    private IdleState() {
    }

    @Override
    public void insertMoney(VendingMachine machine, int cents) {
        if (cents <= 0) {
            throw new IllegalArgumentException("cents must be positive");
        }
        machine.addBalance(cents);
        machine.setState(HasMoneyState.INSTANCE);
    }

    @Override
    public DispenseResult selectProduct(VendingMachine machine, String sku) {
        throw new IllegalStateException("insert money before selecting a product");
    }

    @Override
    public int cancel(VendingMachine machine) {
        throw new IllegalStateException("nothing to cancel");
    }
}
```

**`HasMoneyState.java`**

```java
package com.lld.problems.vendingmachine;

final class HasMoneyState implements VendingMachineState {

    static final HasMoneyState INSTANCE = new HasMoneyState();

    private HasMoneyState() {
    }

    @Override
    public void insertMoney(VendingMachine machine, int cents) {
        if (cents <= 0) {
            throw new IllegalArgumentException("cents must be positive");
        }
        machine.addBalance(cents); // stays in HasMoney
    }

    @Override
    public DispenseResult selectProduct(VendingMachine machine, String sku) {
        Product product = machine.getInventory().findProduct(sku)
                .orElseThrow(() -> new IllegalArgumentException("no such product: " + sku));

        // Stock and funds are independent checks — out-of-stock fails even with enough money.
        if (machine.getInventory().stockOf(sku) <= 0) {
            throw new OutOfStockException(product.name() + " is out of stock");
        }
        if (machine.getBalance() < product.priceCents()) {
            throw new InsufficientFundsException(
                    "need " + product.priceCents() + " cents, have " + machine.getBalance());
        }

        int change = machine.getBalance() - product.priceCents();
        machine.getInventory().decrementStock(sku);
        machine.resetBalance();
        machine.setState(IdleState.INSTANCE);
        return new DispenseResult(product, change);
    }

    @Override
    public int cancel(VendingMachine machine) {
        int refund = machine.refundAndReset();
        machine.setState(IdleState.INSTANCE);
        return refund;
    }
}
```

**`VendingMachine.java`**

```java
package com.lld.problems.vendingmachine;

public class VendingMachine {

    private final Inventory inventory;
    private VendingMachineState state = IdleState.INSTANCE;
    private int balanceCents;

    public VendingMachine(Inventory inventory) {
        this.inventory = inventory;
    }

    public void insertMoney(int cents) {
        state.insertMoney(this, cents);
    }

    public DispenseResult selectProduct(String sku) {
        return state.selectProduct(this, sku);
    }

    public int cancel() {
        return state.cancel(this);
    }

    public int getBalanceCents() {
        return balanceCents;
    }

    Inventory getInventory() {
        return inventory;
    }

    int getBalance() {
        return balanceCents;
    }

    void addBalance(int cents) {
        balanceCents += cents;
    }

    void resetBalance() {
        balanceCents = 0;
    }

    int refundAndReset() {
        int refund = balanceCents;
        balanceCents = 0;
        return refund;
    }

    void setState(VendingMachineState state) {
        this.state = state;
    }
}
```

<script type="text/markdown" id="md-09-3-atm">
# ATM
*Amazon, Microsoft, Walmart.*

**Time-box**: ~2h.

## Requirements
- Card + PIN authentication against an account service (simulate this — don't build real security).
- Balance inquiry, withdrawal, deposit. Withdrawal must respect the account's own rules.
- The **machine itself** has a limited cash inventory by denomination (e.g., only so many $20s, $50s,
  $100s) — a withdrawal must be rejected if the machine physically cannot dispense the requested amount
  with the denominations it currently holds, *even if the account balance is sufficient*. Figure out how
  the machine decides which denominations to dispense.
- **Non-functional**: a withdrawal must not debit the account if dispensing then fails partway (or the
  reverse) — think about what "atomic" means here even without a real database transaction. Two
  concurrent withdrawals against the *same* account must not both succeed if only one can be covered.
- **Out of scope**: check/cash deposits requiring physical validation, multi-currency, fraud detection.

## Where to start
Don't rebuild the account rules from scratch — this problem is designed to sit directly on top of
**Lesson 1's `Account`/`SavingsAccount`/`CurrentAccount` hierarchy**. Reuse it (or your own version of it
from `practice/`) rather than re-deriving minimum-balance/overdraft logic here; the point of this problem
is everything *around* the account (the machine's own cash state, the session flow, the atomicity), not
re-solving Lesson 1. The denomination-dispensing decision is a small algorithm problem wearing an LLD
costume — think about greedy-largest-first and when it can fail to find a valid combination even though
one exists. The session itself (not authenticated → authenticated → selecting an operation → dispensing)
is another State candidate, same as the vending machine.

## Common pitfalls
Re-implementing account withdrawal rules instead of reusing Lesson 1's hierarchy; checking only the
account balance and forgetting the machine's own physical cash constraint entirely; not being able to
explain, out loud, what happens to the account balance if the cash dispenser jams mid-dispense.

## Your task
In `practice/`, package `com.lld.problems.atm`. Reuse your Lesson 1 `Account` hierarchy (copy or import
it). Tests: successful withdrawal debits correctly and reduces machine cash by the right denominations;
withdrawal rejected when account rules forbid it (ties to Lesson 1's existing tests); withdrawal rejected
when the *machine* can't make the amount even though the account could cover it; a concurrent test where
two threads both attempt to withdraw the account's entire balance simultaneously — exactly one should
succeed.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/atm/`.*

**Clarifying questions**: Can I reuse an existing account abstraction, or should the ATM own account
logic itself? (Say explicitly: "I built an `Account` hierarchy in an earlier design — I'll reuse it
rather than re-derive withdrawal rules here.") What denominations does the machine stock, and must the
dispensed amount be exact? What should happen if the account debits successfully but the machine then
can't physically dispense the cash — is a partial failure acceptable, or must it be all-or-nothing?

**Build order**:
1. `InsufficientCashException` first — naming the machine-side failure mode before writing the class that
   throws it, same habit as the vending machine.
2. `CashDispenser` — and specifically, write `dispense(amount)` as a single atomic operation that either
   fully succeeds or throws with **zero mutation**, not a `canDispense()` check followed by a separate
   `dispense()` call. This is the important design decision to narrate: two separate calls is exactly the
   check-then-act race from Lesson 8 — if a second machine-user's request interleaves between your check
   and your dispense, the check's answer is stale. One atomic method removes the gap entirely.
3. `WithdrawalResult` — a plain record, written before `ATM` for the same reason as `Ticket` in Parking
   Lot: `ATM.withdraw`'s return type needs it to exist.
4. `ATM.withdraw` last, and **narrate the ordering decision explicitly** — it's the crux of this
   problem: debit the account first (it's the one operation with no non-mutating "check first" option
   available), then attempt to dispense; if dispensing then fails, run a compensating transaction
   (deposit the amount back) rather than leave the account and the machine's cash inconsistent. Say the
   words "compensating transaction" — it signals you've thought about partial-failure atomicity, not just
   the happy path.
5. Concurrency, again as an explicit final pass: wrap the debit-then-dispense sequence in
   `synchronized(account)`, and explain *why* the lock is on the account object specifically — `Account`
   itself has no internal synchronization (it predates the concurrency material), so every ATM-mediated
   access to a given account has to be serialized from the outside.

**Extensions**:
- *"Support deposits too?"* — `Account.deposit()` already exists; add a `CashDispenser.accept(...)`
  counterpart that increments counts instead of decrementing them.
- *"Multiple ATMs sharing one bank's accounts?"* — the `synchronized(account)` approach stops being
  sufficient the moment two separate ATM processes (not just threads in one JVM) can touch the same
  account — flag that this needs a database-level lock or optimistic concurrency control instead, which
  is a legitimate "this is where LLD hits a real infrastructure boundary" answer.
- *"What if the greedy dispense algorithm fails but a valid combination exists?"* — name the tradeoff
  directly (a DP-based exact-change solver always finds a valid combination if one exists, at the cost of
  more code) and let the interviewer tell you whether they want you to implement it or just discuss it.

## Solution Code

*Full source lives in `solutions/.../problems/atm/` — shown below in build order, one file at a time.*

**`WithdrawalResult.java`**

```java
package com.lld.problems.atm;

import java.util.Map;

public record WithdrawalResult(int amount, Map<Integer, Integer> denominationsDispensed) {
}
```

**`InsufficientCashException.java`**

```java
package com.lld.problems.atm;

public class InsufficientCashException extends RuntimeException {
    public InsufficientCashException(String message) {
        super(message);
    }
}
```

**`CashDispenser.java`**

```java
package com.lld.problems.atm;

import java.util.Comparator;
import java.util.LinkedHashMap;
import java.util.Map;
import java.util.NavigableMap;
import java.util.TreeMap;

/**
 * Tracks the machine's own physical cash, separately from any account's
 * balance. Dispensing must be exact — a greedy largest-denomination-first
 * plan, which is simple but NOT always optimal: it can fail to find a valid
 * combination that exists (e.g. denominations {100, 60}, amount 120 — greedy
 * takes one 100, can't make the remaining 20 from 60s, even though 60+60=120
 * works). canDispense()/dispense() are each atomic — dispense() re-derives
 * and re-checks the plan itself rather than trusting an earlier canDispense()
 * call, so two threads can never both "pass the check" and then both mutate.
 */
public class CashDispenser {

    private final NavigableMap<Integer, Integer> counts;

    public CashDispenser(Map<Integer, Integer> initialCounts) {
        this.counts = new TreeMap<>(Comparator.reverseOrder());
        this.counts.putAll(initialCounts);
    }

    public synchronized boolean canDispense(int amount) {
        return planDispense(amount) != null;
    }

    /** Atomic: either dispenses the full amount and mutates counts, or throws with zero mutation. */
    public synchronized Map<Integer, Integer> dispense(int amount) {
        Map<Integer, Integer> plan = planDispense(amount);
        if (plan == null) {
            throw new InsufficientCashException(
                    "cannot dispense " + amount + " with the denominations currently in the machine");
        }
        plan.forEach((denom, qty) -> counts.merge(denom, -qty, Integer::sum));
        return plan;
    }

    public synchronized int countOf(int denomination) {
        return counts.getOrDefault(denomination, 0);
    }

    private Map<Integer, Integer> planDispense(int amount) {
        Map<Integer, Integer> plan = new LinkedHashMap<>();
        int remaining = amount;
        for (Map.Entry<Integer, Integer> entry : counts.entrySet()) {
            int denom = entry.getKey();
            int available = entry.getValue();
            int use = Math.min(available, remaining / denom);
            if (use > 0) {
                plan.put(denom, use);
                remaining -= use * denom;
            }
        }
        return remaining == 0 ? plan : null;
    }
}
```

**`ATM.java`**

```java
package com.lld.problems.atm;

import com.lld.foundations.oop.bank.Account;

/**
 * Deliberately reuses Lesson 1's Account hierarchy rather than re-deriving
 * withdrawal rules here — this problem is about everything AROUND the
 * account (machine cash, atomicity, concurrency), not the account itself.
 */
public class ATM {

    private final CashDispenser dispenser;

    public ATM(CashDispenser dispenser) {
        this.dispenser = dispenser;
    }

    /**
     * Account.withdraw() has no non-mutating "can I withdraw" check, so the
     * only safe order is: debit first (mutates, may throw per account
     * rules), then dispense (atomic on the dispenser, may throw if the
     * machine can't make the amount). If dispensing fails AFTER a successful
     * debit, we run a compensating transaction (deposit the amount back)
     * rather than leave the account and the machine's cash inconsistent —
     * this is exactly the atomicity requirement the problem brief asks
     * you to think through.
     *
     * synchronized(account): Account itself has no internal locking
     * (Lesson 1 predates Phase 3's concurrency material), so every
     * ATM-mediated access to a given account is serialized here instead —
     * this is what makes two concurrent withdrawals against the SAME
     * account safe.
     */
    public WithdrawalResult withdraw(Account account, double amount) {
        if (amount <= 0 || amount != Math.floor(amount)) {
            throw new IllegalArgumentException("amount must be a positive whole number");
        }
        int amountUnits = (int) amount;

        synchronized (account) {
            account.withdraw(amount); // may throw IllegalStateException per account rules
            try {
                var notes = dispenser.dispense(amountUnits);
                return new WithdrawalResult(amountUnits, notes);
            } catch (InsufficientCashException e) {
                account.deposit(amount); // compensating transaction: undo the debit
                throw e;
            }
        }
    }
}
```

<script type="text/markdown" id="md-09-4-library-management">
# Library Management System
*General OOD warm-up — less concurrency-focused, more about getting entity relationships right.*

**Time-box**: ~2h.

## Requirements
- A catalog of books (title, author, ISBN); the library holds *multiple physical copies* of some titles.
- Members can search the catalog, check out an available copy, return it, and renew a loan (with a limit
  on renewals and a due date).
- If every copy of a title is checked out, a member can place a hold; when a copy is returned, the next
  member on the hold list should be notified it's available for them.
- A librarian can add/remove books and manage members.
- **Out of scope**: multi-branch transfers, digital/ebook lending, actually processing fine payments
  (just track that a fine is owed).

## Where to start
The single most-tested distinction in this problem: **a `Book` (the catalog entry — one per ISBN, with a
title/author) is not the same thing as a physical copy of it** (there are, say, 3 physical copies of one
`Book`, and it's a specific copy that gets checked out, not "the book" as a concept). Get this distinction
wrong and checkout/return logic gets confused about what's actually available. The hold-notification
requirement ("tell the next waiting member when a copy frees up") is a direct fit for Lesson 7's
**Observer** — a returned copy is the subject, waiting members are observers.

## Common pitfalls
Modeling "3 copies available" as just an integer counter on `Book` instead of real objects representing
each physical copy (this breaks the moment you need to track *which specific copy* a member has, for
returns/renewals/damage); putting hold-notification logic as a manual check-every-return-for-holds loop
instead of Observer.

## Your task
In `practice/`, package `com.lld.problems.library`. Model `Book` and its copies as distinct types. Tests:
checkout reduces available copies and fails when none are available; return makes a copy available again
and triggers a hold notification to the correct waiting member (in the correct order — first hold placed,
first served); renewal respects a max-renewals limit; a member exceeding a max-checked-out-books limit is
blocked from further checkouts.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/library/`.*

**Clarifying questions**: Can one title have multiple physical copies? (If yes — and it usually is —
that's the whole design, ask it first.) Is there a limit on how many books a member can hold at once, or
on renewals? When a copy returns and someone's holding, does it auto-checkout to them or just notify them
it's available? Do holds need to be strictly FIFO, or is any order acceptable?

**Build order**:
1. `Book` and `BookCopy` as two separate types, immediately — this is the one modeling decision that
   determines whether the rest of the design is clean or tangled. Say out loud: "a Book is the catalog
   entry, one per ISBN; a BookCopy is a specific physical item — checkout operates on a copy, search
   operates on a book." Getting this backwards (one `Book` with a mutable copy-count integer) is the
   single most common mistake in this exact problem.
2. `Member`, `Loan` — plain data, no behavior. `Loan` as an immutable record with a `renew()` that returns
   a *new* `Loan` (same immutability habit as `Circle`/`Money` back in Lesson 1).
3. `HoldNotificationObserver` interface — written before `Library` itself, the moment the prompt mentions
   "notify the next member." Naming this Observer *before* writing the notification logic keeps `Library`
   from ever knowing what a notification actually does (email, push, log — doesn't matter to it).
4. `Library.checkout` — the simplest flow, so build and test it first, in isolation, before adding holds.
5. `Library.placeHold` / `returnCopy` together — because `returnCopy`'s hold-notification logic is
   meaningless to test until `placeHold` exists to populate the queue. Use an `ArrayDeque` for the
   per-title hold queue specifically because FIFO order (`pollFirst`) is a stated requirement.
6. `renew` last — it's the most isolated method (touches only one `Loan`), so there's no reason to build
   it earlier just because it's simple.

**Extensions**:
- *"Auto-checkout to the next hold instead of just notifying?"* — change `returnCopy`'s notification call
  into a `checkout`-on-their-behalf call; the Observer interface doesn't need to change, just what the one
  registered observer implementation does with the callback.
- *"Multiple branches sharing a catalog?"* — `Book` stays branch-agnostic; `BookCopy` gains a
  `branchId`; `checkout` needs a branch parameter. Small, contained change — a sign the original split
  was right.
- *"What if two members' checkout requests race for the last copy?"* — note explicitly that this problem
  was scoped as not concurrency-focused, but if asked to extend it, the fix is identical to Parking Lot's:
  make `BookCopy.tryCheckout()` atomic (`AtomicBoolean.compareAndSet`) instead of a plain boolean check.

## Solution Code

*Full source lives in `solutions/.../problems/library/` — shown below in build order, one file at a time.*

**`Book.java`**

```java
package com.lld.problems.library;

/** The catalog entry — one per ISBN. Not the same thing as a physical copy (see BookCopy). */
public record Book(String isbn, String title, String author) {
    public Book {
        if (isbn == null || isbn.isBlank()) throw new IllegalArgumentException("isbn must not be blank");
    }
}
```

**`BookCopy.java`**

```java
package com.lld.problems.library;

/** A specific physical copy of a Book. A title with 3 copies has 3 of these, 1 Book. */
public class BookCopy {

    private final String copyId;
    private final String isbn;
    private boolean available = true;

    public BookCopy(String copyId, String isbn) {
        this.copyId = copyId;
        this.isbn = isbn;
    }

    public String getCopyId() {
        return copyId;
    }

    public String getIsbn() {
        return isbn;
    }

    public boolean isAvailable() {
        return available;
    }

    boolean tryCheckout() {
        if (!available) return false;
        available = false;
        return true;
    }

    void markAvailable() {
        available = true;
    }
}
```

**`Member.java`**

```java
package com.lld.problems.library;

public record Member(String id, String name) {
}
```

**`Loan.java`**

```java
package com.lld.problems.library;

import java.time.LocalDate;

public record Loan(String copyId, String memberId, LocalDate checkoutDate, LocalDate dueDate, int renewalCount) {

    public static Loan start(String copyId, String memberId, LocalDate today, int loanDays) {
        return new Loan(copyId, memberId, today, today.plusDays(loanDays), 0);
    }

    public Loan renew(int loanDays) {
        return new Loan(copyId, memberId, checkoutDate, dueDate.plusDays(loanDays), renewalCount + 1);
    }
}
```

**`HoldNotificationObserver.java`**

```java
package com.lld.problems.library;

/** Observer (Lesson 7): notified when a copy a member is waiting on becomes available. */
public interface HoldNotificationObserver {
    void onHoldAvailable(Member member, Book book);
}
```

**`Library.java`**

```java
package com.lld.problems.library;

import java.time.LocalDate;
import java.util.ArrayDeque;
import java.util.ArrayList;
import java.util.Deque;
import java.util.HashMap;
import java.util.List;
import java.util.Map;
import java.util.Optional;

public class Library {

    private static final int LOAN_DAYS = 14;

    private final int maxBooksPerMember;
    private final int maxRenewals;

    private final Map<String, Book> catalog = new HashMap<>();
    private final Map<String, List<BookCopy>> copiesByIsbn = new HashMap<>();
    private final Map<String, Loan> activeLoansByCopyId = new HashMap<>();
    private final Map<String, Deque<Member>> holdQueueByIsbn = new HashMap<>();
    private final Map<String, Integer> checkedOutCountByMember = new HashMap<>();
    private final List<HoldNotificationObserver> observers = new ArrayList<>();

    public Library(int maxBooksPerMember, int maxRenewals) {
        this.maxBooksPerMember = maxBooksPerMember;
        this.maxRenewals = maxRenewals;
    }

    public void addObserver(HoldNotificationObserver observer) {
        observers.add(observer);
    }

    public void addBookWithCopies(Book book, int copyCount) {
        catalog.put(book.isbn(), book);
        List<BookCopy> copies = new ArrayList<>();
        for (int i = 0; i < copyCount; i++) {
            copies.add(new BookCopy(book.isbn() + "-copy-" + i, book.isbn()));
        }
        copiesByIsbn.put(book.isbn(), copies);
    }

    public Optional<Loan> checkout(Member member, String isbn) {
        int current = checkedOutCountByMember.getOrDefault(member.id(), 0);
        if (current >= maxBooksPerMember) {
            throw new IllegalStateException("member has reached the max checked-out books limit");
        }
        for (BookCopy copy : copiesByIsbn.getOrDefault(isbn, List.of())) {
            if (copy.tryCheckout()) {
                Loan loan = Loan.start(copy.getCopyId(), member.id(), LocalDate.now(), LOAN_DAYS);
                activeLoansByCopyId.put(copy.getCopyId(), loan);
                checkedOutCountByMember.merge(member.id(), 1, Integer::sum);
                return Optional.of(loan);
            }
        }
        return Optional.empty(); // no copy available — caller may placeHold
    }

    public void placeHold(Member member, String isbn) {
        holdQueueByIsbn.computeIfAbsent(isbn, k -> new ArrayDeque<>()).addLast(member);
    }

    public void returnCopy(String copyId) {
        Loan loan = activeLoansByCopyId.remove(copyId);
        if (loan == null) {
            throw new IllegalStateException("no active loan for copy " + copyId);
        }
        checkedOutCountByMember.merge(loan.memberId(), -1, Integer::sum);

        BookCopy copy = findCopy(copyId);
        copy.markAvailable();

        Deque<Member> queue = holdQueueByIsbn.get(copy.getIsbn());
        if (queue != null && !queue.isEmpty()) {
            Member next = queue.pollFirst(); // FIFO: first hold placed, first served
            Book book = catalog.get(copy.getIsbn());
            observers.forEach(o -> o.onHoldAvailable(next, book));
        }
    }

    public Loan renew(String copyId) {
        Loan loan = activeLoansByCopyId.get(copyId);
        if (loan == null) {
            throw new IllegalStateException("no active loan for copy " + copyId);
        }
        if (loan.renewalCount() >= maxRenewals) {
            throw new IllegalStateException("max renewals reached for this loan");
        }
        Loan renewed = loan.renew(LOAN_DAYS);
        activeLoansByCopyId.put(copyId, renewed);
        return renewed;
    }

    public int availableCopies(String isbn) {
        return (int) copiesByIsbn.getOrDefault(isbn, List.of()).stream().filter(BookCopy::isAvailable).count();
    }

    private BookCopy findCopy(String copyId) {
        return copiesByIsbn.values().stream()
                .flatMap(List::stream)
                .filter(c -> c.getCopyId().equals(copyId))
                .findFirst()
                .orElseThrow(() -> new IllegalArgumentException("no such copy: " + copyId));
    }
}
```

<script type="text/markdown" id="md-09-5-tic-tac-toe">
# Tic Tac Toe
*Google, Microsoft — a quick one, useful as a state-machine + algorithm-in-OOP warm-up.*

**Time-box**: ~1.5h.

## Requirements
- An N×N board (not hardcoded to 3×3 — generalize), two players alternating turns.
- Detect a win (a full row, column, or either diagonal of the same symbol) and detect a draw.
- Support resetting/replaying a game.
- **Non-functional**: win detection should not require rescanning the entire board after every move —
  there's an O(1)-per-move approach; find it.
- **Out of scope**: an AI opponent, networked multiplayer.

## Where to start
The generalization to N×N is the actual point of this exercise (a hardcoded 3×3 checker is the "junior"
version). Think about what running totals you could maintain incrementally, per row/column/diagonal, that
let you answer "did this move win the game" in constant time without looking at any other cell on the
board.

## Common pitfalls
Rescanning the whole board for a winner after every move (works, but it's the answer that signals you
stopped at "correct" instead of "correct and efficient"); hardcoding board size or win-length instead of
parameterizing them.

## Your task
In `practice/`, package `com.lld.problems.tictactoe`. Implement the O(1)-per-move win check. Tests: wins
detected on a row, a column, and both diagonals; a full board with no winner is correctly a draw; an
attempt to play an already-occupied cell is rejected; the design works correctly for at least one board
size other than 3×3 (e.g., 4×4) without code changes beyond a constructor parameter.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/tictactoe/`.*

**Clarifying questions**: Fixed 3×3, or should the board size be configurable? (Ask this even if the
prompt says "tic-tac-toe" plainly — it's the signal the interviewer is listening for.) Two players only,
or should the design allow more? Is there any reason to care about performance here, or is a naive
rescan-the-board check acceptable for a first pass?

**Build order** — this one is small enough that the order itself *is* the lesson:
1. `Player` enum first, with `other()` for turn alternation baked in as a method rather than an `if` the
   caller writes every time.
2. `GameResult` — a tiny value type (status + optional winner) written *before* `Board`, because
   `Board.play()`'s return type needs to exist first, same habit as `Ticket` and `WithdrawalResult` in
   the earlier problems in this phase.
3. `Board.play()` — and this is the one method worth building in two explicit passes even within a
   single sitting: **first** write it with a naive full-board rescan to confirm the win/draw logic is
   correct at all; **only then** replace the rescan with the row/column/diagonal running-total trick.
   Doing the naive version first, out loud, is a legitimate interview move — "let me get this correct,
   then make it O(1)" is a stronger sequence than trying to write the optimized version from a blank
   page and fumbling the diagonal-index arithmetic under pressure.
4. `Game` last — pure orchestration (whose turn, is the game already over), zero win-detection logic of
   its own. If `Game` needs to know anything about rows or diagonals, that logic leaked out of `Board`.

**Extensions**:
- *"Support more than 2 players?"* — the +1/-1 delta trick is 2-player-specific; generalize to per-player
  counters (`Map<Player, int[]>` for rows/cols/diagonals) instead of a single signed total.
- *"What's the win condition for a board where you don't need a *full* row, just K in a row (like
  Connect Four)?"* — the running-total trick stops working directly; this becomes a genuinely different
  algorithm (sliding-window or DP over each line) — naming that it's a different problem, not a small
  tweak, is the correct answer.
- *"Add an AI opponent?"* — out of scope for this exercise, but the honest one-line answer is minimax
  with alpha-beta pruning for a solved game this small.

## Solution Code

*Full source lives in `solutions/.../problems/tictactoe/` — shown below in build order, one file at a time.*

**`Player.java`**

```java
package com.lld.problems.tictactoe;

public enum Player {
    X('X'), O('O');

    private final char symbol;

    Player(char symbol) {
        this.symbol = symbol;
    }

    public char symbol() {
        return symbol;
    }

    public Player other() {
        return this == X ? O : X;
    }
}
```

**`GameResult.java`**

```java
package com.lld.problems.tictactoe;

public record GameResult(Status status, Player winner) {

    public enum Status { IN_PROGRESS, WIN, DRAW }

    public static GameResult inProgress() {
        return new GameResult(Status.IN_PROGRESS, null);
    }

    public static GameResult win(Player winner) {
        return new GameResult(Status.WIN, winner);
    }

    public static GameResult draw() {
        return new GameResult(Status.DRAW, null);
    }
}
```

**`Board.java`**

```java
package com.lld.problems.tictactoe;

/**
 * O(1)-per-move win detection: running +1/-1 deltas per row, column, and both
 * diagonals, instead of rescanning the whole board after every move.
 */
public class Board {

    private final int size;
    private final Player[][] grid;
    private final int[] rowTotals;
    private final int[] colTotals;
    private int diagonalTotal;
    private int antiDiagonalTotal;
    private int movesMade;

    public Board(int size) {
        if (size < 3) {
            throw new IllegalArgumentException("size must be at least 3");
        }
        this.size = size;
        this.grid = new Player[size][size];
        this.rowTotals = new int[size];
        this.colTotals = new int[size];
    }

    public GameResult play(int row, int col, Player player) {
        if (row < 0 || row >= size || col < 0 || col >= size) {
            throw new IllegalArgumentException("cell out of bounds: (" + row + "," + col + ")");
        }
        if (grid[row][col] != null) {
            throw new IllegalStateException("cell already occupied: (" + row + "," + col + ")");
        }

        grid[row][col] = player;
        int delta = player == Player.X ? 1 : -1;
        rowTotals[row] += delta;
        colTotals[col] += delta;
        if (row == col) {
            diagonalTotal += delta;
        }
        if (row + col == size - 1) {
            antiDiagonalTotal += delta;
        }
        movesMade++;

        if (Math.abs(rowTotals[row]) == size || Math.abs(colTotals[col]) == size
                || Math.abs(diagonalTotal) == size || Math.abs(antiDiagonalTotal) == size) {
            return GameResult.win(player);
        }
        if (movesMade == size * size) {
            return GameResult.draw();
        }
        return GameResult.inProgress();
    }

    public int size() {
        return size;
    }
}
```

**`Game.java`**

```java
package com.lld.problems.tictactoe;

public class Game {

    private final Board board;
    private Player current = Player.X;
    private GameResult result = GameResult.inProgress();

    public Game(int size) {
        this.board = new Board(size);
    }

    public GameResult play(int row, int col) {
        if (result.status() != GameResult.Status.IN_PROGRESS) {
            throw new IllegalStateException("game is already over");
        }
        result = board.play(row, col, current);
        current = current.other();
        return result;
    }

    public GameResult currentResult() {
        return result;
    }
}
```

<script type="text/markdown" id="md-09-6-amazon-locker">
# Amazon Locker
*Amazon — this one surfaced directly out of the resource audit: it appears in two of the top researched
LLD resources' problem sets, and is a genuinely common Amazon-specific prompt given your target list.*

**Time-box**: ~2h.

## Requirements
- A bank of lockers at a pickup location, in different sizes (small/medium/large).
- When a package arrives, assign it to the smallest available locker that fits it, and generate a
  one-time access code for the recipient.
- The recipient enters the code at the locker's keypad to open it and retrieve the package; the locker
  becomes available again once opened and emptied.
- A package not picked up within a configured window should be flagged (decide exactly what "expired"
  triggers — a notification is enough for this exercise).
- **Non-functional**: correct under concurrent package arrivals near capacity (two packages competing for
  the last medium locker at once); access codes must not collide or be guessable.
- **Out of scope**: real hardware/keypad integration, courier routing, multi-location lockers.

## Where to start
Structurally close to **Parking Lot** — a bank of typed slots, size/package compatibility matching, and
the identical "claim the last available slot atomically" concurrency shape from **Lesson 8**. The
genuinely new part is the access-code lifecycle: a code is generated once, tied to exactly one
(locker, package) assignment, and must be invalidated the moment it's used or the package expires — model
this as its own small State machine (assigned → picked-up / expired) layered on top of the locker's own
occupied/free state.

## Common pitfalls
Treating size matching as "find any free locker" instead of "find the *smallest* free locker that fits"
(wastes space in oversized lockers otherwise); repeating Parking Lot's `if/else`-chain mistake for size
compatibility instead of a clean comparison; generating access codes predictably (sequential, or from a
small fixed set) instead of cryptographically random.

## Your task
In `practice/`, package `com.lld.problems.amazonlocker`. Tests: a package is assigned to the smallest
fitting available locker; a concurrent stress test proves no two packages are ever assigned the same
locker; an incorrect access code is rejected; a correct code opens the locker exactly once (reusing it
fails); an expired, unpicked-up package is correctly flagged.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/amazonlocker/`.*

**Clarifying questions**: How many locker sizes, and can a package of a given size go in a larger locker
(yes — this is the same compatibility-direction question as Parking Lot, just size-ranked instead of
type-matched)? Does the recipient identify themselves by tracking ID, by walking up to a specific locker
number, or both? What happens on expiry — does the package get pulled by staff, or is "flag it" (a
notification) enough for this exercise?

**Build order**:
1. `LockerSize` with a `fits(LockerSize)` method, immediately — same OCP move as `VehicleType.fitsIn` in
   Parking Lot, and worth saying explicitly: "this is the same compatibility pattern from Parking Lot,
   just size-ranked instead of type-matched" — recognizing your own earlier work out loud is a genuine
   interview signal, not just efficient.
2. `Package` — trivial data, written only so the next step has something to accept.
3. `LockerAssignment` *before* `Locker` — deliberately the opposite dependency order from Parking Lot's
   `Ticket`/`ParkingSpot`, because here the assignment is what carries the state machine
   (`ASSIGNED`/`PICKED_UP`/`EXPIRED`) and the interesting validation logic (`tryPickUp`) — writing it
   first forces you to decide the state machine's shape before wiring it into a locker.
4. `Locker` — the atomic-claim shape, copied directly from `ParkingSpot`
   (`AtomicReference<LockerAssignment>` + `compareAndSet`). At this point in the phase you should be
   pattern-matching against your own earlier code, not re-deriving atomic claiming from scratch a third
   time.
5. `LockerBank` last, and specifically use `SecureRandom` for the access code the moment you write
   `generateAccessCode()` — not `java.util.Random`, which is seeded predictably and is explicitly the
   wrong choice for anything security-adjacent. Say why: `Random` is fine for a game's dice roll, wrong
   for a code that gates physical access.

**Extensions**:
- *"Text the recipient the code automatically?"* — this is Observer again (Lesson 7): `LockerBank`
  publishes a "package assigned" event; an `SmsNotifier` (or reuse Lesson 2's `NotificationChannel`
  directly) subscribes, without `LockerBank` knowing anything about SMS.
- *"What if a package needs refrigeration and only some lockers support it?"* — add a
  `Set<LockerFeature>` requirement on `Package` and a matching set on `Locker`; `dropOff`'s filter
  predicate gains one more condition, everything else is unchanged — a sign the original design was
  extensible in the right place.
- *"Multiple locker banks across a city, one app?"* — `LockerBank` becomes one unit among many behind a
  routing layer that picks *which* bank based on the recipient's delivery address; flag that this is
  where the problem starts needing real geospatial lookup (HLD territory), same boundary noted for Ride
  Sharing later in this curriculum.

---

Next: **Phase 5 — Practice Problems: Medium**.

## Solution Code

*Full source lives in `solutions/.../problems/amazonlocker/` — shown below in build order, one file at a time.*

**`LockerSize.java`**

```java
package com.lld.problems.amazonlocker;

public enum LockerSize {
    SMALL(1), MEDIUM(2), LARGE(3);

    private final int rank;

    LockerSize(int rank) {
        this.rank = rank;
    }

    /** A package fits a locker of this size or any larger one. */
    public boolean fits(LockerSize lockerSize) {
        return this.rank <= lockerSize.rank;
    }
}
```

**`Package.java`**

```java
package com.lld.problems.amazonlocker;

public record Package(String trackingId, LockerSize size) {
}
```

**`LockerAssignment.java`**

```java
package com.lld.problems.amazonlocker;

import java.time.Duration;
import java.time.Instant;

/**
 * Its own small State machine layered on top of the locker's own free/occupied
 * state: ASSIGNED -> PICKED_UP (via a correct code) or -> EXPIRED (via time).
 */
public class LockerAssignment {

    public enum Status { ASSIGNED, PICKED_UP, EXPIRED }

    private final String accessCode;
    private final Package pkg;
    private final Locker locker;
    private final Instant assignedAt;
    private final Duration pickupWindow;
    private Status status = Status.ASSIGNED;

    LockerAssignment(String accessCode, Package pkg, Locker locker, Instant assignedAt, Duration pickupWindow) {
        this.accessCode = accessCode;
        this.pkg = pkg;
        this.locker = locker;
        this.assignedAt = assignedAt;
        this.pickupWindow = pickupWindow;
    }

    public String getAccessCode() {
        return accessCode;
    }

    public Package getPackage() {
        return pkg;
    }

    public synchronized Status getStatus() {
        return status;
    }

    /** Invalidates on first successful use — a code can never open a locker twice. */
    synchronized boolean tryPickUp(String enteredCode, Instant now) {
        if (status != Status.ASSIGNED) {
            return false; // already picked up, or already flagged expired
        }
        if (isExpired(now)) {
            status = Status.EXPIRED;
            return false;
        }
        if (!accessCode.equals(enteredCode)) {
            return false; // wrong code — do not mutate state
        }
        status = Status.PICKED_UP;
        locker.vacate();
        return true;
    }

    synchronized boolean checkExpiry(Instant now) {
        if (status == Status.ASSIGNED && isExpired(now)) {
            status = Status.EXPIRED;
            return true;
        }
        return false;
    }

    private boolean isExpired(Instant now) {
        return now.isAfter(assignedAt.plus(pickupWindow));
    }
}
```

**`Locker.java`**

```java
package com.lld.problems.amazonlocker;

import java.util.concurrent.atomic.AtomicReference;

public class Locker {

    private final String id;
    private final LockerSize size;
    private final AtomicReference<LockerAssignment> currentAssignment = new AtomicReference<>();

    public Locker(String id, LockerSize size) {
        this.id = id;
        this.size = size;
    }

    public String getId() {
        return id;
    }

    public LockerSize getSize() {
        return size;
    }

    public boolean isFree() {
        return currentAssignment.get() == null;
    }

    public LockerAssignment getCurrentAssignment() {
        return currentAssignment.get();
    }

    /** Atomic per-locker claim — same shape as ParkingSpot.tryClaim (Lesson 8). */
    boolean tryAssign(LockerAssignment assignment) {
        return currentAssignment.compareAndSet(null, assignment);
    }

    void vacate() {
        currentAssignment.set(null);
    }
}
```

**`LockerBank.java`**

```java
package com.lld.problems.amazonlocker;

import java.security.SecureRandom;
import java.time.Duration;
import java.time.Instant;
import java.util.Comparator;
import java.util.List;
import java.util.Optional;

public class LockerBank {

    private final List<Locker> lockersBySizeAscending;
    private final Duration pickupWindow;
    private final SecureRandom random = new SecureRandom();

    public LockerBank(List<Locker> lockers, Duration pickupWindow) {
        this.lockersBySizeAscending = lockers.stream()
                .sorted(Comparator.comparing(Locker::getSize))
                .toList();
        this.pickupWindow = pickupWindow;
    }

    /** Smallest fitting AVAILABLE locker — not just "any" fitting locker. */
    public Optional<LockerAssignment> dropOff(Package pkg, Instant now) {
        for (Locker locker : lockersBySizeAscending) {
            if (pkg.size().fits(locker.getSize()) && locker.isFree()) {
                String code = generateAccessCode();
                LockerAssignment assignment = new LockerAssignment(code, pkg, locker, now, pickupWindow);
                if (locker.tryAssign(assignment)) {
                    return Optional.of(assignment);
                }
                // lost the race for this specific locker — keep scanning, don't fail outright
            }
        }
        return Optional.empty();
    }

    public boolean pickUp(String lockerId, String code, Instant now) {
        Locker locker = findLocker(lockerId);
        LockerAssignment assignment = locker.getCurrentAssignment();
        if (assignment == null) {
            return false;
        }
        return assignment.tryPickUp(code, now);
    }

    /** Sweeps all currently-occupied lockers for assignments past their pickup window. */
    public List<Package> flagExpired(Instant now) {
        return lockersBySizeAscending.stream()
                .map(Locker::getCurrentAssignment)
                .filter(a -> a != null && a.checkExpiry(now))
                .map(LockerAssignment::getPackage)
                .toList();
    }

    private Locker findLocker(String lockerId) {
        return lockersBySizeAscending.stream()
                .filter(l -> l.getId().equals(lockerId))
                .findFirst()
                .orElseThrow(() -> new IllegalArgumentException("no such locker: " + lockerId));
    }

    private String generateAccessCode() {
        return String.format("%06d", random.nextInt(1_000_000)); // SecureRandom — not guessable
    }
}
```

# Phase 5 — Practice Problems: Medium

Same format as Phase 4: Requirements stated like an interviewer would state them, light hints, no
solutions. These six lean harder on Phase 2's patterns and Phase 3's concurrency than the easy tier did —
by this point you should be reaching for a pattern because the problem's shape calls for it, not because
a hint told you to.

Six problems: **LRU/LFU Cache**, **Rate Limiter**, **Elevator System**, **Logging Framework**, **Chess**,
**Snake and Ladder**.

> **Further resources**: [ashishps1/awesome-low-level-design](https://github.com/ashishps1/awesome-low-level-design)
> and HelloInterview both include LRU Cache and Rate Limiter as worked problems — useful for comparing
> your O(1) approach against once you've built your own. Full curated list:
> [Reference — India Company Tiers & Resources](#12-company-tiers-and-resources).

Each problem ends with an **Interview Walkthrough** (same convention as Phase 4) — spoiler content

<script type="text/markdown" id="md-10-1-lru-lfu-cache">
# LRU / LFU Cache
*Near-universal — Amazon/Google/Microsoft favorite, and a strong signal of data-structure fluency.*

**Time-box**: ~2.5h.

## Requirements
- Fixed capacity `get(key)` / `put(key, value)` cache.
- **LRU**: when full, evict the least-recently-used entry. Both `get` and `put` count as a "use."
- Extend the same design to **LFU**: evict the least-*frequently*-used entry; break ties between equally
  frequent entries by least-recently-used.
- **Non-functional, and the entire point of the exercise**: both `get` and `put` must run in **O(1)**
  time, not O(n) and not O(log n).
- **Out of scope**: distributed/multi-node caching, persistence, TTL-based expiry (a reasonable follow-up
  to mention, not required to build).

## Where to start
This one is closer to Lesson 0.1's data-structure territory than to a GoF pattern — no pattern hint will
substitute for knowing the actual mechanism. The O(1) requirement is the trap: a `TreeMap` or
`PriorityQueue` feels like "handles ordering," but both are O(log n). Think about what combination of a
hash map (O(1) lookup) and a structure that supports O(1) reordering (moving an entry to the "most
recent" end without shifting anything else) gets you there for LRU — and for LFU, think about grouping
keys by their current frequency count rather than sorting by it.

## Common pitfalls
Reaching for a sorted structure and accepting O(log n) as "close enough" (it isn't, for this problem);
forgetting that `put` on an **already-existing** key must both update its value *and* count as a use
(reset its recency/frequency); for LFU specifically, forgetting the recency tie-break among equally
frequent keys.

## Your task
In `practice/`, package `com.lld.problems.lrucache`. Implement LRU first with true O(1) `get`/`put`
(verify with a timing-based sanity check, not just correctness), then LFU. Tests: eviction order is
exactly right for both (construct a sequence of operations by hand and assert the exact eviction);
updating an existing key doesn't evict it; capacity of 0 or 1 behaves sensibly.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/lrucache/`.*

**Clarifying questions**: Fixed capacity decided at construction, or resizable later? Does a `put` on an
already-full cache with an already-existing key count as an eviction risk, or is it just an update (it's
just an update — worth confirming out loud, since it changes the eviction-order test cases)? Is thread
safety in scope, or single-threaded for this pass?

**Build order**:
1. A shared `Cache<K,V>` interface (`get`/`put`/`size`) *before* either implementation — the moment the
   prompt says "then extend it to LFU," that's the signal both eviction policies are one interchangeable
   thing (Strategy, at the type level), not two unrelated classes.
2. `LRUCache`, and specifically its two internal pieces in this order: the doubly-linked list mechanics
   (`addToFront`/`removeNode`/`moveToFront`) first, tested informally in your head against a small example
   *before* wiring the `HashMap` index on top — the linked-list bookkeeping is where off-by-one bugs
   actually happen, and it's easier to get right in isolation than tangled up with map lookups from the
   start. `get()` before `put()`, since `put()`'s eviction path reuses the same `removeNode` logic `get()`
   doesn't need yet.
3. `LFUCache` last, reusing the finished, tested `Cache` interface. The one new data structure this needs
   — `Map<Integer, LinkedHashSet<K>>` frequency buckets — is worth explaining *why* a `LinkedHashSet` and
   not a plain `HashSet`: insertion order inside one bucket is exactly the LRU tie-break the requirements
   ask for, so choosing that specific collection type quietly satisfies half the spec for free.
4. `minFreq` tracking is the detail worth narrating last: it only ever needs to *decrease* (to 1, on any
   new insert) or *increase by exactly 1* (when the current min-frequency bucket empties out) — it never
   needs a full rescan to find the new minimum, which is precisely what keeps eviction O(1).

**Extensions**:
- *"Add TTL-based expiry?"* — a `Map<K, Instant>` of expiry times, checked lazily on `get`/`put` rather
  than a background sweeper thread for a first pass; mention the sweeper as the production alternative.
- *"Make it thread-safe?"* — direct callback to Lesson 8: wrap the whole cache in one coarse lock first
  (correct, simple), then discuss whether finer-grained locking is worth the complexity given the
  linked-list mutations touch shared structure on almost every operation — this is a case where "the
  narrowest fix" (Lesson 8's checklist) is arguably still a single lock, and saying so is the sophisticated
  answer, not a cop-out.
- *"What if two keys should never evict each other (pinned entries)?"* — add a `pin(key)` that excludes a
  key from both the linked list and the frequency buckets' eviction candidacy; a good moment to note it
  complicates the O(1) guarantee if not modeled carefully (a pinned key still needs O(1) unpin-and-reinsert).

## Solution Code

*Full source lives in `solutions/.../problems/lrucache/` — shown below in build order, one file at a time.*

**`Cache.java`**

```java
package com.lld.problems.lrucache;

import java.util.Optional;

public interface Cache<K, V> {
    Optional<V> get(K key);

    void put(K key, V value);

    int size();
}
```

**`LRUCache.java`**

```java
package com.lld.problems.lrucache;

import java.util.HashMap;
import java.util.Map;
import java.util.Optional;

/**
 * True O(1) get/put: a HashMap for lookup + a doubly linked list for O(1)
 * reordering, instead of a sorted structure (O(log n)) or a linear scan for
 * the oldest entry (O(n)).
 */
public class LRUCache<K, V> implements Cache<K, V> {

    private static final class Node<K, V> {
        K key;
        V value;
        Node<K, V> prev;
        Node<K, V> next;

        Node(K key, V value) {
            this.key = key;
            this.value = value;
        }
    }

    private final int capacity;
    private final Map<K, Node<K, V>> index = new HashMap<>();
    private final Node<K, V> head = new Node<>(null, null); // dummy — head.next is most-recently-used
    private final Node<K, V> tail = new Node<>(null, null); // dummy — tail.prev is least-recently-used

    public LRUCache(int capacity) {
        if (capacity <= 0) {
            throw new IllegalArgumentException("capacity must be at least 1");
        }
        this.capacity = capacity;
        head.next = tail;
        tail.prev = head;
    }

    @Override
    public Optional<V> get(K key) {
        Node<K, V> node = index.get(key);
        if (node == null) {
            return Optional.empty();
        }
        moveToFront(node);
        return Optional.of(node.value);
    }

    @Override
    public void put(K key, V value) {
        Node<K, V> existing = index.get(key);
        if (existing != null) {
            existing.value = value; // updating an existing key counts as a use
            moveToFront(existing);
            return;
        }
        if (index.size() == capacity) {
            Node<K, V> lru = tail.prev;
            removeNode(lru);
            index.remove(lru.key);
        }
        Node<K, V> node = new Node<>(key, value);
        addToFront(node);
        index.put(key, node);
    }

    @Override
    public int size() {
        return index.size();
    }

    private void moveToFront(Node<K, V> node) {
        removeNode(node);
        addToFront(node);
    }

    private void addToFront(Node<K, V> node) {
        node.prev = head;
        node.next = head.next;
        head.next.prev = node;
        head.next = node;
    }

    private void removeNode(Node<K, V> node) {
        node.prev.next = node.next;
        node.next.prev = node.prev;
    }
}
```

**`LFUCache.java`**

```java
package com.lld.problems.lrucache;

import java.util.HashMap;
import java.util.LinkedHashSet;
import java.util.Map;
import java.util.Optional;

/**
 * O(1) get/put with least-frequently-used eviction, ties broken by
 * least-recently-used. Keys are grouped into per-frequency buckets
 * (LinkedHashSet preserves insertion order within a bucket, which is exactly
 * the LRU tie-break); minFreq tracks which bucket to evict from without
 * scanning.
 */
public class LFUCache<K, V> implements Cache<K, V> {

    private final int capacity;
    private final Map<K, V> values = new HashMap<>();
    private final Map<K, Integer> frequencies = new HashMap<>();
    private final Map<Integer, LinkedHashSet<K>> freqBuckets = new HashMap<>();
    private int minFreq;

    public LFUCache(int capacity) {
        if (capacity <= 0) {
            throw new IllegalArgumentException("capacity must be at least 1");
        }
        this.capacity = capacity;
    }

    @Override
    public Optional<V> get(K key) {
        if (!values.containsKey(key)) {
            return Optional.empty();
        }
        bumpFrequency(key);
        return Optional.of(values.get(key));
    }

    @Override
    public void put(K key, V value) {
        if (values.containsKey(key)) {
            values.put(key, value);
            bumpFrequency(key);
            return;
        }
        if (values.size() == capacity) {
            evictLeastFrequentlyUsed();
        }
        values.put(key, value);
        frequencies.put(key, 1);
        freqBuckets.computeIfAbsent(1, f -> new LinkedHashSet<>()).add(key);
        minFreq = 1;
    }

    @Override
    public int size() {
        return values.size();
    }

    private void bumpFrequency(K key) {
        int oldFreq = frequencies.get(key);
        LinkedHashSet<K> oldBucket = freqBuckets.get(oldFreq);
        oldBucket.remove(key);
        if (oldBucket.isEmpty()) {
            freqBuckets.remove(oldFreq);
            if (minFreq == oldFreq) {
                minFreq++;
            }
        }
        int newFreq = oldFreq + 1;
        frequencies.put(key, newFreq);
        freqBuckets.computeIfAbsent(newFreq, f -> new LinkedHashSet<>()).add(key);
    }

    private void evictLeastFrequentlyUsed() {
        LinkedHashSet<K> bucket = freqBuckets.get(minFreq);
        K evictKey = bucket.iterator().next(); // first inserted at this frequency == least recently used among ties
        bucket.remove(evictKey);
        if (bucket.isEmpty()) {
            freqBuckets.remove(minFreq);
        }
        values.remove(evictKey);
        frequencies.remove(evictKey);
    }
}
```
