<script type="text/markdown" id="md-10-2-rate-limiter">
# Rate Limiter
*Amazon, Salesforce.*

**Time-box**: ~2.5h.

## Requirements
- Given a client identifier and a limit (e.g., N requests per T seconds), decide whether to `allow()` a
  given request.
- Implement **at least two** distinct algorithms behind the same interface: Fixed Window, Sliding Window
  (log or counter), and/or Token Bucket — pick which, but be able to state the memory/accuracy tradeoff
  between whichever two you chose.
- Must track limits **independently per client** (many clients, many independent limiters).
- **Non-functional**: correct under concurrent requests for the same client (this is a direct
  continuation of **Lesson 8's `RateLimiterCounter` practice task** — reuse that reasoning here) and
  bounded memory (a naive sliding-window-log implementation that keeps every timestamp forever is a real
  memory leak under sustained traffic).
- **Out of scope**: coordinating limits across multiple servers/processes (name it as a real extension —
  it would need a shared store like Redis — without building it).

## Where to start
The algorithm itself is a textbook Strategy (Lesson 5): one interface, swappable implementations, exactly
like `DiscountStrategy`. The interesting design decision is *inside* each algorithm: Token Bucket, in
particular, doesn't need a background thread ticking to refill tokens — think about how to compute "how
many tokens should exist right now" lazily, from elapsed time, at the moment a request actually arrives.

## Common pitfalls
A background-thread refill loop for Token Bucket when a lazy, elapsed-time calculation on each request is
simpler and avoids an extra thread entirely; an unbounded sliding-window log that never prunes old
timestamps; forgetting per-client isolation (one shared counter for everyone instead of one per client);
skipping thread-safety until asked.

## Your task
In `practice/`, package `com.lld.problems.ratelimiter`. Implement two algorithms behind one
`RateLimiter` interface, keyed per client. Tests: requests within the limit are allowed, requests over
the limit are rejected, the limit correctly resets/refills over time (you'll need to control or fake time
in the test rather than actually sleeping for real durations), and a concurrent stress test proving the
accepted-count within one window never exceeds the configured limit.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/ratelimiter/`.*

**Clarifying questions**: Which two algorithms — and can you name the accuracy/memory tradeoff between
them before writing any code? (Fixed window: cheap, but allows up to 2x the limit right at a window
boundary — a burst at the end of one window plus a burst at the start of the next. Token bucket: smoother,
allows controlled bursting up to capacity, slightly more state per client.) Per-client keyed by what —
user ID, IP, API key? Does "over the limit" mean reject outright, or should it be discussed as a
follow-up (queue, delay, backpressure)?

**Build order**:
1. `RateLimiter` interface — one method, `allow(clientId)`. Writing this first, before either algorithm,
   is what makes the "two algorithms" requirement actually mean something instead of two unrelated
   classes with no relationship.
2. **The testability decision comes before the first algorithm's logic**: inject a `Clock` rather than
   calling `System.currentTimeMillis()` directly. Say this out loud as its own step — "I'm going to take a
   `Clock` in the constructor so I can control time in tests without sleeping" — because it changes every
   constructor signature that follows, and doing it after the fact means going back and editing finished
   code.
3. `FixedWindowRateLimiter` first (the simpler of the two): one field per client (`windowStart`, `count`),
   synchronized per-client-entry, not globally — narrate why a global lock would be wrong here (it would
   serialize every client's requests against every other client's, when nothing about the requirement
   needs that).
4. `TokenBucketRateLimiter` second, and the one sentence worth saying explicitly: "I'll compute the
   current token count lazily, from elapsed time, at the moment a request arrives, instead of running a
   background thread that ticks and refills — no extra thread, no scheduling to manage." This is
   precisely the design decision Lesson 8's brief flags as the elegant answer, and stating it
   unprompted is a strong signal you internalized the lesson rather than just copying a pattern.
5. Concurrent test last, as always in this phase — and specifically stress a *single shared clientId*
   across many threads, since per-client isolation alone (different keys never touching each other's
   state) doesn't prove the per-client synchronization is actually correct.

**Extensions**:
- *"How would this work across multiple servers, not just one process?"* — name it directly: the
  per-client state needs to move to a shared store (Redis is the standard answer, using `INCR` + `EXPIRE`
  for fixed window, or a Lua script for atomic token bucket updates) — this is the exact "coordinating
  limits across multiple servers" extension the problem brief scoped out, and naming the real answer
  without implementing it is the expected depth here.
- *"Sliding window instead of fixed?"* — either a sliding log (store every request timestamp, prune old
  ones — accurate, more memory) or a sliding window counter (weighted average of the current and previous
  fixed windows — an approximation, O(1) memory); state which you'd pick and why for the traffic pattern
  described.
- *"Different limits for different endpoints on the same client?"* — key the map by `(clientId, endpoint)`
  instead of just `clientId`; the algorithm itself doesn't change.

## Solution Code

*Full source lives in `solutions/.../problems/ratelimiter/` — shown below in build order, one file at a time.*

**`RateLimiter.java`**

```java
package com.lld.problems.ratelimiter;

/** Strategy (Lesson 5): the algorithm is swappable behind one interface, per Lesson 8's practice task. */
public interface RateLimiter {
    boolean allow(String clientId);
}
```

**`FixedWindowRateLimiter.java`**

```java
package com.lld.problems.ratelimiter;

import java.time.Clock;
import java.time.Duration;
import java.util.Map;
import java.util.concurrent.ConcurrentHashMap;

public class FixedWindowRateLimiter implements RateLimiter {

    private static final class Window {
        long windowStartMillis;
        int count;
    }

    private final int maxRequestsPerWindow;
    private final long windowSizeMillis;
    private final Clock clock;
    private final Map<String, Window> windowsByClient = new ConcurrentHashMap<>();

    public FixedWindowRateLimiter(int maxRequestsPerWindow, Duration windowSize, Clock clock) {
        this.maxRequestsPerWindow = maxRequestsPerWindow;
        this.windowSizeMillis = windowSize.toMillis();
        this.clock = clock;
    }

    public FixedWindowRateLimiter(int maxRequestsPerWindow, Duration windowSize) {
        this(maxRequestsPerWindow, windowSize, Clock.systemUTC());
    }

    @Override
    public boolean allow(String clientId) {
        long now = clock.millis();
        Window window = windowsByClient.computeIfAbsent(clientId, id -> new Window());
        synchronized (window) {
            if (now - window.windowStartMillis >= windowSizeMillis) {
                window.windowStartMillis = now;
                window.count = 0;
            }
            if (window.count < maxRequestsPerWindow) {
                window.count++;
                return true;
            }
            return false;
        }
    }
}
```

**`TokenBucketRateLimiter.java`**

```java
package com.lld.problems.ratelimiter;

import java.time.Clock;
import java.util.Map;
import java.util.concurrent.ConcurrentHashMap;

/**
 * No background refill thread: tokens are computed lazily, from elapsed
 * time, at the moment a request actually arrives (Lesson 8's Rate Limiter
 * brief calls this out explicitly as the simpler alternative to a ticking
 * refill loop).
 */
public class TokenBucketRateLimiter implements RateLimiter {

    private static final class Bucket {
        double tokens;
        long lastRefillMillis;
    }

    private final int capacity;
    private final double refillTokensPerSecond;
    private final Clock clock;
    private final Map<String, Bucket> bucketsByClient = new ConcurrentHashMap<>();

    public TokenBucketRateLimiter(int capacity, double refillTokensPerSecond, Clock clock) {
        this.capacity = capacity;
        this.refillTokensPerSecond = refillTokensPerSecond;
        this.clock = clock;
    }

    public TokenBucketRateLimiter(int capacity, double refillTokensPerSecond) {
        this(capacity, refillTokensPerSecond, Clock.systemUTC());
    }

    @Override
    public boolean allow(String clientId) {
        long now = clock.millis();
        Bucket bucket = bucketsByClient.computeIfAbsent(clientId, id -> {
            Bucket fresh = new Bucket();
            fresh.tokens = capacity;
            fresh.lastRefillMillis = now;
            return fresh;
        });
        synchronized (bucket) {
            refill(bucket, now);
            if (bucket.tokens >= 1.0) {
                bucket.tokens -= 1.0;
                return true;
            }
            return false;
        }
    }

    private void refill(Bucket bucket, long now) {
        double elapsedSeconds = (now - bucket.lastRefillMillis) / 1000.0;
        if (elapsedSeconds <= 0) {
            return;
        }
        double newTokens = elapsedSeconds * refillTokensPerSecond;
        bucket.tokens = Math.min(capacity, bucket.tokens + newTokens);
        bucket.lastRefillMillis = now;
    }
}
```

<script type="text/markdown" id="md-10-3-elevator-system">
# Elevator System
*Amazon, Microsoft classic.*

**Time-box**: ~2.5h.

## Requirements
- A building with multiple floors and multiple elevators.
- **External requests**: a button pressed on a floor, specifying a desired direction (up/down).
- **Internal requests**: a button pressed inside a specific elevator, specifying a destination floor.
- Some scheduling logic decides which elevator services a given external request.
- Each elevator has its own state (idle, moving up, moving down, doors open) governing what it can do
  next.
- **Non-functional**: the scheduling algorithm should be swappable (nearest-car dispatch vs. a
  SCAN/elevator-style algorithm that services requests along a sweep) without touching elevator or
  controller internals; must handle multiple concurrent requests arriving at once.
- **Out of scope**: realistic physics/timing simulation, emergency/fire override modes (fine to mention
  as an extension).

## Where to start
Two design decisions dominate this problem. First: an elevator's own behavior is a textbook State
machine (Lesson 7) — sketch it as a Mermaid diagram first (idle → moving → doors open → idle, and what
triggers each transition) before writing any code. Second: *which elevator handles a given request* is a
separate concern from *how an elevator behaves once assigned* — keep the dispatch/scheduling decision
behind its own Strategy interface, owned by a controller, rather than baking "find the nearest idle
elevator" directly into the controller's only method. Also worth thinking through explicitly: an
*external* floor request doesn't know or commit to which elevator will serve it until dispatched; an
*internal* cabin request is already committed to one specific elevator — these are genuinely different
kinds of requests, not the same thing wearing two names.

## Common pitfalls
Hardcoding one dispatch strategy directly into the controller instead of behind an interface; modeling
elevator state as a bare enum checked with `if`/`switch` scattered across methods instead of real State
classes; not handling two external requests arriving in the same tick without dropping or duplicating
one.

## Your task
In `practice/`, package `com.lld.problems.elevator`. Implement at least two dispatch strategies behind
one interface. Tests: an external request is assigned to a sensible elevator under your chosen strategy;
an elevator's state transitions are exactly correct across a sequence of requests; swapping the dispatch
strategy changes which elevator gets assigned without any other code changing; a concurrency test with
several simultaneous external requests completes without any request being lost or double-assigned.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/elevator/`.*

**Clarifying questions**: Is a full physics/timing simulation expected, or is a discrete "tick" model
(each tick moves one floor, or opens/closes doors) acceptable — and worth proposing yourself, since it
sidesteps a huge amount of irrelevant complexity? Should the dispatch algorithm be pluggable, or is one
fixed strategy fine for a first pass? Do internal (in-cabin) and external (hallway button) requests need
different handling, or can they be treated identically once assigned to an elevator?

**Build order**:
1. Propose the tick-based simulation model *out loud* before writing anything — "each `tick()` call
   advances the elevator by one discrete step" turns an open-ended systems problem into something you can
   build and test without a real clock or real motors.
2. `ElevatorState` interface with one method, `next(Elevator) -> ElevatorState`. This is the direct
   translation of a state diagram (Lesson 3) into code — if you haven't sketched the diagram yet, this is
   the moment to draw it: Idle → Moving → DoorsOpen → Idle.
3. `IdleState`, `MovingState`, `DoorsOpenState`, tested each tick at a time *in isolation from dispatch
   entirely* — build and test `Elevator.tick()` against a hand-populated set of pending stops before a
   `DispatchStrategy` or `ElevatorController` exists at all. This proves the hardest part (the state
   machine) works before adding the layer that decides *which* elevator gets a request.
4. `DispatchStrategy` interface, then two implementations, only after step 3 is solid — this ordering
   matters: dispatch decides *which* elevator, the state machine decides *what that elevator does once
   assigned*, and they're genuinely independent concerns that should be built and tested independently
   before being wired together.
5. `ElevatorController` last, as pure wiring: call the strategy, hand the result a stop request. If this
   class starts accumulating its own movement or scheduling logic, that logic escaped from where it
   belongs.
6. Concurrency, once again last: the one line worth narrating is *why* `requestExternal` is
   `synchronized` on the controller rather than per-elevator — the race isn't "two requests hit the same
   elevator" (each elevator's own stop set is a thread-safe `ConcurrentSkipListSet`), it's "two concurrent
   dispatch *decisions* could both read the same stale elevator positions and make an inconsistent joint
   choice" — the thing needing protection is the decision, not the elevators themselves.

**Extensions**:
- *"Implement a proper SCAN/elevator algorithm instead of nearest-car?"* — a new `DispatchStrategy` that
  additionally considers each elevator's current direction and whether the request is "on the way" before
  falling back to nearest-idle; the interface doesn't change, only which implementation is selected.
- *"Add capacity limits (max N passengers)?"* — a small check inside `requestStop` refusing new stops (or
  signaling "elevator full") past a threshold; the state machine itself doesn't need to know about it.
- *"Emergency/fire-mode override?"* — a new `ElevatorState` that all elevators transition into
  immediately, ignoring pending stops — a clean illustration of why State beats a bare `if/else`: adding a
  whole new mode is one new class, not edits scattered across every existing method.

## Solution Code

*Full source lives in `solutions/.../problems/elevator/` — shown below in build order, one file at a time.*

**`Direction.java`**

```java
package com.lld.problems.elevator;

public enum Direction {
    UP, DOWN, IDLE
}
```

**`ElevatorState.java`**

```java
package com.lld.problems.elevator;

/** State (Lesson 7): each state knows only how to advance one simulation tick and what comes next. */
public interface ElevatorState {
    enum Kind { IDLE, MOVING, DOORS_OPEN }

    ElevatorState next(Elevator elevator);

    Kind kind();
}
```

**`IdleState.java`**

```java
package com.lld.problems.elevator;

import java.util.Comparator;

final class IdleState implements ElevatorState {

    static final IdleState INSTANCE = new IdleState();

    private IdleState() {
    }

    @Override
    public ElevatorState next(Elevator elevator) {
        if (elevator.getPendingStops().isEmpty()) {
            return this; // nothing to do — stay idle
        }
        int target = elevator.getPendingStops().stream()
                .min(Comparator.comparingInt(f -> Math.abs(f - elevator.getCurrentFloor())))
                .orElseThrow();
        if (target == elevator.getCurrentFloor()) {
            return DoorsOpenState.INSTANCE; // already at the requested floor — no need to move first
        }
        Direction direction = target > elevator.getCurrentFloor() ? Direction.UP : Direction.DOWN;
        elevator.setDirection(direction);
        return MovingState.towards(direction);
    }

    @Override
    public Kind kind() {
        return Kind.IDLE;
    }
}
```

**`MovingState.java`**

```java
package com.lld.problems.elevator;

final class MovingState implements ElevatorState {

    private final Direction direction;

    private MovingState(Direction direction) {
        this.direction = direction;
    }

    static MovingState towards(Direction direction) {
        return new MovingState(direction);
    }

    @Override
    public ElevatorState next(Elevator elevator) {
        elevator.moveOneFloorTowards(direction);
        if (elevator.getPendingStops().contains(elevator.getCurrentFloor())) {
            return DoorsOpenState.INSTANCE;
        }
        return this; // keep moving in the same direction
    }

    @Override
    public Kind kind() {
        return Kind.MOVING;
    }
}
```

**`DoorsOpenState.java`**

```java
package com.lld.problems.elevator;

final class DoorsOpenState implements ElevatorState {

    static final DoorsOpenState INSTANCE = new DoorsOpenState();

    private DoorsOpenState() {
    }

    @Override
    public ElevatorState next(Elevator elevator) {
        elevator.removeStop(elevator.getCurrentFloor()); // this stop is served
        elevator.setDirection(Direction.IDLE);
        return IdleState.INSTANCE; // the next tick decides where to go next, if anywhere
    }

    @Override
    public Kind kind() {
        return Kind.DOORS_OPEN;
    }
}
```

**`DispatchStrategy.java`**

```java
package com.lld.problems.elevator;

import java.util.List;

/** Strategy (Lesson 5): which elevator handles a request is decided independently of how an elevator behaves once assigned. */
public interface DispatchStrategy {
    Elevator selectElevator(List<Elevator> elevators, int requestFloor, Direction requestedDirection);
}
```

**`NearestElevatorDispatchStrategy.java`**

```java
package com.lld.problems.elevator;

import java.util.Comparator;
import java.util.List;

public class NearestElevatorDispatchStrategy implements DispatchStrategy {
    @Override
    public Elevator selectElevator(List<Elevator> elevators, int requestFloor, Direction requestedDirection) {
        return elevators.stream()
                .min(Comparator.comparingInt(e -> Math.abs(e.getCurrentFloor() - requestFloor)))
                .orElseThrow(() -> new IllegalStateException("no elevators available"));
    }
}
```

**`RoundRobinDispatchStrategy.java`**

```java
package com.lld.problems.elevator;

import java.util.List;
import java.util.concurrent.atomic.AtomicInteger;

public class RoundRobinDispatchStrategy implements DispatchStrategy {

    private final AtomicInteger counter = new AtomicInteger();

    @Override
    public Elevator selectElevator(List<Elevator> elevators, int requestFloor, Direction requestedDirection) {
        int index = Math.floorMod(counter.getAndIncrement(), elevators.size());
        return elevators.get(index);
    }
}
```

**`Elevator.java`**

```java
package com.lld.problems.elevator;

import java.util.NavigableSet;
import java.util.concurrent.ConcurrentSkipListSet;

public class Elevator {

    private final String id;
    private volatile int currentFloor;
    private volatile Direction direction = Direction.IDLE;
    private volatile ElevatorState state = IdleState.INSTANCE;
    private final NavigableSet<Integer> pendingStops = new ConcurrentSkipListSet<>();

    public Elevator(String id, int startingFloor) {
        this.id = id;
        this.currentFloor = startingFloor;
    }

    public String getId() {
        return id;
    }

    public int getCurrentFloor() {
        return currentFloor;
    }

    public Direction getDirection() {
        return direction;
    }

    public ElevatorState.Kind getStateKind() {
        return state.kind();
    }

    public NavigableSet<Integer> getPendingStops() {
        return pendingStops;
    }

    public void requestStop(int floor) {
        pendingStops.add(floor);
    }

    /** Advances the simulation by one step. */
    public void tick() {
        state = state.next(this);
    }

    void setDirection(Direction direction) {
        this.direction = direction;
    }

    void moveOneFloorTowards(Direction direction) {
        currentFloor += (direction == Direction.UP ? 1 : -1);
    }

    void removeStop(int floor) {
        pendingStops.remove(floor);
    }
}
```

**`ElevatorController.java`**

```java
package com.lld.problems.elevator;

import java.util.List;

public class ElevatorController {

    private final List<Elevator> elevators;
    private final DispatchStrategy dispatchStrategy;

    public ElevatorController(List<Elevator> elevators, DispatchStrategy dispatchStrategy) {
        this.elevators = List.copyOf(elevators);
        this.dispatchStrategy = dispatchStrategy;
    }

    /**
     * synchronized: selecting + committing a dispatch decision must be atomic,
     * otherwise two concurrent external requests could both read the same
     * "current" elevator positions and make an inconsistent joint decision.
     */
    public synchronized Elevator requestExternal(int floor, Direction direction) {
        Elevator chosen = dispatchStrategy.selectElevator(elevators, floor, direction);
        chosen.requestStop(floor);
        return chosen;
    }

    public void requestInternal(Elevator elevator, int destinationFloor) {
        elevator.requestStop(destinationFloor);
    }

    public void tickAll() {
        elevators.forEach(Elevator::tick);
    }

    public List<Elevator> getElevators() {
        return elevators;
    }
}
```

# Logging Framework
*Salesforce-style extensibility — a mini Log4j.*

**Time-box**: ~2.5h.

## Requirements
- Log at multiple severity levels (e.g., DEBUG, INFO, WARN, ERROR); a logger has a configured minimum
  level, and messages below it are dropped.
- Support multiple simultaneous output destinations (console, a file, a fake "network" sink), each
  independently configurable per logger.
- Output is formatted by a pluggable formatter (at minimum: timestamp + level + message).
- **Non-functional, and easy to miss**: constructing an expensive log message (e.g., building a large
  string, serializing an object) must **not** happen at all if the message would be filtered out by
  level — this is a real, commonly-tested performance requirement, not a nice-to-have.
- **Out of scope**: log rotation/archival, distributed log aggregation, structured/JSON output (fine to
  mention as an extension).

## Where to start
This problem deliberately echoes **Lesson 2's SOLID notification system** — a logger writing to multiple
destinations is structurally close to a service notifying multiple channels — but the destinations here
(`Appender`s, in the usual naming) are a good fit for a small **Chain of Responsibility** among filters
(does this record pass filter 1? filter 2? before it reaches an appender), and formatting is a clean
Strategy. For the "don't build the message if it's filtered" requirement: think about what Lesson 0.4's
`Supplier<T>` buys you here — a caller passing `() -> expensiveToString()` instead of an already-built
`String` lets the logger decide whether to even *evaluate* the supplier, based on the level check, before
any expensive work happens. A single global logging entry point is also one of the rare cases Lesson 5
names as a **legitimate** use of real Singleton (a process-global concern), not an anti-pattern reach.

## Common pitfalls
Building the full formatted message string before checking whether the level is even enabled (defeats
the whole performance requirement); appenders that aren't safe for concurrent writes from multiple
threads logging at once (a direct application of Phase 3); an `if/else` level check duplicated in every
call site instead of centralized once.

## Your task
In `practice/`, package `com.lld.problems.logging`. Implement level filtering using the
lazy-`Supplier`-that-may-never-be-invoked technique, at least two appenders, and a pluggable formatter.
Tests: a message below the configured level never reaches any appender *and* its supplier is never
invoked (assert this with a counter, not just the output); multiple appenders all receive a passing
message; a concurrent test with many threads logging simultaneously to a shared appender produces no
interleaved/corrupted lines.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/logging/`.*

**Clarifying questions**: Should level filtering be a simple minimum-level cutoff, or does it need
per-appender filters (e.g., errors to console, everything to a file)? Is message *construction* cost a
real concern here, or is `String message` as a plain parameter fine? (Ask this even if you already know
the answer — it's the cue to bring up the `Supplier` technique yourself if the interviewer doesn't.)
Should appenders be synchronous (log call blocks until written) or is async/buffered writing worth
discussing as a follow-up?

**Build order**:
1. `LogLevel` as an enum, and rely on `ordinal()` for severity comparison instead of hand-rolling a
   numeric field — say this out loud, it's a small but real signal that you know enum ordinals are already
   comparable and free.
2. `LogRecord` and `LogFormatter` together — a plain data holder and the one-method interface that turns
   it into a string. Small, and written before `Appender` because `Appender.append` needs *something* to
   receive.
3. `Appender` interface, then `ConsoleAppender`/`InMemoryAppender` — and mark `append()` `synchronized`
   from the start, not as an afterthought. Multiple concurrent log calls sharing one appender is normal,
   expected behavior for a logging framework, not an edge case to bolt on later — treat it as a
   requirement baked into the interface's contract, not a Phase-8-style "now make it thread-safe" retrofit.
4. `Logger.log(level, Supplier<String>)` last, and this is the sentence worth saying verbatim: "I'll take
   a `Supplier<String>` instead of a `String` so the message is never built if the level check fails" —
   then write the level check as the very first line of the method, before the supplier is ever touched.
   Getting the *order* right inside this one method (check first, invoke second) is the entire performance
   requirement in the brief.

**Extensions**:
- *"Structured/JSON logging instead of plain text?"* — a new `LogFormatter` implementation; nothing else
  in the design changes, which is the whole point of having formatting be a Strategy.
- *"Route by level to different appenders (errors to Slack, everything else to a file)?"* — this is
  genuinely Chain of Responsibility territory (Lesson 7): a small chain of level-based filters, each
  deciding whether to forward to its own appender, instead of a single flat appender list on `Logger`.
- *"What if writing to an appender is slow (e.g., a real network call)?"* — flag that a synchronous
  `append()` now blocks the calling thread; the production answer is an async appender backed by a
  `BlockingQueue` and a dedicated writer thread (Lesson 8's producer-consumer shape, applied here) —
  describe it, and note the tradeoff (logs can be lost on a crash before they're flushed) rather than
  pretending it's free.

## Solution Code

*Full source lives in `solutions/.../problems/logging/` — shown below in build order, one file at a time.*

**`LogLevel.java`**

```java
package com.lld.problems.logging;

public enum LogLevel {
    DEBUG, INFO, WARN, ERROR; // ordinal order IS severity order — DEBUG.ordinal() < ERROR.ordinal()
}
```

**`LogRecord.java`**

```java
package com.lld.problems.logging;

import java.time.Instant;

public record LogRecord(LogLevel level, String message, Instant timestamp) {
}
```

**`LogFormatter.java`**

```java
package com.lld.problems.logging;

/** Strategy (Lesson 5): how a record is rendered is independent of where it's sent. */
public interface LogFormatter {
    String format(LogRecord record);
}
```

**`SimpleLogFormatter.java`**

```java
package com.lld.problems.logging;

public class SimpleLogFormatter implements LogFormatter {
    @Override
    public String format(LogRecord record) {
        return "[" + record.timestamp() + "] " + record.level() + " " + record.message();
    }
}
```

**`Appender.java`**

```java
package com.lld.problems.logging;

/** Where a formatted line goes. Implementations must be safe for concurrent writes. */
public interface Appender {
    void append(String formattedLine);
}
```

**`ConsoleAppender.java`**

```java
package com.lld.problems.logging;

public class ConsoleAppender implements Appender {
    @Override
    public synchronized void append(String formattedLine) {
        System.out.println(formattedLine); // synchronized: System.out is shared, concurrent writes must not interleave mid-line
    }
}
```

**`InMemoryAppender.java`**

```java
package com.lld.problems.logging;

import java.util.List;
import java.util.concurrent.CopyOnWriteArrayList;

/** A stand-in for a file/network appender — avoids real I/O side effects, easy to assert against in tests. */
public class InMemoryAppender implements Appender {

    private final List<String> lines = new CopyOnWriteArrayList<>();

    @Override
    public void append(String formattedLine) {
        lines.add(formattedLine);
    }

    public List<String> getLines() {
        return List.copyOf(lines);
    }
}
```

**`Logger.java`**

```java
package com.lld.problems.logging;

import java.time.Instant;
import java.util.List;
import java.util.function.Supplier;

public class Logger {

    private final LogLevel minLevel;
    private final List<Appender> appenders;
    private final LogFormatter formatter;

    public Logger(LogLevel minLevel, List<Appender> appenders, LogFormatter formatter) {
        this.minLevel = minLevel;
        this.appenders = List.copyOf(appenders);
        this.formatter = formatter;
    }

    /**
     * The Supplier is only ever invoked if the level actually passes the
     * filter — an expensive message (string concatenation, object
     * serialization) never gets built for a filtered-out log call.
     */
    public void log(LogLevel level, Supplier<String> messageSupplier) {
        if (level.ordinal() < minLevel.ordinal()) {
            return; // messageSupplier.get() is never called
        }
        LogRecord record = new LogRecord(level, messageSupplier.get(), Instant.now());
        String formatted = formatter.format(record);
        for (Appender appender : appenders) {
            appender.append(formatted);
        }
    }

    public void debug(Supplier<String> message) { log(LogLevel.DEBUG, message); }
    public void info(Supplier<String> message) { log(LogLevel.INFO, message); }
    public void warn(Supplier<String> message) { log(LogLevel.WARN, message); }
    public void error(Supplier<String> message) { log(LogLevel.ERROR, message); }
}
```

# Chess
*Google, Microsoft.*

**Time-box**: ~3h (this one is large — scope deliberately, see below).

## Requirements
- Standard 8×8 board and piece set; each piece type has its own legal-movement rules.
- Track turn order; validate that a proposed move is legal, **including** that it does not leave the
  moving player's own king in check.
- Detect check. Detecting checkmate and stalemate is a stretch goal, not required for a first pass.
- **Out of scope for a first pass** (name these as deliberate scope cuts, don't silently skip them):
  castling, en passant, pawn promotion, draw by repetition/50-move rule, a chess clock. Pick this problem
  apart into a base version first; add one special rule after, if time allows.

## Where to start
The core design decision: where does a piece's movement logic live? Putting every piece's legal-move
rules into one giant `Board`/`Game` class with type-checks (`if (piece instanceof Rook) ...`) is exactly
the OCP violation Lesson 1 opened with — the fix is the same one: each `Piece` subclass knows its *own*
movement pattern, and the board/game asks the piece, polymorphically, rather than deciding on its behalf.
A `Factory` (Lesson 5) is a clean fit for building the initial board setup. "Undo a move" cleanly is a
natural fit for the **Memento** pattern (Lesson 7) — save and restore an object's internal state without
exposing its internals — worth revisiting that lesson's section now that you have a concrete use for it.

## Common pitfalls
Movement logic centralized in the board instead of on each piece (by far the most common structural
mistake in this problem); forgetting the "can't move into check" rule entirely under time pressure — it's
easy to validate a move's *shape* and forget to validate its *consequence*.

## Your task
In `practice/`, package `com.lld.problems.chess`. Implement the board, all six piece types with their own
movement rules, turn tracking, and check detection (including the "can't leave your own king in check"
rule). Tests: each piece type's legal moves are correct in at least a few representative positions; an
illegal move (wrong shape, or one that would leave the king in check) is rejected; check is correctly
detected after a move that causes it.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/chess/`.*

**Clarifying questions**: Which special rules are actually in scope — castling, en passant, pawn
promotion? (Propose cutting all three for a first pass, exactly as the problem brief does — naming
deliberate scope cuts out loud is a stronger signal than silently skipping them.) Is checkmate/stalemate
detection required, or is "detect check" enough? Do you need a display/notation layer, or just correct
internal state?

**Build order** — this is the largest problem in the curriculum so far, and the order is what keeps it
from becoming unmanageable:
1. `Color`, `Position` — trivial, but note the deliberate choice to make `Position` a bare record with
   *no* bounds validation in its constructor. Bounds get checked once, centrally, in `Board.isInBounds`,
   rather than in every single call site that constructs a candidate position during move generation —
   validating in the type itself would mean wrapping every sliding-move calculation in a try/catch.
2. `Piece` as an abstract class with one abstract method, `getPossibleMoves`, *before* writing a single
   concrete piece. This is the OCP commitment stated up front: the board will never contain an
   `instanceof Rook` check anywhere, because every piece answers the same question about itself.
3. `MoveUtils` — the two shared movement shapes (`sliding` for Rook/Bishop/Queen, `fixedOffsets` for
   Knight/King) *before* any of those five pieces. Noticing the shared shape before writing five almost-
   identical classes is exactly the kind of duplication-avoidance an interviewer is watching for — say it
   out loud: "four of these six pieces are one of two movement patterns, so I'll extract that first."
4. The five straightforward pieces (Rook, Bishop, Queen, Knight, King), each a few lines on top of the
   shared helpers. `Pawn` deliberately last and on its own — it's the one piece whose move-generation
   logic doesn't fit either shared helper (asymmetric forward/capture rules), and it's the piece that
   needs the `getAttackSquares` override, which is worth explaining the moment you write it: "a pawn's
   diagonal is something it *threatens* even when nothing's there to capture — that's different from
   where it can actually *move* — so check-detection needs to ask a different question than move
   generation for this one piece."
5. `Board` — and specifically, build `copy()` at the same time as everything else that needs it, not as
   an afterthought: the check-safety rule (`isLegalMove`) fundamentally requires simulating a move on a
   scratch copy, checking the result, and discarding it. Committing to that approach early (instead of
   trying to "undo" a move in place) avoids a whole category of bugs where an undo doesn't perfectly
   restore state.
6. `Game.isLegalMove` last, and the two-step shape it has is worth narrating explicitly: first ask
   "does this match the piece's own movement pattern" (cheap, no simulation), only *then* ask "does
   applying it leave my own king in check" (expensive, requires a full board copy) — checking the cheap
   condition first is a real performance habit, not just code order.

**A bug this exact process catches, worth mentioning as a war story**: building the check-detection test
first with a rook and king already lined up on the same file produced a king that was "in check" before
any move was made at all — the test's assumption was wrong, not the code. This is precisely why running
your tests (not just reading your code) matters even for logic that looks obviously correct: a hand-traced
"this should work" is not the same guarantee as a green test run.

**Extensions**:
- *"Add checkmate detection?"* — for the side to move, check is checkmate if *no* legal move exists that
  escapes it: try every possible move for every one of that side's pieces through `isLegalMove`: if none
  succeed, it's checkmate (or stalemate, if not currently in check). Note the cost: this is checking legality
  for every piece's every possible move, an expensive but correct brute-force approach.
- *"Add castling?"* — needs the King and each Rook to track whether they've ever moved (a boolean flag,
  since castling is only legal if neither piece has moved), plus a check that the king doesn't pass
  through an attacked square — genuinely more state than the current design carries, worth naming as a
  real (not free) extension rather than "just add a case."
- *"Support a chess engine evaluating positions?"* — this is where LLD hands off to an entirely different
  problem (minimax/alpha-beta search over `getPossibleMoves`), worth naming as the boundary rather than
  attempting to sketch it.

## Solution Code

*Full source lives in `solutions/.../problems/chess/` — shown below in build order, one file at a time.*

**`Color.java`**

```java
package com.lld.problems.chess;

public enum Color {
    WHITE, BLACK;

    public Color opposite() {
        return this == WHITE ? BLACK : WHITE;
    }
}
```

**`Position.java`**

```java
package com.lld.problems.chess;

/** row/col in [0,7]. White starts near row 0-1, moving toward row 7; Black starts near row 6-7, moving toward row 0. */
public record Position(int row, int col) {
}
```

**`MoveUtils.java`**

```java
package com.lld.problems.chess;

import java.util.ArrayList;
import java.util.List;

/** Shared movement helpers so Rook/Bishop/Queen and Knight/King don't each hand-roll the same scan. */
final class MoveUtils {

    private MoveUtils() {
    }

    static List<Position> sliding(Board board, Position from, int[][] directions, Color color) {
        List<Position> moves = new ArrayList<>();
        for (int[] d : directions) {
            int r = from.row();
            int c = from.col();
            while (true) {
                r += d[0];
                c += d[1];
                if (!Board.isInBounds(r, c)) {
                    break;
                }
                Position pos = new Position(r, c);
                if (board.isEmpty(pos)) {
                    moves.add(pos);
                } else {
                    if (board.isEnemyAt(pos, color)) {
                        moves.add(pos);
                    }
                    break; // blocked, whether by friend or foe -- stop scanning this direction
                }
            }
        }
        return moves;
    }

    static List<Position> fixedOffsets(Board board, Position from, int[][] offsets, Color color) {
        List<Position> moves = new ArrayList<>();
        for (int[] o : offsets) {
            int r = from.row() + o[0];
            int c = from.col() + o[1];
            if (!Board.isInBounds(r, c)) {
                continue;
            }
            Position pos = new Position(r, c);
            if (board.isEmpty(pos) || board.isEnemyAt(pos, color)) {
                moves.add(pos);
            }
        }
        return moves;
    }
}
```

**`Piece.java`**

```java
package com.lld.problems.chess;

import java.util.List;

/**
 * Each piece knows its own movement pattern (Lesson 1: polymorphism instead
 * of Board/Game branching on `instanceof`). getPossibleMoves is "where can
 * this piece move right now" (used for actually moving); getAttackSquares is
 * "what squares does this piece threaten" (used for check detection) —
 * these differ only for Pawn, whose forward move and diagonal capture are
 * not the same as what it attacks (Lesson 1's Going Further covers this
 * exact kind of nuance: don't conflate two things that look similar).
 */
public abstract class Piece {

    protected final Color color;

    protected Piece(Color color) {
        this.color = color;
    }

    public Color getColor() {
        return color;
    }

    public abstract List<Position> getPossibleMoves(Board board, Position from);

    public List<Position> getAttackSquares(Board board, Position from) {
        return getPossibleMoves(board, from); // default: same as movement — Pawn overrides this
    }
}
```

**`Pawn.java`**

```java
package com.lld.problems.chess;

import java.util.ArrayList;
import java.util.List;

/** No en passant, no promotion in this scope -- deliberate cuts named in the problem brief. */
public class Pawn extends Piece {

    public Pawn(Color color) {
        super(color);
    }

    private int forwardDir() {
        return color == Color.WHITE ? 1 : -1;
    }

    private int startRow() {
        return color == Color.WHITE ? 1 : 6;
    }

    @Override
    public List<Position> getPossibleMoves(Board board, Position from) {
        List<Position> moves = new ArrayList<>();
        int oneStepRow = from.row() + forwardDir();

        if (Board.isInBounds(oneStepRow, from.col()) && board.isEmpty(new Position(oneStepRow, from.col()))) {
            moves.add(new Position(oneStepRow, from.col()));
            int twoStepRow = from.row() + 2 * forwardDir();
            if (from.row() == startRow() && Board.isInBounds(twoStepRow, from.col())
                    && board.isEmpty(new Position(twoStepRow, from.col()))) {
                moves.add(new Position(twoStepRow, from.col()));
            }
        }
        for (int dc : new int[] {-1, 1}) {
            int captureCol = from.col() + dc;
            if (Board.isInBounds(oneStepRow, captureCol)) {
                Position target = new Position(oneStepRow, captureCol);
                if (board.isEnemyAt(target, color)) {
                    moves.add(target);
                }
            }
        }
        return moves;
    }

    /** A pawn THREATENS its diagonals regardless of whether anything is there -- different from where it can actually move. */
    @Override
    public List<Position> getAttackSquares(Board board, Position from) {
        List<Position> attacks = new ArrayList<>();
        int row = from.row() + forwardDir();
        for (int dc : new int[] {-1, 1}) {
            int col = from.col() + dc;
            if (Board.isInBounds(row, col)) {
                attacks.add(new Position(row, col));
            }
        }
        return attacks;
    }
}
```

**`Rook.java`**

```java
package com.lld.problems.chess;

import java.util.List;

public class Rook extends Piece {

    private static final int[][] DIRECTIONS = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};

    public Rook(Color color) {
        super(color);
    }

    @Override
    public List<Position> getPossibleMoves(Board board, Position from) {
        return MoveUtils.sliding(board, from, DIRECTIONS, color);
    }
}
```

**`Knight.java`**

```java
package com.lld.problems.chess;

import java.util.List;

public class Knight extends Piece {

    private static final int[][] OFFSETS = {
            {1, 2}, {2, 1}, {-1, 2}, {-2, 1}, {1, -2}, {2, -1}, {-1, -2}, {-2, -1}
    };

    public Knight(Color color) {
        super(color);
    }

    @Override
    public List<Position> getPossibleMoves(Board board, Position from) {
        return MoveUtils.fixedOffsets(board, from, OFFSETS, color);
    }
}
```

**`Bishop.java`**

```java
package com.lld.problems.chess;

import java.util.List;

public class Bishop extends Piece {

    private static final int[][] DIRECTIONS = {{1, 1}, {1, -1}, {-1, 1}, {-1, -1}};

    public Bishop(Color color) {
        super(color);
    }

    @Override
    public List<Position> getPossibleMoves(Board board, Position from) {
        return MoveUtils.sliding(board, from, DIRECTIONS, color);
    }
}
```

**`Queen.java`**

```java
package com.lld.problems.chess;

import java.util.List;

package com.lld.problems.chess;

/** Factory (Lesson 5): building the initial position is a clean fit -- one place that knows the layout. */
final class StandardPositionFactory {

    private StandardPositionFactory() {
    }

    static void setup(Board board) {
        for (int c = 0; c < 8; c++) {
            board.placePiece(new Position(1, c), new Pawn(Color.WHITE));
            board.placePiece(new Position(6, c), new Pawn(Color.BLACK));
            board.placePiece(new Position(0, c), backRankPiece(c, Color.WHITE));
            board.placePiece(new Position(7, c), backRankPiece(c, Color.BLACK));
        }
    }

    private static Piece backRankPiece(int col, Color color) {
        return switch (col) {
            case 0, 7 -> new Rook(color);
            case 1, 6 -> new Knight(color);
            case 2, 5 -> new Bishop(color);
            case 3 -> new Queen(color);
            case 4 -> new King(color);
            default -> throw new IllegalStateException("unreachable");
        };
    }
}
```

**`Board.java`**

```java
package com.lld.problems.chess;

import java.util.ArrayList;
import java.util.List;

public class Board {

    private final Piece[][] grid;

    public Board() {
        this.grid = new Piece[8][8];
    }

    private Board(Piece[][] grid) {
        this.grid = grid;
    }

    public Piece pieceAt(Position p) {
        return grid[p.row()][p.col()];
    }

    public void placePiece(Position p, Piece piece) {
        grid[p.row()][p.col()] = piece;
    }

    void movePieceInternal(Position from, Position to) {
        grid[to.row()][to.col()] = grid[from.row()][from.col()];
        grid[from.row()][from.col()] = null;
    }

    public boolean isEmpty(Position p) {
        return pieceAt(p) == null;
    }

    public boolean isEnemyAt(Position p, Color color) {
        Piece target = pieceAt(p);
        return target != null && target.getColor() != color;
    }

    public static boolean isInBounds(int row, int col) {
        return row >= 0 && row < 8 && col >= 0 && col < 8;
    }

    /** Pieces are stateless (color only), so copying references into a fresh grid is a safe, cheap deep-enough copy. */
    Board copy() {
        Piece[][] copyGrid = new Piece[8][];
        for (int r = 0; r < 8; r++) {
            copyGrid[r] = grid[r].clone();
        }
        return new Board(copyGrid);
    }

    Position findKing(Color color) {
        for (int r = 0; r < 8; r++) {
            for (int c = 0; c < 8; c++) {
                Piece p = grid[r][c];
                if (p instanceof King && p.getColor() == color) {
                    return new Position(r, c);
                }
            }
        }
        throw new IllegalStateException("no king found for " + color);
    }

    List<Position> allPiecePositions(Color color) {
        List<Position> positions = new ArrayList<>();
        for (int r = 0; r < 8; r++) {
            for (int c = 0; c < 8; c++) {
                Piece p = grid[r][c];
                if (p != null && p.getColor() == color) {
                    positions.add(new Position(r, c));
                }
            }
        }
        return positions;
    }
}
```

**`Game.java`**

```java
package com.lld.problems.chess;

public class Game {

    private final Board board;
    private Color currentTurn = Color.WHITE;

    public Game() {
        this.board = new Board();
        StandardPositionFactory.setup(board);
    }

    /** For tests: build a Game around a hand-placed board instead of the standard opening position. */
    public Game(Board board, Color startingTurn) {
        this.board = board;
        this.currentTurn = startingTurn;
    }

    public Board getBoard() {
        return board;
    }

    public Color getCurrentTurn() {
        return currentTurn;
    }

    public boolean isLegalMove(Position from, Position to) {
        Piece piece = board.pieceAt(from);
        if (piece == null || piece.getColor() != currentTurn) {
            return false;
        }
        if (!piece.getPossibleMoves(board, from).contains(to)) {
            return false; // wrong shape for this piece
        }
        Board simulated = board.copy();
        simulated.movePieceInternal(from, to);
        return !isInCheck(simulated, currentTurn); // must not leave your own king in check
    }

    public void move(Position from, Position to) {
        if (!isLegalMove(from, to)) {
            throw new IllegalArgumentException("illegal move: " + from + " -> " + to);
        }
        board.movePieceInternal(from, to);
        currentTurn = currentTurn.opposite();
    }

    public boolean isInCheck(Color color) {
        return isInCheck(board, color);
    }

    private boolean isInCheck(Board b, Color color) {
        Position kingPos = b.findKing(color);
        for (Position attackerPos : b.allPiecePositions(color.opposite())) {
            Piece attacker = b.pieceAt(attackerPos);
            if (attacker.getAttackSquares(b, attackerPos).contains(kingPos)) {
                return true;
            }
        }
        return false;
    }
}
```

# Snake and Ladder
*Amazon, Microsoft.*

**Time-box**: ~2h.

## Requirements
- A board of N squares (traditionally 100) with configurable snakes (head → tail, moves a player
  backward) and ladders (bottom → top, moves a player forward).
- 2+ players take turns rolling a die (support more than one die, configurably) and move their token
  forward by the roll.
- Landing exactly on a snake's head or a ladder's bottom immediately triggers the corresponding jump.
- Decide, and document, your rule for finishing: does a player need to land **exactly** on the final
  square, or does any roll that reaches or passes it win? Either is defensible — just be explicit.
- **Out of scope**: a real UI, network multiplayer.

## Where to start
This is primarily a simulation/state exercise rather than a pattern-heavy one — don't force a pattern
that doesn't fit. The real design questions: how do you represent "this square jumps you somewhere else"
in a way that's O(1) to check on every move (think: a simple position→destination map is enough — you
don't need a `Cell` class hierarchy for this); and how do you structure the main game loop so it cleanly
supports more than 2 players and terminates correctly.

## Common pitfalls
Off-by-one errors in board indexing (extremely common in this exact problem — decide up front whether
squares are 0-indexed or 1-indexed and be consistent); not deciding what happens if a snake's head and a
ladder's bottom occupy the same square (pick a rule, document it); an infinite loop if the exact-landing
win rule is implemented incorrectly and a player's roll overshoots the final square with no handling.

## Your task
In `practice/`, package `com.lld.problems.snakeandladder`. Implement the full game loop for 2+ players.
Tests: landing on a snake head moves the player to its tail; landing on a ladder bottom moves the player
to its top; your documented win rule is enforced consistently; a full simulated game with a fixed
(non-random, injected) sequence of dice rolls produces an exactly predictable, assertable outcome.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/snakeandladder/`.*

**Clarifying questions**: Exact-landing-to-win, or does any roll that reaches/passes the final square
win? (Pick one and say it out loud rather than silently assuming — this is the one rule real
implementations of this exact game disagree on.) How many dice? Is a snake head or a ladder bottom ever
allowed to coincide with the final square — and if so, what happens? Board size fixed at 100, or
configurable?

**Build order**:
1. **Resist the urge to model `Cell` as a class hierarchy** (`SnakeCell`, `LadderCell`, `NormalCell`).
   Say why out loud: a snake and a ladder are the exact same mechanism from the board's point of view —
   "land here, get moved there" — so the entire requirement is one `Map<Integer, Integer>` from position
   to destination, checked in O(1) on every move. Reaching for a class hierarchy here would be solving a
   problem the requirements don't actually have.
2. `Dice` as an interface, written the moment you decide how many dice are configurable — and the
   *reason* to make it an interface isn't extensibility for its own sake, it's testability: a scripted,
   deterministic dice sequence is the only way to write an assertable test for a game that's otherwise
   pure randomness. Build the test-only `FixedSequenceDice` implementation early, even before `Game`
   exists, since every subsequent test depends on it.
3. `Board.resolve(position)` — a one-line method, but write it and test it in isolation (feed it a few
   positions, assert the jumps and non-jumps) before wiring it into the game loop, so a `Game`-level bug
   later is never confused with a `Board`-level one.
4. `Player` — deliberately minimal, just an id and a mutable position. No behavior of its own.
5. `Game.playTurn()` last, and narrate the exact order of operations inside it, since this is where the
   documented win rule actually gets enforced: **roll → add to position → clamp against board size (the
   overshoot rule) → resolve any jump → check for a win.** Getting the clamp-then-resolve order right
   matters — resolving before clamping could apply a snake/ladder to a position past the edge of the
   board that was never actually reached.

**Extensions**:
- *"Support more than one path variant (e.g., a branching board)?"* — the `Map<Integer,Integer>` model
  stops being sufficient the moment "next position" isn't a pure function of "current position + roll";
  naming that boundary honestly is better than forcing the existing design to fit.
- *"Add a player being sent back to square 1 on landing on another player's square?"* — a small check in
  `playTurn` before applying the jump: does any other player currently occupy `resolved`? If so, apply
  the "send back" rule; note this interacts with the jump-resolution order and needs its own explicit
  decision (does the bump happen before or after snake/ladder resolution?).
- *"Simulate a full game automatically to find average number of turns?"* — this is exactly why `Dice`
  was made swappable: run many simulations with `RandomDice`, no other code changes.

---

Next: **Phase 6 — Practice Problems: Hard / System-ish**.

## Solution Code

*Full source lives in `solutions/.../problems/snakeandladder/` — shown below in build order, one file at a time.*

**`Dice.java`**

```java
package com.lld.problems.snakeandladder;

public interface Dice {
    int roll();
}
```

**`RandomDice.java`**

```java
package com.lld.problems.snakeandladder;

import java.util.Random;

/** Configurable die count -- one die is standard Snake & Ladder, more dice is a common house-rule variant. */
public class RandomDice implements Dice {

    private final int numberOfDice;
    private final Random random = new Random();

    public RandomDice(int numberOfDice) {
        if (numberOfDice <= 0) {
            throw new IllegalArgumentException("numberOfDice must be at least 1");
        }
        this.numberOfDice = numberOfDice;
    }

    @Override
    public int roll() {
        int total = 0;
        for (int i = 0; i < numberOfDice; i++) {
            total += 1 + random.nextInt(6);
        }
        return total;
    }
}
```

**`Board.java`**

```java
package com.lld.problems.snakeandladder;

import java.util.Map;

/**
 * Snakes and ladders are modeled as the same mechanism -- a jump from one
 * square to another -- since "snake" vs "ladder" is just whether the jump
 * goes backward or forward. No Cell class hierarchy needed for this: a plain
 * position-to-destination map is O(1) to check on every move.
 */
public class Board {

    private final int size;
    private final Map<Integer, Integer> jumps;

    public Board(int size, Map<Integer, Integer> jumps) {
        this.size = size;
        this.jumps = Map.copyOf(jumps);
    }

    public int size() {
        return size;
    }

    public int resolve(int position) {
        return jumps.getOrDefault(position, position);
    }
}
```

**`Player.java`**

public class Player {

    private final String id;
    private int position = 0; // 0 = not yet entered the board

    public Player(String id) {
        this.id = id;
    }

    public String getId() {
        return id;

**`Game.java`**

```java
package com.lld.problems.snakeandladder;

import java.util.List;

/**
 * Documented win rule: a roll that reaches OR passes the final square wins
 * (the overshoot is clamped to the final square, not wasted/invalid) --
 * the "exact landing required" variant is an equally valid house rule, this
 * is just the one this implementation picked and states explicitly.
 */
public class Game {

    private final Board board;
    private final Dice dice;
    private final List<Player> players;
    private int currentPlayerIndex = 0;
    private Player winner;

    public Game(Board board, Dice dice, List<Player> players) {
        if (players.size() < 2) {
            throw new IllegalArgumentException("at least 2 players required");
        }
        this.board = board;
        this.dice = dice;
        this.players = List.copyOf(players);
    }

    public boolean isOver() {
        return winner != null;
    }

    public Player getWinner() {
        return winner;
    }

    public Player getCurrentPlayer() {
        return players.get(currentPlayerIndex);
    }

    public void playTurn() {
        if (isOver()) {
            throw new IllegalStateException("game is already over");
        }
        Player player = getCurrentPlayer();
        int roll = dice.roll();
        int target = Math.min(player.getPosition() + roll, board.size()); // overshoot clamps, doesn't waste the turn
        int resolved = board.resolve(target); // apply a snake/ladder jump if this square has one
        player.moveTo(resolved);

        if (resolved == board.size()) {
            winner = player;
            return;
        }
        currentPlayerIndex = (currentPlayerIndex + 1) % players.size();
    }
}
```

# Splitwise (Expense Sharing)
*Amazon, Microsoft favorite.*

**Time-box**: ~3h.

## Requirements
- Users, optionally organized into groups. An expense is paid by one (or more) users and split among a
  set of users.
- Support at least three split types: **equal**, **exact** (a specific amount per user, must sum to the
  total), **percentage** (must sum to 100%).
- Maintain a running balance between every pair of users (who owes whom, and how much).
- **Settle up**: record a payment between two users, reducing their mutual balance.
- **Debt simplification**: given the current tangle of pairwise balances across a group, compute a
  *minimal* set of transactions that settles everyone up (fewer total payments than settling every
  pairwise debt individually).
- **Out of scope**: multiple currencies, real payment processing.

## Where to start
The split types are a direct Strategy application (Lesson 5) — nothing new to learn there, just apply it.
The two things that actually make this problem hard: **money correctness** and **the simplification
algorithm**. On money: an equal split of $100 among 3 people doesn't divide evenly — decide, explicitly,
who absorbs the leftover cent, and use integer cents or `BigDecimal`, never `double` (this is Lesson
0.1's money-precision warning, now with real consequences — a split that doesn't sum exactly to the
original total is a correctness bug, not a rounding curiosity). On simplification: think about it as a
graph problem — net out each person's overall balance (total owed minus total owing) first, then greedily
match the largest creditor against the largest debtor, repeatedly, rather than trying to cancel every
pairwise debt directly.

## Common pitfalls
Split amounts that don't sum exactly to the total due to floating-point or rounding (verify this with an
assertion in every test, not just eyeballing it); a "simplification" that just nets out each *pair*
independently instead of the whole group, producing more transactions than necessary; using `double` for
money.

## Your task
In `practice/`, package `com.lld.problems.splitwise`. Implement all three split types and the
debt-simplification algorithm. Tests: each split type's amounts always sum exactly to the total for
several tricky inputs (amounts that don't divide evenly); settling up correctly reduces balances;
simplification on a hand-constructed multi-person tangle produces a demonstrably smaller number of
transactions than the naive pairwise approach, and the simplified transactions still settle everyone
exactly.

## Interview Walkthrough
*Reference solution: `solutions/.../problems/splitwise/`.*

**Clarifying questions**: Which split types are actually required — all three, or is equal enough for a
first pass with exact/percent as follow-ups? Should balances be tracked per-pair, overall per-person, or
both? (Say up front: "I'll track per-pair balances as the source of truth, and derive a per-person net
total from them when I need it for simplification" — this is the actual design decision the whole problem
hinges on.) Is debt simplification required, or a stretch goal to mention?

**Build order**:
1. `SplitStrategy` interface — one method, before any of the three implementations, the moment the
   prompt says "support multiple split types." Same Strategy shape you've built four times already in
   this curriculum by now; naming that out loud ("this is the same interchangeable-algorithm shape as
   the rate limiter and the pricing strategies") costs nothing and signals pattern recognition.
2. `EqualSplitStrategy` first (simplest), and the one line worth narrating explicitly: "the total in
   cents divided by N people won't always divide evenly, so I'll give the leftover cents to the first N
   people rather than dropping them" — pick *a* deterministic rule and state it; which specific rule
   matters far less than visibly having one.
3. `ExactSplitStrategy` and `PercentSplitStrategy` next, both validating their own input *at
   construction time* (amounts summing to the total; percentages summing to 100) rather than deferring
   the check to `computeShares` — fail as early as possible, a habit from Lesson 0.4's boundary-validation
   material.
4. `Expense.create(...)` as a static factory that calls the strategy and then re-validates the result
   sums to the total — a belt-and-suspenders check that catches a buggy strategy implementation, not just
   buggy input.
5. `Ledger` before `SplitwiseService` — get the per-pair balance bookkeeping (`recordExpense`,
   `recordSettlement`) correct and tested in isolation, since it's the part every other piece depends on.
6. `DebtSimplifier` last, and specifically as its own standalone class taking `Map<String, Long>` net
   balances — not a method glued onto `Ledger` or `SplitwiseService`. Say why: it's a pure algorithm with
   no dependency on how balances were computed, so isolating it means you can unit test the
   greedy-matching logic directly against hand-built balance maps, without needing a whole ledger of
   expenses to set up first.

**Extensions**:
- *"Support groups, not just individual expenses?"* — a `Group` becomes a named set of user IDs; expenses
  can optionally reference a group for display purposes, but the underlying `Ledger`/`Expense` mechanics
  don't need to change at all, since balances are already tracked per-pair regardless of grouping.
- *"Multiple currencies?"* — named directly as out of scope in the brief; the honest answer if pushed is
  that `Expense` and `Ledger` both need a currency field, and settlements/simplification only make sense
  *within* one currency — cross-currency netting needs an exchange-rate service, a genuinely different
  problem.
- *"Is the greedy debt-simplification always optimal (minimum possible transactions)?"* — a good one to
  know cold: greedy largest-vs-largest is *not* provably optimal in every case (finding the true minimum
  is NP-hard in general), but it's a strong, standard approximation that's more than sufficient for an
  LLD interview — know the limitation exists rather than overclaiming optimality.

## Solution Code

*Full source lives in `solutions/.../problems/splitwise/` — shown below in build order, one file at a time.*

**`SplitStrategy.java`**

```java
package com.lld.problems.splitwise;

import java.util.List;
import java.util.Map;

/** Strategy (Lesson 5): equal/exact/percent are interchangeable ways to turn a total into per-user shares. */
public interface SplitStrategy {
    Map<String, Long> computeShares(long totalCents, List<String> participantIds);
}
```

**`EqualSplitStrategy.java`**

```java
package com.lld.problems.splitwise;

import java.util.LinkedHashMap;
import java.util.List;
import java.util.Map;

/** Money in integer cents (Lesson 0.1): a split must sum EXACTLY to the total, no floating point. */
public class EqualSplitStrategy implements SplitStrategy {

    @Override
    public Map<String, Long> computeShares(long totalCents, List<String> participantIds) {
        int n = participantIds.size();
        long base = totalCents / n;
        long remainder = totalCents % n; // the leftover cents from integer division

        Map<String, Long> shares = new LinkedHashMap<>();
        for (int i = 0; i < n; i++) {
            long share = base + (i < remainder ? 1 : 0); // the first `remainder` participants absorb one extra cent each
            shares.put(participantIds.get(i), share);
        }
        return shares;
    }
}
```

**`ExactSplitStrategy.java`**

```java
package com.lld.problems.splitwise;

import java.util.List;
import java.util.Map;

public class ExactSplitStrategy implements SplitStrategy {

    private final Map<String, Long> exactAmountsCents;

    public ExactSplitStrategy(Map<String, Long> exactAmountsCents) {
        this.exactAmountsCents = Map.copyOf(exactAmountsCents);
    }

    @Override
    public Map<String, Long> computeShares(long totalCents, List<String> participantIds) {
        long sum = exactAmountsCents.values().stream().mapToLong(Long::longValue).sum();
        if (sum != totalCents) {
            throw new IllegalArgumentException("exact amounts must sum to the total: " + sum + " != " + totalCents);
        }
        if (!exactAmountsCents.keySet().containsAll(participantIds) || exactAmountsCents.size() != participantIds.size()) {
            throw new IllegalArgumentException("exact amounts must cover exactly the given participants");
        }
        return exactAmountsCents;
    }
}
```

**`PercentSplitStrategy.java`**

```java
package com.lld.problems.splitwise;

import java.util.ArrayList;
import java.util.LinkedHashMap;
import java.util.List;
import java.util.Map;

public class PercentSplitStrategy implements SplitStrategy {

    private final Map<String, Double> percentages;

    public PercentSplitStrategy(Map<String, Double> percentages) {
        double sum = percentages.values().stream().mapToDouble(Double::doubleValue).sum();
        if (Math.abs(sum - 100.0) > 1e-6) {
            throw new IllegalArgumentException("percentages must sum to 100, got " + sum);
        }
        this.percentages = Map.copyOf(percentages);
    }

    @Override
    public Map<String, Long> computeShares(long totalCents, List<String> participantIds) {
        Map<String, Long> shares = new LinkedHashMap<>();
        long allocated = 0;
        List<String> keys = new ArrayList<>(percentages.keySet());
        for (int i = 0; i < keys.size(); i++) {
            String userId = keys.get(i);
            long share;
            if (i == keys.size() - 1) {
                share = totalCents - allocated; // last participant absorbs the rounding remainder, guaranteeing an exact sum
            } else {
                share = Math.round(totalCents * (percentages.get(userId) / 100.0));
            }
            shares.put(userId, share);
            allocated += share;
        }
        return shares;
    }
}
```

**`Expense.java`**

```java
package com.lld.problems.splitwise;

import java.util.List;
import java.util.Map;

public record Expense(String id, String paidByUserId, long totalCents, Map<String, Long> shares) {

    public static Expense create(String id, String paidByUserId, long totalCents,
                                  SplitStrategy strategy, List<String> participantIds) {
        Map<String, Long> shares = strategy.computeShares(totalCents, participantIds);
        long sum = shares.values().stream().mapToLong(Long::longValue).sum();
        if (sum != totalCents) {
            throw new IllegalStateException("split shares must sum exactly to the total: " + sum + " != " + totalCents);
        }
        return new Expense(id, paidByUserId, totalCents, shares);
    }
}
```

**`Ledger.java`**

```java
package com.lld.problems.splitwise;

import java.util.HashMap;
import java.util.Map;

/** balances.get(A).get(B) = how much B owes A right now (can be negative, meaning A owes B). */
public class Ledger {

    private final Map<String, Map<String, Long>> balances = new HashMap<>();

    void recordExpense(Expense expense) {
        String payer = expense.paidByUserId();
        for (Map.Entry<String, Long> entry : expense.shares().entrySet()) {
            String debtor = entry.getKey();
            long amount = entry.getValue();
            if (!debtor.equals(payer)) {
                adjust(payer, debtor, amount); // debtor now owes payer `amount` more
            }
        }
    }

    void recordSettlement(String fromUserId, String toUserId, long amountCents) {
        // fromUserId pays toUserId -- reduces how much fromUserId owes toUserId
        adjust(toUserId, fromUserId, -amountCents);
    }

    /** Positive: userB owes userA. Negative: userA owes userB. */
    public long balanceBetween(String userA, String userB) {
        return balances.getOrDefault(userA, Map.of()).getOrDefault(userB, 0L);
    }

    /** Positive: overall owed money by others. Negative: overall owes others money. */
    public long netBalance(String userId) {
        return balances.getOrDefault(userId, Map.of()).values().stream().mapToLong(Long::longValue).sum();
    }

    private void adjust(String creditor, String debtor, long amount) {
        balances.computeIfAbsent(creditor, k -> new HashMap<>()).merge(debtor, amount, Long::sum);
        balances.computeIfAbsent(debtor, k -> new HashMap<>()).merge(creditor, -amount, Long::sum);
    }
}
```

**`Transaction.java`**

package com.lld.problems.splitwise;

public record Transaction(String fromUserId, String toUserId, long amountCents) {
}
```

**`DebtSimplifier.java`**

```java
package com.lld.problems.splitwise;

import java.util.AbstractMap;
import java.util.ArrayList;
import java.util.List;
import java.util.Map;
import java.util.PriorityQueue;

/**
 * Nets out each person's OVERALL balance first, then greedily matches the
 * largest creditor against the largest debtor, repeatedly -- not "cancel
 * every pairwise debt individually," which produces far more transactions
 * than necessary.
 */
public class DebtSimplifier {

    public List<Transaction> simplify(Map<String, Long> netBalances) {
        PriorityQueue<Map.Entry<String, Long>> creditors =
                new PriorityQueue<>((a, b) -> Long.compare(b.getValue(), a.getValue())); // largest first
        PriorityQueue<Map.Entry<String, Long>> debtors =
                new PriorityQueue<>((a, b) -> Long.compare(a.getValue(), b.getValue())); // most negative first

        for (Map.Entry<String, Long> entry : netBalances.entrySet()) {
            if (entry.getValue() > 0) {
                creditors.add(new AbstractMap.SimpleEntry<>(entry.getKey(), entry.getValue()));
            } else if (entry.getValue() < 0) {
                debtors.add(new AbstractMap.SimpleEntry<>(entry.getKey(), entry.getValue()));
            }
        }

        List<Transaction> transactions = new ArrayList<>();
        while (!creditors.isEmpty() && !debtors.isEmpty()) {
            Map.Entry<String, Long> creditor = creditors.poll();
            Map.Entry<String, Long> debtor = debtors.poll();
            long amount = Math.min(creditor.getValue(), -debtor.getValue());

            transactions.add(new Transaction(debtor.getKey(), creditor.getKey(), amount));

            long remainingCredit = creditor.getValue() - amount;
            long remainingDebt = debtor.getValue() + amount;
            if (remainingCredit > 0) {
                creditors.add(new AbstractMap.SimpleEntry<>(creditor.getKey(), remainingCredit));
            }
            if (remainingDebt < 0) {
                debtors.add(new AbstractMap.SimpleEntry<>(debtor.getKey(), remainingDebt));
            }
        }
        return transactions;
    }
}
```

**`SplitwiseService.java`**

```java
package com.lld.problems.splitwise;

import java.util.HashMap;
import java.util.List;
import java.util.Map;
import java.util.Set;

public class SplitwiseService {

    private final Ledger ledger = new Ledger();
    private final DebtSimplifier simplifier = new DebtSimplifier();

    public Expense addExpense(String id, String paidByUserId, long totalCents,
                               SplitStrategy strategy, List<String> participantIds) {
        Expense expense = Expense.create(id, paidByUserId, totalCents, strategy, participantIds);
        ledger.recordExpense(expense);
        return expense;
    }

    public void settle(String fromUserId, String toUserId, long amountCents) {
        ledger.recordSettlement(fromUserId, toUserId, amountCents);
    }

    public long balanceBetween(String userA, String userB) {
        return ledger.balanceBetween(userA, userB);
    }

    public long netBalance(String userId) {
        return ledger.netBalance(userId);
    }

    public List<Transaction> simplifyDebts(Set<String> userIds) {
        Map<String, Long> netBalances = new HashMap<>();
        for (String userId : userIds) {
            netBalances.put(userId, ledger.netBalance(userId));
        }
        return simplifier.simplify(netBalances);
    }
}
